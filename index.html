<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAB Profit Analytics</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#12151B;
    --panel:#181D26;
    --panel2:#1E2430;
    --border:#2A3140;
    --text:#EDEFF3;
    --muted:#8B93A3;
    --muted2:#5D6779;
    --gold:#D9A441;
    --gold-soft:#3A2F1D;
    --teal:#4FB8B0;
    --teal-soft:#1C2F2E;
    --coral:#E2725B;
    --coral-soft:#2E1F1C;
    --violet:#8C7CF0;
    --green:#6FBF73;
    --red:#E2604F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Sora',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;flex-wrap:wrap;gap:12px;
    position:sticky;top:0;z-index:150;
    background:rgba(18,21,27,.96);
    backdrop-filter:blur(10px);
    padding:10px 0;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg,var(--gold),#a97a2c);
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-weight:700;color:#1a1409;font-size:15px;
  }
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-0.01em;}
  .brand span{color:var(--muted);font-size:12px;display:block;margin-top:1px;letter-spacing:.02em;}

  nav.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px;flex-wrap:wrap;}
  nav.tabs button{
    background:transparent;border:none;color:var(--muted);
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:7px;cursor:pointer;transition:.15s;
    white-space:nowrap;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{background:var(--panel2);color:var(--gold);}

  .filter-bar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:10px 14px;margin-bottom:12px;
  }
  .save-warning{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    background:var(--coral-soft);border:1px solid #4a2b25;color:#f0c9c0;
    border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;line-height:1.4;
  }
  .save-warning .sw-text{flex:1;}
  .save-warning button{
    flex:0 0 auto;background:transparent;border:1px solid #6b3a30;color:#f0c9c0;
    border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .save-warning button:hover{background:#4a2b25;}

  .timeframe-bar{
    display:flex;align-items:center;flex-wrap:wrap;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:10px 14px;margin-bottom:12px;
  }
  .timeframe-bar select{width:auto;min-width:170px;}
  .timeframe-bar .custom-dates{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .timeframe-bar .custom-dates input{width:auto;}
  .timeframe-bar .tf-label{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:20px;border:1px solid var(--border);
    background:var(--panel2);color:var(--muted);cursor:pointer;transition:.15s;
    display:flex;align-items:center;gap:6px;
  }
  .chip:hover{color:var(--text);}
  .chip.active{background:var(--gold-soft);color:var(--gold);border-color:#5c451f;}
  .chip.disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
  .chip .dot{width:7px;height:7px;border-radius:50%;}

  .toggle-wrap{display:flex;align-items:center;gap:8px;}
  .toggle-label{font-size:12px;color:var(--muted);font-weight:600;}
  .switch{position:relative;width:38px;height:22px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:var(--panel2);border:1px solid var(--border);border-radius:20px;transition:.15s;}
  .slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:.15s;}
  input:checked + .slider{background:var(--gold-soft);border-color:#5c451f;}
  input:checked + .slider:before{transform:translateX(16px);background:var(--gold);}

  .kpi-strip{
    display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
    background:var(--border);border:1px solid var(--border);border-radius:12px;
    overflow:hidden;margin-bottom:18px;
  }
  .kpi{background:var(--panel);padding:16px 18px;}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px;font-weight:600;}
  .kpi .value{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--text);}
  .kpi .value.gold{color:var(--gold);}
  .kpi .value.teal{color:var(--teal);}
  .kpi .sub{font-size:11px;color:var(--muted2);margin-top:4px;}

  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:18px 20px;margin-bottom:18px;
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .panel-head h2{font-size:14px;margin:0;font-weight:700;letter-spacing:.01em;}
  .panel-head .hint{font-size:11.5px;color:var(--muted);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:820px){.grid-2{grid-template-columns:1fr;} .kpi-strip{grid-template-columns:repeat(2,1fr);}}

  canvas{max-width:100%;}
  .chart-wrap{position:relative;height:260px;}
  .chart-wrap.tall{height:320px;}

  label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  input,select{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:7px;font-family:'Inter',sans-serif;font-size:13.5px;
    outline:none;
  }
  input:focus,select:focus{border-color:var(--gold);}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > .field{flex:1;min-width:140px;}
  button.btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    background:var(--gold);color:#1a1409;border:none;border-radius:7px;
    padding:9px 16px;cursor:pointer;transition:.15s;
  }
  button.btn:hover{filter:brightness(1.08);}
  button.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  button.btn.danger{background:var(--coral-soft);color:var(--coral);border:1px solid #4a2b25;}
  button.btn.small{padding:5px 10px;font-size:11.5px;}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;
     padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;}
  td{padding:8px 10px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .table-scroll{max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}
  .table-scroll table{font-size:12.5px;}
  .table-scroll th{position:sticky;top:0;background:var(--panel);}

  .tag{
    display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
    font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;
  }
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;}

  .product-card{
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:14px 16px;margin-bottom:10px;
  }
  .product-card .pc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .product-card .pc-head .name{font-weight:700;font-size:14px;}
  .product-card .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;}
  .product-card .stats .s-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .product-card .stats .s-val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;margin-top:2px;}
  .edit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
  @media (max-width:700px){.edit-grid{grid-template-columns:1fr 1fr;} .product-card .stats{grid-template-columns:1fr 1fr;}}

  .alias-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .alias-pill{
    display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);
    padding:3px 4px 3px 10px;border-radius:20px;font-size:11.5px;color:var(--muted);
  }
  .alias-pill button{
    background:transparent;border:none;color:var(--muted2);cursor:pointer;font-size:14px;line-height:1;
    padding:2px 6px;border-radius:50%;
  }
  .alias-pill button:hover{color:var(--coral);}

  .drop-zone{
    border:2px dashed var(--border);border-radius:10px;padding:26px 18px;text-align:center;
    color:var(--muted);font-size:13px;cursor:pointer;transition:.15s;
  }
  .drop-zone:hover, .drop-zone.dragover{border-color:var(--gold);color:var(--text);}

  .resolve-card{
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:14px 16px;margin-bottom:10px;
  }
  .resolve-card .csv-title{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold);margin-bottom:8px;}
  .resolve-card .opt{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid var(--border);}
  .resolve-card .opt:first-of-type{border-top:none;}
  .resolve-card .opt input[type=radio]{width:auto;margin-top:3px;}
  .resolve-card .opt label{text-transform:none;font-size:13px;color:var(--text);font-weight:400;margin:0;cursor:pointer;}
  .resolve-card select{margin-top:6px;}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;}
  .badge.auto{background:var(--teal-soft);color:var(--teal);}
  .badge.new{background:var(--gold-soft);color:var(--gold);}
  .badge.review{background:var(--coral-soft);color:var(--coral);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .legend-row{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:10px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}

  .log-row{
    display:flex;align-items:center;gap:14px;padding:8px 4px;border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .log-row:last-child{border-bottom:none;}
  .log-row:hover{background:var(--panel2);border-radius:6px;}
  .log-row.log-row-zero{opacity:.55;}
  .log-date{width:110px;flex:0 0 auto;color:var(--muted);}
  .log-total{width:70px;flex:0 0 auto;font-weight:700;}
  .log-badges{display:flex;flex-wrap:wrap;gap:5px;flex:1;}
  .log-badge{
    padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;
    font-family:'JetBrains Mono',monospace;white-space:nowrap;
  }
  .log-tooltip{
    position:fixed;display:none;z-index:200;pointer-events:none;
    background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    padding:10px 6px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:12.5px;
    max-width:320px;
    transition:opacity .08s ease;
  }
  .log-tooltip-date{font-weight:700;color:var(--text);margin-bottom:6px;font-family:'JetBrains Mono',monospace;}
  .log-tooltip-row{
    display:grid;
    grid-template-columns:7px 198px 70px 72px;
    align-items:center;
    column-gap:2px;
    padding:3px 0;
    white-space:nowrap;
  }
  .log-tooltip-row .dot{width:7px;height:7px;flex:none;}
  .log-tooltip-name{
    display:flex;
    align-items:center;
    min-width:0;
    white-space:nowrap;
    overflow:visible;
  }
  .log-tooltip-product-name{
    color:var(--muted);
    white-space:nowrap;
    overflow:visible;
    text-overflow:clip;
    flex:0 0 auto;
    font-size:11.5px;
  }
  .log-tooltip-sale{
    color:var(--gold);
    font-size:10.5px;
    font-weight:600;
    white-space:nowrap;
    margin-left:2px;
    flex:0 0 auto;
  }
  .log-tooltip-val{
    font-family:'JetBrains Mono',monospace;
    color:var(--text);
    text-align:right;
    width:70px;
    min-width:70px;
    max-width:70px;
    white-space:nowrap;
    justify-self:end;
  }
  .log-tooltip-growth{
    font-family:'JetBrains Mono',monospace;
    color:var(--teal);
    font-size:11px;
    text-align:right;
    width:72px;
    min-width:72px;
    max-width:72px;
    white-space:nowrap;
    justify-self:end;
  }

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .chart-revenue-tooltip{position:absolute;z-index:50;min-width:200px;pointer-events:none;background:rgba(24,29,38,.94);backdrop-filter:blur(8px);border:1px solid rgba(93,103,121,.55);border-radius:7px;box-shadow:0 8px 24px rgba(0,0,0,.36);padding:9px 11px;font-size:12px;line-height:1.3;opacity:0;transform:translate3d(0,0,0);transition:opacity .12s ease,transform .095s ease-out;will-change:transform,opacity;}
  .chart-revenue-tooltip .crt-title{font-weight:700;color:var(--text);margin-bottom:7px;}
  .chart-revenue-tooltip .crt-row{display:grid;grid-template-columns:8px 34px minmax(90px,1fr);column-gap:12px;align-items:center;padding:3px 0;}
  .chart-revenue-tooltip .crt-row.zero{opacity:.38;}
  .chart-revenue-tooltip .crt-dot{width:7px;height:7px;border-radius:50%;}
  .chart-revenue-tooltip .crt-code{font-weight:700;letter-spacing:.04em;color:var(--text);}
  .chart-revenue-tooltip .crt-value{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .chart-revenue-tooltip .crt-total{display:grid;grid-template-columns:1fr minmax(90px,auto);column-gap:22px;border-top:1px solid var(--border);margin-top:6px;padding-top:7px;font-weight:700;}
  .chart-revenue-tooltip .crt-total span:last-child{text-align:right;font-variant-numeric:tabular-nums;}

  /* --- Revenue Log: compact, left-packed fixed columns --- */
  .revenue-log-sheet{
    width:max-content;
    max-width:100%;
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:8px;
    position:relative;
    background:var(--panel);
  }
  .revenue-log-grid{
    display:grid;
    width:max-content;
    min-width:100%;
    align-items:stretch;
  }
  .rl-grid-cell{
    min-height:34px;
    display:flex;
    align-items:center;
    padding:6px 8px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
    font-size:12.5px;
  }
  .rl-grid-head{
    position:sticky;
    top:0;
    z-index:8;
    background:rgba(30,36,48,.97);
    backdrop-filter:blur(8px);
    color:var(--muted);
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.055em;
    box-shadow:0 1px 0 var(--border);
  }
  .rl-date-cell{padding-left:10px;color:var(--muted);}
  .rl-total-cell{font-weight:700;text-align:right;justify-content:flex-end;font-variant-numeric:tabular-nums;padding-right:12px;}
  .rl-product-cell{justify-content:center;padding-left:4px;padding-right:4px;text-align:center;}
  .rl-header-product{justify-content:flex-start;padding-left:5px;padding-right:6px;}
  .rl-header-code{display:inline-flex;align-items:center;gap:5px;color:var(--text);font-weight:700;letter-spacing:.06em;white-space:nowrap;}
  .rl-value-pill{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-height:22px;
    padding:2px 4px;
    border-radius:0;
    background:transparent !important;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .rl-value-pill .dot{flex:0 0 auto;}
  .rl-blank{min-width:18px;}
  .rl-month-heading{
    grid-column:1 / -1;
    padding:12px 10px 7px;
    background:var(--bg);
    color:var(--gold);
    font-size:12px;
    font-weight:700;
    letter-spacing:.025em;
    border-bottom:1px solid var(--border);
  }
  .rl-day-row{display:contents;}
  .rl-day-row:hover > .rl-grid-cell{background:var(--panel2);}
  .rl-day-row:hover > .rl-product-cell{
    background:rgba(255,255,255,.018) !important;
  }

  .product-short-code{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:2px 6px;border:1px solid var(--border);border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--gold);margin-left:8px;}


  /* --- Revenue Log: neutral product cells --- */
  .revenue-log-grid .rl-product-cell,
  .revenue-log-grid .rl-header-product{
    border-left:1px solid var(--border);
  }
  .revenue-log-grid .rl-product-cell{
    position:relative;
    isolation:isolate;
    background:transparent;
  }
  .revenue-log-grid .rl-header-product{
    position:relative;
    top:auto;
    z-index:8;
    background:var(--panel2);
  }

.rl-month-heading{
    display:flex;align-items:center;justify-content:space-between;
    gap:28px;min-width:320px;
  }
  .rl-month-heading .rl-month-total{
    margin-left:auto;color:var(--text);font-variant-numeric:tabular-nums;font-weight:700;
  }




  .revenue-log-bottom-btn{
    position:fixed;
    right:24px;
    bottom:24px;
    z-index:120;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(30,36,48,.94);
    color:var(--text);
    box-shadow:0 8px 24px rgba(0,0,0,.34);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    transition:opacity .14s ease,transform .14s ease,background .14s ease;
  }
  .revenue-log-bottom-btn:hover{
    background:rgba(42,49,64,.98);
    transform:translateY(-1px);
  }
  .revenue-log-bottom-btn.visible{display:flex;}


  .sticky-filter-bar{
    position:sticky;
    top:var(--sticky-filter-top,72px);
    z-index:140;
    box-shadow:0 8px 18px rgba(0,0,0,.16);
  }
  .revenue-log-load-controls{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0 0 10px 0;
  }


  .revenue-log-panel{position:relative;}
  .revenue-log-loading-overlay{
    position:fixed;
    z-index:190;
    display:none;
    overflow:hidden;
    pointer-events:all;
    background:rgba(18,21,27,.42);
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
    border:1px solid rgba(255,255,255,.035);

      rgba(255,255,255,.035),

/* Rare: strongly blue with visible geometric detail. */

}

/* Full-page card pack overlay */
.motivation-pack-overlay{
  position:fixed;
  inset:0;
  z-index:100000;

  align-items:center;
  justify-content:center;
  padding:22px;
  background:rgba(3,6,10,.68);

}
.motivation-pack-stage{
  width:min(900px,96vw);
  max-height:94vh;
  overflow:auto;
  position:relative;
  padding:24px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:22px;
  background:
    radial-gradient(circle at 50% -10%,rgba(65,145,255,.15),transparent 40%),

  right:14px;

  height:34px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.11);
  background:rgba(0,0,0,.28);
  color:#DDE3EB;
  cursor:pointer;
  z-index:2;
}

    linear-gradient(125deg,transparent 0 22%,rgba(255,255,255,.13) 22% 26%,transparent 26% 64%,rgba(255,226,130,.14) 64% 68%,transparent 68%),

  box-shadow:0 28px 70px rgba(0,0,0,.44),0 0 38px rgba(255,194,62,.14);
  transition:transform .18s ease,box-shadow .18s ease;

}

  const dedicated=getDedicatedFxCache();
  Object.entries(dedicated).forEach(([date,entry])=>{

async function loadState(){
  // For a normal local HTML file, use browser localStorage first.
  const localState = getLocalState();
  if(localState) return mergeDedicatedFxCacheIntoState(mergeBundledFxHistory(localState));

  // If running inside an artifact with window.storage, preserve support
  // for that environment and migrate the first loaded state into localStorage too.
  if(storageApiExists()){
    try{
      const res = await window.storage.get('marketplace-tracker-clean-import-v1');
      if(res && res.value){
        const state = mergeDedicatedFxCacheIntoState(mergeBundledFxHistory(JSON.parse(res.value)));
        setLocalState(state);
        return state;
      }
    }catch(e){
      console.error('Artifact storage load failed', e);
    }
  }

  const fxOnly=getDedicatedFxCache();
  if(Object.keys(fxOnly).length){
    const state=JSON.parse(JSON.stringify(SEED_DATA));
    state.fxHistory=fxOnly;
    mergeBundledFxHistory(state);
    return state;
  }
  return null;
}

async function saveState(state, attempt){
  attempt = attempt || 1;
  const serialized = JSON.stringify(state);

  // Primary persistence for this standalone/local HTML file.
  if(localStorageAvailable()){
    try{
      window.localStorage.setItem(LOCAL_STORAGE_KEY, serialized);
      LAST_SAVED_SNAPSHOT = serialized;
      clearSaveWarning();
      return true;
    }catch(e){
      console.error('Local storage save failed (attempt '+attempt+')', e);
      // If localStorage is unavailable/quota-limited, try the host API below.
    }
  }

  // Keep the original artifact storage as a secondary option when available.
  if(storageApiExists()){
    try{
      const result = await window.storage.set('marketplace-tracker-clean-import-v1', serialized);
      if(!result) throw new Error('storage.set returned no result');
      LAST_SAVED_SNAPSHOT = serialized;
      clearSaveWarning();
      return true;
    }catch(e){
      console.error('Artifact storage save failed (attempt '+attempt+')', e);
      if(attempt < 2){
        await new Promise(r=>setTimeout(r, 250));
        return saveState(state, attempt+1);
      }
      const detail = (e && e.message) ? e.message : 'unknown storage error';
      setSaveWarning(detail);
      return false;
    }
  }

  setSaveWarning('browser localStorage is not available');
  return false;
}

function cleanShortName(value){
  return String(value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
}
function cleanShortName(value){
  return String(value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
}
function shortNameParts(name){
  const raw=String(name||'').trim();
  const words=raw.split(/\s+/).map(w=>w.replace(/[^A-Za-z0-9]/g,'')).filter(Boolean);
  let version='';
  const semantic=[];
  words.forEach(w=>{
    const m=w.match(/^v(\d+)$/i);
    if(m) version=m[1]; else semantic.push(w);
  });
  return {raw,words,semantic,version};
}
function automaticBaseShortName(name){
  const {words,semantic}=shortNameParts(name);
  if(!words.length) return 'P';
  const source=semantic.length?semantic:words;
  const initials=source.map(w=>w[0]).join('').toUpperCase();
  // Prefer meaningful initials, with a target of up to three characters:
  // one word -> I, two words -> NI, three+ words -> NIS.
  return cleanShortName(initials.slice(0,3) || 'P');
}
function rawInitialCode(name){ return automaticBaseShortName(name); }
function shortNameCandidates(name,length){
  const {raw,semantic,version}=shortNameParts(name);
  const compact=raw.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const semanticCompact=semantic.join('').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const initials=semantic.map(w=>w[0]).join('').toUpperCase();
  const out=[];
  const add=s=>{
    s=cleanShortName(s);
    if(s.length===length && !out.includes(s)) out.push(s);
  };

  add((initials+semanticCompact).slice(0,length));
  add(semanticCompact.slice(0,length));
  add(compact.replace(/V(?=\d)/ig,'').slice(0,length));
  if(semanticCompact) add((semanticCompact[0]+semanticCompact.slice(-Math.max(0,length-1))).slice(0,length));

  const chars=semanticCompact||compact||initials||'P';
  if(chars.length){
    const first=chars[0], rest=chars.slice(1);
    const choose=(prefix,start,need)=>{
      if(need===0){ add(prefix); return; }
      for(let i=start;i<rest.length;i++) choose(prefix+rest[i],i+1,need-1);
    };
    choose(first,0,length-1);
  }
  for(let n=1;n<=99;n++){
    const suffix=String(n);
    const prefix=(semanticCompact||compact||initials||'P').slice(0,Math.max(1,length-suffix.length));
    add((prefix+suffix).slice(0,length));
  }
  return out;
}
function generateUniqueShortName(name,products,excludeId){
  const used=new Set((products||[]).filter(p=>p.id!==excludeId).map(p=>cleanShortName(p.shortName)).filter(Boolean));
  const natural=automaticBaseShortName(name);
  if(natural && !used.has(natural)) return natural;

  // Version digits are a collision resolver, not part of the normal abbreviation.
  // Nice Interaction System V2 -> NIS normally; if NIS exists -> NIS2.
  const {version}=shortNameParts(name);
  if(version){
    const withVersion=cleanShortName(natural+version);
    if(withVersion.length<=5 && !used.has(withVersion)) return withVersion;
  }

  // Otherwise stay as concise as possible, aiming at 3 first, then 4 and 5.
  for(const length of [3,4,5]){
    for(const candidate of shortNameCandidates(name,length)){
      if(!used.has(candidate)) return candidate;
    }
  }
  for(let n=0;n<1000;n++){
    const candidate=cleanShortName('P'+n.toString(36).toUpperCase());
    if(candidate && !used.has(candidate)) return candidate;
  }
  return 'P';
}
function shortNameFor(p){
  const code=cleanShortName(p&&p.shortName);
  return code || automaticBaseShortName(p&&p.name);
}

function normalizeTitle(s){
  let t = (s||'').toLowerCase();

}
function wordSet(s){ return new Set(normalizeTitle(s).split(' ').filter(Boolean)); }
function jaccard(a,b){
  const A = wordSet(a), B = wordSet(b);
  if(A.size===0 || B.size===0) return 0;

  A.forEach(w=>{ if(B.has(w)) inter++; });
  const union = A.size + B.size - inter;
  return union ? inter/union : 0;
}

  for(const p of products){
    let score = jaccard(rawTitle, p.name);
    (p.aliases||[]).forEach(a=>{ score = Math.max(score, jaccard(rawTitle,a)); });
    if(score>bestScore){ bestScore=score; best=p; }
  }
  return { product: best, score: bestScore };
}

function mergeBundledFxHistory(state){
  if(!state || typeof state!=='object') return state;
  if(!state.fxHistory || typeof state.fxHistory!=='object' || Array.isArray(state.fxHistory)) state.fxHistory={};

  // Bundled history is a baseline only. Never overwrite a rate already present
  // in the user's state/cache, because a successfully downloaded value wins.
  Object.entries(BUNDLED_HISTORICAL_FX).forEach(([date,entry])=>{
    if(!state.fxHistory[date]) state.fxHistory[date]=entry;
  });
  return state;
}

function earliestFxRelevantProductDate(){
  // Imported revenue is authoritative for FX coverage. This intentionally does
  // not rely on the stored product release date, because an overlapping/later
  // CSV can introduce older sales for an already-existing product.
  const revenueDates=(STATE.revenue||[]).map(r=>r.date).filter(Boolean).sort();
  if(revenueDates.length) return revenueDates[0];

  // Fallback only for a product that exists before any revenue rows do.
  const productDates=(STATE.products||[]).map(p=>p.releaseDate).filter(Boolean).sort();
  return productDates.length?productDates[0]:null;
}
function requiredHistoricalFxDates(){
  const oldest=earliestFxRelevantProductDate();
  if(!oldest) return [];
  const firstMonth=oldest.slice(0,7);
  const [fy,fm]=firstMonth.split('-').map(Number);
  const today=todayStr();
  const out=[];
  let y=fy,m=fm;
  while(true){
    const ym=`${y}-${String(m).padStart(2,'0')}`;
    const payoutDate=fxPayoutDateForRevenueMonth(ym);
    if(payoutDate>today) break;
    out.push({revenueMonth:ym,payoutDate});
    m++;
    if(m>12){m=1;y++;}
    if(y>new Date().getFullYear()+1) break;
  }
  return out;
}

    const d = new Date();
    d.setHours(12,0,0,0);
    d.setDate(d.getDate() - (preset.days-1));
    return { start: localDateString(d), end: today };
  }
  return { start: today, end: today };
}
function rangeDayCount(range){
  return Math.round((new Date(range.end) - new Date(range.start)) / 86400000) + 1;
}
function monthsInRange(range){
  const out = [];
  let [y,m] = range.start.slice(0,7).split('-').map(Number);
  const [ey,em] = range.end.slice(0,7).split('-').map(Number);
  while(y<ey || (y===ey && m<=em)){
    out.push(`${String(y).padStart(4,'0')}-${String(m).padStart(2,'0')}`);
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}
function localDateString(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysInRangeList(range){
  const days = [];
  const [sy,sm,sd]=range.start.split('-').map(Number);
  const [ey,em,ed]=range.end.split('-').map(Number);
  let d = new Date(sy,sm-1,sd,12,0,0,0);
  const endD = new Date(ey,em-1,ed,12,0,0,0);
  while(d<=endD){
    days.push(localDateString(d));
    d.setDate(d.getDate()+1);
  }
  return days;
}
function dayLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return names[d.getMonth()] + ' ' + d.getDate();
}

function cardAlbumCardKey(type,id,rarity){

function cardAlbumEntityTypeLabel(entity){
  if(entity.entityType==='manager') return 'Manager';

function cardAlbumIsGermanyTeam(team){
  const name=String(team?.name||'').trim().toLowerCase();
  const shortName=String(team?.shortName||'').trim().toLowerCase();
  const theme=String(team?.featuredThemeId||'').trim().toLowerCase();
  const kind=String(team?.teamKind||'').trim().toLowerCase();

  if(theme==='germany') return true;
  if(kind==='national' && ['germany','germany national team','deutschland'].includes(name)) return true;
  if(kind==='national' && ['ger','deu','germany','deutschland'].includes(shortName)) return true;
  return false;
}
function cardAlbumIsOwned(entity,rarity){
  const key=cardAlbumCardKey(entity.entityType,entity.sourceId,rarity);

function cardAlbumMatchesView(entity,team,rarity){
  if(CARD_ALBUM_VIEW.ownedOnly && !cardAlbumIsOwned(entity,rarity)) return false;

function cardAlbumVisibleCardsForTeam(team){
  const visible=[];

function cardAlbumVisibleTeams(teams){

function cardAlbumEntitiesForTeam(team){
  const head=[{
    entityType:'team',
    sourceId:team.sourceId,
    name:team.name,
    imageUrl:team.badgeUrl || team.card?.imageUrl || '',
    teamName:team.name,
    position:'Team crest'
  }];
  const roster=(team.players||[]).map(player=>({
    entityType:player.entityType==='manager'?'manager':'player',
    sourceId:player.sourceId,
    name:player.name,
    imageUrl:player.imageUrl || player.card?.imageUrl || '',
    teamName:team.name,

function cardAlbumValidKeys(dataset){
  const valid=new Set();
  if(!dataset || !Array.isArray(dataset.teams)) return valid;
  dataset.teams.forEach(team=>{
    cardAlbumEntitiesForTeam(team).forEach(entity=>{
      CARD_ALBUM_RARITIES.forEach(rarity=>{
        valid.add(cardAlbumCardKey(entity.entityType,entity.sourceId,rarity));
      });
    });
  });
  return valid;
}
function cardAlbumStats(){
  const dataset=cardAlbumDataset();
  if(!dataset||!Array.isArray(dataset.teams))return{teams:0,managers:0,players:0,baseCards:0,totalVariants:0,collectedVariants:0,duplicateCards:0,totalCopies:0,collectedCommon:0,collectedRare:0,collectedLegendary:0};
  const teams=dataset.teams.length;
  let managers=0,players=0;
  dataset.teams.forEach(t=>(t.players||[]).forEach(p=>p.entityType==='manager'?managers++:players++));
  const baseCards=teams+managers+players,totalVariants=baseCards*CARD_ALBUM_RARITIES.length,inventory=cardAlbumInventory();
  let collectedVariants=0,duplicateCards=0,totalCopies=0,collectedCommon=0,collectedRare=0,collectedLegendary=0;
  Object.entries(inventory).forEach(([key,raw])=>{
    const count=Math.max(0,Math.floor(Number(raw)||0));
    if(count>0){
      collectedVariants++;
      if(key.endsWith(':common'))collectedCommon++;
      else if(key.endsWith(':rare'))collectedRare++;
      else if(key.endsWith(':legendary'))collectedLegendary++;
    }
    if(count>1)duplicateCards++;
    totalCopies+=count;
  });
  return{teams,managers,players,baseCards,totalVariants,collectedVariants,duplicateCards,totalCopies,collectedCommon,collectedRare,collectedLegendary};
}

function cardAlbumDeepClone(value){return JSON.parse(JSON.stringify(value));}
function cardAlbumMergeDatasets(previous,next){
  if(!previous||!Array.isArray(previous.teams))return cardAlbumDeepClone(next);
  if(!next||!Array.isArray(next.teams))return cardAlbumDeepClone(previous);
  const merged=cardAlbumDeepClone(previous);
  merged.schema=next.schema||merged.schema;
  merged.schemaVersion=Math.max(Number(merged.schemaVersion)||1,Number(next.schemaVersion)||1);
  merged.generatedAt=next.generatedAt||new Date().toISOString();
  merged.source={...(merged.source||{}),...(next.source||{})};
  merged.collection={...(merged.collection||{}),...(next.collection||{})};
  const teamMap=new Map((merged.teams||[]).map(team=>[String(team.sourceId),team]));
  const removeEntityEverywhere=sourceId=>{
    for(const team of merged.teams||[])team.players=(team.players||[]).filter(p=>String(p.sourceId)!==String(sourceId));
  };
  for(const incomingTeam of next.teams||[]){
    const teamId=String(incomingTeam.sourceId);
    let target=teamMap.get(teamId);
    if(!target){
      target=cardAlbumDeepClone(incomingTeam);target.players=[];merged.teams.push(target);teamMap.set(teamId,target);
    }else{
      const preservedPlayers=target.players||[];
      Object.assign(target,cardAlbumDeepClone(incomingTeam));
      target.players=preservedPlayers;
    }
    for(const incomingEntity of incomingTeam.players||[]){
      removeEntityEverywhere(incomingEntity.sourceId);
      target.players=target.players||[];
      target.players.push(cardAlbumDeepClone(incomingEntity));
    }
  }
  return merged;
}

async function importCardDatasetToAlbum(file){
  if(!file)return;
  try{
    const parsed=JSON.parse(await file.text());
    if(parsed?.schema!=='motivation-card-dataset'||!Array.isArray(parsed.teams))throw new Error('That file is not a supported Card Dataset Builder JSON export.');
    const album=cardAlbumState();
    album.dataset=cardAlbumMergeDatasets(album.dataset,parsed);
    album.importedAt=new Date().toISOString();
    await persist();
    showToast('Card dataset updated · album progress preserved');
    renderTabContent();
  }catch(err){
    console.error('Card dataset import failed',err);
    alert(err?.message||'Failed to import the card dataset.');
  }
}
async function clearCardAlbumDataset(){
  if(!cardAlbumDataset()) return;
  if(!confirm('Remove the imported card dataset and collection progress from this website?')) return;
  STATE.cardAlbum={dataset:null,inventory:{},importedAt:null};
  await persist();
  showToast('Card album cleared');
  renderTabContent();
}


let CARD_ALBUM_PREVIEW_CLEANUP=null;

function closeCardAlbumPreview(){
  if(typeof CARD_ALBUM_PREVIEW_CLEANUP==='function'){
    const cleanup=CARD_ALBUM_PREVIEW_CLEANUP;
    CARD_ALBUM_PREVIEW_CLEANUP=null;
    cleanup();
  }
  document.getElementById('cardAlbumPreviewOverlay')?.remove();
}

function openCardAlbumPreview(sourceCard){
  if(!sourceCard) return;
  closeCardAlbumPreview();

  const overlay=document.createElement('div');
  overlay.id='cardAlbumPreviewOverlay';
  overlay.className='card-preview-overlay';

  const stage=document.createElement('div');
  stage.className='card-preview-stage';

  const wrap=document.createElement('div');
  wrap.className='card-preview-card-wrap';

  const clone=sourceCard.cloneNode(true);
  clone.removeAttribute('data-card-previewable');
  clone.removeAttribute('title');
  clone.querySelectorAll('img').forEach(img=>img.draggable=false);

  const light=document.createElement('div');
  light.className='card-preview-light';
  clone.appendChild(light);

  wrap.appendChild(clone);
  stage.appendChild(wrap);

  const hint=document.createElement('div');
  hint.className='card-preview-hint';
  hint.textContent='Move anywhere to tilt the card · click the card to close';
  stage.appendChild(hint);

  overlay.appendChild(stage);
  document.body.appendChild(overlay);

  const maxTiltX=6.2;
  const maxTiltY=7.0;
  const smoothing=.12;

  let targetX=0;
  let targetY=0;
  let currentX=0;
  let currentY=0;
  let targetLightX=50;
  let targetLightY=50;
  let currentLightX=50;
  let currentLightY=50;
  let rafId=0;
  let destroyed=false;

  const onPointerMove=e=>{
    const viewportW=Math.max(1,window.innerWidth);
    const viewportH=Math.max(1,window.innerHeight);

    const nx=Math.max(-1,Math.min(1,(e.clientX/viewportW-.5)*2));
    const ny=Math.max(-1,Math.min(1,(e.clientY/viewportH-.5)*2));

    targetY=nx*maxTiltY;
    targetX=-ny*maxTiltX;

    // Keep the light subtle and mostly centered while restoring the original card tilt.
    targetLightX=50+nx*3.5;
    targetLightY=50+ny*3.0;
  };

  const animate=()=>{
    if(destroyed) return;

    currentX+=(targetX-currentX)*smoothing;
    currentY+=(targetY-currentY)*smoothing;
    currentLightX+=(targetLightX-currentLightX)*.065;
    currentLightY+=(targetLightY-currentLightY)*.065;

    clone.style.transform=
      `perspective(1050px) rotateX(${currentX.toFixed(3)}deg) rotateY(${currentY.toFixed(3)}deg) scale(1.018)`;

    const lightOffsetX=(currentLightX-50)*1.15;
    const lightOffsetY=(currentLightY-50)*1.00;
    light.style.transform=
      `translate(-50%,-50%) translate(${lightOffsetX.toFixed(2)}px,${lightOffsetY.toFixed(2)}px) translateZ(8px)`;

    rafId=requestAnimationFrame(animate);
  };

  const preventDrag=e=>e.preventDefault();
  const preventSelect=e=>e.preventDefault();

  clone.addEventListener('click',e=>{
    e.stopPropagation();
    closeCardAlbumPreview();
  });

  overlay.addEventListener('click',e=>{
    if(e.target===overlay) closeCardAlbumPreview();
  });

  const onKey=e=>{
    if(e.key==='Escape') closeCardAlbumPreview();
  };

  window.addEventListener('pointermove',onPointerMove,{passive:true});
  overlay.addEventListener('dragstart',preventDrag);
  overlay.addEventListener('selectstart',preventSelect);
  document.addEventListener('keydown',onKey);

  CARD_ALBUM_PREVIEW_CLEANUP=()=>{
    destroyed=true;
    if(rafId) cancelAnimationFrame(rafId);
    window.removeEventListener('pointermove',onPointerMove);
    overlay.removeEventListener('dragstart',preventDrag);
    overlay.removeEventListener('selectstart',preventSelect);
    document.removeEventListener('keydown',onKey);
  };

  animate();
}

function wireCardAlbumEvents(){
  const albumShell=document.querySelector('.card-album-shell');

    albumShell.querySelectorAll('img').forEach(img=>img.draggable=false);

const MOTIVATION_CARD_PACK_COST=50;
const MOTIVATION_CARD_PACK_SIZE=5;
const MOTIVATION_NEW_PRODUCT_XP=600; // equivalent to 50 hours at 12 XP/hour
const MOTIVATION_STARTER_GEMS=300;
const MOTIVATION_NEW_PRODUCT_GEMS=500;

function motivationCardPackRarity(){
  const roll=Math.random();
  if(roll<.80) return 'common';
  if(roll<.975) return 'rare';
  return 'legendary';
}
function cardAlbumDrawPool(){
  const dataset=cardAlbumDataset();
  if(!dataset || !Array.isArray(dataset.teams)) return [];
  const pool=[];
  dataset.teams.forEach(team=>{
    cardAlbumEntitiesForTeam(team).forEach(entity=>{
      pool.push({
        teamSourceId:String(team.sourceId),
        entityType:entity.entityType,
        sourceId:String(entity.sourceId)
      });
    });
  });
  return pool;
}
function cardAlbumResolveDraw(draw){
  const dataset=cardAlbumDataset();
  if(!dataset) return null;
  let team=(dataset.teams||[]).find(t=>String(t.sourceId)===String(draw.teamSourceId))||null;
  let entity=null;

  if(team){
    entity=cardAlbumEntitiesForTeam(team).find(e=>String(e.sourceId)===String(draw.sourceId) && e.entityType===draw.entityType)||null;
  }

  if(!entity){
    for(const candidateTeam of dataset.teams||[]){
      const found=cardAlbumEntitiesForTeam(candidateTeam).find(e=>String(e.sourceId)===String(draw.sourceId) && e.entityType===draw.entityType);
      if(found){ team=candidateTeam; entity=found; break; }
    }
  }
  return team&&entity?{team,entity}:null;
}
function motivationGeneratePackDraws(){
  const pool=cardAlbumDrawPool();
  if(!pool.length) return [];
  return Array.from({length:MOTIVATION_CARD_PACK_SIZE},()=>{
    const base=pool[Math.floor(Math.random()*pool.length)];
    return {...base,rarity:motivationCardPackRarity()};
  });
}
function motivationApplyPackToInventory(draws){
  const inventory=cardAlbumInventory();
  draws.forEach(draw=>{
    const key=cardAlbumCardKey(draw.entityType,draw.sourceId,draw.rarity);
    inventory[key]=Math.max(0,Math.floor(Number(inventory[key])||0))+1;
  });
}
async function motivationBuyOrResumeCardPack(){
  const game=motivationGameState();
  if(game.pendingCardPack){
    openMotivationPackOverlay();
    return;
  }
  if(!cardAlbumDataset()){
    showToast('Import a card dataset first');
    return;
  }
  if(game.gems<MOTIVATION_CARD_PACK_COST){
    showToast(`You need ${MOTIVATION_CARD_PACK_COST}💎 for a pack`);
    return;
  }

  const draws=motivationGeneratePackDraws();
  if(draws.length!==MOTIVATION_CARD_PACK_SIZE){
    showToast('No cards are available in the album yet');
    return;
  }

  game.gems-=MOTIVATION_CARD_PACK_COST;
  motivationApplyPackToInventory(draws);
  game.pendingCardPack={
    id:uid('pack'),
    createdAt:new Date().toISOString(),
    cost:MOTIVATION_CARD_PACK_COST,
    draws,
    revealIndex:0
  };
  await persist();
  refreshMotivationAlbumProgress();
  openMotivationPackOverlay();
}
function motivationPackCardHTML(draw){
  const resolved=cardAlbumResolveDraw(draw);
  if(!resolved) return `<div class="card-album-empty"><h3>Card unavailable</h3></div>`;
  return cardAlbumCardHTML(resolved.entity,resolved.team,draw.rarity);
}
function motivationClosePackOverlay(){
  document.getElementById('motivationPackOverlay')?.remove();
}
async function motivationFinishPack(){
  const game=motivationGameState();
  game.pendingCardPack=null;
  await persist();
  motivationClosePackOverlay();
  refreshMotivationAlbumProgress();
  if(ACTIVE_TAB==='album') renderTabContent();
}
async function motivationAdvancePackReveal(){
  const game=motivationGameState();
  const pack=game.pendingCardPack;
  if(!pack) return;
  if(pack.revealIndex<=0) pack.revealIndex=1;
  else if(pack.revealIndex<MOTIVATION_CARD_PACK_SIZE) pack.revealIndex++;
  else pack.revealIndex=MOTIVATION_CARD_PACK_SIZE+1;
  await persist();
  openMotivationPackOverlay();
}
function openMotivationPackOverlay(){
  motivationClosePackOverlay();
  const pack=motivationGameState().pendingCardPack;
  if(!pack) return;

  const overlay=document.createElement('div');
  overlay.id='motivationPackOverlay';
  overlay.className='motivation-pack-overlay';

  let body='';
  if(pack.revealIndex<=0){
    body=`
      <div class="motivation-sealed-pack-wrap">
        <button class="motivation-sealed-pack" id="motivationSealedPack" type="button" aria-label="Open card pack">
          <span class="motivation-sealed-pack-inner">
            <span>Motivation collection</span>
            <strong>5 CARDS</strong>
            <small>Click to tear open</small>
          </span>
        </button>
        <div class="motivation-pack-caption">Your five cards are already secured. Click the pack to tear it open and reveal them one by one.</div>
      </div>`;
  }else if(pack.revealIndex<=MOTIVATION_CARD_PACK_SIZE){
    const draw=pack.draws[pack.revealIndex-1];
    body=`
      <div class="motivation-pack-reveal">
        <div class="motivation-pack-reveal-progress">Card ${pack.revealIndex} / ${MOTIVATION_CARD_PACK_SIZE}</div>
        <div class="motivation-pack-reveal-card">${motivationPackCardHTML(draw)}</div>
        <button type="button" class="btn primary" id="motivationPackNextBtn">${pack.revealIndex<MOTIVATION_CARD_PACK_SIZE?'Reveal next':'View all five'}</button>
      </div>`;
  }else{
    body=`
      <div class="motivation-pack-results">
        <h3>Your pack</h3>
        <div class="motivation-pack-results-grid">${pack.draws.map(motivationPackCardHTML).join('')}</div>
        <div class="motivation-pack-results-actions"><button type="button" class="btn primary" id="motivationPackDoneBtn">Add to collection</button></div>
      </div>`;
  }

  overlay.innerHTML=`
    <div class="motivation-pack-stage">
      <button type="button" class="motivation-pack-close" id="motivationPackCloseBtn" aria-label="Close">×</button>
      ${body}
    </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector('#motivationPackCloseBtn')?.addEventListener('click',()=>{
    if(pack.revealIndex>MOTIVATION_CARD_PACK_SIZE) motivationFinishPack();
    else motivationClosePackOverlay();
  });
  overlay.querySelector('#motivationSealedPack')?.addEventListener('click',()=>{
    const packEl=overlay.querySelector('#motivationSealedPack');
    const stage=overlay.querySelector('.motivation-pack-stage');
    if(packEl) packEl.classList.add('opening');
    if(stage) stage.classList.add('opening');
    setTimeout(()=>motivationAdvancePackReveal(),480);
  });
  overlay.querySelector('#motivationPackNextBtn')?.addEventListener('click',motivationAdvancePackReveal);
  overlay.querySelector('#motivationPackDoneBtn')?.addEventListener('click',motivationFinishPack);
}

function motivationNewProductReward(newCount,firstImport){
  if(!motivationModeEnabled() || newCount<=0) return null;
  const game=motivationGameState();

  if(!game.productLaunchRewardBaselineReady){
    game.productLaunchRewardBaselineReady=true;
    // A first bootstrap import establishes the product baseline, just like the
    // first Toggl sync establishes a work baseline.
    if(firstImport) return null;
  }

  const xp=MOTIVATION_NEW_PRODUCT_XP*newCount;
  const directGems=MOTIVATION_NEW_PRODUCT_GEMS*newCount;
  const xpEvent=motivationGrantXp(xp,`${newCount} new product${newCount===1?'':'s'} shipped`);
  const gemEvent=motivationGrantGems(directGems,`${newCount} new product${newCount===1?'':'s'} shipped`);
  return {
    newCount,
    xp,
    directGems,
    levelGems:xpEvent?.gemsAwarded||0,
    totalGems:directGems+(xpEvent?.gemsAwarded||0),
    xpEvent,
    gemEvent
  };
}

  setTimeout(()=>overlay?.remove(),9000);

  document.body.classList.toggle('dashboard-page-active',ACTIVE_TAB==='dashboard');
  if(ACTIVE_TAB==='dashboard' && !document.querySelector('.topbar')) window.scrollTo(0,0);
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">$</div>
        <div>
          <h1>FAB Profit Analytics</h1>
          <span>This website was created using AI</span>
        </div>
      </div>
      <div class="topbar-nav-group">
        <div class="currency-bar">
          <label class="currency-switcher" title="Display currency">

              ${currencyOptionsHTML()}
            </select>
          </label>
        </div>
        <nav class="tabs" id="tabs">
          ${tabButton('dashboard','Dashboard')}
          ${tabButton('compare','Compare Products')}
          ${tabButton('revenuelog','Revenue Log')}
          ${tabButton('sales','Sales')}
          ${tabButton('import','Import CSV')}
          ${tabButton('products','Edit Products')}
          ${tabButton('settings','Settings')}
          ${tabButton('data','Backup')}
        </nav>
      </div>
    </div>
    <div class="app-content-shell">
      <div class="save-warning" id="saveWarningBanner" style="display:none;">
        <span class="sw-text"></span>
        <button id="saveWarningDismiss" type="button">Dismiss</button>
      </div>
      <div id="tabContent"></div>
    </div>
  `;
  renderSaveWarningBanner();
  const dismissBtn = document.getElementById('saveWarningDismiss');
  if(dismissBtn) dismissBtn.addEventListener('click', ()=>{
    SAVE_WARNING_DISMISSED = true;
    renderSaveWarningBanner();
  });
  const currencySwitcher=document.getElementById('currencySwitcher');
  if(currencySwitcher) currencySwitcher.addEventListener('change',async()=>{
    STATE.settings.displayCurrency=Object.prototype.hasOwnProperty.call(CURRENCY_RATES_FROM_USD,currencySwitcher.value)?currencySwitcher.value:'USD';
    await persist();
    render();
  });

  document.getElementById('tabs').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const nextTab=b.dataset.tab;
      const previousTab=ACTIVE_TAB;
      const enteringRevenueLog=nextTab==='revenuelog' && previousTab!=='revenuelog';
      const leavingRevenueLog=previousTab==='revenuelog' && nextTab!=='revenuelog';
      const enteringDashboard=nextTab==='dashboard' && previousTab!=='dashboard';
      const enteringCompare=nextTab==='compare' && previousTab!=='compare';

      // Any pending Revenue Log bottom-scroll belongs only to the Revenue Log.
      // Cancel it immediately when leaving so a queued frame cannot scroll the
      // newly rendered destination page.
      if(leavingRevenueLog){
        REVENUE_LOG_SCROLL_TO_BOTTOM_ON_RENDER=false;
      }

      ACTIVE_TAB=nextTab;

      // Dashboard should always open at the top, regardless of the page-level
      // scroll position inherited from the Revenue Log.
      if(enteringDashboard){
        window.scrollTo(0,0);
      }

      if(enteringCompare) COMPARE_DEFERRED_RENDER=true;
      if(ACTIVE_TAB!=='import') IMPORT_STATE=null;
      if(enteringRevenueLog){
        REVENUE_LOG_MONTHS_VISIBLE=REVENUE_LOG_INITIAL_MONTHS;
        REVENUE_LOG_LOAD_ALL=false;
        REVENUE_LOG_SCROLL_TO_BOTTOM_ON_RENDER=true;
      }
      render();

      // Reassert after layout because the Revenue Log may previously have left
      // the document at its maximum scroll position.
      if(enteringDashboard){
        requestAnimationFrame(()=>window.scrollTo(0,0));
      }
    });
  });
  mountMotivationFloatingControl();
  renderTabContent();
}

function motivationModeEnabled(){
  return !!(STATE && STATE.settings && STATE.settings.motivationMode===true);
}

function motivationNetForProducts(products,start=null,end=null){
  return (products||[]).reduce((sum,p)=>sum+rawNetForProductRange(p,start,end),0);
}

function motivationTopProduct(products,start=null,end=null){
  const rows=(products||[]).map(p=>({
    product:p,
    revenue:rawNetForProductRange(p,start,end)
  })).sort((a,b)=>b.revenue-a.revenue);
  return rows[0]||null;
}

function motivationNextRevenueCheckpoint(total){
  const value=Math.max(0,Number(total)||0);
  let step=250;
  if(value>=1000) step=500;
  if(value>=5000) step=1000;
  if(value>=20000) step=2500;
  if(value>=50000) step=5000;
  if(value>=100000) step=10000;

  const target=(Math.floor(value/step)+1)*step;
  const previous=Math.max(0,target-step);
  const span=Math.max(1,target-previous);
  const progress=Math.max(0,Math.min(100,(value-previous)/span*100));
  return {target,previous,remaining:Math.max(0,target-value),progress};
}

function motivationWindow(days,offsetDays=0){
  const end=datePlusDays(todayStr(),offsetDays);
  const start=datePlusDays(end,-Math.max(0,days-1));
  return {start,end};
}

function motivationPercentChange(current,previous){
  const now=Number(current)||0;
  const before=Number(previous)||0;
  if(Math.abs(before)<0.000001) return null;
  return (now-before)/Math.abs(before)*100;
}

  `;
}

function motivationProductTagHTML(product){

  const ids=(STATE.products||[]).map(p=>p.id);

}

function motivationDashboardModel(){
  const products=STATE.products||[];
  if(!products.length) return null;

  const last30=motivationWindow(30,0);
  const prev30={start:datePlusDays(last30.start,-30),end:datePlusDays(last30.start,-1)};
  const current30=motivationNetForProducts(products,last30.start,last30.end);
  const previous30=motivationNetForProducts(products,prev30.start,prev30.end);
  const change=motivationPercentChange(current30,previous30);
  const lifetime=motivationNetForProducts(products);
  const checkpoint=motivationNextRevenueCheckpoint(lifetime);
  const last90=motivationWindow(90,0);
  const top=motivationTopProduct(products,last90.start,last90.end);
  const total90=motivationNetForProducts(products,last90.start,last90.end);
  const share=top&&total90>0?Math.round(top.revenue/total90*100):0;

  const momentumText=change===null
    ? 'No earlier 30-day baseline yet'
    : `${change>=0?'+':''}${Math.round(change)}% vs previous 30 days`;
  const action=top
    ? `${motivationProductTagHTML(top.product)} is the strongest 90-day earner${share?` at ${share}% of portfolio revenue`:''}. Protect that momentum with a useful update, while the next product expands the ceiling.`
    : 'Keep the portfolio moving: improve one existing asset and keep the next release progressing.';

  return {
    eyebrow:'Developer momentum',
    title:`${fmtMoney(checkpoint.remaining)} to the next lifetime checkpoint`,
    metrics:[
      motivationMetricHTML('Next checkpoint',fmtMoney(checkpoint.target),`${Math.round(checkpoint.progress)}% through this step`),
      motivationMetricHTML('Last 30 days',fmtMoney(current30),escapeHtml(momentumText)),
      motivationMetricHTML('Live products',String(products.length),'Each product is another revenue surface')
    ],
    progress:checkpoint.progress,
    action
  };
}

function motivationCompareModel(){
  const products=getFilteredProducts();
  if(!products.length) return null;
  const last90=motivationWindow(90,0);
  const ranked=products.map(p=>({product:p,revenue:rawNetForProductRange(p,last90.start,last90.end)}))
    .sort((a,b)=>b.revenue-a.revenue);
  const top=ranked[0];
  const second=ranked[1]||null;
  const total=ranked.reduce((s,r)=>s+r.revenue,0);
  const share=total>0?Math.round(top.revenue/total*100):0;
  const gap=second?Math.max(0,top.revenue-second.revenue):0;
  const action=second
    ? `${motivationProductTagHTML(top.product)} leads the selected products. Use the gap to decide deliberately: compound the winner with an update, or lift ${motivationProductTagHTML(second.product)} with the clearest improvement.`
    : `${motivationProductTagHTML(top.product)} is the current focus. The next leverage point is either a meaningful update or another product beside it.`;

  return {
    eyebrow:'Where to push next',
    title:`${motivationProductTagHTML(top.product)} leads the last 90 days`,
    metrics:[
      motivationMetricHTML('90-day leader',fmtMoney(top.revenue),share?`${share}% of selected revenue`:''),
      motivationMetricHTML('Lead over #2',second?fmtMoney(gap):'—',second?`vs ${escapeHtml(shortNameFor(second.product))}`:'Only one product selected'),
      motivationMetricHTML('Compared products',String(products.length),'Pick one update target, not ten')
    ],
    action
  };
}

function motivationRevenueLogModel(){
  const products=getFilteredProducts();
  if(!products.length) return null;
  const last30=motivationWindow(30,0);
  const last90=motivationWindow(90,0);
  const days30=daysInRangeList(last30);
  const days90=daysInRangeList(last90);
  const totals30=days30.map(date=>({date,value:motivationNetForProducts(products,date,date)}));
  const totals90=days90.map(date=>({date,value:motivationNetForProducts(products,date,date)}));
  const positiveDays=totals30.filter(x=>x.value>0.005).length;
  const total30=totals30.reduce((s,x)=>s+x.value,0);
  const average30=total30/Math.max(1,totals30.length);
  const best=totals90.slice().sort((a,b)=>b.value-a.value)[0]||{date:todayStr(),value:0};

  return {
    eyebrow:'Daily proof of momentum',
    title:`Revenue showed up on ${positiveDays} of the last 30 days`,
    metrics:[
      motivationMetricHTML('Revenue days',`${positiveDays}/30`,'More independent products can make this steadier'),
      motivationMetricHTML('Best day · 90d',fmtMoney(best.value),escapeHtml(shortDayLabel(best.date))),
      motivationMetricHTML('30-day daily average',fmtMoney(average30),'Including zero-revenue days')
    ],
    action:'Every non-zero day is evidence that shipped work keeps working after development ends. The strongest way to multiply those days is more useful updates and more products in the portfolio.'
  };
}

function motivationSalesModel(){
  const futurePlanned=(STATE.plannedSales||[]).filter(x=>x&&x.start>todayStr());
  const urgent=urgentUnconfirmedSales();
  let suggestionCount=0;
  try{ suggestionCount=salesSuggestions().length; }catch(_){ suggestionCount=0; }
  const next=futurePlanned.slice().sort((a,b)=>a.start.localeCompare(b.start))[0]||null;
  const nextProduct=next?(STATE.products||[]).find(p=>p.id===next.productId):null;
  const nextInfo=next?saleRequestDeadlineInfo(next.start):null;

  let action='Turn one useful sale opportunity into a concrete planned request. A visible pipeline makes future revenue less accidental.';
  if(urgent.length){
    const first=urgent[0];
    action=`Request ${motivationProductTagHTML(first.product)} first — its request window is the nearest. Protect the revenue opportunities you already created before planning the next one.`;
  }else if(next&&nextProduct&&nextInfo){
    action=`Next planned opportunity: ${motivationProductTagHTML(nextProduct)} starts ${escapeHtml(shortDayLabel(next.start))}. You still have ${nextInfo.daysLeft} day${nextInfo.daysLeft===1?'':'s'} before its request deadline.`;
  }

  return {
    eyebrow:'Revenue pipeline',
    title:`${futurePlanned.length} planned · ${suggestionCount} suggested`,
    metrics:[
      motivationMetricHTML('Planned sales',String(futurePlanned.length),'Already turned into concrete intent'),
      motivationMetricHTML('Suggestions',String(suggestionCount),'Potential opportunities still available'),
      motivationMetricHTML('Request soon',String(urgent.length),urgent.length?'Less than 8 days left':'No urgent request windows')
    ],
    action
  };
}

function motivationProductsModel(){
  const products=STATE.products||[];
  if(!products.length) return null;
  const last90=motivationWindow(90,0);
  const top=motivationTopProduct(products,last90.start,last90.end);
  const newest=products.slice().sort((a,b)=>String(firstSaleDate(b.id)||'').localeCompare(String(firstSaleDate(a.id)||'')))[0]||null;
  const newestDate=newest?firstSaleDate(newest.id):null;
  const newestAge=newestDate?Math.max(0,dayDiff(newestDate,todayStr())):null;
  const nextPortfolioCount=products.length+1;

  return {
    eyebrow:'Portfolio builder',
    title:`Next portfolio milestone: ${nextPortfolioCount} live products`,
    metrics:[
      motivationMetricHTML('Products live',String(products.length),`Next milestone: ${nextPortfolioCount} live products`),
      motivationMetricHTML('Newest product',newest?escapeHtml(shortNameFor(newest)):'—',newestAge===null?'':`${newestAge} day${newestAge===1?'':'s'} in market`),
      motivationMetricHTML('90-day leader',top?escapeHtml(shortNameFor(top.product)):'—',top?fmtMoney(top.revenue):'')
    ],
    action:top
      ? `${motivationProductTagHTML(top.product)} is currently doing the most recent revenue work. A focused update can strengthen an existing earner, while every additional product you release adds another independent revenue surface.`
      : `Keep improving what is live while moving future releases toward launch. Every additional live product adds another independent revenue surface.`
  };
}



function motivationWorkLogEntries(){
  return Array.isArray(STATE.motivationWorkLog) ? STATE.motivationWorkLog : [];
}
function motivationWorkEntryForDate(date){
  return motivationWorkLogEntries().find(x=>x && x.date===date) || null;
}
function motivationTogglState(){
  if(!STATE.motivationToggl || typeof STATE.motivationToggl!=='object'){
    STATE.motivationToggl={dailyHours:{},lastSyncAt:null,lastError:null,entryCount:0,syncStart:null,syncEnd:null};
  }
  if(!STATE.motivationToggl.dailyHours || typeof STATE.motivationToggl.dailyHours!=='object'){
    STATE.motivationToggl.dailyHours={};
  }
  return STATE.motivationToggl;
}
function motivationTogglConnected(){
  return !!getTogglApiToken();
}
function motivationTogglHours(date){
  return Math.max(0,Number(motivationTogglState().dailyHours?.[date])||0);
}
function motivationWorkHours(date){
  const manual=motivationWorkEntryForDate(date);
  if(manual) return Math.max(0,Number(manual.hours)||0);
  return motivationTogglHours(date);
}
function motivationWorkSource(date){
  if(motivationWorkEntryForDate(date)) return 'manual';
  if(Object.prototype.hasOwnProperty.call(motivationTogglState().dailyHours||{},date)) return 'toggl';
  return 'none';
}
function motivationWorkTrackingStart(){
  const dates=new Set();
  motivationWorkLogEntries().forEach(x=>{
    if(x && Number(x.hours)>0 && x.date) dates.add(x.date);
  });
  Object.entries(motivationTogglState().dailyHours||{}).forEach(([date,hours])=>{
    if(Number(hours)>0) dates.add(date);
  });
  return [...dates].sort()[0]||null;
}
function motivationWorkSetHours(date,hours){
  const value=Math.max(0,Math.min(24,Number(hours)||0));
  STATE.motivationWorkLog=(STATE.motivationWorkLog||[]).filter(x=>x && x.date!==date);
  STATE.motivationWorkLog.push({
    date,
    hours:Math.round(value*100)/100,
    updatedAt:new Date().toISOString(),
    source:'manual'
  });
  STATE.motivationWorkLog.sort((a,b)=>a.date.localeCompare(b.date));
}
function motivationWorkClearManualOverride(date){
  STATE.motivationWorkLog=(STATE.motivationWorkLog||[]).filter(x=>x && x.date!==date);
}
function motivationTogglLastSyncText(){
  const state=motivationTogglState();
  if(!state.lastSyncAt) return 'Not synced yet';
  const d=new Date(state.lastSyncAt);
  if(Number.isNaN(d.getTime())) return 'Synced previously';
  return `Last sync ${d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}`;
}

function motivationTogglSplitEntryByLocalDay(entry,rangeStart,rangeEnd,totals){
  if(!entry || !entry.start) return;
  const start=new Date(entry.start);
  let startMs=start.getTime();
  if(!Number.isFinite(startMs)) return;

  const duration=Number(entry.duration);
  let endMs=NaN;
  if(entry.stop){
    const stopMs=new Date(entry.stop).getTime();
    if(Number.isFinite(stopMs)) endMs=stopMs;
  }
  if(!Number.isFinite(endMs)){
    if(Number.isFinite(duration) && duration>=0) endMs=startMs+duration*1000;
    else endMs=Date.now();
  }
  if(!Number.isFinite(endMs) || endMs<=startMs) return;
  endMs=Math.min(endMs,Date.now());

  let cursorMs=startMs;
  let guard=0;
  while(cursorMs<endMs && guard<100){
    const cursor=new Date(cursorMs);
    const date=localDateString(cursor);
    const nextMidnight=new Date(cursor.getFullYear(),cursor.getMonth(),cursor.getDate()+1,0,0,0,0).getTime();
    const chunkEnd=Math.min(endMs,nextMidnight);
    if(date>=rangeStart && date<=rangeEnd){
      totals[date]=(Number(totals[date])||0)+(chunkEnd-cursorMs)/3600000;
    }
    cursorMs=chunkEnd;
    guard++;
  }
}
function motivationTogglAggregateEntries(entries,rangeStart,rangeEnd){
  const totals={};
  (Array.isArray(entries)?entries:[]).forEach(entry=>{
    motivationTogglSplitEntryByLocalDay(entry,rangeStart,rangeEnd,totals);
  });

  const result={};
  let cursor=rangeStart;
  while(cursor<=rangeEnd){
    const value=Math.max(0,Math.min(24,Number(totals[cursor])||0));
    result[cursor]=Math.round(value*100)/100;
    cursor=datePlusDays(cursor,1);
  }
  return result;
}
async function motivationFetchTogglTimeEntries(token,rangeStart,rangeEnd,bridgeOverride=null){
  const bridgeBase=normalizeTogglBridgeUrl(bridgeOverride||getTogglBridgeUrl());
  if(!bridgeBase){
    throw new Error('Set your online Toggl bridge URL first.');
  }

  const bridgeUrl=`${bridgeBase}/time_entries`;
  let response;
  try{
    response=await fetch(bridgeUrl,{
      method:'POST',
      mode:'cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        token,
        start_date:rangeStart,
        // The bridge validates YYYY-MM-DD values. Use tomorrow as the
        // inclusive/exclusive safety boundary so all of today's completed
        // entries are returned even if the upstream API treats end_date as
        // the start of that calendar day.
        end_date:datePlusDays(rangeEnd,1)
      })
    });
  }catch(error){
    const err=new Error(
      'The online Toggl bridge could not be reached. Check the bridge URL and make sure the Worker is deployed.'
    );
    err.cause=error;
    throw err;
  }

  let payload=null;
  try{ payload=await response.json(); }catch(_){}

  if(!response.ok){
    const detail=payload && payload.error
      ? payload.error
      : `Online Toggl bridge failed (${response.status}).`;
    throw new Error(detail);
  }

  if(!payload || !Array.isArray(payload.entries)){
    throw new Error('The online Toggl bridge returned an unexpected response.');
  }
  return payload.entries;
}

async function motivationSyncToggl60Days(tokenOverride=null,bridgeOverride=null){
  const token=String(tokenOverride||getTogglApiToken()||'').trim();
  if(!token) throw new Error('Enter your Toggl Track API token first.');

  const rangeEnd=todayStr();
  const rangeStart=datePlusDays(rangeEnd,-59);
  const entries=await motivationFetchTogglTimeEntries(token,rangeStart,rangeEnd,bridgeOverride);
  const dailyHours=motivationTogglAggregateEntries(entries,rangeStart,rangeEnd);
  const state=motivationTogglState();
  const game=motivationGameState();

  let newWorkHours=0;
  let xpEvent=null;

  if(!game.workXpBaselineReady){
    // The first successful sync establishes a fair baseline so importing old
    // history does not instantly grant dozens of levels.
    Object.entries(dailyHours).forEach(([date,hours])=>{
      game.workXpAwardedHours[date]=Math.max(
        Number(game.workXpAwardedHours[date])||0,
        Number(hours)||0
      );
    });
    game.workXpBaselineReady=true;
  }else{
    Object.entries(dailyHours).forEach(([date,hours])=>{
      const current=Math.max(0,Number(hours)||0);
      const already=Math.max(0,Number(game.workXpAwardedHours[date])||0);
      if(current>already){
        newWorkHours+=current-already;
        game.workXpAwardedHours[date]=current;
      }
    });

    if(newWorkHours>0.0001){
      const rawXp=newWorkHours*MOTIVATION_WORK_XP_PER_HOUR+game.workXpCarry;
      const wholeXp=Math.floor(rawXp);
      game.workXpCarry=rawXp-wholeXp;
      if(wholeXp>0){
        xpEvent=motivationGrantXp(
          wholeXp,
          `${motivationFormatHours(newWorkHours)} newly synced from Toggl`
        );
      }
    }
  }

  state.dailyHours=dailyHours;
  state.lastSyncAt=new Date().toISOString();
  state.lastError=null;
  state.entryCount=entries.length;
  state.syncStart=rangeStart;
  state.syncEnd=rangeEnd;
  await persist();

  return {
    entries,
    dailyHours,
    rangeStart,
    rangeEnd,
    newWorkHours:Math.round(newWorkHours*100)/100,
    xpAwarded:xpEvent?xpEvent.amount:0,
    xpEvent,
    baselineEstablished:!xpEvent && newWorkHours<=0 && game.workXpBaselineReady
  };
}

const MOTIVATION_WORK_XP_PER_HOUR=30;
/* challenge-xp-plus-20 */

function motivationGameState(){
  if(!STATE.motivationGame || typeof STATE.motivationGame!=='object'){
    STATE.motivationGame={
      totalXp:0,gems:MOTIVATION_STARTER_GEMS,starterGemsGranted:true,activeChallenge:null,challengeHistory:[],gemChallenge:null,gemChallengeHistory:[],tasks:[],
      workXpBaselineReady:false,workXpAwardedHours:{},workXpCarry:0,lastTaskPromptAt:null,
      productLaunchRewardBaselineReady:(STATE.products||[]).length>0,pendingCardPack:null
    };
  }
  if(!Array.isArray(STATE.motivationGame.challengeHistory)) STATE.motivationGame.challengeHistory=[];
  if(!Array.isArray(STATE.motivationGame.gemChallengeHistory)) STATE.motivationGame.gemChallengeHistory=[];
  if(!Array.isArray(STATE.motivationGame.tasks)) STATE.motivationGame.tasks=[];
  if(!STATE.motivationGame.workXpAwardedHours || typeof STATE.motivationGame.workXpAwardedHours!=='object'){
    STATE.motivationGame.workXpAwardedHours={};
  }
  if(typeof STATE.motivationGame.starterGemsGranted!=='boolean'){
    STATE.motivationGame.gems=Math.max(MOTIVATION_STARTER_GEMS,Math.floor(Number(STATE.motivationGame.gems)||0));
    STATE.motivationGame.starterGemsGranted=true;
  }else{
    STATE.motivationGame.gems=Math.max(0,Math.floor(Number(STATE.motivationGame.gems)||0));
  }
  return STATE.motivationGame;
}

function motivationXpRequiredForLevel(level){
  const l=Math.max(1,Math.round(Number(level)||1));
  // Early levels are quick. Cost rises gradually and then plateaus at 1,200 XP
  // so late levels remain meaningful but always realistically reachable.
  const uncapped=120 + (l-1)*6 + Math.pow(l-1,2)*0.035;
  return Math.min(1200,Math.max(120,Math.round(uncapped/5)*5));
}

function motivationLevelInfo(totalXp=null){
  let remaining=Math.max(0,Math.round(
    totalXp===null ? Number(motivationGameState().totalXp)||0 : Number(totalXp)||0
  ));
  let level=1;
  let guard=0;
  while(guard<10000){
    const needed=motivationXpRequiredForLevel(level);
    if(remaining<needed){
      return {
        level,
        currentXp:remaining,
        requiredXp:needed,
        progress:needed?remaining/needed*100:0,
        totalXp:Math.max(0,Math.round(totalXp===null?Number(motivationGameState().totalXp)||0:Number(totalXp)||0))
      };
    }
    remaining-=needed;
    level++;
    guard++;
  }
  return {level,currentXp:0,requiredXp:1200,progress:0,totalXp:Number(totalXp)||0};
}

function motivationLevelGemReward(level){
  const l=Math.max(2,Math.round(Number(level)||2));
  const previousReward=20+l*2;
  return Math.min(112,Math.round(previousReward*1.584));
}

function motivationGrantGems(amount,reason){
  const game=motivationGameState();
  const gems=Math.max(0,Math.round(Number(amount)||0));
  if(!gems) return null;
  game.gems=Math.max(0,Math.floor(Number(game.gems)||0))+gems;
  return {
    type:'gems',
    amount:gems,
    reason:String(reason||'Gem reward'),
    balance:game.gems
  };
}

function motivationGrantXp(amount,reason){
  const game=motivationGameState();
  const xp=Math.max(0,Math.round(Number(amount)||0));
  if(!xp) return null;
  const before=motivationLevelInfo(game.totalXp);
  game.totalXp+=xp;
  const after=motivationLevelInfo(game.totalXp);

  let gemsAwarded=0;
  if(after.level>before.level){
    for(let level=before.level+1;level<=after.level;level++){
      gemsAwarded+=motivationLevelGemReward(level);
    }
    game.gems=Math.max(0,Math.floor(Number(game.gems)||0))+gemsAwarded;
  }

  const event={
    type:'xp',
    amount:xp,
    reason:String(reason||'Progress'),
    before,
    after,
    leveledUp:after.level>before.level,
    gemsAwarded
  };

  if(event.leveledUp){
    setTimeout(()=>showMotivationLevelUpCelebration(event),120);
  }

  return event;
}

function motivationWorkDates(days=60){
  const count=Math.max(1,Math.round(Number(days)||60));
  const out=[];
  for(let i=count-1;i>=0;i--) out.push(datePlusDays(todayStr(),-i));
  return out;
}

function motivationFormatHours(value){
  const n=Math.round((Number(value)||0)*10)/10;
  return `${Number.isInteger(n)?n:n.toFixed(1)} h`;
}

function motivationShortDate(date,includeYear=false){
  if(!date) return '—';
  const d=new Date(date+'T12:00:00');
  return d.toLocaleDateString(undefined,includeYear
    ? {month:'short',day:'numeric',year:'numeric'}
    : {month:'short',day:'numeric'});
}

function motivationDateRangeLabel(start,end){
  if(!start || !end) return '—';
  return start===end
    ? motivationShortDate(start,true)
    : `${motivationShortDate(start)} – ${motivationShortDate(end,true)}`;
}

function motivationWorkWindowStats(start,end){
  const days=[];
  let cursor=start;
  while(cursor<=end){
    days.push(cursor);
    cursor=datePlusDays(cursor,1);
  }
  const hours=days.reduce((sum,date)=>sum+motivationWorkHours(date),0);
  const activeDays=days.filter(date=>motivationWorkHours(date)>0).length;
  return {
    start,end,days,
    hours:Math.round(hours*100)/100,
    activeDays,
    averageActive:activeDays?hours/activeDays:0
  };
}

function motivationLocalTodayStr(){
  return localDateString(new Date());
}

function motivationWeekStart(date=motivationLocalTodayStr()){
  const d=new Date(date+'T12:00:00');
  const mondayOffset=(d.getDay()+6)%7;
  return datePlusDays(date,-mondayOffset);
}

function motivationWeekStats(offset=0){
  const localToday=motivationLocalTodayStr();
  const thisMonday=motivationWeekStart(localToday);
  const start=datePlusDays(thisMonday,offset*7);
  const calendarEnd=datePlusDays(start,6);

  // Current week is "week to date": Monday through the current local day.
  // Previous weeks always use the complete Monday-Sunday range.
  const dataEnd=offset===0 ? localToday : calendarEnd;
  const stats=motivationWorkWindowStats(start,dataEnd);

  return {
    ...stats,
    calendarStart:start,
    calendarEnd,
    label:motivationDateRangeLabel(start,calendarEnd)
  };
}

function motivationWorkCurrentStreak(){
  const today=todayStr();
  let cursor=motivationWorkHours(today)>0 ? today : datePlusDays(today,-1);
  let count=0;
  while(motivationWorkHours(cursor)>0){
    count++;
    cursor=datePlusDays(cursor,-1);
    if(count>3650) break;
  }
  return count;
}

function motivationWorkBestStreakInfo(days=60,minHours=.0001){
  let bestDays=0,bestStart=null,bestEnd=null;
  let currentDays=0,currentStart=null;

  motivationWorkDates(days).forEach(date=>{
    if(motivationWorkHours(date)>=minHours){
      if(currentDays===0) currentStart=date;
      currentDays++;
      if(currentDays>bestDays){
        bestDays=currentDays;
        bestStart=currentStart;
        bestEnd=date;
      }
    }else{
      currentDays=0;
      currentStart=null;
    }
  });
  return {days:bestDays,start:bestStart,end:bestEnd};
}

function motivationWorkComparisonText(current,previous){
  if(previous.hours<=0){
    if(current.hours<=0) return 'No hours logged yet';
    return 'New baseline — keep building it';
  }
  const pct=(current.hours-previous.hours)/previous.hours*100;
  const rounded=Math.round(Math.abs(pct));
  return `${pct>=0?'↑':'↓'} ${rounded}% vs previous 30 days`;
}

  return Math.floor(Math.random()*(max-min+1))+min;
}
