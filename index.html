function keepSalesSelectionInView(direction){
  const scroller=document.getElementById('salesTimelineScroll');
  if(!scroller || !SALES_SHIFT_SELECTION.size) return;

  // Stable anchor: the selected sale with the earliest original start date.
  const entries=[...SALES_SHIFT_SELECTION.values()]
    .slice()
    .sort((a,b)=>{
      const byStart=a.period.start.localeCompare(b.period.start);
      return byStart!==0 ? byStart : a.key.localeCompare(b.key);
    });

  const anchorEntry=entries[0];
  if(!anchorEntry) return;

  const anchorBox=[...document.querySelectorAll('.sales-timeline-sale-period.multi-selected')]
    .find(box=>{
      const p=STATE.products.find(x=>x.id===box.dataset.productId);
      if(!p) return false;
      const key=`${p.id}|${box.dataset.originalStart}|${box.dataset.originalEnd}`;
      return key===anchorEntry.key;
    });
  if(!anchorBox) return;

  // Use fixed timeline coordinates, not getBoundingClientRect().
  // This avoids alternating targets while the box/scroll animations are mid-frame.
  const row=document.querySelector('[data-sales-date]');
  const rowHeight=row ? row.getBoundingClientRect().height : 42;
  const intendedShift=SALES_SHIFT_DAY_OFFSET*rowHeight;

  const previewTop=anchorBox.offsetTop+intendedShift;
  const previewBottom=previewTop+anchorBox.offsetHeight;

  const margin=58;
  const visibleTop=scroller.scrollTop+margin;
  const visibleBottom=scroller.scrollTop+scroller.clientHeight-margin;

  let targetTop=scroller.scrollTop;
  if(previewTop<visibleTop){
    targetTop=previewTop-margin;
  }else if(previewBottom>visibleBottom){
    targetTop=previewBottom-(scroller.clientHeight-margin);
  }else{
    return;
  }

  targetTop=Math.max(0,Math.min(scroller.scrollHeight-scroller.clientHeight,targetTop));
  if(Math.abs(targetTop-scroller.scrollTop)<1) return;

  const startTop=scroller.scrollTop;
  const duration=90;
  const started=performance.now();

  if(keepSalesSelectionInView._raf){
    cancelAnimationFrame(keepSalesSelectionInView._raf);
  }

  const ease=t=>1-Math.pow(1-t,3);
  const step=now=>{
    const t=Math.min(1,(now-started)/duration);
    scroller.scrollTop=startTop+(targetTop-startTop)*ease(t);
    if(t<1){
      keepSalesSelectionInView._raf=requestAnimationFrame(step);
    }else{
      scroller.scrollTop=targetTop;
      keepSalesSelectionInView._raf=null;
    }
  };

  keepSalesSelectionInView._raf=requestAnimationFrame(step);
}
function updateSalesSelectionPreview(){
  const row=document.querySelector('[data-sales-date]');
  const rowHeight=row?row.getBoundingClientRect().height:42;

function saveShiftedSelection(entries,offset){

  return changed;
}

async function copyFabSupportRows(rows,button){
  const eligible=rows.filter(row=>Number(row.discount)<=50);
  if(!eligible.length){
    showSalesTransientMessage('No selected products have a requested discount of 50% or less.');
    return;
  }

  if(eligible.some(row=>!row.id)){
    showSalesTransientMessage('Add product URLs on the Edit Products page before copying a FAB support request.');
    return;
  }

  const text=[
    'Please schedule the following products:',
    ...eligible.map(row=>
      `www.fab.com/listings/${row.id}, ${formatFabSupportDate(row.start)}, ${formatFabSupportDate(row.end)}, ${Number(row.discount)}`
    )
  ].join('\n');

  try{
    await navigator.clipboard.writeText(text);
  }catch(err){
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  animateClipboardButton(button);
}

function normalizeSaleDiscountValue(value){
  const n=Number(value);
  return Number.isFinite(n) && Number.isInteger(n) && n>=10 && n<=100 ? n : null;
}

function discountPickerHTML(prefix,value){
  const current=normalizeSaleDiscountValue(value);
  const presets=[10,20,30,40,50];
  return `
    <div class="sale-discount-picker" data-discount-picker="${escapeAttr(prefix)}">
      <div class="sale-discount-presets">
        ${presets.map(v=>`<button type="button" class="sale-discount-preset ${current===v?'selected':''}" data-discount-value="${v}">${v}%</button>`).join('')}
      </div>
      <label class="sale-discount-custom-wrap">
        
        <div class="sale-discount-custom-input">
          <input type="text" inputmode="numeric" maxlength="3" autocomplete="off" id="${escapeAttr(prefix)}Custom" value="${current!==null&&!presets.includes(current)?current:''}" placeholder="10–100">
          <span>%</span>
        </div>
      </label>
    </div>
  `;
}

function wireDiscountPicker(root,prefix,initialValue){
  const wrap=root.querySelector(`[data-discount-picker="${prefix}"]`);
  if(!wrap) return null;
  const buttons=[...wrap.querySelectorAll('[data-discount-value]')];
  const input=wrap.querySelector(`#${prefix}Custom`);
  let value=normalizeSaleDiscountValue(initialValue);

  const sync=()=>{
    buttons.forEach(btn=>btn.classList.toggle('selected',Number(btn.dataset.discountValue)===value));
    const preset=[10,20,30,40,50].includes(value);
    wrap.classList.toggle('custom-selected',value!==null&&!preset);
  };

  buttons.forEach(btn=>btn.addEventListener('click',()=>{
    value=Number(btn.dataset.discountValue);
    if(input) input.value='';
    sync();
  }));

  if(input){
    input.addEventListener('input',()=>{
    input.value=input.value.replace(/\D/g,'').slice(0,3);
    if(Number(input.value)>100) input.value='100';
      input.value=input.value.replace(/\D/g,'').slice(0,3);
      const parsed=normalizeSaleDiscountValue(input.value);
      value=parsed;
      sync();
    });
  }

  sync();
  return {
    getValue:()=>value,
    setValue:v=>{
      value=normalizeSaleDiscountValue(v);
      if(input) input.value=value!==null&&![10,20,30,40,50].includes(value)?String(value):'';
      sync();
    }
  };
}

function normalizeFabEventImportText(value){
  return String(value??'')
    .replace(/\u00a0/g,' ')
    .replace(/\u202f/g,' ')
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/\*\*/g,'')
    .replace(/__/g,'')
    .replace(/[–—]/g,'-')
    .replace(/[ \t]+/g,' ')
    .trim();
}

function fabEventImportNumber(value){
  const raw=String(value??'').trim().toLowerCase();
  if(/^\d+$/.test(raw)) return Number(raw);
  const words={
    one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,
    ten:10
  };
  return words[raw]??null;
}

function fabEventImportDate(monthName,dayValue,yearValue){
  const monthMap={
    january:1,february:2,march:3,april:4,may:5,june:6,
    july:7,august:8,september:9,sept:9,sep:9,october:10,oct:10,
    november:11,nov:11,december:12,dec:12
  };
  const month=monthMap[String(monthName||'').toLowerCase()];
  const day=Number(dayValue);
  const year=Number(yearValue);
  if(!month || !Number.isInteger(day) || day<1 || day>31 || !Number.isInteger(year)) return null;

  const d=new Date(Date.UTC(year,month-1,day));
  if(
    d.getUTCFullYear()!==year ||
    d.getUTCMonth()!==month-1 ||
    d.getUTCDate()!==day
  ) return null;

  return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

function fabEventImportCapacity(segment){
  const text=String(segment||'').toLowerCase();

  if(
    /\bany\s+(?:number|amount)\b/.test(text) ||
    /\bunlimited\b/.test(text) ||
    /\bno\s+(?:product\s+)?limit\b/.test(text) ||
    /\bwithout\s+(?:a\s+)?(?:product\s+)?limit\b/.test(text)
  ){
    return {unlimitedProducts:true,maxProducts:3,detected:true};
  }

  const numberToken='(one|two|three|four|five|six|seven|eight|nine|ten|\\d{1,2})';
  const patterns=[
    new RegExp(`\\bup\\s+to\\s+${numberToken}\\b`,'i'),
    new RegExp(`\\bmax(?:imum)?(?:\\s+of)?\\s+${numberToken}\\b`,'i'),
    new RegExp(`\\blimit(?:ed)?\\s+to\\s+${numberToken}\\b`,'i'),
    new RegExp(`\\b${numberToken}\\s+(?:eligible\\s+)?products?\\b`,'i')
  ];

  for(const pattern of patterns){
    const match=text.match(pattern);
    if(!match) continue;
    const token=match.slice(1).find(x=>x!==undefined);
    const n=fabEventImportNumber(token);
    if(Number.isInteger(n) && n>=1){
      return {
        unlimitedProducts:false,
        maxProducts:Math.max(1,Math.min(9,n)),
        detected:true
      };
    }
  }

  return {unlimitedProducts:null,maxProducts:null,detected:false};
}

function parseFabEventImportText(value){
  const text=normalizeFabEventImportText(value);
  if(!text) return [];

  const month='(January|February|March|April|May|June|July|August|September|Sept|Sep|October|Oct|November|Nov|December|Dec)';
  const day='(\\d{1,2})(?:st|nd|rd|th)?';
  const year='(\\d{4})';
  const writtenDate=`${month}\\s+${day}\\s*,?\\s*${year}`;
  const numericDate='(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})';
  const dateToken=`(?:${writtenDate}|${numericDate})`;

  const pairRegex=new RegExp(
    `${dateToken}\\s*(?:to|through|until|-)\\s*${dateToken}`,
    'gi'
  );

  const numericToIso=(monthValue,dayValue,yearValue)=>{
    const monthNumber=Number(monthValue);
    const dayNumber=Number(dayValue);
    const yearNumber=Number(yearValue);
    if(
      !Number.isInteger(monthNumber) || monthNumber<1 || monthNumber>12 ||
      !Number.isInteger(dayNumber) || dayNumber<1 || dayNumber>31 ||
      !Number.isInteger(yearNumber)
    ) return null;

    const d=new Date(Date.UTC(yearNumber,monthNumber-1,dayNumber));
    if(
      d.getUTCFullYear()!==yearNumber ||
      d.getUTCMonth()!==monthNumber-1 ||
      d.getUTCDate()!==dayNumber
    ) return null;

    return `${yearNumber}-${String(monthNumber).padStart(2,'0')}-${String(dayNumber).padStart(2,'0')}`;
  };

  const decodeDate=(m,offset)=>{
    const writtenMonth=m[offset];
    const writtenDay=m[offset+1];
    const writtenYear=m[offset+2];
    const numericMonth=m[offset+3];
    const numericDay=m[offset+4];
    const numericYear=m[offset+5];

    if(writtenMonth!==undefined){
      return fabEventImportDate(writtenMonth,writtenDay,writtenYear);
    }
    if(numericMonth!==undefined){
      return numericToIso(numericMonth,numericDay,numericYear);
    }
    return null;
  };

  const matches=[];
  let match;
  while((match=pairRegex.exec(text))){
    const startDate=decodeDate(match,1);
    const endDate=decodeDate(match,7);

    matches.push({
      index:match.index,
      endIndex:pairRegex.lastIndex,
      raw:match[0],
      start:startDate,
      end:endDate
    });
  }

  return matches
    .filter(x=>x.start && x.end && x.end>=x.start)
    .map((item,index)=>{
      const next=matches[index+1];
      const nextNewline=text.indexOf('\n',item.endIndex);
      const nextEventStart=next ? next.index : text.length;
      const segmentEnd=nextNewline>=0
        ? Math.min(nextNewline,nextEventStart)
        : nextEventStart;

      const previousNewline=text.lastIndexOf('\n',item.index);
      const segmentStart=previousNewline>=0 ? previousNewline+1 : 0;
      const segment=text.slice(segmentStart,segmentEnd).trim();
      const capacity=fabEventImportCapacity(segment);

      return {
        start:item.start,
        end:item.end,
        unlimitedProducts:capacity.unlimitedProducts,
        maxProducts:capacity.maxProducts,
        capacityDetected:capacity.detected,
        raw:segment || item.raw
      };
    });
}

}

function ensureFabEventParticipantSales(event,removedProductIds=new Set()){
  if(!event) return;
  const participants=event.participants||[];
  const participantIds=new Set(participants.map(x=>x.productId));

  // Remove stale linked event sales that are no longer participants.
  STATE.confirmedSalePeriods=(STATE.confirmedSalePeriods||[]).filter(x=>{
    if(!x || x.fabEventId!==event.id) return true;
    return participantIds.has(x.productId) && !removedProductIds.has(x.productId);
  });

  participants.forEach(part=>{
    if(removedProductIds.has(part.productId)) return;
    const p=STATE.products.find(x=>x.id===part.productId);
    if(!p) return;

    let rec=(STATE.confirmedSalePeriods||[]).find(x=>x.productId===p.id && x.fabEventId===event.id);
    const payload={
      id:rec?rec.id:uid('sale-confirm'),
      productId:p.id,
      originalStart:event.start,
      originalEnd:event.end,
      start:event.start,
      end:event.end,
      discountPercent:Number(part.discountPercent)||0,
      manualAdded:true,
      confirmedAt:new Date().toISOString(),
      fabEventId:event.id,
      eventLinked:true
    };

    if(rec) Object.assign(rec,payload);
    else (STATE.confirmedSalePeriods||(STATE.confirmedSalePeriods=[])).push(payload);
  });

  SALE_PERIOD_CACHE.clear();
  MONTHLY_PROFILE_CACHE.clear();
  MONTHLY_NORMALIZED_CACHE.clear();
}

function fabEventConflictResolution(event,newStart,newEnd,participants){
  const removedProducts=[];
  const removedPlanned=[];

  for(const part of participants){
    const p=STATE.products.find(x=>x.id===part.productId);
    if(!p) continue;

    const releaseEligibility=validateProductSaleReleaseEligibility(p,newStart);
    if(!releaseEligibility.ok){
      removedProducts.push(part.productId);
      continue;
    }

    // Ignore the linked sale generated by this same FAB event.
    const confirmed=displaySalePeriodsForProduct(p)
      .filter(x=>x.fabEventId!==event?.id);

    let confirmedConflict=false;

    for(const other of confirmed){
      if(saleDatesOverlap(newStart,newEnd,other.start,other.end)){
        confirmedConflict=true;
        break;
      }
      if(other.end<newStart && saleFullGapDays(other.end,newStart)<30){
        confirmedConflict=true;
        break;
      }
      if(other.start>newEnd && saleFullGapDays(newEnd,other.start)<30){
        confirmedConflict=true;
        break;
      }
    }

    if(confirmedConflict){
      removedProducts.push(part.productId);
      continue;
    }

    // Planned-sale conflicts are resolved in favor of the FAB event.
    plannedSalesForProduct(p.id).forEach(pl=>{
      const conflict=
        saleDatesOverlap(newStart,newEnd,pl.start,pl.end) ||
        (pl.end<newStart && saleFullGapDays(pl.end,newStart)<30) ||
        (pl.start>newEnd && saleFullGapDays(newEnd,pl.start)<30);

      if(conflict){
        removedPlanned.push({productId:p.id,plannedId:pl.id});
      }
    });
  }

  return {removedProducts,removedPlanned};
}

function applyFabEventConflictResolution(event,newStart,newEnd,participants){
  const result=fabEventConflictResolution(event,newStart,newEnd,participants);

  const removedSet=new Set(result.removedProducts);
  const plannedIds=new Set(result.removedPlanned.map(x=>x.plannedId));

  if(plannedIds.size){
    STATE.plannedSales=(STATE.plannedSales||[]).filter(x=>!plannedIds.has(x.id));
  }

  const keptParticipants=participants.filter(x=>!removedSet.has(x.productId));

  return {
    participants:keptParticipants,
    removedProducts:result.removedProducts,
    removedPlanned:result.removedPlanned
  };
}

function fabEventProductGapValidation(product,eventStart,eventEnd,eventId=null){
  if(!product || !eventStart || !eventEnd) return {ok:false,message:'Invalid event dates.'};

  const releaseEligibility=validateProductSaleReleaseEligibility(product,eventStart);
  if(!releaseEligibility.ok) return releaseEligibility;

  const peers=[
    ...displaySalePeriodsForProduct(product)
      .filter(x=>x.fabEventId!==eventId)
      .map(x=>({kind:'sale',start:x.start,end:x.end})),
    ...plannedSalesForProduct(product.id)
      .map(x=>({kind:'planned',start:x.start,end:x.end}))
  ].sort((a,b)=>a.start.localeCompare(b.start));

  for(const other of peers){
    if(saleDatesOverlap(eventStart,eventEnd,other.start,other.end)){
      return {ok:false,message:'Overlaps another sale.'};
    }
  }

  const prev=peers.filter(x=>x.end<eventStart).sort((a,b)=>b.end.localeCompare(a.end))[0];
  if(prev){
    const gap=saleFullGapDays(prev.end,eventStart);
    if(gap<30){
      return {ok:false,message:`Only ${gap} full days after the previous sale; 30 full days required.`};
    }
  }

  const next=peers.filter(x=>x.start>eventEnd).sort((a,b)=>a.start.localeCompare(b.start))[0];
  if(next){
    const gap=saleFullGapDays(eventEnd,next.start);
    if(gap<30){
      return {ok:false,message:`Only ${gap} full days before the next sale; 30 full days required.`};
    }
  }

  return {ok:true};
}

function fabEventParticipantRowsHTML(event,start,end){
  const ids=STATE.products.map(p=>p.id);

  return (STATE.products||[]).map(p=>{
    const selectedDiscount=fabEventParticipantDiscount(event,p.id);
    const validation=(start&&end)?fabEventProductGapValidation(p,start,end,event?.id||null):{ok:true};
    const disabled=!validation.ok;
    const color=colorFor(p.id,ids);

    return `
      <div class="fab-event-product-row ${disabled?'disabled':''}" data-fab-product="${escapeAttr(p.id)}">
        <div class="fab-event-product-check-col">
          <input type="checkbox" class="fab-event-product-check" ${selectedDiscount!==null?'checked':''} ${disabled?'disabled':''}>
        </div>

        <div class="fab-event-product-label-col">
          <div class="fab-event-product-label-main">
            <span class="sales-product-bubble-dot" style="background:${color}"></span>
            <span class="fab-event-product-name">${escapeHtml(cleanShortName(p.shortName||p.name))}</span>
          </div>
          
        </div>

        <div class="fab-event-product-discounts">
          ${[10,20,30,40,50,70].map(v=>`
            <button type="button" class="fab-event-product-discount ${selectedDiscount===v?'selected':''}" data-discount="${v}" ${disabled?'disabled':''}>${v}%</button>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function collectFabEventParticipants(modal){
  const result=[];
  for(const row of modal.querySelectorAll('.fab-event-product-row')){
    const check=row.querySelector('.fab-event-product-check');
    if(!check || !check.checked || check.disabled) continue;

    const selected=row.querySelector('.fab-event-product-discount.selected');
    if(!selected) return {ok:false,message:'Choose a discount for every participating product.'};

    result.push({
      productId:row.dataset.fabProduct,
      discountPercent:Number(selected.dataset.discount)
    });
  }
  return {ok:true,participants:result};
}


function showFabEventDeleteConfirm(event,returnEditor='participation'){
  if(!event) return;

  const participantCount=(event.participants||[]).length;
  const modal=showSalesGlobalModal(`
    <div class="sales-global-modal-head">
      <div>
        <strong>Delete FAB event sale?</strong>
        <span>${event.start} → ${event.end}</span>
      </div>
      <button type="button" class="sales-global-modal-close" aria-label="Close">×</button>
    </div>

    <div class="sales-global-reset-warning">
      This will delete the FAB event sale${participantCount
        ? ` and remove ${participantCount} participating sale${participantCount===1?'':'s'} linked to this event`
        : ''}.
    </div>

    <div class="sales-global-reset-actions">
      <button type="button" class="btn secondary" id="fabEventDeleteCancel">Cancel</button>
      <button type="button" class="btn danger" id="fabEventDeleteConfirm">Delete event</button>
    </div>
  `);
  if(!modal) return;
  setSalesModalSize(modal,'move');

  const back=()=>returnEditor==='setup' ? openFabEventSaleEditor(event.id) : openFabEventParticipationEditor(event.id);
  modal.querySelector('.sales-global-modal-close').addEventListener('click',back);
  modal.querySelector('#fabEventDeleteCancel').addEventListener('click',back);

  modal.querySelector('#fabEventDeleteConfirm').addEventListener('click',()=>{
    const restoreDate=captureSalesTimelineVisibleDate();
    captureSalesTimelineScroll();

    // Remove every confirmed/manual sale linked to this FAB event.
    STATE.confirmedSalePeriods=(STATE.confirmedSalePeriods||[]).filter(
      x=>!(x && x.fabEventId===event.id)
    );

    // Remove the event itself.
    STATE.fabEventSales=(STATE.fabEventSales||[]).filter(
      x=>!(x && x.id===event.id)
    );

    SALE_PERIOD_CACHE.clear();
    MONTHLY_PROFILE_CACHE.clear();
    MONTHLY_NORMALIZED_CACHE.clear();
    persist();

    SALES_TIMELINE_RESTORE_DATE=restoreDate;
    closeSalesGlobalModal();
    renderTabContent();
  });
}

function openFabEventSaleEditor(existingId=null,importedEvent=null){
  const existing=existingId ? (STATE.fabEventSales||[]).find(x=>x.id===existingId) : null;
  const isNew=!existing;

  const modal=showSalesGlobalModal(`
    <div class="sales-global-modal-head">
      <div>
        <strong>${existing?'Edit FAB sale':'Add FAB event sale'}</strong>
        <span>Set the event dates and product limit.</span>
      </div>
      <button type="button" class="sales-global-modal-close" aria-label="Close">×</button>
    </div>

    ${isNew?`
      <label class="fab-event-smart-import">
        <span>Paste FAB sale information</span>
        <textarea id="fabEventSmartImport" rows="1" spellcheck="false"
          placeholder="Paste event text to fill this form automatically">${importedEvent?.raw?escapeHtml(importedEvent.raw):''}</textarea>
      </label>
    `:''}

    <div class="fab-event-date-stack">
      <label class="fab-event-date-row">
        <span>Start date</span>
        <input type="date" id="fabEventStart" value="${existing?escapeAttr(existing.start):(importedEvent?.start||'')}">
      </label>
      <label class="fab-event-date-row">
        <span>End date</span>
        <input type="date" id="fabEventEnd" value="${existing?escapeAttr(existing.end):(importedEvent?.end||'')}">
      </label>
    </div>

    <div class="fab-event-capacity-row">
      <div>
        <strong>Unlimited products</strong>
        <span>No product limit.</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="fabEventUnlimited" ${
          existing
            ? (fabEventUnlimitedProducts(existing)?'checked':'')
            : (importedEvent?.unlimitedProducts===false?'':'checked')
        }>
        <span class="slider"></span>
      </label>
    </div>

    <label class="sales-global-modal-field fab-event-max-products-field" id="fabEventMaxWrap">
      <span>Product limit</span>
      <input type="text" inputmode="numeric" id="fabEventMaxProducts" maxlength="1"
        value="${
          existing
            ? fabEventMaxProducts(existing)
            : (importedEvent?.maxProducts||3)
        }" aria-label="Product limit">
    </label>

    <div class="sales-global-modal-error" id="fabEventError"></div>

    <div class="fab-event-editor-actions">
      ${existing?`<button type="button" class="btn danger" id="fabEventDelete">Delete</button>`:''}
      <button type="button" class="btn primary" id="fabEventSave">Save</button>
    </div>
  `);
  if(!modal) return;
  setSalesModalSize(modal,'fabSetup');
  modal.classList.add('fab-event-setup-modal');

  const start=modal.querySelector('#fabEventStart');
  const end=modal.querySelector('#fabEventEnd');
  const unlimited=modal.querySelector('#fabEventUnlimited');
  const maxWrap=modal.querySelector('#fabEventMaxWrap');
  const maxProducts=modal.querySelector('#fabEventMaxProducts');
  const error=modal.querySelector('#fabEventError');
  const save=modal.querySelector('#fabEventSave');
  const smartImport=modal.querySelector('#fabEventSmartImport');

  const closeEditor=()=>{
    if(isNew) clearFabEventImportQueue();
    closeSalesGlobalModal();
  };
  modal.querySelector('.sales-global-modal-close').addEventListener('click',closeEditor);

  const cleanMax=()=>{
    maxProducts.value=maxProducts.value.replace(/\D/g,'').slice(0,1);
    let n=Number(maxProducts.value);
    if(!Number.isInteger(n) || n<1 || n>9){
      maxProducts.value='3';
      n=3;
    }
    return n;
  };

  const syncCapacity=()=>{
    maxWrap.style.display=unlimited.checked?'none':'flex';
  };

  unlimited.addEventListener('change',syncCapacity);
  maxProducts.addEventListener('input',()=>{
    maxProducts.value=maxProducts.value.replace(/\D/g,'').slice(0,1);
  });
  maxProducts.addEventListener('change',cleanMax);
  syncCapacity();

  if(importedEvent && isNew){
    applyFabEventImportedValues(importedEvent,start,end,unlimited,maxProducts,maxWrap,error);
  }

  if(smartImport){
    const parseAndApply=()=>{
      const parsed=parseFabEventImportText(smartImport.value);
      if(!parsed.length){
        FAB_EVENT_IMPORT_QUEUE=[];
        if(smartImport.value.trim()){
          error.textContent='No complete FAB sale date range was detected.';
        }else{
          error.textContent='';
        }
        return;
      }

      const [first,...rest]=parsed;
      FAB_EVENT_IMPORT_QUEUE=rest;
      applyFabEventImportedValues(first,start,end,unlimited,maxProducts,maxWrap,error);
    };

    smartImport.addEventListener('input',parseAndApply);
    smartImport.addEventListener('paste',()=>{
      requestAnimationFrame(parseAndApply);
    });

    if(importedEvent){
      // This modal was opened from the queue. Keep the remaining queue intact.
      applyFabEventImportedValues(importedEvent,start,end,unlimited,maxProducts,maxWrap,error);
    }
  }

  save.addEventListener('click',()=>{
    error.textContent='';

    if(!start.value||!end.value){
      error.textContent='Choose both dates.';
      return;
    }
    if(end.value<start.value){
      error.textContent='End date must be on or after start date.';
      return;
    }

    const resolution=applyFabEventConflictResolution(
      existing,
      start.value,
      end.value,
      existing?.participants||[]
    );

    const updatedEvent={
      id:existing?existing.id:uid('fab-event'),
      start:start.value,
      end:end.value,
      name:existing?.name||'',
      participants:resolution.participants,
      unlimitedProducts:unlimited.checked,
      maxProducts:cleanMax(),
      createdAt:existing?.createdAt||new Date().toISOString(),
      updatedAt:new Date().toISOString()
    };

    const fabReturnDate=captureSalesTimelineVisibleDate();
    captureSalesTimelineScroll();
    saveFabEventSale(updatedEvent);
    ensureFabEventParticipantSales(updatedEvent,new Set(resolution.removedProducts));
    persist();

    SALES_TIMELINE_RESTORE_DATE=fabReturnDate;

    const queuedNext=isNew && FAB_EVENT_IMPORT_QUEUE.length
      ? FAB_EVENT_IMPORT_QUEUE.shift()
      : null;

    closeSalesGlobalModal();
    renderTabContent();

    const notes=[];
    if(resolution.removedProducts.length){
      notes.push(`${resolution.removedProducts.length} product${resolution.removedProducts.length===1?' was':'s were'} removed because the changed event dates violate the 30-day release/cooldown eligibility rules.`);
    }
    if(resolution.removedPlanned.length){
      notes.push(`${resolution.removedPlanned.length} conflicting planned sale${resolution.removedPlanned.length===1?' was':'s were'} removed.`);
    }
    if(notes.length) showSalesTransientMessage(notes.join(' '));

    if(queuedNext){
      if(FAB_EVENT_IMPORT_TIMEOUT!==null) clearTimeout(FAB_EVENT_IMPORT_TIMEOUT);
      FAB_EVENT_IMPORT_TIMEOUT=setTimeout(()=>{
        FAB_EVENT_IMPORT_TIMEOUT=null;
        openFabEventSaleEditor(null,queuedNext);
      },450);
    }else if(isNew){
      clearFabEventImportQueue();
    }
  });

  const del=modal.querySelector('#fabEventDelete');
  if(del){
    del.addEventListener('click',()=>showFabEventDeleteConfirm(existing,'setup'));
  }

  wireEnterToPrimary(modal,save,closeEditor);
  requestAnimationFrame(()=>smartImport ? smartImport.focus() : start.focus());
}


function openFabEventParticipationEditor(eventId){

  const modal=showSalesGlobalModal(`

      </label>
      <label class="fab-event-date-row">

        <input type="date" id="fabEventParticipationEnd" value="${escapeAttr(event.end)}">
      </label>
    </div>

    <div class="fab-event-capacity-row">
      <div>
        <strong>Unlimited products</strong>
        <span>No product limit.</span>
      </div>

        <input type="checkbox" id="fabEventParticipationUnlimited" ${fabEventUnlimitedProducts(event)?'checked':''}>

    <label class="sales-global-modal-field fab-event-max-products-field" id="fabEventParticipationMaxWrap">

        value="${fabEventMaxProducts(event)}" aria-label="Product limit">
    </label>

    <div class="fab-event-participation-head">
      <strong>Participating products</strong>
      <span>Eligible products must be released at least 30 days before the event and need a 30-day gap before and after it.</span>
    </div>

    <div class="fab-event-bulk-row fab-event-product-row">
      <div class="fab-event-product-check-col">
        <input type="checkbox" id="fabEventBulkParticipationCheck" aria-label="Toggle all participating products">
      </div>

      <div class="fab-event-product-label-col"></div>

      <div class="fab-event-product-discounts fab-event-bulk-discount-buttons">
        ${[10,20,30,40,50,70].map(v=>`
          <button type="button" class="fab-event-product-discount fab-event-bulk-discount-btn" data-discount="${v}">${v}%</button>
        `).join('')}
      </div>
    </div>

    <div class="fab-event-product-list" id="fabEventProductList"></div>
    <div class="sales-global-modal-error" id="fabEventError"></div>

    <div class="fab-event-editor-actions">
      <button type="button" class="btn danger" id="fabEventParticipationDelete">Delete</button>
      <button type="button" class="btn primary" id="fabEventParticipationSave">Save</button>
    </div>
  `);
  if(!modal) return;
  setSalesModalSize(modal,'fabParticipation');
  modal.classList.add('fab-event-participation-modal');

  const start=modal.querySelector('#fabEventParticipationStart');
  const end=modal.querySelector('#fabEventParticipationEnd');
  const unlimited=modal.querySelector('#fabEventParticipationUnlimited');
  const maxWrap=modal.querySelector('#fabEventParticipationMaxWrap');
  const maxProducts=modal.querySelector('#fabEventParticipationMax');
  const list=modal.querySelector('#fabEventProductList');
  const error=modal.querySelector('#fabEventError');
  const save=modal.querySelector('#fabEventParticipationSave');
  const bulkParticipationCheck=modal.querySelector('#fabEventBulkParticipationCheck');

  modal.querySelector('.sales-global-modal-close').addEventListener('click',closeSalesGlobalModal);

  const cleanMax=()=>{
    maxProducts.value=maxProducts.value.replace(/\D/g,'').slice(0,1);
    let n=Number(maxProducts.value);
    if(!Number.isInteger(n)||n<1||n>9){
      maxProducts.value='3';
      n=3;
    }
    return n;
  };

  const syncCapacity=()=>{
    maxWrap.style.display=unlimited.checked?'none':'flex';
  };

  const selectedCount=()=>[...list.querySelectorAll('.fab-event-product-check:checked')]
    .filter(x=>!x.disabled).length;

  const enforceLimit=(changedCheck=null)=>{
    if(unlimited.checked) return true;

    const max=cleanMax();
    if(selectedCount()<=max) return true;

    if(changedCheck) changedCheck.checked=false;
    error.textContent=`Only ${max} product${max===1?'':'s'} can participate in this FAB event.`;
    return false;
  };

  const wireRows=()=>{
    list.querySelectorAll('.fab-event-product-check').forEach(check=>{
      check.addEventListener('change',()=>{
        error.textContent='';
        enforceLimit(check);
        syncBulkParticipationCheck();
      });
    });

    list.querySelectorAll('.fab-event-product-discount').forEach(btn=>{
      if(btn.classList.contains('fab-event-bulk-discount-btn')) return;

      btn.addEventListener('click',()=>{
        error.textContent='';
        const row=btn.closest('.fab-event-product-row');
        if(!row) return;

        row.querySelectorAll('.fab-event-product-discount').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');

        const check=row.querySelector('.fab-event-product-check');
        if(check && !check.disabled){
          const wasChecked=check.checked;
          check.checked=true;
          if(!enforceLimit(check) && !wasChecked){
            btn.classList.remove('selected');
          }
        }
      });
    });
  };

  const renderProducts=()=>{
    const tempEvent={
      ...event,
      start:start.value||event.start,
      end:end.value||event.end
    };
    list.innerHTML=fabEventParticipantRowsHTML(tempEvent,start.value,end.value);
    wireRows();
    enforceLimit();
    requestAnimationFrame(()=>{
      syncBulkParticipationCheck();
      list.classList.toggle('has-scrollbar',list.scrollHeight>list.clientHeight);
      const reserve=Math.max(0,list.offsetWidth-list.clientWidth);
      modal.style.setProperty('--fab-scrollbar-reserve',`${reserve}px`);
    });
  };

  start.addEventListener('change',renderProducts);
  end.addEventListener('change',renderProducts);

  unlimited.addEventListener('change',()=>{
    error.textContent='';
    syncCapacity();
    enforceLimit();
  });

  maxProducts.addEventListener('input',()=>{
    maxProducts.value=maxProducts.value.replace(/\D/g,'').slice(0,1);
  });
  maxProducts.addEventListener('change',()=>{
    cleanMax();
    error.textContent='';
    enforceLimit();
  });
  const syncBulkParticipationCheck=()=>{
    const eligible=[...list.querySelectorAll('.fab-event-product-check')].filter(x=>!x.disabled);
    const checked=eligible.filter(x=>x.checked).length;
    bulkParticipationCheck.checked=eligible.length>0 && checked===eligible.length;
    bulkParticipationCheck.indeterminate=checked>0 && checked<eligible.length;
  };

  bulkParticipationCheck.addEventListener('change',()=>{
    error.textContent='';
    const eligible=[...list.querySelectorAll('.fab-event-product-check')].filter(x=>!x.disabled);

    if(!bulkParticipationCheck.checked){
      eligible.forEach(x=>x.checked=false);
      syncBulkParticipationCheck();
      return;
    }

    if(unlimited.checked){
      eligible.forEach(x=>x.checked=true);
    }else{
      const max=cleanMax();
      eligible.forEach((x,i)=>x.checked=i<max);
      if(eligible.length>max){
        error.textContent=`Only ${max} product${max===1?'':'s'} can participate in this FAB event.`;
      }
    }
    syncBulkParticipationCheck();
  });

  modal.querySelectorAll('.fab-event-bulk-discount-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      error.textContent='';
      modal.querySelectorAll('.fab-event-bulk-discount-btn').forEach(x=>x.classList.remove('selected'));
      btn.classList.add('selected');

      const value=btn.dataset.discount;
      list.querySelectorAll('.fab-event-product-row').forEach(row=>{
        const check=row.querySelector('.fab-event-product-check');
        if(!check || check.disabled) return;

        row.querySelectorAll('.fab-event-product-discount').forEach(x=>{
          x.classList.toggle('selected',x.dataset.discount===value);
        });
      });
    });
  });

  syncCapacity();
  renderProducts();

  save.addEventListener('click',()=>{
    const fabReturnDate=captureSalesTimelineVisibleDate();
    error.textContent='';

    if(!start.value||!end.value){
      error.textContent='Choose both dates.';
      return;
    }
    if(end.value<start.value){
      error.textContent='End date must be on or after start date.';
      return;
    }

    const result=collectFabEventParticipants(modal);
    if(!result.ok){
      error.textContent=result.message;
      return;
    }

    const max=cleanMax();
    if(!unlimited.checked && result.participants.length>max){
      error.textContent=`Only ${max} product${max===1?'':'s'} can participate in this FAB event.`;
      return;
    }

    const resolution=applyFabEventConflictResolution(
      event,
      start.value,
      end.value,
      result.participants
    );

    event.start=start.value;
    event.end=end.value;
    event.unlimitedProducts=unlimited.checked;
    event.maxProducts=max;
    event.participants=resolution.participants;
    event.updatedAt=new Date().toISOString();

    saveFabEventSale(event);
    ensureFabEventParticipantSales(event,new Set(resolution.removedProducts));
    persist();

    SALES_TIMELINE_RESTORE_DATE=fabReturnDate;
    closeSalesGlobalModal();
    renderTabContent();

    const notes=[];
    if(resolution.removedProducts.length){
      notes.push(`${resolution.removedProducts.length} product${resolution.removedProducts.length===1?' was':'s were'} removed because of the 30-day release/cooldown eligibility rules.`);
    }
    if(resolution.removedPlanned.length){
      notes.push(`${resolution.removedPlanned.length} conflicting planned sale${resolution.removedPlanned.length===1?' was':'s were'} removed.`);
    }
    if(notes.length) showSalesTransientMessage(notes.join(' '));
  });

  const deleteEventBtn=modal.querySelector('#fabEventParticipationDelete');
  if(deleteEventBtn){
    deleteEventBtn.addEventListener('click',()=>showFabEventDeleteConfirm(event,'participation'));
  }

  wireEnterToPrimary(modal,save,closeSalesGlobalModal);
}

function mountFabEventSales(){
  const track=document.getElementById('salesTimelineTrack');
  if(!track) return;

  let layer=track.querySelector('.fab-event-sales-layer');
  if(!layer){
    layer=document.createElement('div');
    layer.className='fab-event-sales-layer';
    track.appendChild(layer);
  }
  layer.innerHTML='';

  let controls=track.querySelector('.fab-event-controls-layer');
  if(!controls){
    controls=document.createElement('div');
    controls.className='fab-event-controls-layer';
    track.appendChild(controls);
  }
  controls.innerHTML='';

  const rows=[...track.querySelectorAll('[data-sales-date]')];
  if(!rows.length) return;

  const rowByDate=new Map(rows.map(r=>[r.dataset.salesDate,r]));
  const first=rows[0].dataset.salesDate;
  const last=rows[rows.length-1].dataset.salesDate;

  fabEventSales()
    .filter(x=>x.end>=first && x.start<=last)
    .forEach(event=>{
      const startDate=event.start<first?first:event.start;
      const endDate=event.end>last?last:event.end;
      const sr=rowByDate.get(startDate);
      const er=rowByDate.get(endDate);
      if(!sr||!er) return;

      const startsInside=event.start>=first;
      const endsInside=event.end<=last;
      const top=sr.offsetTop+(startsInside?sr.offsetHeight*.5:0);
      const bottom=er.offsetTop+(endsInside?er.offsetHeight*.5:er.offsetHeight);
      const height=Math.max(sr.offsetHeight*.5,bottom-top);

      const band=document.createElement('div');
      band.className='fab-event-sale-band';
      band.style.top=`${top}px`;
      band.style.height=`${height}px`;

      const startsInNovember=String(event.start||'').slice(5,7)==='11';
      if(startsInNovember){
        band.classList.add('black-friday-fab-event');
        band.innerHTML=`
          <div class="fab-black-friday-background-label" aria-hidden="true">
            <strong>BLACK FRIDAY</strong>
            <span>To be safe, it’s recommended to directly participate in the sale<br>instead of making an overlapping individual sale.</span>
          </div>
        `;
      }

      layer.appendChild(band);

      const button=document.createElement('button');
      button.type='button';
      button.className='fab-event-participate-button';
      button.style.top=`${top+6}px`;
      button.innerHTML='<span>Participate and edit</span><strong>FAB Event Sale</strong>';
      button.addEventListener('click',e=>{
        e.preventDefault();
        e.stopPropagation();
        openFabEventParticipationEditor(event.id);
      });
      controls.appendChild(button);
    });
}

function salesTimelineLaneGeometry(track){
  if(!track) return null;
  const rows=[...track.querySelectorAll('[data-sales-date]')];
  if(!rows.length) return null;

  const sampleRow=rows[0];
  const daySize=Math.round(sampleRow.getBoundingClientRect().height)||42;

  const labelWidth=Math.round(
    (sampleRow.querySelector('.sales-timeline-day-label')||sampleRow).getBoundingClientRect().width
  )||116;

  const leadingGap=14;

  // Columns are slightly wider than sale boxes and sit directly next to each other.
  const cellExtra=8;
  const cellWidth=daySize+cellExtra;
  const productAreaLeft=labelWidth+leadingGap;

  const productCount=(STATE.products||[]).length;
  const trackWidth=Math.max(
    track.scrollWidth,
    track.clientWidth,
    track.getBoundingClientRect().width
  );

  const usableWidth=Math.max(0,trackWidth-productAreaLeft);
  const totalSlots=Math.max(
    productCount+3,
    Math.ceil(usableWidth/cellWidth)
  );

  return {
    daySize,
    labelWidth,
    leadingGap,
    cellExtra,
    cellWidth,
    productAreaLeft,
    productCount,
    totalSlots,
    trackWidth
  };
}


function normalizeStartedPlannedSales(){
  const today=todayStr();
  const due=(STATE.plannedSales||[]).filter(x=>x && x.start<=today);
  if(!due.length) return false;

  due.forEach(rec=>{
    const p=STATE.products.find(x=>x.id===rec.productId);
    if(!p) return;
    saveManualConfirmedSale(p,rec.start,rec.end,rec.discountPercent||0);
  });

  const dueIds=new Set(due.map(x=>x.id));
  STATE.plannedSales=(STATE.plannedSales||[]).filter(x=>!dueIds.has(x.id));
  persist();
  return true;
}

function plannedSalesForProduct(productId){
  return (STATE.plannedSales||[])
    .filter(x=>x && x.productId===productId)
    .sort((a,b)=>a.start.localeCompare(b.start));
}

function plannedSaleById(id){
  return (STATE.plannedSales||[]).find(x=>x.id===id)||null;
}

function plannedSalePeriodObject(record){
  return {
    id:record.id,
    plannedId:record.id,
    productId:record.productId,
    start:record.start,
    end:record.end,
    originalStart:record.start,
    originalEnd:record.end,
    discountPercent:record.discountPercent==null?null:Number(record.discountPercent),
    planned:true,
    confirmed:false,
    accepted:false,
    state:'planned'
  };
}

function savePlannedSale(record){
  STATE.plannedSales=STATE.plannedSales||[];
  const idx=STATE.plannedSales.findIndex(x=>x.id===record.id);
  if(idx>=0) STATE.plannedSales[idx]={...STATE.plannedSales[idx],...record};
  else STATE.plannedSales.push(record);
  persist();
}

function deletePlannedSale(id){
  STATE.plannedSales=(STATE.plannedSales||[]).filter(x=>x.id!==id);
  persist();
}

function validatePlannedSalePlacement(product,start,end,ignorePlannedId=null,ignoreConfirmedId=null){
  if(!product || !start || !end) return {ok:false,message:'Invalid planned sale.'};
  if(end<start) return {ok:false,message:'End date must be on or after start date.'};

  const releaseEligibility=validateProductSaleReleaseEligibility(product,start);
  if(!releaseEligibility.ok) return releaseEligibility;

  const lengthDays=dayDiff(start,end)+1;
  if(lengthDays<2) return {ok:false,message:'A planned sale must be at least 2 days long.'};
  if(dayDiff(start,end)>14) return {ok:false,message:'A sale can be at most 14 sale days long.'};

  const requiredGap=salesPlanningRequiredGapDays();

  const realPeriods=displaySalePeriodsForProduct(product)
    .filter(p=>!(ignoreConfirmedId && p.confirmationId===ignoreConfirmedId))
    .map(p=>({
      id:p.confirmationId||`${p.start}|${p.end}`,
      start:p.start,
      end:p.end,
      kind:'sale',
      confirmed:!!p.confirmed
    }));

  const planned=plannedSalesForProduct(product.id)
    .filter(x=>x.id!==ignorePlannedId)
    .map(x=>({
      id:x.id,
      start:x.start,
      end:x.end,
      kind:'planned',
      confirmed:false
    }));

  const all=[...realPeriods,...planned].sort((a,b)=>a.start.localeCompare(b.start));

  for(const other of all){
    if(saleDatesOverlap(start,end,other.start,other.end)){
      return {ok:false,message:'This planned sale would overlap another sale.'};
    }
  }

  const prev=all
    .filter(x=>x.end<start)
    .sort((a,b)=>b.end.localeCompare(a.end))[0];

  if(prev){
    const gap=saleFullGapDays(prev.end,start);

    // Nearby real estimated sales still need confirmation before a new plan can be created.
    if(prev.kind==='sale' && !prev.confirmed && gap<=50){
      return {ok:false,message:'The previous nearby sale must be confirmed first.'};
    }

    if(gap<requiredGap){
      return {ok:false,message:`At least ${requiredGap} full sale-free days are required after the previous ${prev.kind==='planned'?'planned ':''}sale.`};
    }
  }

  const next=all
    .filter(x=>x.start>end)
    .sort((a,b)=>a.start.localeCompare(b.start))[0];

  if(next){
    const gap=saleFullGapDays(end,next.start);
    if(gap<requiredGap){
      return {ok:false,message:`At least ${requiredGap} full sale-free days are required before the next ${next.kind==='planned'?'planned ':''}sale.`};
    }
  }

  return {ok:true};
}

let SALES_PLANNING_DRAG=null;
let SALES_PLANNING_POINTER_ID=null;

function plannedSaleVisualColor(product){
  const ids=STATE.products.map(p=>p.id);
  return colorFor(product.id,ids);
}
function salesPlanningRequiredGapDays(){
  return STATE.settings.salesPlanningRequire31DayGap===false ? 30 : 31;
}

function salesPlanningMinDate(){
  return datePlusDays(todayStr(),-30);
}

function salesTimelineProductLaneInfo(track,clientX){
  if(!track) return null;
  const geometry=salesTimelineLaneGeometry(track);
  if(!geometry) return null;

  const rect=track.getBoundingClientRect();
  const localX=clientX-rect.left;
  const relativeX=localX-geometry.productAreaLeft;
  if(relativeX<0) return null;

  const laneIndex=Math.floor(relativeX/geometry.cellWidth);
  if(laneIndex<0 || laneIndex>=geometry.totalSlots) return null;

  const products=(STATE.products||[]).slice();
  const product=laneIndex<geometry.productCount ? products[laneIndex] : null;

  return {
    product,
    laneIndex,
    daySize:geometry.daySize,
    cellWidth:geometry.cellWidth,
    localX,
    productAreaLeft:geometry.productAreaLeft,
    isEmpty:!product,
    geometry
  };
}
function salesTimelineDateAtPointer(scroller,clientY){
  if(!scroller) return null;
  const rows=[...scroller.querySelectorAll('[data-sales-date]')];
  if(!rows.length) return null;

  const y=clientY;
  let best=null;
  let bestDist=Infinity;
  rows.forEach(row=>{
    const rect=row.getBoundingClientRect();
    if(y>=rect.top && y<=rect.bottom){
      best=row;
      bestDist=0;
      return;
    }
    const d=Math.min(Math.abs(y-rect.top),Math.abs(y-rect.bottom));
    if(d<bestDist){
      bestDist=d;
      best=row;
    }
  });
  return best ? best.dataset.salesDate : null;
}

function salePeriodContainsDate(period,date){
  return !!period && date>=period.start && date<=period.end;
}


function salesPlanningNeighborContext(product,date){
  const requiredGap=salesPlanningRequiredGapDays();

  const real=displaySalePeriodsForProduct(product).map(p=>({
    kind:'sale',
    start:p.start,
    end:p.end,
    confirmed:!!p.confirmed,
    planned:false
  }));

  const planned=plannedSalesForProduct(product.id).map(p=>({
    kind:'planned',
    start:p.start,
    end:p.end,
    confirmed:false,
    planned:true
  }));

  const all=[...real,...planned].sort((a,b)=>a.start.localeCompare(b.start));

  const previous=all
    .filter(x=>x.end<date)
    .sort((a,b)=>b.end.localeCompare(a.end))[0]||null;

  const next=all
    .filter(x=>x.start>date)
    .sort((a,b)=>a.start.localeCompare(b.start))[0]||null;

  return {
    requiredGap,
    previous,
    next,
    prevGap:previous?saleFullGapDays(previous.end,date):null,
    nextGap:next?saleFullGapDays(date,next.start):null
  };
}

function salesPlanningPreviousRelevantSale(product,date){
  const periods=displaySalePeriodsForProduct(product)
    .filter(period=>period.end<date)
    .sort((a,b)=>b.end.localeCompare(a.end));

  const previous=periods[0]||null;
  if(!previous) return null;

  const gap=dayDiff(previous.end,date);
  if(gap>50) return null;

  return {period:previous,gap};
}

function salesPlanningTooltipModel(product,date){
  if(!product || !date) return null;

  const realPeriods=displaySalePeriodsForProduct(product);
  const plannedPeriods=plannedSalesForProduct(product.id);

  if(realPeriods.some(period=>salePeriodContainsDate(period,date))) return {hidden:true};
  if(plannedPeriods.some(period=>date>=period.start && date<=period.end)) return {hidden:true};

  const productName=product.name||'Product';
  const shortName=cleanShortName(product.shortName||product.name);
  const isHistorical=date<=todayStr();

  const forwardEnd=datePlusDays(date,1);
  const backwardStart=datePlusDays(date,-1);
  const forward=validateNewTimelineSalePlacement(product,date,forwardEnd);
  const backward=validateNewTimelineSalePlacement(product,backwardStart,date);
  const available=forward.ok || backward.ok;

  const peers=[
    ...realPeriods.map(x=>({kind:'sale',start:x.start,end:x.end})),
    ...plannedPeriods.map(x=>({kind:'planned',start:x.start,end:x.end}))
  ].sort((a,b)=>a.start.localeCompare(b.start));

  const prev=peers.filter(x=>x.end<date).sort((a,b)=>b.end.localeCompare(a.end))[0]||null;
  const next=peers.filter(x=>x.start>date).sort((a,b)=>a.start.localeCompare(b.start))[0]||null;
  const lines=[];
  const releaseEligibility=validateProductSaleReleaseEligibility(product,date);
  if(!releaseEligibility.ok) lines.push(releaseEligibility.message);

  if(prev){
    const gap=saleFullGapDays(prev.end,date);
    let required=0;
    if(prev.kind==='planned') required=salesPlanningRequiredGapDays();
    else required=saleCooldownApplies(date)?salesPlanningRequiredGapDays():0;

    if(required){
      lines.push(`${prev.kind==='planned'?'Previous planned sale':'Previous sale'}: ${gap} full days gap · ${required} full days needed`);
    }else{
      lines.push(`${prev.kind==='planned'?'Previous planned sale':'Previous sale'}: ${gap} full days gap · no cooldown required before Oct 22, 2024`);
    }
  }

  if(next){
    const gap=saleFullGapDays(date,next.start);
    let required=0;
    if(next.kind==='planned') required=salesPlanningRequiredGapDays();
    else required=saleCooldownApplies(next.start)?salesPlanningRequiredGapDays():0;

    if(required){
      lines.push(`${next.kind==='planned'?'Next planned sale':'Next sale'}: ${gap} full days gap · ${required} full days needed`);
    }else{
      lines.push(`${next.kind==='planned'?'Next planned sale':'Next sale'}: ${gap} full days gap · no cooldown required before Oct 22, 2024`);
    }
  }

  if(!prev && !next){
    lines.push(isHistorical && date<'2024-10-22'
      ? 'No neighboring sale · historical cooldown rule does not apply'
      : `No neighboring sale · ${salesPlanningRequiredGapDays()} days required when applicable`
    );
  }

  return {
    allowed:available,
    shortName,
    productName,
    product,
    date,
    title:isHistorical?'+ New confirmed sale':'+ New planned sale',
    detail:available
      ? (isHistorical
          ? 'This sale will be added directly as confirmed.'
          : 'A new planned sale can start from this cell.')
      : (!releaseEligibility.ok
          ? releaseEligibility.message
          : 'There is not enough spacing to create a sale here.'),
    gapLines:lines
  };
}
function hideSalesPlanHoverTooltip(){
  const tooltip=document.getElementById('salesPlanHoverTooltip');
  if(!tooltip) return;
  tooltip.hidden=true;
  tooltip.innerHTML='';
  document.body.classList.remove('sales-plan-tooltip-visible');
}

function showSalesPlanHoverTooltip(model,clientX,clientY){
  const tooltip=document.getElementById('salesPlanHoverTooltip');
  if(!tooltip || !model || model.hidden){
    hideSalesPlanHoverTooltip();
    return;
  }

  tooltip.innerHTML=`
    <div class="sales-plan-tooltip-head">
      <strong class="sales-plan-tooltip-title">${escapeHtml(model.title)}</strong>
      ${salesPlanningProductChipHTML(model.product)}
    </div>
    <div class="sales-plan-tooltip-date">${escapeHtml(model.date)}</div>

    <div class="sales-plan-tooltip-status ${model.allowed?'allowed':'blocked'}">
      ${model.allowed?'Available':'Not available'}
    </div>

    ${Array.isArray(model.gapLines)&&model.gapLines.length?`
      <div class="sales-plan-gap-lines">
        ${model.gapLines.map(line=>`<div class="sales-plan-gap-line">${salesPlanGapHTML(line)}</div>`).join('')}
      </div>
    `:model.gapText?`
      <div class="sales-plan-gap-line">${salesPlanGapHTML(model.gapText)}</div>
    `:model.metricValue!==undefined?`
      <div class="sales-plan-tooltip-metrics">
        ${salesPlanMetricHTML(model.metricValue,model.metricLabel||'')}
      </div>
    `:''}

    <div class="sales-plan-tooltip-detail">${escapeHtml(model.detail||'')}</div>
    ${model.subdetail?`<div class="sales-plan-tooltip-subdetail">${escapeHtml(model.subdetail)}</div>`:''}
  `;

  tooltip.hidden=false;
  document.body.classList.add('sales-plan-tooltip-visible');

  const pad=14;
  const rect=tooltip.getBoundingClientRect();
  let left=clientX+14;
  let top=clientY+14;

  if(left+rect.width>window.innerWidth-pad) left=clientX-rect.width-14;
  if(top+rect.height>window.innerHeight-pad) top=clientY-rect.height-14;

  tooltip.style.left=`${Math.max(pad,left)}px`;
  tooltip.style.top=`${Math.max(pad,top)}px`;
}
function ensureSalesTimelineGridOverlay(){
  const track=document.getElementById('salesTimelineTrack');
  if(!track) return null;

  let grid=track.querySelector('.sales-timeline-grid-overlay');
  if(!grid){
    grid=document.createElement('div');
    grid.className='sales-timeline-grid-overlay';
    grid.innerHTML='<div class="sales-timeline-cell-hover" id="salesTimelineCellHover"></div>';
    track.appendChild(grid);
  }

  const geometry=salesTimelineLaneGeometry(track);
  if(!geometry) return grid;

  grid.style.left=`${geometry.productAreaLeft}px`;
  grid.style.right='0px';
  grid.style.width='auto';
  grid.style.setProperty('--sales-grid-cell-width',`${geometry.cellWidth}px`);

  return grid;

  grid.style.display='block';
  grid.style.visibility='visible';
  grid.style.opacity='1';
}
function updateSalesTimelineCellHover(clientX,clientY){
  const scroller=document.getElementById('salesTimelineScroll');
  const track=document.getElementById('salesTimelineTrack');
  const hover=document.getElementById('salesTimelineCellHover');
  if(!scroller || !track || !hover) return null;

  const lane=salesTimelineProductLaneInfo(track,clientX);
  const date=salesTimelineDateAtPointer(scroller,clientY);
  if(!lane || !date){
    hover.hidden=true;
    return lane && date ? {lane,date,row:null} : null;
  }

  const row=scroller.querySelector(`[data-sales-date="${date}"]`);
  if(!row){
    hover.hidden=true;
    return null;
  }

  hover.hidden=false;
  hover.style.display='block';
  hover.style.left=`${lane.laneIndex*lane.cellWidth}px`;
  hover.style.top=`${row.offsetTop}px`;
  hover.style.width=`${lane.cellWidth}px`;
  hover.style.height=`${row.offsetHeight}px`;

  return {lane,date,row};
}

function hideSalesTimelineCellHover(){
  const hover=document.getElementById('salesTimelineCellHover');
  if(hover) hover.hidden=true;
}


let SALES_SUPPRESS_HOVER_UNTIL_POINTER_MOVE=false;
let SALES_PLAN_POINTER_X=null;
let SALES_PLAN_POINTER_Y=null;
let SALES_PLAN_POINTER_INSIDE=false;

function salesPlanningProductChipHTML(product){
  if(!product) return '';
  const ids=STATE.products.map(p=>p.id);
  const color=colorFor(product.id,ids);

    <span class="sales-plan-product-chip" title="${escapeAttr(product.name||'')}">

    <span class="sales-plan-metric">
      <strong>${escapeHtml(String(value))}</strong>
      <span>${escapeHtml(label)}</span>
    </span>
  `;
}

function salesPlanGapHTML(text){
  const safe=escapeHtml(text||'');
  return safe.replace(/(\d+\+?)/g,'<strong>$1</strong>');
}


function refreshSalesPlanningHoverFromPointer(){
  if(SALES_SUPPRESS_HOVER_UNTIL_POINTER_MOVE){
    hideSalesPlanHoverTooltip();
    hideSalesTimelineCellHover();
    return;
  }
  if(!SALES_PLAN_POINTER_INSIDE || SALES_PLAN_POINTER_X===null || SALES_PLAN_POINTER_Y===null){
    hideSalesPlanHoverTooltip();
    hideSalesTimelineCellHover();
    return;
  }

  const scroller=document.getElementById('salesTimelineScroll');
  const track=document.getElementById('salesTimelineTrack');
  if(!scroller || !track || ACTIVE_TAB!=='sales'){
    hideSalesPlanHoverTooltip();
    hideSalesTimelineCellHover();
    return;
  }

  const hit=updateSalesTimelineCellHover(SALES_PLAN_POINTER_X,SALES_PLAN_POINTER_Y);
  if(!hit){
    hideSalesPlanHoverTooltip();
    return;
  }

  const underPointer=document.elementFromPoint(SALES_PLAN_POINTER_X,SALES_PLAN_POINTER_Y);

  // Existing sale boxes and suggestion boxes own their hover area.
  if(underPointer && underPointer.closest && (
    underPointer.closest('.sales-timeline-sale-period') ||
    underPointer.closest('.sales-timeline-sale-suggestion')
  )){
    hideSalesPlanHoverTooltip();
    hideSalesTimelineCellHover();
    return;
  }

  if(hit.lane.isEmpty || !hit.lane.product){
    hideSalesPlanHoverTooltip();
    return;
  }

  const model=salesPlanningTooltipModel(hit.lane.product,hit.date);
  if(model) model.product=hit.lane.product;
  showSalesPlanHoverTooltip(model,SALES_PLAN_POINTER_X,SALES_PLAN_POINTER_Y);
}

function clearSalesPlanningDragPreview(){
  const el=document.getElementById('salesPlanningDragPreview');
  if(el) el.remove();
}

function renderSalesPlanningDragPreview(){
  clearSalesPlanningDragPreview();
  if(!SALES_PLANNING_DRAG || !SALES_PLANNING_DRAG.previewVisible) return;

  const track=document.getElementById('salesTimelineTrack');
  const overlay=document.getElementById('salesTimelineSaleOverlay');
  if(!track || !overlay) return;

  const p=SALES_PLANNING_DRAG.product;
  const rows=[...track.querySelectorAll('[data-sales-date]')];
  const rowByDate=new Map(rows.map(r=>[r.dataset.salesDate,r]));
  const startRow=rowByDate.get(SALES_PLANNING_DRAG.start);
  const endRow=rowByDate.get(SALES_PLANNING_DRAG.end);
  if(!startRow || !endRow) return;

  const geometry=salesTimelineLaneGeometry(track);
  const products=STATE.products||[];
  const productIndex=products.findIndex(x=>x.id===p.id);
  if(!geometry || productIndex<0) return;

  const top=startRow.offsetTop+startRow.offsetHeight*.5;
  const bottom=endRow.offsetTop+endRow.offsetHeight*.5;
  const left=geometry.productAreaLeft+productIndex*geometry.cellWidth+(geometry.cellWidth-geometry.daySize)/2;
  const color=plannedSaleVisualColor(p);
  const shortName=cleanShortName(p.shortName||p.name);

  const box=document.createElement('div');
  box.id='salesPlanningDragPreview';
  box.className='sales-planning-drag-preview';
  box.style.top=`${top}px`;
  box.style.left=`${left}px`;
  box.style.width=`${geometry.daySize}px`;
  box.style.height=`${Math.max(geometry.daySize*.5,bottom-top)}px`;
  box.style.setProperty('--sale-color',color);
  box.style.setProperty('--sale-fill',rgbaFromHex(color,.12));
  box.style.setProperty('--sale-stripe',rgbaFromHex(color,.20));
  box.innerHTML=`<span class="sales-sale-short-name">${shortName}</span>`;
  overlay.appendChild(box);
}

function beginSalesPlanningDrag(hit,e){
  if(!hit || !hit.lane || !hit.lane.product || !hit.date) return false;

  const p=hit.lane.product;
  const date=hit.date;

  const canForward=validateNewTimelineSalePlacement(p,date,datePlusDays(date,1)).ok;
  const canBackward=validateNewTimelineSalePlacement(p,datePlusDays(date,-1),date).ok;

  if(!canForward && !canBackward) return false;

  SALES_PLANNING_DRAG={
    product:p,
    anchor:date,
    start:date,
    end:date,
    moved:false,
    previewVisible:false
  };
  SALES_PLANNING_POINTER_ID=e.pointerId;

  const scroller=document.getElementById('salesTimelineScroll');
  if(scroller && typeof scroller.setPointerCapture==='function'){
    try{scroller.setPointerCapture(e.pointerId);}catch(_){}
  }

  document.body.classList.add('sales-planning-dragging');
  hideSalesPlanHoverTooltip();
  hideSalesTimelineCellHover();
  clearSalesPlanningDragPreview();
  e.preventDefault();
  return true;
}

function updateSalesPlanningDrag(date){
  if(!SALES_PLANNING_DRAG || !date) return;

  let start=SALES_PLANNING_DRAG.anchor<date?SALES_PLANNING_DRAG.anchor:date;
  let end=SALES_PLANNING_DRAG.anchor<date?date:SALES_PLANNING_DRAG.anchor;

  if(dayDiff(start,end)>14){
    if(date>=SALES_PLANNING_DRAG.anchor) end=datePlusDays(SALES_PLANNING_DRAG.anchor,14);
    else start=datePlusDays(SALES_PLANNING_DRAG.anchor,-14);
  }

  if(dayDiff(start,end)<1){
    SALES_PLANNING_DRAG.start=SALES_PLANNING_DRAG.anchor;
    SALES_PLANNING_DRAG.end=SALES_PLANNING_DRAG.anchor;
    SALES_PLANNING_DRAG.moved=false;
    SALES_PLANNING_DRAG.previewVisible=false;
    clearSalesPlanningDragPreview();
    return;
  }

  const valid=validateNewTimelineSalePlacement(SALES_PLANNING_DRAG.product,start,end);
  if(!valid.ok) return;

  SALES_PLANNING_DRAG.start=start;
  SALES_PLANNING_DRAG.end=end;
  SALES_PLANNING_DRAG.moved=true;
  SALES_PLANNING_DRAG.previewVisible=true;
  renderSalesPlanningDragPreview();
}

function finishSalesPlanningDrag(cancel=false){
  if(!SALES_PLANNING_DRAG) return;

  const drag=SALES_PLANNING_DRAG;
  SALES_PLANNING_DRAG=null;

  const scroller=document.getElementById('salesTimelineScroll');
  if(scroller && SALES_PLANNING_POINTER_ID!==null && typeof scroller.releasePointerCapture==='function'){
    try{scroller.releasePointerCapture(SALES_PLANNING_POINTER_ID);}catch(_){}
  }
  SALES_PLANNING_POINTER_ID=null;

  document.body.classList.remove('sales-planning-dragging');
  clearSalesPlanningDragPreview();

  if(cancel || !drag.moved || dayDiff(drag.start,drag.end)<1){
    refreshSalesPlanningHoverFromPointer();
    return;
  }

  const valid=validateNewTimelineSalePlacement(drag.product,drag.start,drag.end);
  if(!valid.ok){
    showSalesTransientMessage(valid.message);
    refreshSalesPlanningHoverFromPointer();
    return;
  }

  captureSalesTimelineScroll();

  if(drag.start<=todayStr()){
    saveManualConfirmedSale(drag.product,drag.start,drag.end);
  }else{
    savePlannedSale({
      id:uid('planned-sale'),
      productId:drag.product.id,
      start:drag.start,
      end:drag.end,
      discountPercent:null,
      status:'planned',
      createdAt:new Date().toISOString(),
      updatedAt:new Date().toISOString()
    });
  }

  renderTabContent();
}

function wireSalesPlanningHoverPreview(){
  const scroller=document.getElementById('salesTimelineScroll');
  const track=document.getElementById('salesTimelineTrack');
  if(!scroller || !track || scroller.dataset.planHoverWired==='1') return;
  scroller.dataset.planHoverWired='1';

  ensureSalesTimelineGridOverlay();

  scroller.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    const hit=updateSalesTimelineCellHover(e.clientX,e.clientY);
    const onSale=e.target && e.target.closest && e.target.closest('.sales-timeline-sale-period');
    const onSuggestion=e.target && e.target.closest && e.target.closest('.sales-timeline-sale-suggestion');
    if(onSuggestion){
      hideSalesPlanHoverTooltip();
      hideSalesTimelineCellHover();
      return;
    }
    if(hit && hit.lane && hit.lane.product && !onSale) beginSalesPlanningDrag(hit,e);
  });

  scroller.addEventListener('pointermove',e=>{
    SALES_SUPPRESS_HOVER_UNTIL_POINTER_MOVE=false;
    SALES_PLAN_POINTER_X=e.clientX;
    SALES_PLAN_POINTER_Y=e.clientY;
    SALES_PLAN_POINTER_INSIDE=true;

    if(SALES_PLANNING_DRAG){
      if(SALES_PLANNING_POINTER_ID!==null && e.pointerId!==SALES_PLANNING_POINTER_ID) return;
      updateSalesPlanningDrag(salesTimelineDateAtPointer(scroller,e.clientY));
      return;
    }

    refreshSalesPlanningHoverFromPointer();
  });

  scroller.addEventListener('pointerenter',e=>{
    SALES_PLAN_POINTER_X=e.clientX;
    SALES_PLAN_POINTER_Y=e.clientY;
    SALES_PLAN_POINTER_INSIDE=true;
    if(!SALES_PLANNING_DRAG) refreshSalesPlanningHoverFromPointer();
  });

  scroller.addEventListener('pointerleave',()=>{
    SALES_PLAN_POINTER_INSIDE=false;
    if(!SALES_PLANNING_DRAG){
      hideSalesPlanHoverTooltip();
      hideSalesTimelineCellHover();
      hideSalesSuggestionGlobalTooltip();
    }
  });

  const finishPointer=e=>{
    if(!SALES_PLANNING_DRAG) return;
    if(SALES_PLANNING_POINTER_ID!==null && e.pointerId!==SALES_PLANNING_POINTER_ID) return;
    finishSalesPlanningDrag(false);
  };

  scroller.addEventListener('pointerup',finishPointer);
  window.addEventListener('pointerup',finishPointer);

  scroller.addEventListener('pointercancel',e=>{
    if(!SALES_PLANNING_DRAG) return;
    if(SALES_PLANNING_POINTER_ID!==null && e.pointerId!==SALES_PLANNING_POINTER_ID) return;
    finishSalesPlanningDrag(true);
  });

  window.addEventListener('blur',()=>{
    if(SALES_PLANNING_DRAG) finishSalesPlanningDrag(true);
  });

  scroller.addEventListener('scroll',()=>{
    if(!SALES_PLANNING_DRAG) requestAnimationFrame(refreshSalesPlanningHoverFromPointer);
  },{passive:true});
}

function wirePlannedSaleDirectClicks(){
  const scroller=document.getElementById('salesTimelineScroll');
  if(!scroller || scroller.dataset.plannedPointerWired==='1') return;
  scroller.dataset.plannedPointerWired='1';

  let pressedPlannedId=null;
  let pressedX=0;
  let pressedY=0;

  scroller.addEventListener('pointerdown',e=>{
    const box=e.target && e.target.closest
      ? e.target.closest('.sales-timeline-sale-period[data-planned-id]')
      : null;

    if(!box || e.shiftKey || e.button!==0){
      pressedPlannedId=null;
      return;
    }

    pressedPlannedId=box.dataset.plannedId||null;
    pressedX=e.clientX;
    pressedY=e.clientY;
  },true);

  scroller.addEventListener('pointerup',e=>{
    if(!pressedPlannedId) return;

    const plannedId=pressedPlannedId;
    const moved=Math.hypot(e.clientX-pressedX,e.clientY-pressedY);
    pressedPlannedId=null;

    if(moved>5 || e.shiftKey) return;

    const underPointer=document.elementFromPoint(e.clientX,e.clientY);
    const box=underPointer && underPointer.closest
      ? underPointer.closest('.sales-timeline-sale-period[data-planned-id]')
      : null;

    if(!box || box.dataset.plannedId!==plannedId) return;

    e.preventDefault();
    e.stopPropagation();
    openPlannedSaleEditor(plannedId);
  },true);

  scroller.addEventListener('pointercancel',()=>{
    pressedPlannedId=null;
  },true);
}

function preferredFabEventForEditing(){
  const events=fabEventSales();
  if(!events.length) return null;

  const today=todayStr();
  const current=events.find(x=>x.start<=today && x.end>=today);
  if(current) return current;

  const future=events.filter(x=>x.start>today).sort((a,b)=>a.start.localeCompare(b.start))[0];
  if(future) return future;

  return events.slice().sort((a,b)=>b.end.localeCompare(a.end))[0]||null;
}

function wireSalesTimelineEvents(){
  const scroller=document.getElementById('salesTimelineScroll');
  if(!scroller) return;
  const rows=[...scroller.querySelectorAll('[data-sales-date]')];
  const buttons=[...document.querySelectorAll('[data-sales-jump]')];
  if(!rows.length||!buttons.length) return;

  wireSalesGlobalModal();
  wireSalesPlanningHoverPreview();
  wirePlannedSaleDirectClicks();
  updateSalesSelectionToolbarHint();

  const addFabBtn=document.getElementById('addFabSalesBtn');
  if(addFabBtn){
    addFabBtn.addEventListener('click',()=>{clearFabEventImportQueue();openFabEventSaleEditor();});
  }

  const moreSettingsBtn=document.getElementById('salesMoreSettingsBtn');
  if(moreSettingsBtn){
    moreSettingsBtn.addEventListener('click',openSalesMoreSettings);
  }


const historyToggle=document.getElementById('salesTimelineHistoryToggle');
  if(historyToggle){
    historyToggle.addEventListener('change',()=>{
      if(historyToggle.checked){
        SALES_TIMELINE_RESTORE_DATE=captureSalesTimelineVisibleDate();
      }else{
        SALES_TIMELINE_RESTORE_DATE=null;
      }

      SALES_TIMELINE_SHOW_FULL_HISTORY=historyToggle.checked;
      // Session-only state: rebuild the Sales page but do not persist settings.
      renderTabContent();
      requestAnimationFrame(()=>{
        ensureSalesTimelineGridOverlay();
        requestAnimationFrame(ensureSalesTimelineGridOverlay);
      });
    });
  }

  const rowByDate=new Map(rows.map(row=>[row.dataset.salesDate,row]));
  const nearestRowForDate=(target)=>{
    if(rowByDate.has(target)) return rowByDate.get(target);
    const tt=new Date(target+'T12:00:00').getTime();
    let best=null,dist=Infinity;
    rows.forEach(row=>{
      const rt=new Date(row.dataset.salesDate+'T12:00:00').getTime();
      const d=Math.abs(rt-tt);
      if(d<dist){dist=d;best=row;}
    });
    return best;
  };

  const updateActiveButton=()=>{
    const probe=scroller.getBoundingClientRect().top+Math.min(90,scroller.clientHeight*.22);
    let nearest=null,dist=Infinity;
    rows.forEach(row=>{
      const rect=row.getBoundingClientRect();
      const d=Math.abs((rect.top+rect.height/2)-probe);
      if(d<dist){dist=d;nearest=row;}
    });
    if(!nearest) return;
    const date=nearest.dataset.salesDate;
    const visibleTime=new Date(date+'T12:00:00').getTime();

    let nearestButton=null;
    let nearestDistance=Infinity;
    buttons.forEach(btn=>{
      const target=btn.dataset.salesJump;
      if(!target) return;
      const targetTime=new Date(target+'T12:00:00').getTime();
      const distance=Math.abs(targetTime-visibleTime);
      if(distance<nearestDistance){
        nearestDistance=distance;
        nearestButton=btn;
      }
    });

    buttons.forEach(btn=>btn.classList.remove('active'));
    if(nearestButton) nearestButton.classList.add('active');
  };

  const scrollToDateInstant=(date)=>{
    const row=nearestRowForDate(date);
    if(!row) return;
    scroller.scrollTop=Math.max(0,row.offsetTop-8);
    updateActiveButton();
  };

  buttons.forEach(btn=>{
    btn.addEventListener('click',()=>scrollToDateInstant(btn.dataset.salesJump));
  });

  let rafPending=false;
  scroller.addEventListener('scroll',()=>{
    if(rafPending) return;
    rafPending=true;
    requestAnimationFrame(()=>{
      rafPending=false;
      updateActiveButton();
    });
  },{passive:true});
// Build sale bars after layout is measurable.
  requestAnimationFrame(()=>{
    mountSalesTimelineSalePeriods();
    ensureSalesTimelineGridOverlay();

    if(SALES_TIMELINE_RESTORE_DATE){
      const restoreDate=SALES_TIMELINE_RESTORE_DATE;
      SALES_TIMELINE_RESTORE_DATE=null;
      if(!restoreSalesTimelineVisibleDate(restoreDate)){
        scrollToDateInstant(todayStr());
      }
      updateActiveButton();
    }else if(SALES_TIMELINE_RESTORE_SCROLL_TOP!==null){
      scroller.scrollTop=SALES_TIMELINE_RESTORE_SCROLL_TOP;
      SALES_TIMELINE_RESTORE_SCROLL_TOP=null;
      updateActiveButton();
    }else{
      scrollToDateInstant(todayStr());
    }
  });

  // Recalculate sale-bar geometry if the page width changes.
  let resizeTimer=null;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
      if(ACTIVE_TAB==='sales'){
        mountSalesTimelineSalePeriods();
        ensureSalesTimelineGridOverlay();
      }
    },80);
  },{passive:true});
}

function monthRangeFromOffset(offset){
  const now=new Date();
  const d=new Date(now.getFullYear(),now.getMonth()+offset,1,12,0,0,0);
  const year=d.getFullYear();
  const month=d.getMonth()+1;
  const start=`${year}-${String(month).padStart(2,'0')}-01`;
  const lastDay=new Date(year,month,0,12,0,0,0).getDate();
  const fullEnd=`${year}-${String(month).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  const isCurrent=offset===0;
  const end=isCurrent?todayStr():fullEnd;

  const prevYear=year-1;
  const prevLastDay=new Date(prevYear,month,0,12,0,0,0).getDate();
  const comparisonStart=`${prevYear}-${String(month).padStart(2,'0')}-01`;
  const comparisonEnd=`${prevYear}-${String(month).padStart(2,'0')}-${String(prevLastDay).padStart(2,'0')}`;

  const names=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return {
    title:`${names[month-1]} ${year}`,
    start,end,fullEnd,isCurrent,
    comparisonStart,comparisonEnd,
    comparisonLabel:`${names[month-1]} ${prevYear}`
  };
}

function weightedSaleDaysForProductRange(p,start,end){
  if(!p || !start || !end || start>end) return 0;

  let total=0;
  displaySalePeriodsForProduct(p).forEach(period=>{
    const overlapStart=period.start>start?period.start:start;
    const overlapEnd=period.end<end?period.end:end;
    if(overlapStart>overlapEnd) return;

    // Count each calendar day in the overlap. The true first and last day of
    // the inferred sale each contribute half a day. A one-day sale therefore
    // contributes 1.0 day (0.5 start + 0.5 end).
    let cursor=new Date(overlapStart+'T12:00:00');
    const finish=new Date(overlapEnd+'T12:00:00');
    while(cursor<=finish){
      const y=cursor.getFullYear();
      const m=String(cursor.getMonth()+1).padStart(2,'0');
      const d=String(cursor.getDate()).padStart(2,'0');
      const date=`${y}-${m}-${d}`;

      let weight=1;
      const isStart=date===period.start;
      const isEnd=date===period.end;
      if(isStart && isEnd) weight=period.transition===true?.5:1;
      else if(isStart || isEnd) weight=.5;

      total+=weight;
      cursor.setDate(cursor.getDate()+1);
    }
  });

  return total;
}

function weightedSaleDaysForProductsRange(products,start,end){
  return products.reduce((sum,p)=>sum+weightedSaleDaysForProductRange(p,start,end),0);
}

function formatSaleDays(days){
  const n=Math.round((Number(days)||0)*10)/10;
  return Number.isInteger(n)?String(n):n.toFixed(1);
}


function roundHalf(value){
  return Math.round((Number(value)||0)*2)/2;
}


function historicalSaleAverageEligibleProducts(products, historicalStart){
  return (products||[]).filter(p=>{
    const release=p && p.releaseDate;
    return !release || release<historicalStart;
  });
}

function saleDaysBreakdown(products,start,end){
  const rows=(products||[]).map(p=>({
    product:p,
    days:weightedSaleDaysForProductRange(p,start,end)
  }));
  const total=rows.reduce((sum,row)=>sum+row.days,0);
  const average=rows.length?roundHalf(total/rows.length):0;
  return {rows,total,average};
}
