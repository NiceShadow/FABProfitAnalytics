function monthlySaleWeightForInfo(sale){
  if(!sale) return 0;

  // A genuine one-day inferred sale counts as one full sale-day. A same-day
  // discounted + normal-price transition is explicitly a half-day.
  if(sale.start===sale.end){
    return sale.transition===true ? .5 : 1;
  }
  return sale.edge ? .5 : 1;
}

function monthlyProductPerformanceProfile(p,start,end){
  if(!p || !start || !end || start>end){
    return {
      saleDays:0,nonSaleDays:0,
      saleRevenue:0,nonSaleRevenue:0,
      saleRate:null,nonSaleRate:0,totalRevenue:0,totalDays:0
    };
  }

  const cacheKey=`${p.id}|${start}|${end}|${STATE.settings.applyRevenueShare?'share':'full'}|${STATE.settings.displayCurrency||'USD'}`;
  if(MONTHLY_PROFILE_CACHE.has(cacheKey)) return MONTHLY_PROFILE_CACHE.get(cacheKey);

  let saleDays=0;
  let nonSaleDays=0;
  let saleRevenue=0;
  let nonSaleRevenue=0;
  let totalRevenue=0;
  const dates=daysInRangeList({start,end});

  dates.forEach(date=>{
    const revenue=rawNetForProductRange(p,date,date);
    const sale=saleInfoForDate(p,date);
    const saleWeight=Math.max(0,Math.min(1,monthlySaleWeightForInfo(sale)));
    const nonSaleWeight=1-saleWeight;

    totalRevenue+=revenue;
    saleDays+=saleWeight;
    nonSaleDays+=nonSaleWeight;

    // Transition days are split proportionally between sale/non-sale time.
    saleRevenue+=revenue*saleWeight;
    nonSaleRevenue+=revenue*nonSaleWeight;
  });

  const result={
    saleDays,
    nonSaleDays,
    saleRevenue,
    nonSaleRevenue,
    saleRate:saleDays>0?saleRevenue/saleDays:null,
    nonSaleRate:nonSaleDays>0?nonSaleRevenue/nonSaleDays:0,
    totalRevenue,
    totalDays:dates.length
  };
  MONTHLY_PROFILE_CACHE.set(cacheKey,result);
  return result;
}

function monthlyMapDateOneYearForward(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const targetYear=y+1;
  const maxDay=new Date(targetYear,m,0,12,0,0,0).getDate();
  return `${targetYear}-${String(m).padStart(2,'0')}-${String(Math.min(d,maxDay)).padStart(2,'0')}`;
}

function monthlyMappedPriorSaleSchedule(p,priorStart,priorEnd,currentStart,currentEnd){
  const mapped=[];
  let totalDays=0;

  daysInRangeList({start:priorStart,end:priorEnd}).forEach(priorDate=>{
    const sale=saleInfoForDate(p,priorDate);
    if(!sale) return;

    const currentDate=monthlyMapDateOneYearForward(priorDate);
    if(currentDate<currentStart || currentDate>currentEnd) return;

    const weight=Math.max(0,Math.min(1,monthlySaleWeightForInfo(sale)));
    if(weight<=0) return;

    mapped.push({priorDate,currentDate,weight});
    totalDays+=weight;
  });

  return {days:totalDays,mapped};
}

function monthlyLatestSalePerformanceBefore(p,beforeDate){
  const periods=displaySalePeriodsForProduct(p)
    .filter(period=>period.end<beforeDate)
    .sort((a,b)=>b.end.localeCompare(a.end));

  for(const period of periods){
    const profile=monthlyProductPerformanceProfile(p,period.start,period.end);
    if(profile.saleDays>0 && profile.saleRate!==null){
      return {
        rate:profile.saleRate,
        start:period.start,
        end:period.end,
        source:'recent'
      };
    }
  }
  return null;
}

function monthlyNormalizedProductPerformance(p,priorStart,priorEnd,currentStart,currentEnd){
  const currentProfile=monthlyProductPerformanceProfile(p,currentStart,currentEnd);
  const priorProfile=monthlyProductPerformanceProfile(p,priorStart,priorEnd);
  const targetSchedule=monthlyMappedPriorSaleSchedule(p,priorStart,priorEnd,currentStart,currentEnd);

  const targetSaleDays=Math.max(0,Math.min(currentProfile.totalDays,targetSchedule.days));
  const targetNonSaleDays=Math.max(0,currentProfile.totalDays-targetSaleDays);

  let saleRate=currentProfile.saleRate;
  let saleRateSource='current period';
  let saleRateSourceRange=null;

  // If this year's comparison period has no sale exposure, use the most recent
  // earlier sale for that product. This is the key current-month/no-sale case.
  if(saleRate===null && targetSaleDays>0){
    const recent=monthlyLatestSalePerformanceBefore(p,currentStart);
    if(recent){
      saleRate=recent.rate;
      saleRateSource='most recent sale';
      saleRateSourceRange={start:recent.start,end:recent.end};
    }else if(priorProfile.saleRate!==null){
      saleRate=priorProfile.saleRate;
      saleRateSource='prior-year sale fallback';
      saleRateSourceRange={start:priorStart,end:priorEnd};
    }else{
      saleRate=0;
      saleRateSource='no sale-rate history';
    }
  }
  if(saleRate===null) saleRate=0;

  let nonSaleRate=currentProfile.nonSaleRate;
  if(currentProfile.nonSaleDays<=0){
    // Rare all-sale period fallback: use the period's observed overall daily
    // rate rather than inventing a non-sale rate.
    nonSaleRate=currentProfile.totalDays>0
      ? currentProfile.totalRevenue/currentProfile.totalDays
      : 0;
  }

  // Counterfactual rebuild:
  // current-year non-sale performance × last-year-normalized non-sale exposure
  // + current/recent sale performance × last-year-normalized sale exposure.
  const adjustedRevenue=(nonSaleRate*targetNonSaleDays)+(saleRate*targetSaleDays);

  return {
    product:p,
    adjustedRevenue,
    actualRevenue:currentProfile.totalRevenue,
    delta:adjustedRevenue-currentProfile.totalRevenue,
    actualSaleDays:currentProfile.saleDays,
    targetSaleDays,
    priorSaleDays:priorProfile.saleDays,
    nonSaleRate,
    saleRate,
    saleRateSource,
    saleRateSourceRange,
    targetSchedule
  };
}

function monthlyNormalizedComparison(products,priorStart,priorEnd,currentStart,currentEnd){
  const ids=(products||[]).map(p=>p.id).sort().join(',');
  const cacheKey=`${ids}|${priorStart}|${priorEnd}|${currentStart}|${currentEnd}|${STATE.settings.applyRevenueShare?'share':'full'}|${STATE.settings.displayCurrency||'USD'}|${STATE.settings.monthlyComparisonEstablishedOnly===true?'established':'all'}`;
  if(MONTHLY_NORMALIZED_CACHE.has(cacheKey)) return MONTHLY_NORMALIZED_CACHE.get(cacheKey);

  const details=(products||[]).map(p=>
    monthlyNormalizedProductPerformance(p,priorStart,priorEnd,currentStart,currentEnd)
  );

  // Historical average:
  // only products that actually existed during the prior-year comparison month
  // are allowed to contribute to the historical average. Newer products must
  // NOT enter that average as artificial 0-sale-day rows.
  const historicalRows=details.filter(row=>{
    const release=row.product && row.product.releaseDate;
    return !release || release<priorStart;
  });

  const historicalAverageSaleDaysRaw=historicalRows.length
    ? historicalRows.reduce((sum,row)=>sum+row.priorSaleDays,0)/historicalRows.length
    : 0;

  // This rounded value is the single canonical normalized target everywhere:
  // the historical display, the normalized display, and every newer product's
  // inherited target sale exposure all use EXACTLY the same number.
  const historicalAverageSaleDays=roundHalf(historicalAverageSaleDaysRaw);

  // Current-year normalized side:
  // products that did not exist last year but do exist now inherit the
  // historical average sale exposure. Products that already existed last year
  // keep their own mapped prior-year sale exposure.
  if(STATE.settings.monthlyComparisonEstablishedOnly!==true && details.length){
    details.forEach(row=>{
      const release=row.product && row.product.releaseDate;
      const notReleasedDuringPriorPeriod=!!release && release>=priorStart;
      if(!notReleasedDuringPriorPeriod) return;

      const currentProfile=monthlyProductPerformanceProfile(row.product,currentStart,currentEnd);
      const fallbackSaleDays=Math.min(
        currentProfile.totalDays,
        historicalAverageSaleDays
      );

      row.targetSaleDays=fallbackSaleDays;
      row.usedUnreleasedAverageFallback=true;
      row.fallbackSaleDays=fallbackSaleDays;

      const targetNonSaleDays=Math.max(0,currentProfile.totalDays-fallbackSaleDays);

      let saleRate=row.saleRate;
      let saleRateSource=row.saleRateSource;
      let saleRateSourceRange=row.saleRateSourceRange;

      if((!Number.isFinite(saleRate) || saleRate<=0) && fallbackSaleDays>0){
        const recent=monthlyLatestSalePerformanceBefore(row.product,currentStart);
        if(recent){
          saleRate=recent.rate;
          saleRateSource='most recent sale';
          saleRateSourceRange={start:recent.start,end:recent.end};
        }
      }
      if(!Number.isFinite(saleRate)) saleRate=0;

      row.saleRate=saleRate;
      row.saleRateSource=saleRateSource;
      row.saleRateSourceRange=saleRateSourceRange;
      row.adjustedRevenue=(row.nonSaleRate*targetNonSaleDays)+(saleRate*fallbackSaleDays);
      row.delta=row.adjustedRevenue-row.actualRevenue;
    });
  }

  // By construction:
  // - left historical average excludes products that did not yet exist
  // - right normalized average is intentionally shown as that same historical
  //   average, while newer current-year products inherit exactly that exposure.
  const result={
    details,
    revenue:details.reduce((sum,row)=>sum+row.adjustedRevenue,0),
    actualRevenue:details.reduce((sum,row)=>sum+row.actualRevenue,0),
    totalTargetSaleDays:details.reduce((sum,row)=>sum+row.targetSaleDays,0),
    averageTargetSaleDays:historicalAverageSaleDays,
    historicalAverageSaleDays,
    historicalProductCount:historicalRows.length
  };

  MONTHLY_NORMALIZED_CACHE.set(cacheKey,result);
  return result;
}

function dashboardMonthlyPerformanceHTML(products){
  const monthAbbr=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  const normalizeSaleExposure=STATE.settings.monthlyNormalizeSaleExposure===true;

  const comparisonMetrics=(current,previous)=>{
    const diff=current-previous;
    let changeText='—';
    let changeClass='neutral';

    if(Math.abs(previous)>0.000001){
      const pct=(diff/Math.abs(previous))*100;
      changeText=`${pct>=0?'+':''}${pct.toFixed(1)}%`;
      changeClass=pct>0?'positive':pct<0?'negative':'neutral';
    }else if(current>0){
      changeText='New';
      changeClass='positive';
    }

    return {
      diff,
      changeText,
      changeClass,
      diffPrefix:diff>0?'+':''
    };
  };

  const today=new Date();
  const currentDayCutoff=Math.max(1,today.getDate()-1);
  const currentMonthName=monthNames[today.getMonth()];
  const currentMonthPriorYear=today.getFullYear()-1;

  const threeMonthSummaryRows=[];

  const cards=[-2,-1,0].map(offset=>{
    const range=monthRangeFromOffset(offset);
    const eligibleProducts=monthlyComparisonEligibleProducts(products,range);

    const comparisonMonthLabel=`${monthAbbr[comparisonMonth-1]} ${comparisonYear}`;
    const currentMonthLabel=`${monthAbbr[comparisonMonth-1]} ${comparisonYear+1}`;

    let priorEnd=range.comparisonEnd;
    let currentEnd=range.end;
    let priorScopeLabel='';
    let currentScopeLabel='';

    if(range.isCurrent){
      const currentYear=comparisonYear+1;
      const maxPriorDay=new Date(comparisonYear,comparisonMonth,0,12,0,0,0).getDate();
      const maxCurrentDay=new Date(currentYear,comparisonMonth,0,12,0,0,0).getDate();
      const cutoff=Math.min(currentDayCutoff,maxPriorDay,maxCurrentDay);

      // The current month always compares only through yesterday.
      currentEnd=`${currentYear}-${String(comparisonMonth).padStart(2,'0')}-${String(cutoff).padStart(2,'0')}`;
      currentScopeLabel=`until day ${cutoff}`;

      // This separate toggle only decides whether last year's displayed
      // historical comparison also stops at that same day.
      if(STATE.settings.monthlyCurrentMonthUntilDayOnly===true){
        priorEnd=`${comparisonYear}-${String(comparisonMonth).padStart(2,'0')}-${String(cutoff).padStart(2,'0')}`;
        priorScopeLabel=`until day ${cutoff}`;

    const priorRevenue=monthlyNetForProducts(eligibleProducts,range.comparisonStart,priorEnd);
    const historicalCurrentRevenue=monthlyNetForProducts(eligibleProducts,range.start,currentEnd);

    const normalized=normalizeSaleExposure
      ? monthlyNormalizedComparison(
          eligibleProducts,
          range.comparisonStart,
          priorEnd,
          range.start,

        </div>

          <div class="monthly-performance-flow-value left prior-year-info">

              <span>${priorRevenueLabel}</span>
              <span class="monthly-performance-revenue-scope${priorScopeLabel?'':' placeholder'}">${priorScopeLabel||'full month'}</span>

function prewarmMonthlyPerformance(){
  if(ACTIVE_TAB!=='dashboard') return;
  const products=getFilteredProducts();
  if(!products.length) return;

  const run=()=>{
    // Precompute the expensive normalized state for all three cards so the
    // first toggle into normalized mode is usually immediate.
    [-2,-1,0].forEach(offset=>{
      const range=monthRangeFromOffset(offset);
      const eligibleProducts=monthlyComparisonEligibleProducts(products,range);
      let priorEnd=range.comparisonEnd;
      let currentEnd=range.end;

      if(range.isCurrent){
        const today=new Date();
        const [comparisonYear,comparisonMonth]=range.comparisonStart.split('-').map(Number);
        const currentYear=comparisonYear+1;
        const maxPriorDay=new Date(comparisonYear,comparisonMonth,0,12,0,0,0).getDate();
        const maxCurrentDay=new Date(currentYear,comparisonMonth,0,12,0,0,0).getDate();
        const cutoff=Math.min(Math.max(1,today.getDate()-1),maxPriorDay,maxCurrentDay);
        currentEnd=`${currentYear}-${String(comparisonMonth).padStart(2,'0')}-${String(cutoff).padStart(2,'0')}`;
        if(STATE.settings.monthlyCurrentMonthUntilDayOnly===true){
          priorEnd=`${comparisonYear}-${String(comparisonMonth).padStart(2,'0')}-${String(cutoff).padStart(2,'0')}`;
        }
      }

      monthlyNormalizedComparison(
        eligibleProducts,
        range.comparisonStart,
        priorEnd,
        range.start,
        currentEnd
      );
    });
  };

  if('requestIdleCallback' in window){
    window.requestIdleCallback(run,{timeout:1200});
  }else{
    setTimeout(run,120);
  }
}

function updateCompareLoadingViewport(){

  const filterBottom=filter?filter.getBoundingClientRect().bottom:topbarBottom;

  const top=Math.max(0,filterBottom,rect.top);
  const bottom=Math.min(window.innerHeight,rect.bottom);
  const left=Math.max(0,rect.left);
  const right=Math.min(window.innerWidth,rect.right);
  const width=Math.max(0,right-left);
  const height=Math.max(0,bottom-top);

  overlay.style.left=Math.round(left)+'px';
  overlay.style.top=Math.round(top)+'px';
  overlay.style.width=Math.round(width)+'px';
  overlay.style.height=Math.round(height)+'px';

function dailyRevenuePerHourIncreaseSeries(p){
  const start=firstSaleDate(p.id);
  const end=todayStr();
  const hours=totalHoursForProduct(p);
  if(!start || !end || hours<=0) return [];

  const days=daysInRangeList({start,end});
  return days.map(date=>{
    const dayRevenue=chartNetForProductRange(p,date,date);
    return displayMoneyValue(dayRevenue)/hours;
  });
}

function performanceRelativeToDevelopmentTime(p){
  const series=dailyRevenuePerHourIncreaseSeries(p);
  if(!series.length) return 0;
  const mean=series.reduce((s,v)=>s+(Number(v)||0),0)/series.length;
  return mean*100;
}

function performanceEvolutionDailySeries(p){
  const start=firstSaleDate(p.id);
  const end=todayStr();
  const hours=totalHoursForProduct(p);
  if(!start || !end || hours<=0) return {days:[],values:[]};

  const days=daysInRangeList({start,end});
  let cumulative=0;

  const values=days.map((date,index)=>{
    const dayRevenue=chartNetForProductRange(p,date,date);

    const dailyIncrease=displayMoneyValue(dayRevenue)/hours;
    cumulative+=dailyIncrease;

    // Excel equivalent:
    // AVERAGE($T$first:T_current)*100
    return (cumulative/(index+1))*100;
  });

  return {days,values};
}

function performanceEvolutionMonthlySeries(p,months,range){
  const daily=performanceEvolutionDailySeries(p);
  if(!daily.days.length) return months.map(()=>null);

  const byMonthLast=new Map();
  daily.days.forEach((date,index)=>{
    if(date<range.start || date>range.end) return;
    byMonthLast.set(monthKey(date),daily.values[index]);
  });

  // For monthly chart alignment, use the final cumulative-average value of each month.
  // Before the product existed, keep null so no line is drawn.
  let lastKnown=null;
  return months.map(m=>{
    if(byMonthLast.has(m)) lastKnown=byMonthLast.get(m);
    return lastKnown;
  });
}



function unitsSoldForProduct(p){

function hexToRgba(hex,alpha){
  const h=String(hex||'').replace('#','');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return `rgba(139,147,163,${alpha})`;
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function externalRevenueTooltip(context){
  const {chart,tooltip}=context;
  const parent=chart.canvas.parentNode;
  if(getComputedStyle(parent).position==='static') parent.style.position='relative';

  let el=parent.querySelector('.chart-revenue-tooltip');
  if(!el){
    el=document.createElement('div');
    el.className='chart-revenue-tooltip';
    parent.appendChild(el);
  }

  if(tooltip.opacity===0){
    el.style.opacity='0';
    return;
  }

  const title=tooltip.title&&tooltip.title.length?tooltip.title[0]:'';
  const rows=(tooltip.dataPoints||[]).map(dp=>{
    const value=Number(dp.raw)||0;
    const zero=Math.abs(value)<0.000001?' zero':'';
    const color=dp.dataset._baseRevenueColor || '#8B93A3';
    return `<div class="crt-row${zero}">
      <span class="crt-dot" style="background:${color}"></span>
      <span class="crt-code">${dp.dataset.label}</span>
      <span class="crt-value">${fmtMoney(value)}</span>
    </div>`;
  }).join('');
  const total=(tooltip.dataPoints||[]).reduce((s,dp)=>s+(Number(dp.raw)||0),0);
  const nextHTML=`<div class="crt-title">${title}</div>${rows}<div class="crt-total"><span>Total</span><span>${fmtMoney(total)}</span></div>`;
  if(el.innerHTML!==nextHTML) el.innerHTML=nextHTML;

  const canvasRect=chart.canvas.getBoundingClientRect();
  const parentRect=parent.getBoundingClientRect();
  const canvasLeft=canvasRect.left-parentRect.left;
  const canvasTop=canvasRect.top-parentRect.top;
  const w=el.offsetWidth||200;
  const h=el.offsetHeight||120;

  // Follow Chart.js' caret/bar position like the earlier native tooltip.
  // Prefer the right side of the hovered bar; flip left near the panel edge.
  let x=canvasLeft+tooltip.caretX+12;
  let y=canvasTop+tooltip.caretY-Math.min(22,h*.18);

  if(x+w>parent.clientWidth-6){
    x=canvasLeft+tooltip.caretX-w-12;
  }
  x=Math.max(6,Math.min(parent.clientWidth-w-6,x));

  // Keep the box inside the chart vertically while remaining visually attached.

const yearAxisSeparatorsPlugin={
  id:'yearAxisSeparators',
  beforeDatasetsDraw(chart,args,opts){
    if(!opts||!opts.enabled) return;
    const x=chart.scales.x;
    const area=chart.chartArea;
    const buckets=chart.$timeBuckets || [];
    if(!x || !area || buckets.length<2) return;

    const yearOf=s=>String(s||'').slice(0,4);
    const monthOf=s=>String(s||'').slice(5,7);

    const ctx=chart.ctx;
    ctx.save();
    ctx.strokeStyle='#2A3140';
    ctx.lineWidth=1;
    ctx.lineCap='butt';

    for(let i=1;i<buckets.length;i++){
      const prev=String(buckets[i-1]||'');
      const cur=String(buckets[i]||'');

      // Only mark a real Dec -> Jan year boundary.
      if(yearOf(prev)===yearOf(cur)) continue;
      if(monthOf(prev)!=='12' || monthOf(cur)!=='01') continue;

      const prevX=x.getPixelForValue(i-1);
      const curX=x.getPixelForValue(i);
      if(!Number.isFinite(prevX)||!Number.isFinite(curX)) continue;

      const px=(prevX+curX)/2;

      ctx.beginPath();
      ctx.moveTo(px,area.top);
      ctx.lineTo(px,area.bottom);
      ctx.stroke();
    }
    ctx.restore();
  },
  afterDraw(chart,args,opts){
    if(!opts||!opts.enabled) return;
    const x=chart.scales.x;
    const area=chart.chartArea;
    const buckets=chart.$timeBuckets || [];
    if(!x || !area || buckets.length<2) return;

    const monthSerial=s=>{
      const text=String(s||'');
      const y=Number(text.slice(0,4));
      const m=Number(text.slice(5,7));
      return Number.isFinite(y)&&Number.isFinite(m)&&m>=1&&m<=12 ? y*12+(m-1) : null;
    };

    const firstSerial=monthSerial(buckets[0]);
    const lastSerial=monthSerial(buckets[buckets.length-1]);
    if(firstSerial===null||lastSerial===null) return;

    const x0=x.getPixelForValue(0);
    const x1=x.getPixelForValue(1);
    const monthStep=x1-x0;
    if(!Number.isFinite(x0)||!Number.isFinite(monthStep)||Math.abs(monthStep)<.001) return;

    const firstYear=Math.floor(firstSerial/12);
    const lastYear=Math.floor(lastSerial/12);

    const ctx=chart.ctx;
    ctx.save();
    ctx.font='900 22px Roboto, Arial, sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='top';

    // Include one virtual neighboring year on each side. Their centers can be
    // outside the canvas and naturally clip, which keeps annual spacing constant.
    for(let year=firstYear-1;year<=lastYear+1;year++){
      const janSerial=year*12;
      const decSerial=janSerial+11;
      const centerSerial=janSerial+5.5;
      const centerIndex=centerSerial-firstSerial;
      const centerX=x0+centerIndex*monthStep;

      const fullYear=janSerial>=firstSerial && decSerial<=lastSerial;
      const touchesVisible=decSerial>=firstSerial && janSerial<=lastSerial;

      ctx.fillStyle=fullYear
        ? 'rgba(237,239,243,.78)'
        : (touchesVisible ? 'rgba(237,239,243,.28)' : 'rgba(237,239,243,.12)');

      const y=Math.min(chart.height-24,area.bottom+30);
      ctx.fillText(String(year),centerX,y);
    }

    ctx.restore();
  }
}
Chart.register(yearAxisSeparatorsPlugin);

function niceMoneyStep(maxValue,targetMajorTicks=5){
  const max=Math.max(0,Number(maxValue)||0);
  if(max<=0) return 10;
  const rough=max/Math.max(2,targetMajorTicks);
  const exponent=Math.pow(10,Math.floor(Math.log10(rough)));
  const fraction=rough/exponent;
  let niceFraction;
  if(fraction<=1) niceFraction=1;
  else if(fraction<=2) niceFraction=2;
  else if(fraction<=2.5) niceFraction=2.5;
  else if(fraction<=5) niceFraction=5;
  else niceFraction=10;
  return niceFraction*exponent;
}
function compactMoneyAxis(value,withDollar=true){
  const n=Number(value)||0;
  const abs=Math.abs(n);
  let text;
  if(abs>=1000000){
    const v=n/1000000;
    text=(Number.isInteger(v)?v:v.toFixed(1))+'m';
  }else if(abs>=1000){
    const v=n/1000;
    text=(Number.isInteger(v)?v:v.toFixed(1))+'k';
  }else{
    text=(Number.isInteger(n)?n:Number(n.toFixed(2))).toLocaleString('de-DE');
  }
  return withDollar?formatCurrencyText(text):text;
}
function isMajorTick(value,major){
  const ratio=(Number(value)||0)/major;
  return Math.abs(ratio-Math.round(ratio))<1e-7;
}

function mountDashboardCharts(){
  const products = getFilteredProducts();
  if(products.length===0) return;
  const ids = products.map(p=>p.id);
  const gridColor = '#2A3140';
  const tickColor = '#8B93A3';
  const allSelected = ACTIVE_FILTER==='all';
  const combinedLabel = allSelected ? 'All products' : 'Selected total';
  Chart.defaults.font.family = "'Roboto', Arial, sans-serif";
  Chart.defaults.color = tickColor;

  // ---- Revenue per product (its own time range + daily/monthly toggle) ----
  destroyChart('chartMonthlyRevenue');
  {
    const range = resolveRange(TF_PRODUCT_CHART, products);
    const dailyAllowed = rangeDayCount(range)<=90;
    const granularity = dailyAllowed ? CHART_GRANULARITY : 'monthly';
    const buckets = granularity==='daily' ? daysInRangeList(range) : monthsInRange(range);
    const labelFn = granularity==='daily' ? dayLabel : monthLabel;

    const seriesByProduct = {};
    products.forEach(p=>{
      const share = revenueShareMultiplier(p);
      seriesByProduct[p.id] = buckets.map(bucket=>{
        if(granularity==='daily') return dashboardRevenueForProductRange(p,bucket,bucket);
        const [y,m]=bucket.split('-').map(Number);
        const bucketStart=`${bucket}-01`;
        const bucketEnd=`${bucket}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;
        const start=bucketStart<range.start?range.start:bucketStart;
        const end=bucketEnd>range.end?range.end:bucketEnd;
        return dashboardRevenueForProductRange(p,start,end);
      });
    });

    const revenueStackMax=buckets.reduce((mx,_,i)=>Math.max(mx,products.reduce((s,p)=>s+(Number(seriesByProduct[p.id][i])||0),0)),0);
    const revenueMajorStep=niceMoneyStep(revenueStackMax,5);
    const revenueMinorStep=revenueMajorStep/2;
    const revenueAxisMax=Math.max(revenueMajorStep,Math.ceil(revenueStackMax/revenueMajorStep)*revenueMajorStep);

    const ctx = document.getElementById('chartMonthlyRevenue');
    if(ctx && buckets.length){
      charts.chartMonthlyRevenue = new Chart(ctx, {
        plugins:[{
          id:'moneyScaleConfigRevenue',
          beforeInit(chart){
            chart.$moneyMajorStep=revenueMajorStep;
            chart.$timeBuckets=buckets;
          }
        }],
        data: {
          labels: buckets.map(labelFn),
          datasets:[{
            type:'bar',
            label:DASHBOARD_REVENUE_MODE==='net'?'Net revenue':'Gross revenue',
            data:buckets.map((_,i)=>products.reduce((s,p)=>s+(Number(seriesByProduct[p.id][i])||0),0)),
            backgroundColor:'rgba(217,164,65,0.12)',
            hoverBackgroundColor:'rgba(217,164,65,0.42)',
            borderColor:'#D9A441',
            hoverBorderColor:'#D9A441',
            borderWidth:1.5,
            borderRadius:2,
            maxBarThickness:26,
            _bucketKeys:buckets,
            _productBreakdown:products.map(p=>({
              id:p.id,
              code:shortNameFor(p),
              name:p.name,
              color:colorFor(p.id,ids),
              values:seriesByProduct[p.id]
            }))
          }]
        },
        options: {
          responsive:true,
          maintainAspectRatio:false,
          interaction:{mode:'index',intersect:false,axis:'x'},

          plugins:{
            legend:{display:false},
            revenueChartDecorations:{enabled:true},
            yearAxisSeparators:{enabled:true},
            tooltip:{
              enabled:false,
              external:dashboardRevenueExternalTooltip
            }
          },
          layout:{ padding:{ top:16, bottom:30 } },
          scales:{
            x:{ grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, color:tickColor} },
            y:{
              beginAtZero:true,
              max:revenueAxisMax,
              grid:{color:gridColor},
              ticks:{
                stepSize:revenueMinorStep,
                color:tickColor,
                callback:v=>isMajorTick(v,revenueMajorStep)?compactMoneyAxis(v,true):''
              }
            }
          }
        }
      });
    }
  }

  // ---- Accumulated total revenue (its own separate time range, single net line) ----
  destroyChart('chartAccumulated');
  {
    const range = resolveRange(TF_ACCUM_CHART, products);
    const dayCount = rangeDayCount(range);
    const granularity = dayCount<=180 ? 'daily' : 'monthly';
    const buckets = granularity==='daily' ? daysInRangeList(range) : monthsInRange(range);
    const labelFn = granularity==='daily' ? dayLabel : monthLabel;

    let cumulative = 0;
    const series = buckets.map(bucket=>{
      const netForBucket = products.reduce((sum,p)=>{
        if(granularity==='daily') return sum+chartNetForProductRange(p,bucket,bucket);
        const [y,m]=bucket.split('-').map(Number);
        const bucketStart=`${bucket}-01`;
        const bucketEnd=`${bucket}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;
        const start=bucketStart<range.start?range.start:bucketStart;
        const end=bucketEnd>range.end?range.end:bucketEnd;
        return sum+chartNetForProductRange(p,start,end);
      },0);
      cumulative += netForBucket;
      return Math.round(cumulative*100)/100;
    });
    // The accumulated graph itself is sales net of marketplace fees only.
    // General spending affects the displayed KPI number, never the graph data.
    const totalNet = cumulative;
    const totalGeneralSpending = products.reduce((s,p)=>s+productSpendingTotal(p),0);
    const displayedTotalNet = totalNet - (
      STATE.settings.subtractGeneralSpendingFromNumbers!==false ? totalGeneralSpending : 0
    );
    const accumSeriesMax=Math.max(0,...series);
    const accumMajorStep=niceMoneyStep(accumSeriesMax,5);
    const accumMinorStep=accumMajorStep/2;
    const accumAxisMax=Math.max(accumMajorStep,Math.ceil(accumSeriesMax/accumMajorStep)*accumMajorStep);

    const totalGross = products.reduce((s,p)=>{
      const share = revenueShareMultiplier(p);
      return s + STATE.revenue
        .filter(r=>r.productId===p.id && r.date>=range.start && r.date<=range.end)
        .reduce((a,r)=>a+convertRevenueUSD(Number(r.amount)*share,r.date),0);
    },0);

    const kpiEl = document.getElementById('accumKpis');
    if(kpiEl){
      kpiEl.innerHTML = `
        <div class="kpi-strip" style="grid-template-columns:repeat(2,1fr);margin-bottom:14px;">
          <div class="kpi">
            <div class="label">Net revenue</div>
            <div class="value gold mono">${fmtMoney(displayedTotalNet)}</div>
            <div class="sub">${range.start} → ${range.end}${STATE.settings.subtractGeneralSpendingFromNumbers!==false?' · general spending deducted':''}</div>
          </div>
          <div class="kpi">
            <div class="label">Gross revenue</div>
            <div class="value mono">${fmtMoney(totalGross)}</div>
            <div class="sub">${STATE.settings.subtractGeneralSpendingFromNumbers!==false?'before marketplace fees and general spending':'before marketplace fees'}</div>
          </div>
        </div>
      `;
    }

    const ctx = document.getElementById('chartAccumulated');
    if(ctx && buckets.length){
      charts.chartAccumulated = new Chart(ctx, {
        plugins:[{
          id:'moneyScaleConfigAccum',
          beforeInit(chart){
            chart.$moneyMajorStep=accumMajorStep;
            chart.$timeBuckets=buckets;
          }
        }],

function mountIndividualProductComparisonCharts(targetProductId=null){
  const products=getFilteredProducts();
  if(!products.length) return;

  const gridColor='#2A3140';
  const tickColor='#8B93A3';

  // All cards use one shared X range. With "All time" this begins at the
  // oldest visible product's first sale, so every chart lines up exactly.
  const range=resolveRange(TF_PRODUCT_CARDS,products);
  const months=monthsInRange(range);

  // Build every product's monthly series first so we can derive one shared Y scale.
  const seriesByProduct={};
  const performanceByProduct={};
  let globalMonthlyMax=0;
  let globalPerformanceMax=0;

  products.forEach(p=>{
    const series=months.map(m=>{
      const [y,mo]=m.split('-').map(Number);
      const bucketStart=`${m}-01`;
      const bucketEnd=`${m}-${String(new Date(y,mo,0).getDate()).padStart(2,'0')}`;
      const start=bucketStart<range.start?range.start:bucketStart;
      const end=bucketEnd>range.end?range.end:bucketEnd;
      return chartNetForProductRange(p,start,end);
    });
    const performanceSeries=performanceEvolutionMonthlySeries(p,months,range);

    seriesByProduct[p.id]=series;
    performanceByProduct[p.id]=performanceSeries;

    const localMax=Math.max(0,...series);
    if(localMax>globalMonthlyMax) globalMonthlyMax=localMax;

    const perfValues=performanceSeries.filter(v=>Number.isFinite(Number(v)));
    const localPerfMax=perfValues.length?Math.max(0,...perfValues):0;
    if(localPerfMax>globalPerformanceMax) globalPerformanceMax=localPerfMax;
  });

  const sharedMajorStep=niceMoneyStep(globalMonthlyMax,5);
  const sharedMinorStep=sharedMajorStep/2;
  const sharedAxisMax=Math.max(
    sharedMajorStep,
    Math.ceil(globalMonthlyMax/sharedMajorStep)*sharedMajorStep
  );

  const perfMajorStep=niceMoneyStep(globalPerformanceMax,5);
  const perfAxisMax=Math.max(
    perfMajorStep,
    Math.ceil(globalPerformanceMax/perfMajorStep)*perfMajorStep
  );

  products.forEach(p=>{
    if(targetProductId && p.id!==targetProductId) return;

    const canvasId=`productHistory_${p.id}`;
    destroyChart(canvasId);

    if(COLLAPSED_PRODUCT_COMPARE_CARDS.has(p.id)) return;

    const ctx=document.getElementById(canvasId);
    if(!ctx) return;

    const series=seriesByProduct[p.id]||[];
    const performanceSeries=performanceByProduct[p.id]||[];
    const productColor=colorFor(p.id,products.map(x=>x.id));

    const ownPerfValues=performanceSeries.filter(v=>Number.isFinite(Number(v)));
    const ownPerfMax=ownPerfValues.length?Math.max(0,...ownPerfValues):0;
    const ownPerfMin=ownPerfValues.length?Math.min(0,...ownPerfValues):0;
    const ownPerfStep=niceMoneyStep(Math.max(Math.abs(ownPerfMin),Math.abs(ownPerfMax)),5);
    const ownPerfAxisMax=Math.max(ownPerfStep,Math.ceil(ownPerfMax/ownPerfStep)*ownPerfStep);
    const ownPerfAxisMin=ownPerfMin<0 ? Math.floor(ownPerfMin/ownPerfStep)*ownPerfStep : 0;

    const perfScaleMax=PRODUCT_PERFORMANCE_SHARED_SCALE?perfAxisMax:ownPerfAxisMax;
    const perfScaleMin=PRODUCT_PERFORMANCE_SHARED_SCALE?0:ownPerfAxisMin;

    charts[canvasId]=new Chart(ctx,{
      plugins:[{
        id:`moneyScale_${p.id}`,
        beforeInit(chart){
          chart.$moneyMajorStep=sharedMajorStep;
          chart.$timeBuckets=months;
        }
      }],
      type:'bar',
      data:{
        labels:months.map(monthLabel),
        datasets:[
          {
            type:'bar',
            label:shortNameFor(p),
            data:series,
            backgroundColor:hexToRgba(productColor,.16),
            hoverBackgroundColor:hexToRgba(productColor,.42),
            borderColor:productColor,
            hoverBorderColor:productColor,
            borderWidth:1.5,
            borderRadius:2,
            maxBarThickness:26,
            _tooltipColor:productColor,
            _bucketKeys:months,
            yAxisID:'y'
          },
          ...(hasAnyWorkingHours()?[{
            type:'line',
            label:'Performance',
            data:performanceSeries,
            borderColor:productColor,
            backgroundColor:'transparent',
            borderWidth:2,
            pointRadius:0,
            pointHoverRadius:4,
            pointHitRadius:18,
            tension:.22,
            spanGaps:true,
            yAxisID:'yPerf'
          }]:[])
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false,axis:'x'},
        plugins:{
          legend:{display:false},
          revenueChartDecorations:{enabled:true},
          yearAxisSeparators:{enabled:true},
          tooltip:{
            enabled:true,
            mode:'index',
            intersect:false,
            displayColors:false,
            backgroundColor:'rgba(0,0,0,.82)',
            borderColor:'rgba(255,255,255,.10)',
            borderWidth:1,
            cornerRadius:6,
            padding:9,
            titleColor:'#EDEFF3',
            bodyColor:'#EDEFF3',
            titleFont:{family:"Roboto, Arial, sans-serif",size:12,weight:'800'},
            bodyFont:{family:"Roboto, Arial, sans-serif",size:12,weight:'600'},
            callbacks:{
              title:items=>{
                if(!items.length) return '';

              },

/* ================= REVENUE LOG ================= */
function daysDescBetween(start, end){
  const out = [];
  let d = new Date(end+'T00:00:00');
  const startD = new Date(start+'T00:00:00');
  while(d>=startD){ out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()-1); }
  return out;
}
function fullMonthLabel(ym){
  const [y,m] = ym.split('-');
  const names=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${names[parseInt(m,10)-1]} ${y}`;
}
function shortDayLabel(date){
  const d=new Date(date+'T00:00:00');
  const names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${names[d.getMonth()]} ${d.getDate()}`;
}

function parseMoneyNumber(value){
  if(value===null || value===undefined || value==='') return null;
  let s=String(value).trim().replace(/[^\d,.\-]/g,'');
  if(!s) return null;
  const lastComma=s.lastIndexOf(','), lastDot=s.lastIndexOf('.');
  if(lastComma>-1 && lastDot>-1){
    if(lastComma>lastDot) s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  }else if(lastComma>-1){
    const decimals=s.length-lastComma-1;
    s = decimals===2 ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  }else{
    s=s.replace(/,/g,'');
  }
  const n=Number(s);
  return Number.isFinite(n)?n:null;
}
function detectPriceColumn(fields){
  const exact=['Base Price','Listing Base Price','List Price','Unit Price','Price'];
  for(const name of exact){
    const found=(fields||[]).find(f=>String(f).trim().toLowerCase()===name.toLowerCase());
    if(found) return found;
  }
  // Last-resort fuzzy match, but deliberately avoid revenue/sales/earnings columns.
  return (fields||[]).find(f=>{
    const x=String(f).trim().toLowerCase();
    return x.includes('price') && !x.includes('net') && !x.includes('sales') && !x.includes('revenue');
  }) || null;
}
function rgbaFromHex(hex,alpha){
  const h=String(hex||'').replace('#','');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return `rgba(139,147,163,${alpha})`;
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function dayDiff(a,b){
  const da=new Date(a+'T00:00:00'), db=new Date(b+'T00:00:00');
  return Math.round((db-da)/86400000);
}
function observedPricesForHistoryRow(x){
  const values=[];
  const add=v=>{
    const n=Number(v);
    if(Number.isFinite(n) && n>0) values.push(n);
  };
  if(Array.isArray(x&&x.observedPrices)) x.observedPrices.forEach(add);
  add(x&&x.price);
  add(x&&x.minPrice);
  add(x&&x.maxPrice);
  return [...new Set(values.map(v=>Math.round(v*100)/100))].sort((a,b)=>a-b);
}
function observedPricesForProductOnDate(pid,date){
  const values=[];
  (STATE.priceHistory||[])
    .filter(x=>x.productId===pid && x.date===date)
    .forEach(x=>observedPricesForHistoryRow(x).forEach(v=>values.push(v)));
  return [...new Set(values)].sort((a,b)=>a-b);
}
function priceForProductOnDate(pid,date){
  const vals=observedPricesForProductOnDate(pid,date);
  return vals.length ? vals[0] : null;
}
function hasProfessionalSaleOnDate(pid,date){
  return Array.isArray(STATE.licenseHistory) && STATE.licenseHistory.some(x=>x.productId===pid && x.date===date && x.hasProfessional);
}
function hasRefundOnDate(pid,date){
  return Array.isArray(STATE.refundHistory) && STATE.refundHistory.some(x=>x.productId===pid && x.date===date && x.hasRefund);
}
function saleCooldownApplies(date){
  return date>='2024-10-22';
}
function saleCooldownSatisfied(previousEnd,nextStart){
  if(!previousEnd || !nextStart) return true;
  if(!saleCooldownApplies(nextStart)) return true;

  // Marketplace cooldown introduced Oct 22, 2024.
  // Only completely sale-free calendar dates strictly between the two
  // half-day sale boundary dates count toward the cooldown.
  return saleGapMeetsRequirement(previousEnd,nextStart,30);
}
function datePlusDays(dateStr,days){
  const d=new Date(dateStr+'T12:00:00');
  d.setDate(d.getDate()+Number(days||0));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function rawSalePeriodsForProduct(p){
  const release=p.releaseDate||firstSaleDate(p.id);
  const rows=[];
  (STATE.priceHistory||[])
    .filter(x=>x.productId===p.id && x.date)
    .forEach(x=>{
      observedPricesForHistoryRow(x).forEach(price=>{
        rows.push({date:x.date,price});
      });
    });
  rows.sort((a,b)=>a.date.localeCompare(b.date));

  if(rows.length<3) return [];

  const byDate=new Map();
  rows.forEach(x=>{
    const price=Number(x.price);
    if(!byDate.has(x.date) || price<byDate.get(x.date)) byDate.set(x.date,price);
  });
  const days=[...byDate.entries()].map(([date,price])=>({date,price})).sort((a,b)=>a.date.localeCompare(b.date));

  const periods=[];
  let lastSaleEnd=null;

  for(let i=1;i<days.length-1;i++){
    const cur=days[i];

    if(dayDiff(release,cur.date)<30) continue;
    if(!saleCooldownSatisfied(lastSaleEnd,cur.date)) continue;

    let before=null;
    for(let j=i-1;j>=0;j--){
      if(dayDiff(days[j].date,cur.date)>120) break;
      if(days[j].price>cur.price*1.05){ before=days[j]; break; }
    }

    let after=null, afterIdx=-1;
    for(let j=i+1;j<days.length;j++){
      if(dayDiff(cur.date,days[j].date)>45) break;
      if(days[j].price>cur.price*1.05){ after=days[j]; afterIdx=j; break; }
    }

    if(!before || !after) continue;

    // Handles a permanent price adjustment around a sale, e.g.
    // 59.99 -> 41.99 sale -> 49.99 new normal.
    const normalPrice=Math.min(before.price,after.price);
    const discount=1-(cur.price/normalPrice);
    if(discount<.05) continue;

    let lastDiscountIdx=i;
    let invalid=false;

    for(let j=i+1;j<afterIdx;j++){
      const obs=days[j];

      if(obs.price<normalPrice*.95 && Math.abs(obs.price-cur.price)/cur.price<=.20){
        lastDiscountIdx=j;
        if(dayDiff(cur.date,obs.date)>15){
          invalid=true;
          break;
        }
        continue;
      }

      invalid=true;
      break;
    }

    if(invalid) continue;

    const startDate=cur.date;
    const endDate=days[lastDiscountIdx].date;
    if(dayDiff(startDate,endDate)>15) continue;

    periods.push({
      // start/end may later be extended toward a marketplace-wide campaign.
      // observedStart/observedEnd always preserve what the product's own
      // transaction prices directly support.
      start:startDate,
      end:endDate,
      observedStart:startDate,
      observedEnd:endDate,
      normalPrice,
      salePrice:cur.price,
      discountPercent:Math.round(discount*100)
    });

    lastSaleEnd=endDate;
    i=afterIdx-1;
  }
  return periods;
}
function clipSalePeriodAtObservedNormalPrices(p,period){
  const observedStart=period.observedStart||period.start;
  const observedEnd=period.observedEnd||period.end;
  const referenceNormal=Number(period.normalPrice)||0;
  if(referenceNormal<=0) return period;

  // Group ALL observed private prices by date. A date is a hard non-sale
  // barrier only when every observed price on that date is back at the
  // normal/base-price level.
  //
  // If the same date contains BOTH a discounted price and a normal price,
  // that is a transition day (the sale started/ended during that day).
  // It must remain inside the inferred sale and will naturally render as
  // an edge / half-day when it is the period boundary.
  const pricesByDate=new Map();
  (STATE.priceHistory||[])
    .filter(x=>x.productId===p.id && x.date)
    .forEach(x=>{
      if(!pricesByDate.has(x.date)) pricesByDate.set(x.date,[]);
      observedPricesForHistoryRow(x).forEach(price=>pricesByDate.get(x.date).push(price));
    });

  const normalDates=[...pricesByDate.entries()]
    .filter(([date,prices])=>{
      if(!prices.length) return false;
      const hasDiscounted=prices.some(price=>price<referenceNormal*.95);
      const hasNormal=prices.some(price=>price>=referenceNormal*.95);
      return hasNormal && !hasDiscounted;
    })
    .map(([date])=>date)
    .sort();

  let start=period.start;
  let end=period.end;

  // If extending backward encountered a known pure normal-price day, the
  // inferred sale can only begin on the following calendar day.
  const beforeBarrier=normalDates
    .filter(date=>date>=start && date<observedStart)
    .pop();
  if(beforeBarrier){
    const afterBarrier=datePlusDays(beforeBarrier,1);
    if(afterBarrier>start) start=afterBarrier;
  }

  // If extending forward encountered a known pure normal-price day, the
  // inferred sale must end on the preceding calendar day.
  const afterBarrier=normalDates
    .find(date=>date>observedEnd && date<=end);
  if(afterBarrier){
    const beforeBarrierDate=datePlusDays(afterBarrier,-1);
    if(beforeBarrierDate<end) end=beforeBarrierDate;
  }

  // Never clip away the product's own observed discounted evidence,
  // including same-day discounted+normal transition observations.
  if(start>observedStart) start=observedStart;
  if(end<observedEnd) end=observedEnd;

  return {...period,start,end};
}

function detectedSalePeriodsForProduct(p){
  if(SALE_PERIOD_CACHE.has(p.id)) return SALE_PERIOD_CACHE.get(p.id);

  const periods=rawSalePeriodsForProduct(p);

  // Marketplace-wide/public campaigns often apply to several products at once.
  // Missing transaction days are unknown, so a strongly overlapping campaign on
  // another product can extend an inferred boundary, but never beyond 15 days.
  const otherPeriods=[];
  STATE.products.filter(x=>x.id!==p.id).forEach(op=>{
    rawSalePeriodsForProduct(op).forEach(period=>otherPeriods.push(period));
  });

  periods.forEach(period=>{
    const observedStart=period.observedStart||period.start;
    const observedEnd=period.observedEnd||period.end;

    otherPeriods.forEach(other=>{
      // Strong campaign evidence:
      // 1) the observed product sale sits inside / overlaps another product's sale,
      // 2) or one inferred edge is only a couple of days away.
      // This lets a sparse observation such as Jul 27/29 expand toward a
      // plausible Jul 22-29 public sale without forcing every product to match.
      const overlapsObserved=!(other.end<observedStart || other.start>observedEnd);
      const closeStart=Math.abs(dayDiff(other.start,observedStart))<=2;
      const closeEnd=Math.abs(dayDiff(other.end,observedEnd))<=2;
      if(!(overlapsObserved||closeStart||closeEnd)) return;

      const proposedStart=other.start<period.start?other.start:period.start;
      const proposedEnd=other.end>period.end?other.end:period.end;

      // Keep the same conservative maximum inferred sale length.
      if(dayDiff(proposedStart,proposedEnd)<=15){
        period.start=proposedStart;
        period.end=proposedEnd;
      }
    });
  });

  // Explicit normal-price observations are stronger evidence than campaign
  // matching. Never infer a sale through a date where this product was
  // directly sold at its normal/base price.
  const barrierClippedPeriods=periods.map(period=>clipSalePeriodAtObservedNormalPrices(p,period));

  // Final pass: preserve observed evidence, but clip only the INFERRED edges
  // when the marketplace cooldown would otherwise be violated.
  const refined=[];
  barrierClippedPeriods
    .slice()
    .sort((a,b)=>(a.observedStart||a.start).localeCompare(b.observedStart||b.start))
    .forEach(period=>{
      const observedStart=period.observedStart||period.start;
      const observedEnd=period.observedEnd||period.end;
      let start=period.start;
      let end=period.end;

      const previous=refined[refined.length-1];
      if(previous && saleCooldownApplies(observedStart)){
        const earliestAllowed=datePlusDays(previous.end,30);

        if(start<earliestAllowed){
          // Never move later than the product's own first observed discounted day.
          // If campaign matching tried to start too early, clip the inferred
          // extension to the cooldown boundary (or the observed start).
          start=earliestAllowed<observedStart?earliestAllowed:observedStart;
        }
      }

      // If clipping the start would make the inferred span too long, pull only
      // the inferred end back, but never before the observed discounted evidence.
      if(dayDiff(start,end)>15){
        const maxEnd=datePlusDays(start,15);
        end=maxEnd>observedEnd?maxEnd:observedEnd;
      }

      // A genuine observed sale should survive even if neighboring campaign
      // inference was imperfect. Only reject impossible ordering.
      if(start>end) {
        start=observedStart;
        end=observedEnd;
      }

      refined.push({...period,start,end});
    });

  SALE_PERIOD_CACHE.set(p.id,refined);
  return refined;
}
function directlyObservedSaleInfoForDate(p,date){
  const prices=observedPricesForProductOnDate(p.id,date);
  if(!prices.length) return null;

  const salePrice=prices[0];

  // Find nearby higher private prices around this observation, using the same
  // conservative windows as the main sale estimator.
  let before=null;
  for(let offset=1;offset<=120;offset++){
    const d=datePlusDays(date,-offset);
    const vals=observedPricesForProductOnDate(p.id,d);
    const higher=vals.filter(v=>v>salePrice*1.05);
    if(higher.length){ before=Math.min(...higher); break; }
  }

  let after=null;
  for(let offset=1;offset<=45;offset++){
    const d=datePlusDays(date,offset);
    const vals=observedPricesForProductOnDate(p.id,d);
    const higher=vals.filter(v=>v>salePrice*1.05);
    if(higher.length){ after=Math.min(...higher); break; }
  }

  if(before===null || after===null) return null;
  const normalPrice=Math.min(before,after);
  const discount=1-(salePrice/normalPrice);
  if(discount<.05) return null;

  const hasNormalSameDay=prices.some(v=>v>=normalPrice*.95);

  return {
    start:date,
    end:date,
    normalPrice,
    salePrice,
    discountPercent:Math.round(discount*100),
    edge:true,
    observed:true,
    transition:hasNormalSameDay
  };
}


function deletedSaleMatchesDetectedPeriod(p,period){
  return (STATE.deletedSalePeriods||[]).some(x=>{
    if(!x || x.productId!==p.id) return false;

    if(x.originalStart===period.start && x.originalEnd===period.end) return true;

    const overlapStart=(x.originalStart||x.start)>period.start?(x.originalStart||x.start):period.start;
    const overlapEnd=(x.originalEnd||x.end)<period.end?(x.originalEnd||x.end):period.end;
    return overlapStart<=overlapEnd &&
      Math.abs(dayDiff(x.originalStart||x.start,period.start))<=2;
  });
}

function deletedSaleShadowsDate(p,date){
  return (STATE.deletedSalePeriods||[]).some(x=>{
    if(!x || x.productId!==p.id) return false;
    const a=x.originalStart||x.start;
    const b=x.originalEnd||x.end;
    return date>=a && date<=b;
  });
}

function importedDiscountEvidenceForSale(p,period){
  if(!p || !period) return [];
  const start=(period.originalStart||period.start)<period.start?(period.originalStart||period.start):period.start;
  const end=(period.originalEnd||period.end)>period.end?(period.originalEnd||period.end):period.end;
  const dates=[];
  let d=start;
  let guard=0;
  while(d<=end && guard<40){
    if(directlyObservedSaleInfoForDate(p,d)) dates.push(d);
    d=datePlusDays(d,1);
    guard++;
  }
  return dates;
}

function historicalCooldownRequirement(previousEnd,nextStart){
  if(!previousEnd || !nextStart) return 0;
  return saleCooldownApplies(nextStart)?30:0;
}

function validateNewConfirmedSalePlacement(product,start,end,ignorePlannedId=null){
  if(!product || !start || !end) return {ok:false,message:'Invalid sale.'};
  if(end<start) return {ok:false,message:'End date must be on or after start date.'};

  const releaseEligibility=validateProductSaleReleaseEligibility(product,start);
  if(!releaseEligibility.ok) return releaseEligibility;
  if(dayDiff(start,end)>14) return {ok:false,message:'A sale can be at most 14 sale days long.'};

  const peers=[
    ...displaySalePeriodsForProduct(product).map(x=>({
      kind:'sale',start:x.start,end:x.end
    })),
    ...plannedSalesForProduct(product.id).filter(x=>x.id!==ignorePlannedId).map(x=>({
      kind:'planned',start:x.start,end:x.end
    }))
  ].sort((a,b)=>a.start.localeCompare(b.start));

  for(const other of peers){
    if(saleDatesOverlap(start,end,other.start,other.end)){
      return {ok:false,message:'This sale would overlap another sale.'};
    }
  }

  const prev=peers.filter(x=>x.end<start).sort((a,b)=>b.end.localeCompare(a.end))[0];
  if(prev){
    const required=prev.kind==='planned'
      ? salesPlanningRequiredGapDays()
      : historicalCooldownRequirement(prev.end,start);
    if(required && saleFullGapDays(prev.end,start)<required){
      return {ok:false,message:`At least ${required} full sale-free days are required after the previous ${prev.kind==='planned'?'planned ':''}sale.`};
    }
  }

  const next=peers.filter(x=>x.start>end).sort((a,b)=>a.start.localeCompare(b.start))[0];
  if(next){
    const required=next.kind==='planned'
      ? salesPlanningRequiredGapDays()
      : historicalCooldownRequirement(end,next.start);
    if(required && saleFullGapDays(end,next.start)<required){
      return {ok:false,message:`At least ${required} full sale-free days are required before the next ${next.kind==='planned'?'planned ':''}sale.`};
    }
  }

  return {ok:true};
}

function validateNewTimelineSalePlacement(product,start,end){
  return start<=todayStr()
    ? validateNewConfirmedSalePlacement(product,start,end)
    : validatePlannedSalePlacement(product,start,end);
}

function deleteConfirmedSale(p,period){
  if(!p || !period || !period.confirmed) return false;

  const originalStart=period.originalStart||period.start;
  const originalEnd=period.originalEnd||period.end;

  STATE.confirmedSalePeriods=(STATE.confirmedSalePeriods||[]).filter(x=>{
    if(!x || x.productId!==p.id) return true;
    if(period.confirmationId && x.id===period.confirmationId) return false;
    return !(x.originalStart===originalStart && x.originalEnd===originalEnd);
  });

  const tombstones=STATE.deletedSalePeriods||(STATE.deletedSalePeriods=[]);
  tombstones.push({

    end:period.end,

  });

  SALE_PERIOD_CACHE.clear();
  MONTHLY_PROFILE_CACHE.clear();
  MONTHLY_NORMALIZED_CACHE.clear();
  persist();
  return true;
}

function confirmedSaleOverrideForDetectedPeriod(p,period){
  const overrides=(STATE.confirmedSalePeriods||[])
    .filter(x=>x && x.productId===p.id);

  // Primary identity is the original estimated range the user confirmed.
  let match=overrides.find(x=>
    x.originalStart===period.start && x.originalEnd===period.end
  );
  if(match) return match;

  // Fallback for old confirmations if the estimator shifts by a day later:
  // use an override whose original range substantially overlaps this estimate.
  match=overrides.find(x=>{
    const overlapStart=x.originalStart>period.start?x.originalStart:period.start;
    const overlapEnd=x.originalEnd<period.end?x.originalEnd:period.end;
    return overlapStart<=overlapEnd && Math.abs(dayDiff(x.originalStart,period.start))<=2;
  });
  return match||null;
}

function displaySalePeriodsForProduct(p){
  const detected=detectedSalePeriodsForProduct(p)
    .filter(period=>!deletedSaleMatchesDetectedPeriod(p,period));

  const mapped=detected.map(period=>{
    const override=confirmedSaleOverrideForDetectedPeriod(p,period);
    if(override){
      return {
        ...period,
        start:override.start,
        end:override.end,
        state:'confirmed',
        confirmed:true,
        confirmationId:override.id,
        discountPercent:Number(override.discountPercent)||Number(period.discountPercent)||0,
        estimatedDiscountPercent:Number(period.discountPercent)||0,
        originalStart:override.originalStart,
        originalEnd:override.originalEnd,
        manualAdded:!!override.manualAdded,
        fabEventId:override.fabEventId||null,
        eventLinked:!!override.eventLinked,
        displayCorrected:true
      };
    }

    const visualStart=period.start;
    const maxVisualEnd=datePlusDays(visualStart,14);
    const visualEnd=period.end<maxVisualEnd?period.end:maxVisualEnd;

    return {
      ...period,
      start:visualStart,
      end:visualEnd,
      originalStart:period.start,
      originalEnd:period.end,
      state:'estimated',
      confirmed:false,
      estimatedDiscountPercent:Number(period.discountPercent)||0,
      displayCorrected:true
    };
  });

  const mappedIds=new Set(mapped.filter(x=>x.confirmationId).map(x=>x.confirmationId));
  (STATE.confirmedSalePeriods||[])
    .filter(x=>x && x.productId===p.id && !mappedIds.has(x.id))
    .filter(x=>!(STATE.deletedSalePeriods||[]).some(d=>
      d && d.productId===p.id && d.confirmationId && d.confirmationId===x.id
    ))
    .forEach(x=>{
      mapped.push({
        start:x.start,
        end:x.end,
        originalStart:x.originalStart,
        originalEnd:x.originalEnd,
        state:'confirmed',
        confirmed:true,
        confirmationId:x.id,
        displayCorrected:true,
        discountPercent:Number(x.discountPercent)||0,
        estimatedDiscountPercent:Number(x.discountPercent)||0,
        manualAdded:!!x.manualAdded,
        fabEventId:x.fabEventId||null,
        eventLinked:!!x.eventLinked
      });
    });

  return mapped.sort((a,b)=>a.start.localeCompare(b.start));
}

function saveAndConfirmSalePeriod(p,period,start,end,discountPercent){

  const originalStart=period.originalStart||period.start;

  let record=null;
  if(period.confirmationId) record=list.find(x=>x.id===period.confirmationId);
  if(!record){
    record=list.find(x=>x.productId===p.id && x.originalStart===originalStart && x.originalEnd===originalEnd);
  }

  const n=Number(discountPercent);
  const visualDiscount=Number.isFinite(n)?Math.max(10,Math.min(100,Math.round(n))):saleVisualDiscount(period);
  const payload={
    id:record?record.id:uid('sale-confirm'), productId:p.id,
    originalStart, originalEnd, start, end,
    discountPercent:visualDiscount, confirmedAt:new Date().toISOString()
  };
  if(record) Object.assign(record,payload); else list.push(payload);
  STATE.deletedSalePeriods=(STATE.deletedSalePeriods||[]).filter(x=>
    !(x && x.productId===p.id &&
      (x.confirmationId===payload.id ||
       (x.originalStart===originalStart && x.originalEnd===originalEnd)))
  );
  SALE_PERIOD_CACHE.clear(); MONTHLY_PROFILE_CACHE.clear(); MONTHLY_NORMALIZED_CACHE.clear();
  persist();

}

function saveAndConfirmMultipleSalePeriods(entries,start,end,discountPercent){
  if(!Array.isArray(entries) || !entries.length || !start || !end || start>end) return false;

  const n=Number(discountPercent);
  const forcedDiscount=discountPercent===null || discountPercent===undefined || discountPercent===''
    ? null
    : (Number.isFinite(n)?Math.max(10,Math.min(100,Math.round(n))):null);

  let changed=false;

  entries.forEach(entry=>{
    if(!entry || !entry.product || !entry.period) return;

    const p=entry.product;
    const period=entry.period;
    const originalStart=period.originalStart||period.start;
    const originalEnd=period.originalEnd||period.end;
    const list=STATE.confirmedSalePeriods||(STATE.confirmedSalePeriods=[]);

    let record=period.confirmationId?list.find(x=>x.id===period.confirmationId):null;
    if(!record) record=list.find(x=>x.productId===p.id && x.originalStart===originalStart && x.originalEnd===originalEnd);

    const existingStored=record ? normalizeSaleDiscountValue(record.discountPercent) : null;
    const inferred=detectedDiscountForRange(p,period.start,period.end);
    const preserved=existingStored!==null ? existingStored :
      (normalizeSaleDiscountValue(period.discountPercent)!==null && Number(period.discountPercent)>0
        ? normalizeSaleDiscountValue(period.discountPercent)
        : inferred);

    const payload={
      id:record?record.id:uid('sale-confirm'),
      productId:p.id,
      originalStart,
      originalEnd,
      start,
      end,
      discountPercent:forcedDiscount===null ? (preserved??0) : forcedDiscount,
      confirmedAt:new Date().toISOString()
    };

    if(record) Object.assign(record,payload);
    else list.push(payload);
    changed=true;
  });

  if(changed){
    SALE_PERIOD_CACHE.clear();
    MONTHLY_PROFILE_CACHE.clear();
    MONTHLY_NORMALIZED_CACHE.clear();
    persist();
  }
  return changed;
}

function resetMultipleConfirmedSalesToEstimated(entries){

function saleInfoForDate(p,date){
  if(deletedSaleShadowsDate(p,date)) return null;
  const periods=displaySalePeriodsForProduct(p);

  // Confirmed periods are authoritative for their original estimated sale.
  const confirmedOriginals=periods.filter(x=>x.confirmed);

  // If this date belongs to the original estimated range of a confirmed sale,
  // do not resurrect the old estimate from direct CSV evidence.
  const shadowedByConfirmedOriginal=confirmedOriginals.some(period=>{
    const originalStart=period.originalStart||period.start;
    const originalEnd=period.originalEnd||period.end;
    return date>=originalStart && date<=originalEnd;
  });

  const period=periods.find(s=>date>=s.start && date<=s.end);
  if(period){
    const edge=date===period.start || date===period.end;
    return {...period,edge};
  }

  if(shadowedByConfirmedOriginal) return null;

  // Only use direct one-day evidence when it is not already outside a corrected
  // detected period. This keeps Revenue Log and Sales page on the same timeline.
  const direct=directlyObservedSaleInfoForDate(p,date);
  if(!direct) return null;

  const correctedPeriods=periods;
  const immediatelyAfterCorrected=correctedPeriods.some(period=>
    date===datePlusDays(period.end,1) &&
    period.displayCorrected===true
  );
  if(immediatelyAfterCorrected) return null;

  // Also suppress direct evidence that falls inside the original estimate of
  // a confirmed override, even if that original range later shifts.
  const insideAnyConfirmedOriginal=confirmedOriginals.some(period=>{
    const originalStart=period.originalStart||period.start;
    const originalEnd=period.originalEnd||period.end;
    return date>=originalStart && date<=originalEnd;
  });
  if(insideAnyConfirmedOriginal) return null;

  return direct;
}

function netRevenueForProductsInMonth(products,ym){
  const [y,m]=ym.split('-').map(Number);
  const start=`${ym}-01`;
  const lastDay=new Date(y,m,0).getDate();
  const end=`${ym}-${String(lastDay).padStart(2,'0')}`;
  return products.reduce((sum,p)=>sum+chartNetForProductRange(p,start,end),0);
}


function shiftYearMonth(ym,deltaMonths){
  const [y,m]=String(ym).split('-').map(Number);
  const d=new Date(y,m-1+deltaMonths,1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function revenueLogEarliestVisibleMonth(){
  const current=monthKey(todayStr());
  return shiftYearMonth(current,-Math.max(0,REVENUE_LOG_MONTHS_VISIBLE-1));
}

  const overlay=document.getElementById('revenueLogLoadingOverlay');
  const panel=document.getElementById('revenueLogPanel');
  if(!overlay || !panel || !overlay.classList.contains('visible')) return;

  const rect=panel.getBoundingClientRect();
  const stickyTop=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sticky-filter-top'))||0;
  const filter=document.querySelector('.sticky-filter-bar');
  const filterBottom=filter ? filter.getBoundingClientRect().bottom : stickyTop;

  const top=Math.max(0,filterBottom,rect.top);
  const bottom=Math.min(window.innerHeight,rect.bottom);
  const left=Math.max(0,rect.left);
  const right=Math.min(window.innerWidth,rect.right);
  const width=Math.max(0,right-left);
  const height=Math.max(0,bottom-top);

  overlay.style.left=Math.round(left)+'px';
  overlay.style.top=Math.round(top)+'px';
  overlay.style.width=Math.round(width)+'px';
  overlay.style.height=Math.round(height)+'px';
  overlay.style.visibility=(width>0 && height>0)?'visible':'hidden';
}

function createFullBackupPayload(){
  // STATE contains the complete persistent dashboard model, including:
  // products/revenue/sales/settings, Motivation Mode setting, Toggl-synced
  // daily hours + sync metadata, XP/levels, current challenge, challenge
  // history, impact tasks and the anti-double-award XP bookkeeping.
  return {
    backupFormat:'fab-profit-analytics-full-backup',
    backupVersion:2,
    exportedAt:new Date().toISOString(),
    state:JSON.parse(JSON.stringify(STATE)),
    localConnection:{
      // Safe connection configuration is included for convenience.
      // The Toggl API token is deliberately NOT written into backup files.
      togglBridgeUrl:getTogglBridgeUrl()||''
    }
  };
}

function parseFullBackupPayload(parsed){
  if(!parsed || typeof parsed!=='object') throw new Error('bad shape');

  // New v2 wrapper format.
  if(parsed.backupFormat==='fab-profit-analytics-full-backup' && parsed.state){
    return {
      state:parsed.state,
      localConnection:parsed.localConnection||{}
    };
  }

  // Legacy backups exported by earlier versions were STATE directly.
  if(parsed.products && parsed.revenue && parsed.units){
    return {state:parsed,localConnection:{}};
  }

  throw new Error('bad shape');
}

async function clearAllWebsiteData(){
  const first=confirm('Delete ALL website data? This removes products, revenue, units, price history, settings, sale metadata, professional/refund markers, downloaded exchange-rate cache and all other locally stored dashboard data. The bundled historical exchange rates through July 30, 2026 remain part of the HTML. This cannot be undone. A backup is strongly recommended first.');
  if(!first) return;
  const second=confirm('Final confirmation: permanently clear all locally stored dashboard data, including downloaded exchange rates?');
  if(!second) return;

  // Remove every persisted copy first. This prevents downloaded FX history
  // (especially 2026 entries) from being merged back into the freshly reset state.
  try{
    if(window.localStorage){
      window.localStorage.removeItem(LOCAL_STORAGE_KEY);
      window.localStorage.removeItem(FX_CACHE_STORAGE_KEY);
      window.localStorage.removeItem(TOGGL_TOKEN_STORAGE_KEY);
      window.localStorage.removeItem(TOGGL_BRIDGE_URL_STORAGE_KEY);
    }
  }catch(e){
    console.error('Local reset failed',e);
  }

  // The old artifact-storage path is still supported by the app, so clear it too.
  if(storageApiExists()){
    try{
      if(typeof window.storage.delete==='function'){
        await window.storage.delete('marketplace-tracker-clean-import-v1');
      }else{
        // If delete is unavailable, overwrite with a truly clean seed.
        await window.storage.set('marketplace-tracker-clean-import-v1',JSON.stringify(SEED_DATA));
      }
    }catch(e){
      console.error('Secondary storage reset failed',e);
    }
  }

  // Rebuild from the empty seed and explicitly seed ONLY the bundled historical
  // table shipped inside this HTML. No previously downloaded entries are allowed into this state.
  STATE=JSON.parse(JSON.stringify(SEED_DATA));
  STATE.fxHistory={};
  mergeBundledFxHistory(STATE);
  STATE=normalizeState(STATE);

  ACTIVE_FILTER='all';
  TF_PRODUCT_CHART={preset:'all',start:null,end:null};
  TF_PRODUCT_CARDS={preset:'all',start:null,end:null};
  PRODUCT_PERFORMANCE_SHARED_SCALE=false;
  COLLAPSED_PRODUCT_COMPARE_CARDS.clear();
  COLLAPSED_EDIT_PRODUCT_CARDS.clear();
  KNOWN_EDIT_PRODUCT_CARDS.clear();
  TF_ACCUM_CHART={preset:'all',start:null,end:null};
  IMPORT_STATE=null;
  REVENUE_LOG_VISIBLE=REVENUE_LOG_PAGE_SIZE;
  SALE_PERIOD_CACHE=new Map();

  // Save the clean baseline. The dedicated FX cache now contains bundled dates only.
  await persist();
  showToast('All website data cleared');
  render();
  renderTabContent();
}

function escapeHtml(value){
  return String(value??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

function readCsvFileText(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=evt=>resolve(String(evt.target.result||''));
    reader.onerror=()=>reject(reader.error||new Error(`Could not read ${file.name||'CSV file'}`));
    reader.readAsText(file);
  });
}

async function handleCsvFiles(fileList){
  const files=Array.from(fileList||[]).filter(file=>file && (!file.name || file.name.toLowerCase().endsWith('.csv') || file.type==='text/csv'));
  if(!files.length) return;

  try{
    const texts=await Promise.all(files.map(readCsvFileText));

    // Each FAB report is treated as an authoritative snapshot for every
    // day/product combination it contains. If selected reports overlap, the
    // later selected file replaces the earlier file for that same combination.
    const grouped={};
    const daySet=new Set();
    let usableRowCount=0;
    const detectedPriceColumns=new Set();

    texts.forEach((text,fileIndex)=>{
      const parsed=Papa.parse(text,{header:true,skipEmptyLines:true});
      const rows=parsed.data.filter(r=>r['Day'] && r['Listing Title'] && r['Net Sales']!==undefined && r['Net Sales']!=='');
      if(!rows.length) return;

      usableRowCount+=rows.length;
      const priceColumn=detectPriceColumn(parsed.meta && parsed.meta.fields ? parsed.meta.fields : Object.keys(rows[0]||{}));
      if(priceColumn) detectedPriceColumns.add(priceColumn);

      const fileGrouped={};
      rows.forEach(r=>{
        const day=String(r['Day']||'').trim();
        const title=String(r['Listing Title']||'').trim();
        const amount=parseMoneyNumber(r['Net Sales']);
        if(!day || !title || amount===null) return;

        daySet.add(day);
        const key=day+'||'+title;
        if(!fileGrouped[key]){
          fileGrouped[key]={
            day,title,amount:0,units:0,prices:[],privatePrices:[],
            hasProfessional:false,hasRefund:false,_fileIndex:fileIndex
          };
        }

        const g=fileGrouped[key];
        g.amount+=amount;

        const parsedUnits=parseMoneyNumber(r['Net Units']);
        if(parsedUnits!==null) g.units+=parsedUnits;

        const licenseText=String(r['License']||'').trim().toLowerCase();
        const parsedPrice=priceColumn ? parseMoneyNumber(r[priceColumn]) : null;
        const isRefund=(parsedPrice!==null && parsedPrice<0) || (parsedUnits!==null && parsedUnits<0) || amount<0;

        if(isRefund) g.hasRefund=true;
        if(licenseText==='professionell') g.hasProfessional=true;

        if(priceColumn && !isRefund && parsedPrice!==null && parsedPrice>0){
          g.prices.push(parsedPrice);
          if(licenseText==='privat') g.privatePrices.push(parsedPrice);
        }
      });

      Object.values(fileGrouped).forEach(g=>{
        if(g.privatePrices.length){
          // Preserve every distinct observed private base price for the day.
          // This is essential for sale transition days where some customers
          // bought at the discounted price and others at the normal price.
          g.basePrices=[...new Set(
            g.privatePrices
              .filter(v=>Number.isFinite(Number(v)) && Number(v)>0)
              .map(v=>Math.round(Number(v)*100)/100)
          )].sort((a,b)=>a-b);
          // Keep a legacy scalar for compatibility with older import code/UI.
          // The minimum is the strongest evidence that a sale was active at
          // some point during this date.
          g.basePrice=g.basePrices.length?g.basePrices[0]:null;
        }else{
          g.basePrices=[];
          g.basePrice=null;
        }
        delete g.prices;
        delete g.privatePrices;
        delete g._fileIndex;

        // Later selected files win for overlapping day/title combinations.
        grouped[g.day+'||'+g.title]=g;
      });
    });

    if(!Object.keys(grouped).length){
      alert('No usable rows found. Expecting a FAB sales report with Day, Listing Title and Net Sales columns.');
      return;
    }

    const titleSet=Array.from(new Set(Object.values(grouped).map(g=>g.title)));
    const resolutions={};
    const firstImport=STATE.products.length===0;
    const groupedList=titleSet.map((title,i)=>{
      const safeId='g'+i;
      if(firstImport){
        resolutions[title]={action:'new'};
        return {title,mode:'new',safeId};
      }

      const m=matchProduct(title,STATE.products);
      if(m.mode==='exact'){
        resolutions[title]={action:'auto',productId:m.product.id};
        return {title,mode:'exact',safeId};
      }

      const suggestion=suggestClosestProduct(title,STATE.products);
      if(suggestion.product && suggestion.score>=0.3){
        resolutions[title]={action:'merge',mergeTargetId:suggestion.product.id,rename:true};
      }else{
        resolutions[title]={action:'new'};
      }
      return {title,mode:'review',safeId,suggestion};
    });

    IMPORT_STATE={
      groupedByDayTitle:grouped,
      groupedList,
      resolutions,
      firstImport,
      dayCount:daySet.size,
      rowCount:usableRowCount,
      fileCount:files.length,
      priceColumn:detectedPriceColumns.size===1 ? Array.from(detectedPriceColumns)[0] : (detectedPriceColumns.size>1?'multiple price columns':null)
    };
    renderTabContent();
  }catch(err){
    console.error('CSV import read failed',err);
    alert(`Could not read the selected CSV file${files.length===1?'':'s'}.`);
  }
}
