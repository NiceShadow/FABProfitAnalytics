function motivationTaskChallengeCandidates(){
  const game=motivationGameState();
  const today=motivationLocalTodayStr ? motivationLocalTodayStr() : todayStr();
  const recentTaskIds=game.challengeHistory
    .slice(-3)
    .map(ch=>ch&&ch.taskId)
    .filter(Boolean);

  const openTasks=motivationOpenTasks()
    .filter(task=>{
      const remainingXp=motivationTaskRemainingXp(task);
      const remainingHours=motivationTaskRemainingHours(task);
      return remainingXp>=30 && remainingHours>=1.25;
    });

  const candidates=[];

  openTasks.forEach(task=>{
    const remainingHours=motivationTaskRemainingHours(task);
    const estimated=Math.max(.25,Number(task.estimatedHours)||.25);

    const makeHours=(fraction,minHours,maxHours)=>{
      const raw=Math.max(minHours,remainingHours*fraction);
      const quarter=Math.round(raw*4)/4;
      return Math.max(.25,Math.min(remainingHours,maxHours,quarter));
    };

    const add=(kind,title,description,targetHours,deadlineDays)=>{
      const reward=motivationTaskMilestoneReward(task,targetHours);
      if(reward<25) return;
      candidates.push({
        kind,
        title,
        description,
        startDate:today,
        deadline:datePlusDays(today,deadlineDays),
        params:{
          targetHours,
          creditHours:targetHours,
          taskTitle:task.title
        },
        taskId:task.id,
        taskLinked:true,
        xpReward:Math.round((reward)*1.20)
      });
    };

    const shortHours=makeHours(.20,1.25,4);
    const mediumHours=makeHours(.28,2,6);
    const longHours=makeHours(.36,3,10);
    const checkpointHours=makeHours(.45,3.5,12);

    add(
      'task_focus_push',
      'Focused task push',
      `Put ${motivationFormatHours(shortHours)} of focused progress into “${task.title}”.`,
      shortHours,
      1
    );

    if(remainingHours>=2.5){
      add(
        'task_two_day_push',
        'Task momentum',
        `Invest ${motivationFormatHours(mediumHours)} into “${task.title}” over the next 2 days.`,
        mediumHours,
        1
      );
    }

    if(remainingHours>=4){
      add(
        'task_three_day_push',
        'Development checkpoint',
        `Move “${task.title}” forward by ${motivationFormatHours(longHours)} within the next 3 days.`,
        longHours,
        2
      );
    }

    if(estimated>=8 && remainingHours>=5){
      add(
        'task_major_checkpoint',
        'Major task checkpoint',
        `Reach another ${motivationFormatHours(checkpointHours)} of real progress on “${task.title}”.`,
        checkpointHours,
        4
      );
    }
  });

  // Avoid immediately returning to the same task when another open task exists.
  const fresh=candidates.filter(ch=>!recentTaskIds.includes(ch.taskId));
  return fresh.length ? fresh : candidates;
}



function motivationCreateChallenge(){
  const game=motivationGameState();
  const recentKinds=game.challengeHistory.slice(-2).map(x=>x.kind).filter(Boolean);

  const genericTemplates=motivationChallengeTemplates();
  let genericCandidates=genericTemplates
    .map(factory=>factory())
    .filter(ch=>!recentKinds.includes(ch.kind));
  if(!genericCandidates.length) genericCandidates=genericTemplates.map(factory=>factory());

  let taskCandidates=motivationTaskChallengeCandidates()
    .filter(ch=>!recentKinds.includes(ch.kind));
  if(!taskCandidates.length) taskCandidates=motivationTaskChallengeCandidates();

  const useTask=taskCandidates.length>0 && Math.random()<.38;
  const pool=useTask ? taskCandidates : genericCandidates;
  const challenge=pool[motivationRandomInt(0,pool.length-1)];

  let xpReward=challenge.taskLinked
    ? Math.max(0,Math.round(Number(challenge.xpReward)||0))
    : Math.max(50,Math.round(challenge.xpReward/5)*5);
  let gemReward=0;

  // Main challenges remain the primary challenge track, but some generic
  // challenges now award Gems instead of XP. Task-linked challenges stay XP
  // because their reward is part of the task's fixed XP budget.
  if(!challenge.taskLinked && Math.random()<.28){
    gemReward=Math.max(18,Math.min(60,Math.round(xpReward/6)));
    xpReward=0;
  }

  return {
    id:uid('challenge'),
    ...challenge,
    xpReward,
    gemReward,
    createdAt:new Date().toISOString()
  };
}

function motivationEnsureActiveChallenge(){
  const game=motivationGameState();
  let changed=false;
  const today=motivationLocalTodayStr ? motivationLocalTodayStr() : todayStr();

  if(game.activeChallenge && game.activeChallenge.taskId){
    const linkedTask=motivationChallengeTask(game.activeChallenge);
    if(!linkedTask || linkedTask.status==='completed'){
      motivationArchiveTaskChallenge(
        game.activeChallenge,
        linkedTask ? 'task_completed' : 'task_removed'
      );
      game.activeChallenge=null;
      changed=true;
    }
  }

  if(game.activeChallenge && game.activeChallenge.deadline && today>game.activeChallenge.deadline){
    game.challengeHistory.push({
      ...game.activeChallenge,
      status:'expired',
      finishedAt:new Date().toISOString()
    });
    game.activeChallenge=null;
    changed=true;
  }

  if(!game.activeChallenge){
    game.activeChallenge=motivationCreateChallenge();
    changed=true;
  }

  if(changed) persist();
  return game.activeChallenge;
}


function motivationHoursInRange(start,end){
  let total=0;
  let cursor=start;
  while(cursor<=end){
    total+=motivationWorkHours(cursor);
    cursor=datePlusDays(cursor,1);
  }
  return total;
}

function motivationChallengeProgress(challenge){
  if(!challenge) return {ratio:0,label:'No challenge',detail:''};
  const p=challenge.params||{};

  if(challenge.taskId){
    const task=motivationChallengeTask(challenge);
    if(!task){
      return {
        ratio:0,
        label:'Linked task is no longer available',
        detail:'This challenge will be replaced automatically.'
      };
    }

    const target=Math.max(.25,Number(p.targetHours||p.creditHours)||.25);
    const credited=Math.max(0,Number(task.progressHours)||0);
    const estimated=Math.max(.25,Number(task.estimatedHours)||.25);

    return {
      ratio:0,
      label:`Complete when you have added ${motivationFormatHours(target)}`,
      detail:`Trust-based · ${motivationFormatHours(credited)} credited toward ~${motivationFormatHours(estimated)} estimated task time`
    };
  }


  if(challenge.kind==='today_hours'){
    const done=motivationWorkHours(challenge.startDate);
    return {
      ratio:Math.min(1,done/p.hours),
      label:`${motivationFormatHours(done)} / ${p.hours} h`,
      detail:`Today · ${motivationFormatHours(done)} logged`
    };
  }

  if(challenge.kind==='two_day_split'){
    const first=motivationWorkHours(challenge.startDate);
    const second=motivationWorkHours(datePlusDays(challenge.startDate,1));
    const target=p.hoursPerDay*2;
    const credit=Math.min(first,p.hoursPerDay)+Math.min(second,p.hoursPerDay);
    return {
      ratio:Math.min(1,credit/target),
      label:`${motivationFormatHours(first)} today · ${motivationFormatHours(second)} tomorrow`,
      detail:`Target ${p.hoursPerDay} h on each day`
    };
  }

  if(challenge.kind==='three_day_total' || challenge.kind==='week_total'){
    const done=motivationHoursInRange(challenge.startDate,challenge.deadline);
    return {
      ratio:Math.min(1,done/p.totalHours),
      label:`${motivationFormatHours(done)} / ${p.totalHours} h`,
      detail:`${motivationDateRangeLabel(challenge.startDate,challenge.deadline)}`
    };
  }

  if(challenge.kind==='consistency_five'){
    let count=0;
    let cursor=challenge.startDate;
    while(cursor<=challenge.deadline){
      if(motivationWorkHours(cursor)>=p.minHours) count++;
      cursor=datePlusDays(cursor,1);
    }
    return {
      ratio:Math.min(1,count/p.activeDays),
      label:`${count} / ${p.activeDays} qualifying days`,
      detail:`At least ${p.minHours} h on a qualifying day`
    };
  }

  if(challenge.kind==='streak_minimum'){
    let best=0,current=0;
    let cursor=challenge.startDate;
    while(cursor<=challenge.deadline){
      if(motivationWorkHours(cursor)>=p.minHours){
        current++;
        best=Math.max(best,current);
      }else current=0;
      cursor=datePlusDays(cursor,1);
    }
    return {
      ratio:Math.min(1,best/p.days),
      label:`Best: ${best} / ${p.days} days`,
      detail:`At least ${p.minHours} h per streak day`
    };
  }

  return {ratio:0,label:'In progress',detail:''};
}

function motivationChallengeDeadlineText(challenge){
  const left=dayDiff(todayStr(),challenge.deadline);
  if(left<0) return 'Expired';
  if(left===0) return `Expires today · ${motivationShortDate(challenge.deadline)}`;
  if(left===1) return `1 day left · ${motivationShortDate(challenge.deadline)}`;
  return `${left} days left · ${motivationShortDate(challenge.deadline)}`;
}


async function motivationAutoCompleteTrackedChallenge(){
  const game=motivationGameState();
  const challenge=game.activeChallenge;
  if(!challenge || !motivationChallengeIsAutoTracked(challenge)){
    return {completed:false,event:null};
  }

  const progress=motivationChallengeProgress(challenge);
  if(progress.ratio<1){
    return {completed:false,event:null};
  }

  const awardedXp=Math.max(0,Math.round(Number(challenge.xpReward)||0));
  const awardedGems=Math.max(0,Math.round(Number(challenge.gemReward)||0));
  const event=awardedGems>0
    ? motivationGrantGems(awardedGems,`Challenge completed · ${challenge.title}`)
    : (awardedXp>0 ? motivationGrantXp(awardedXp,`Challenge completed · ${challenge.title}`) : null);

  game.challengeHistory.push({
    ...challenge,
    status:'completed',
    finishedAt:new Date().toISOString(),
    claimedXp:awardedXp,
    claimedGems:awardedGems,
    completionMode:'automatic_toggl'
  });

  game.activeChallenge=null;
  motivationEnsureActiveChallenge();
  await persist();

  return {completed:true,event};
}

async function motivationCompleteChallenge(){
  const game=motivationGameState();
  const challenge=game.activeChallenge;
  if(!challenge) return;

  if(!motivationChallengeCanManualClaim(challenge)){
    showToast('This challenge completes automatically from Toggl progress');
    return;
  }

  let awardedXp=Math.max(0,Math.round(Number(challenge.xpReward)||0));
  let awardedGems=Math.max(0,Math.round(Number(challenge.gemReward)||0));
  let event=null;

  if(challenge.taskId){
    const task=motivationChallengeTask(challenge);

    if(!task || task.status==='completed'){
      motivationArchiveTaskChallenge(
        challenge,
        task ? 'task_completed' : 'task_removed'
      );
      game.activeChallenge=null;
      motivationEnsureActiveChallenge();
      await persist();
      refreshMotivationGamePanel();
      showToast('That task is already closed · new challenge generated');
      return;
    }

    awardedGems=0;
    awardedXp=Math.min(awardedXp,motivationTaskRemainingXp(task));
    task.xpClaimedFromChallenges=motivationTaskClaimedXp(task)+awardedXp;

    const creditHours=Math.max(
      0,
      Number(challenge.params&&(
        challenge.params.creditHours??challenge.params.targetHours
      ))||0
    );
    if(creditHours>0){
      task.progressHours=Math.min(
        Math.max(0,Number(task.estimatedHours)||0),
        Math.max(0,Number(task.progressHours)||0)+creditHours
      );
    }
  }

  if(awardedGems>0){
    event=motivationGrantGems(awardedGems,`Challenge completed · ${challenge.title}`);
  }else if(awardedXp>0){
    event=motivationGrantXp(
      awardedXp,
      challenge.taskId
        ? `Task milestone · ${challenge.params&&challenge.params.taskTitle ? challenge.params.taskTitle : challenge.title}`
        : `Challenge completed · ${challenge.title}`
    );
  }

  game.challengeHistory.push({
    ...challenge,
    status:'completed',
    finishedAt:new Date().toISOString(),
    claimedXp:awardedXp,
    claimedGems:awardedGems
  });
  game.activeChallenge=null;
  motivationEnsureActiveChallenge();
  await persist();

  refreshMotivationGamePanel();
  refreshMotivationAlbumProgress();
  mountMotivationFloatingControl();

  if(event) showMotivationRewardBurst(event);
  else showToast('Challenge completed');
}

/* ---------- Impact task system ---------- */
function motivationTaskXpReward(importance,impact,estimatedHours){
  const i=Math.max(0,Math.min(10,Number(importance)||0));
  const imp=Math.max(0,Math.min(10,Number(impact)||0));
  const hours=Math.max(0,Math.min(40,Number(estimatedHours)||0));
  const raw=40+i*7+imp*9+hours*6;
  return Math.max(50,Math.round(raw/5)*5);
}

function motivationTaskClaimedXp(task){
  return Math.max(
    0,
    Math.min(
      Math.max(0,Math.round(Number(task&&task.xpReward)||0)),
      Math.round(Number(task&&task.xpClaimedFromChallenges)||0)
    )
  );
}

function motivationTaskRemainingXp(task){
  return Math.max(
    0,
    Math.round(Number(task&&task.xpReward)||0)-motivationTaskClaimedXp(task)
  );
}

function motivationTaskRemainingHours(task){
  return Math.max(
    0,
    (Number(task&&task.estimatedHours)||0)-(Number(task&&task.progressHours)||0)
  );
}

function motivationTaskMilestoneReward(task,creditHours){
  const totalXp=Math.max(0,Math.round(Number(task&&task.xpReward)||0));
  const remainingXp=motivationTaskRemainingXp(task);
  const estimated=Math.max(.25,Number(task&&task.estimatedHours)||.25);
  const hours=Math.max(.25,Number(creditHours)||.25);

  // Task-linked challenges only redistribute the task's existing XP budget.
  // One milestone can consume at most half of the original budget.
  const proportional=totalXp*(hours/estimated);
  const capped=Math.min(totalXp*.5,proportional,remainingXp);
  const rounded=Math.max(0,Math.round(capped/5)*5);
  return Math.min(remainingXp,rounded);
}

function motivationChallengeTask(challenge){
  if(!challenge || !challenge.taskId) return null;
  return motivationGameState().tasks.find(t=>t.id===challenge.taskId)||null;
}

function motivationChallengeIsAutoTracked(challenge){
  if(!challenge) return false;
  if(challenge.taskId) return false;

  return [
    'today_hours',
    'two_day_split',
    'three_day_total',
    'consistency_five',
    'week_total',
    'streak_minimum'
  ].includes(challenge.kind);
}

function motivationChallengeCanManualClaim(challenge){
  return !!challenge && !motivationChallengeIsAutoTracked(challenge);
}


function motivationArchiveTaskChallenge(challenge,status='task_closed'){
  const game=motivationGameState();
  if(!challenge) return;
  game.challengeHistory.push({
    ...challenge,
    status,
    finishedAt:new Date().toISOString(),
    claimedXp:0
  });
}


function motivationOpenTasks(){
  return motivationGameState().tasks.filter(t=>t.status!=='completed');
}

function motivationTaskPromptDue(){
  const game=motivationGameState();
  if(!game.lastTaskPromptAt) return true;
  if(game.lastTaskPromptAt===todayStr()) return false;
  return dayDiff(game.lastTaskPromptAt,todayStr())>=4;
}

    preview.innerHTML=`This task has a total budget of <strong>${reward} XP</strong>. Task-linked challenges may pay part of it earlier; finishing the task awards whatever remains.`;
  };
  const sanitizeWholeNumber=(input,max)=>{
    input.value=String(input.value||'').replace(/[^\d]/g,'').slice(0,3);
    if(input.value!=='' && Number(input.value)>max) input.value=String(max);
  };
  const sanitizeDecimal=(input,max)=>{
    let value=String(input.value||'').replace(',','.');
    value=value.replace(/[^\d.]/g,'');
    const firstDot=value.indexOf('.');
    if(firstDot>=0){
      value=value.slice(0,firstDot+1)+value.slice(firstDot+1).replace(/\./g,'');
      const [whole,dec='']=value.split('.');
      value=whole+'.'+dec.slice(0,2);
    }
    if(value!=='' && value!=='.' && Number(value)>max) value=String(max);
    input.value=value;
  };

  importance.addEventListener('input',()=>{
    sanitizeWholeNumber(importance,10);
    refreshPreview();
  });
  impact.addEventListener('input',()=>{
    sanitizeWholeNumber(impact,10);
    refreshPreview();
  });
  hours.addEventListener('input',()=>{
    sanitizeDecimal(hours,200);
    refreshPreview();
  });
  refreshPreview();

  modal.querySelector('.sales-global-modal-close').addEventListener('click',close);
  modal.querySelector('#motivationTaskCancel').addEventListener('click',close);
  modal.querySelector('#motivationTaskSave').addEventListener('click',async()=>{

      importance:i,
      impact:imp,
      estimatedHours:Math.round(est*100)/100,
      progressHours:0,
      xpReward:Math.round((motivationTaskXpReward(i)*1.20),imp,est),
      xpClaimedFromChallenges:0,
      status:'open',
      createdAt:new Date().toISOString()
    });
    await persist();
    close();
    refreshMotivationGamePanel();
  });
  requestAnimationFrame(()=>title.focus());
}

async function motivationCompleteTask(taskId){
  const game=motivationGameState();
  const task=game.tasks.find(t=>t.id===taskId && t.status!=='completed');
  if(!task) return;

  const remainingXp=motivationTaskRemainingXp(task);
  task.status='completed';
  task.completedAt=new Date().toISOString();

  const event=remainingXp>0
    ? motivationGrantXp(remainingXp,`Task finished · ${task.title}`)
    : null;

  // If the current challenge depends on this task it is no longer possible,
  // so archive it and generate a replacement immediately.
  if(game.activeChallenge && game.activeChallenge.taskId===task.id){
    motivationArchiveTaskChallenge(game.activeChallenge,'task_completed');
    game.activeChallenge=null;
  }
  motivationEnsureActiveChallenge();

  await persist();
  refreshMotivationGamePanel();
  mountMotivationFloatingControl();

  refreshMotivationAlbumProgress();
  if(event) showMotivationXpBurst(event);
  else showToast('Task completed · its XP budget was already earned through milestones');
}


async function motivationRemoveTask(taskId){
  const game=motivationGameState();

  if(game.activeChallenge && game.activeChallenge.taskId===taskId){
    motivationArchiveTaskChallenge(game.activeChallenge,'task_removed');
    game.activeChallenge=null;
  }

  game.tasks=game.tasks.filter(t=>t.id!==taskId);
  motivationEnsureActiveChallenge();
  await persist();
  refreshMotivationGamePanel();
}

function motivationWorkTimelineHTML(){
  if(!motivationModeEnabled() || ACTIVE_TAB!=='dashboard') return '';

  const dates=motivationWorkDates(60);
  const today=todayStr();
  const trackingStart=motivationWorkTrackingStart();
  const current30=motivationWorkWindowStats(datePlusDays(today,-29),today);
  const previous30=motivationWorkWindowStats(datePlusDays(today,-59),datePlusDays(today,-30));
  const currentStreak=motivationWorkCurrentStreak();
  const bestStreak=motivationWorkBestStreakInfo(60);
  const thisWeek=motivationWeekStats(0);
  const lastWeek=motivationWeekStats(-1);
  const twoWeeksAgo=motivationWeekStats(-2);

  const rawMax=Math.max(0,...dates.map(date=>motivationWorkHours(date)));
  const scaleMax=Math.max(8,Math.ceil(rawMax/2)*2);
  const baselineY=88;
  const positivePixels=76;
  const ticks=[];
  for(let value=2;value<=scaleMax;value+=2){
    ticks.push({
      value,
      top:baselineY-(value/scaleMax)*positivePixels
    });
  }

  const bars=dates.map((date,index)=>{
    const hours=motivationWorkHours(date);
    const isToday=date===today;
    const tracked=!!trackingStart && date>=trackingStart;
    const missed=!isToday && tracked && hours<=0;
    const positiveHeight=hours>0?Math.max(7,Math.min(positivePixels,(hours/scaleMax)*positivePixels)):0;
    const d=new Date(date+'T12:00:00');
    const showLabel=index===0 || index===dates.length-1 || d.getDate()===1 || d.getDay()===1;
    const label=d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    const fullLabel=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    const source=motivationWorkSource(date);
    const sourceText=source==='toggl'?'Synced from Toggl':(source==='manual'?'Manual override':'');
    const tooltipBody=hours>0
      ? `${motivationFormatHours(hours)} worked${sourceText?` · ${sourceText}`:''}`
      : (isToday?'No work logged yet':(missed?'0 h worked':'Not tracked yet'));

    return `
      <div class="motivation-work-day ${hours>0?'worked':''} ${missed?'missed':''} ${isToday?'today':''} ${!tracked&&!isToday?'untracked':''}"
        data-motivation-tooltip-title="${escapeAttr(fullLabel)}"
        data-motivation-tooltip-body="${escapeAttr(tooltipBody)}">
        <span class="motivation-work-bar-zone">
          ${hours>0?`<span class="motivation-work-positive" style="height:${positiveHeight.toFixed(1)}px"></span>`:''}
          ${missed?`<span class="motivation-work-negative"></span>`:''}
          ${isToday && hours<=0?`<span class="motivation-work-today-dot"></span>`:''}
        </span>
        <span class="motivation-work-day-label ${showLabel?'show':''}">${showLabel?escapeHtml(label):''}</span>
      </div>
    `;
  }).join('');

  const bestTooltip=bestStreak.days
    ? `${motivationDateRangeLabel(bestStreak.start,bestStreak.end)} · ${bestStreak.days} consecutive worked days`
    : 'No worked-day streak in the current 60-day window yet.';

  return `
    <section class="motivation-work-panel" id="motivationWorkTimelinePanel">
      <div class="motivation-work-head">
        <div>
          <span class="motivation-eyebrow">Work momentum</span>
          <h3>60-day developer consistency</h3>
          <p>Worked days rise above the line. Tracked days with no work logged dip below it. Work data comes directly from Toggl Track.</p>
        </div>
        <div class="motivation-work-actions">
          <button type="button" class="btn secondary motivation-toggl-connect-btn" id="motivationTogglConnectBtn">${motivationTogglConnected()?'Toggl settings':'Connect Toggl'}</button>
        </div>
      </div>

      ${motivationTogglStatusHTML()}

      <div class="motivation-work-stats">
        <div class="motivation-work-stat">
          <span>Current streak</span>
          <strong>${currentStreak} day${currentStreak===1?'':'s'}</strong>
          <small>${currentStreak?'Keep the chain alive':'One focused day starts the next streak'}</small>
        </div>
        <div class="motivation-work-stat">
          <span>Last 30 days</span>
          <strong>${motivationFormatHours(current30.hours)}</strong>
          <small>${escapeHtml(motivationWorkComparisonText(current30,previous30))}</small>
        </div>
        <div class="motivation-work-stat">
          <span>Active days</span>
          <strong>${current30.activeDays} / 30</strong>
          <small>${current30.activeDays?`${Math.round(current30.activeDays/30*100)}% consistency`:'Start with one logged day'}</small>
        </div>
        <div class="motivation-work-stat motivation-work-stat-hover"
          data-motivation-tooltip-title="Best 60-day streak"
          data-motivation-tooltip-body="${escapeAttr(bestTooltip)}">
          <span>Best 60-day streak</span>
          <strong>${bestStreak.days} day${bestStreak.days===1?'':'s'}</strong>
          <small>${current30.activeDays?`${motivationFormatHours(current30.averageActive)} avg per active day`:'Your baseline begins when you log work'}</small>
        </div>
      </div>

      <div class="motivation-week-stats">
        <div class="motivation-week-stat">
          <span>2 weeks ago · Mon–Sun</span>
          <strong>${motivationFormatHours(twoWeeksAgo.hours)}</strong>
          <small>${escapeHtml(twoWeeksAgo.label)}</small>
        </div>
        <div class="motivation-week-stat">
          <span>Last week · Mon–Sun</span>
          <strong>${motivationFormatHours(lastWeek.hours)}</strong>
          <small>${escapeHtml(lastWeek.label)}</small>
        </div>
        <div class="motivation-week-stat">
          <span>This week · Mon–Sun</span>
          <strong>${motivationFormatHours(thisWeek.hours)}</strong>
          <small>${escapeHtml(thisWeek.label)} · through ${escapeHtml(motivationShortDate(motivationLocalTodayStr()))}</small>
        </div>
      </div>

      <div class="motivation-work-chart-wrap">
        <div class="motivation-work-chart" style="--work-columns:${dates.length}">
          ${ticks.map(t=>`
            <div class="motivation-work-grid-line" style="top:${t.top.toFixed(1)}px">
              <span>${t.value}h</span>
            </div>
          `).join('')}
          <div class="motivation-work-baseline"><span>0h</span></div>
          ${bars}
        </div>
      </div>

      <div class="motivation-work-legend">
        <span><i class="worked"></i>Worked</span>
        <span><i class="missed"></i>No work logged after tracking began</span>
        <span><i class="neutral"></i>Not tracked yet / today</span>
      </div>
    </section>
  `;
}




async function motivationRunDashboardTogglSync(triggerBtn=null){
  const original=triggerBtn?.textContent||'Sync Now';
  if(triggerBtn){
    triggerBtn.disabled=true;
    triggerBtn.textContent='Syncing…';
  }

  try{
    const result=await motivationSyncToggl60Days();
    const challengeResult=await motivationAutoCompleteTrackedChallenge();
    const gemChallengeResult=await motivationAutoCompleteGemChallenge();

    refreshMotivationWorkTimeline();
    refreshMotivationGamePanel();
    refreshMotivationAlbumProgress();
    mountMotivationFloatingControl();

    if(challengeResult.completed && challengeResult.event){
      showMotivationRewardBurst(challengeResult.event);
    }else if(result.xpEvent){
      showMotivationXpBurst(result.xpEvent);
    }

    if(gemChallengeResult.completed && gemChallengeResult.event){
      setTimeout(()=>showMotivationGemBurst(gemChallengeResult.event),challengeResult.event||result.xpEvent?750:0);
    }

    if(result.newWorkHours>0){
      showToast(`${motivationFormatHours(result.newWorkHours)} synced${challengeResult.completed||gemChallengeResult.completed?' · challenge progress updated':''}`);
    }else if(!challengeResult.completed&&!gemChallengeResult.completed){
      showToast('Toggl synced · no new work time');
    }
  }catch(error){
    const message=error && error.message ? error.message : 'Toggl sync failed';

    await persist();

    if(triggerBtn && triggerBtn.isConnected){
      triggerBtn.disabled=false;
      triggerBtn.textContent=original;
    }
  }
}

/* ================= SALES TIMELINE ================= */
function addYearsToDateString(dateStr,years){
  const d=new Date(dateStr+'T12:00:00');
  d.setFullYear(d.getFullYear()+years);
  return localDateString(d);
}
function salesTimelineOldestDate(){
  const productDates=(STATE.products||[]).map(p=>p.releaseDate).filter(Boolean).sort();
  const revenueDates=(STATE.revenue||[]).map(r=>r.date).filter(Boolean).sort();
  const candidates=[];
  if(productDates.length) candidates.push(productDates[0]);
  if(revenueDates.length) candidates.push(revenueDates[0]);
  return candidates.length?candidates.sort()[0]:todayStr();
}
function salesTimelineRecentStartDate(){
  const d=new Date(todayStr()+'T12:00:00');
  d.setMonth(d.getMonth()-2);
  return localDateString(d);
}
function salesTimelineStartDate(){
  return SALES_TIMELINE_SHOW_FULL_HISTORY
    ? salesTimelineOldestDate()
    : salesTimelineRecentStartDate();
}
function salesTimelineEndDate(){
  return addYearsToDateString(todayStr(),1);
}
function salesTimelineJumpMarkers(start,end){
  const today=todayStr();
  const markers=[];
  const firstYear=Number(start.slice(0,4));
  const lastYear=Number(end.slice(0,4));

  if(SALES_TIMELINE_SHOW_FULL_HISTORY){
    // Long historical mode: major year starts + one compact mid-year marker.
    for(let y=firstYear;y<=lastYear;y++){
      const jan=`${y}-01-01`;
      const jun=`${y}-06-01`;

      if(jan>=start && jan<=end){
        markers.push({date:jan,label:String(y),type:'major',year:y});
      }
      if(jun>=start && jun<=end){
        markers.push({date:jun,label:`Jun ${y}`,type:'minor',year:y});
      }
    }
  }else{
    // Short mode spans about 14 months. Use compact markers roughly every
    // two months, while preserving January as a major year marker.
    let cursor=new Date(start+'T12:00:00');
    cursor.setDate(1);
    cursor.setMonth(cursor.getMonth()+1);

    let step=0;
    const endTime=new Date(end+'T12:00:00').getTime();
    while(cursor.getTime()<=endTime){
      const date=localDateString(cursor);
      const y=cursor.getFullYear();
      const month=cursor.getMonth()+1;
      const monthLabels=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const label=`${monthLabels[month-1]} ${y}`;
      const isYearStart=month===1;

      if(step%2===0 || isYearStart){
        markers.push({
          date,
          label:isYearStart?String(y):label,
          type:isYearStart?'major':'minor',
          year:y
        });
      }

      cursor.setMonth(cursor.getMonth()+1);
      step++;
    }
  }

  if(today>=start && today<=end){
    markers.push({
      date:today,
      label:'Today',
      type:'major today',
      year:Number(today.slice(0,4))
    });
  }

  markers.sort((a,b)=>a.date.localeCompare(b.date));

  const deduped=[];
  markers.forEach(marker=>{
    const existing=deduped.findIndex(x=>x.date===marker.date);
    if(existing<0){
      deduped.push(marker);
    }else if(marker.type.includes('today')){
      deduped[existing]=marker;
    }
  });

  return deduped;
}
function salesTimelineDayRows(start,end){
  const rows=[];
  const today=todayStr();
  let cursor=new Date(start+'T12:00:00');
  const finalDate=new Date(end+'T12:00:00');
  let index=0;
  while(cursor<=finalDate){
    const date=localDateString(cursor);
    const d=new Date(date+'T12:00:00');
    const isToday=date===today;
    const isYearStart=date.slice(5)==='01-01';
    rows.push(`
      <div class="sales-timeline-day${isToday?' today':''}${isYearStart?' year-start':''}"
           data-sales-date="${date}" data-sales-year="${d.getFullYear()}" data-sales-index="${index}">
        <div class="sales-timeline-day-label">
          <span class="sales-timeline-weekday">${d.toLocaleDateString(undefined,{weekday:'short'})}</span>
          <strong>${d.toLocaleDateString(undefined,{month:'short'})} ${d.getDate()}</strong>
          <span class="sales-timeline-year">${d.getFullYear()}</span>
        </div>
        <div class="sales-timeline-day-cell"></div>
      </div>
    `);
    cursor.setDate(cursor.getDate()+1);
    index++;
  }
  return rows.join('');
}


function addDays(dateStr,days){
  const d=new Date(dateStr+'T12:00:00');
  d.setDate(d.getDate()+Number(days||0));
  return localDateString(d);
}

function salesSuggestionGapDays(){
  return STATE.settings.salesPlanningRequire31DayGap===false ? 30 : 31;
}

function salesSuggestionBlockingPeriods(product){
  const confirmed=displaySalePeriodsForProduct(product)
    .filter(period=>period && period.confirmed)
    .map(period=>({
      start:period.start,
      end:period.end,
      kind:period.fabEventId?'fab-event-participant':'confirmed'
    }));

  const planned=plannedSalesForProduct(product.id)
    .filter(period=>period && period.start && period.end)
    .map(period=>({
      start:period.start,
      end:period.end,
      kind:'planned'
    }));

  return [...confirmed,...planned]
    .sort((a,b)=>a.start.localeCompare(b.start));
}

function salesSuggestionFitsBlockingPeriods(product,start,end,gapDays){
  return salesSuggestionBlockingPeriods(product).every(period=>{
    if(period.end<start) return saleGapMeetsRequirement(period.end,start,gapDays);
    if(period.start>end) return saleGapMeetsRequirement(end,period.start,gapDays);
    return false;
  });
}

function salesSuggestionsForProduct(product){
  if(!product || STATE.settings.salesShowSuggestions===false) return [];

  const gap=salesSuggestionGapDays();
  const earliestReleaseEligible=productSaleEarliestEligibleDate(product);
  if(!earliestReleaseEligible) return [];

  const normalSuggestionStart=addDays(todayStr(),15);
  const minStart=earliestReleaseEligible>normalSuggestionStart ? earliestReleaseEligible : normalSuggestionStart;
  const minSuggestionDays=Math.max(1,Math.min(14,Math.round(Number(STATE.settings.salesSuggestionMinimumDays)||4)));
  const maxSuggestions=12;
  const requireKnownNextFab=STATE.settings.salesSuggestionsRequireKnownNextFabEvent!==false;
  const events=fabEventSales()
    .filter(event=>event && event.start && event.end && event.end>=minStart)
    .slice()
    .sort((a,b)=>a.start.localeCompare(b.start));

  const lastKnownFabEvent=events.length ? events[events.length-1] : null;

  // Safe mode deliberately does not plan into an entirely unknown FAB-event future.
  if(requireKnownNextFab && !lastKnownFabEvent) return [];

  const fixedBlockers=salesSuggestionBlockingPeriods(product)
    .map(x=>({...x}))
    .sort((a,b)=>a.start.localeCompare(b.start));

  const suggested=[];

  const allBlockers=()=>[
    ...fixedBlockers,
    ...suggested.map(s=>({start:s.start,end:s.end,kind:'suggested'}))
  ].sort((a,b)=>a.start.localeCompare(b.start));

  const rangeFits=(start,end)=>{
    if(!start || !end || end<start || dayDiff(start,end)>14) return false;
    if(!validateProductSaleReleaseEligibility(product,start).ok) return false;

    return allBlockers().every(period=>{
      if(period.end<start) return saleGapMeetsRequirement(period.end,start,gap);
      if(period.start>end) return saleGapMeetsRequirement(end,period.start,gap);
      return false;
    });
  };

  const eventAlreadyCovered=(event)=>{
    return allBlockers().some(period=>
      period.start<=event.start && period.end>=event.end
    );
  };

  const fabCandidates=(event)=>{
    if(!event || dayDiff(event.start,event.end)>14) return [];

    const candidates=[];

    for(let start=event.start; start>=minStart; start=addDays(start,-1)){
      if(dayDiff(start,event.end)>14) break;

      const maxEnd=addDays(start,14);
      for(let end=event.end; end<=maxEnd; end=addDays(end,1)){
        if(!rangeFits(start,end)) continue;
        const weightedDays=dayDiff(start,end);
        if(weightedDays<minSuggestionDays) continue;

        candidates.push({
          start,
          end,
          weightedDays,
          daysBefore:dayDiff(start,event.start),
          daysAfter:dayDiff(event.end,end)
        });
      }
    }

    return candidates;
  };

  const nextReachableFabAfter=(event)=>{
    const idx=events.findIndex(x=>x.id===event.id);
    if(idx<0) return null;

    for(let i=idx+1;i<events.length;i++){
      const next=events[i];
      if(eventAlreadyCovered(next)) continue;
      if(fabCandidates(next).length) return next;
    }
    return null;
  };

  const bestFabCandidate=(event)=>{
    const candidates=fabCandidates(event);
    if(!candidates.length) return null;

    const nextEvent=nextReachableFabAfter(event);

    candidates.forEach(candidate=>{
      if(!nextEvent){
        candidate.keepsNextFabEvent=true;
        return;
      }

      suggested.push({
        productId:product.id,
        start:candidate.start,
        end:candidate.end,
        _temporary:true
      });
      candidate.keepsNextFabEvent=fabCandidates(nextEvent).length>0;
      suggested.pop();
    });

    candidates.sort((a,b)=>{
      if(a.keepsNextFabEvent!==b.keepsNextFabEvent){
        return a.keepsNextFabEvent ? -1 : 1;
      }

      if(b.weightedDays!==a.weightedDays) return b.weightedDays-a.weightedDays;

      const aAfterPenalty=Math.abs(a.daysAfter-1);
      const bAfterPenalty=Math.abs(b.daysAfter-1);
      if(aAfterPenalty!==bAfterPenalty) return aAfterPenalty-bAfterPenalty;

      if(a.daysAfter!==b.daysAfter) return a.daysAfter-b.daysAfter;

      if(a.start!==b.start) return a.start.localeCompare(b.start);
      return a.end.localeCompare(b.end);
    });

    return candidates[0];
  };

  const horizonCandidates=[
    addDays(minStart,365),
    ...fixedBlockers.map(x=>addDays(x.end,gap+45)),
    ...events.map(x=>addDays(x.end,gap+45))
  ].sort();
  const horizon=horizonCandidates[horizonCandidates.length-1]||addDays(minStart,365);

  for(let iteration=0;iteration<maxSuggestions;iteration++){
    let earliest=null;

    for(let start=minStart;start<=horizon;start=addDays(start,1)){
      for(let len=14;len>=minSuggestionDays;len--){
        const end=addDays(start,len);
        if(rangeFits(start,end)){
          earliest={start,end,weightedDays:len};
          break;
        }
      }
      if(earliest) break;
    }

    if(!earliest) break;

    let targetEvent=null;
    for(const event of events){
      if(eventAlreadyCovered(event)) continue;
      if(fabCandidates(event).length){
        targetEvent=event;
        break;
      }
    }

    if(!targetEvent){
      if(requireKnownNextFab) break;

      suggested.push({
        productId:product.id,
        start:earliest.start,
        end:earliest.end,
        targetFabEventId:null,
        nextFabEventId:null,
        preservesFabEvent:false
      });
      continue;
    }

    const targetIsLastKnownFab=!!(
      requireKnownNextFab &&
      lastKnownFabEvent &&
      targetEvent.id===lastKnownFabEvent.id
    );

    let bestEarly=null;

    for(let start=earliest.start; start<targetEvent.start; start=addDays(start,1)){
      for(let len=14;len>=minSuggestionDays;len--){
        const end=addDays(start,len);
        if(end>=targetEvent.start) continue;
        if(!rangeFits(start,end)) continue;

        suggested.push({
          productId:product.id,
          start,
          end,
          _temporary:true
        });

        const targetCandidate=bestFabCandidate(targetEvent);
        suggested.pop();

        if(!targetCandidate) continue;

        const totalExposure=len+targetCandidate.weightedDays;
        const candidate={start,end,weightedDays:len,totalExposure};

        if(
          !bestEarly ||
          candidate.start<bestEarly.start ||
          (
            candidate.start===bestEarly.start &&
            candidate.totalExposure>bestEarly.totalExposure
          ) ||
          (
            candidate.start===bestEarly.start &&
            candidate.totalExposure===bestEarly.totalExposure &&
            candidate.weightedDays>bestEarly.weightedDays
          )
        ){
          bestEarly=candidate;
        }
      }

      if(bestEarly && bestEarly.start===start) break;
    }

    if(bestEarly){
      suggested.push({
        productId:product.id,
        start:bestEarly.start,
        end:bestEarly.end,
        targetFabEventId:null,
        nextFabEventId:targetEvent.id,
        preservesFabEvent:true
      });
      continue;
    }

    // In safe mode, the last known FAB event is the uncertainty boundary.
    // Still provide a conservative provisional suggestion: fully cover the
    // known event, use as much sale duration as possible, but end exactly when
    // the FAB event ends. This preserves the earliest possible cooldown window
    // for a still-unknown later FAB event.
    if(targetIsLastKnownFab){
      const safeCandidates=fabCandidates(targetEvent)
        .filter(candidate=>candidate.end===targetEvent.end)
        .sort((a,b)=>{
          if(b.weightedDays!==a.weightedDays) return b.weightedDays-a.weightedDays;
          return a.start.localeCompare(b.start);
        });

      const safeSuggestion=safeCandidates[0]||null;
      if(safeSuggestion){
        suggested.push({
          productId:product.id,
          start:safeSuggestion.start,
          end:safeSuggestion.end,
          targetFabEventId:targetEvent.id,
          nextFabEventId:null,
          preservesFabEvent:true,
          provisionalUnknownNextFab:true
        });
      }
      break;
    }

    const fabSuggestion=bestFabCandidate(targetEvent);
    if(fabSuggestion){
      const nextEvent=nextReachableFabAfter(targetEvent);
      suggested.push({
        productId:product.id,
        start:fabSuggestion.start,
        end:fabSuggestion.end,
        targetFabEventId:targetEvent.id,
        nextFabEventId:nextEvent?.id||null,
        preservesFabEvent:!!fabSuggestion.keepsNextFabEvent
      });
      continue;
    }

    suggested.push({
      productId:product.id,
      start:earliest.start,
      end:earliest.end,
      targetFabEventId:null,
      nextFabEventId:null,
      preservesFabEvent:false
    });
  }

  return suggested;
}

function salesSuggestionForProduct(product){
  return salesSuggestionsForProduct(product)[0]||null;
}

function salesSuggestions(){
  if(STATE.settings.salesShowSuggestions===false) return [];

}

function saleRequestDeadlineInfo(startDate){
  if(!startDate) return null;

  const deadline=datePlusDays(startDate,-14);
  const signedDays=dayDiff(todayStr(),deadline);
  const daysLeft=Math.max(0,signedDays);

  return {
    deadline,
    signedDays,
    daysLeft,
    sentence:signedDays>1
      ? `days left to request this sale`
      : (signedDays===1
          ? 'day left to request this sale'
          : (signedDays===0
              ? 'days left to request this sale · deadline is today'
              : `days left to request this sale · deadline passed ${Math.abs(signedDays)} day${Math.abs(signedDays)===1?'':'s'} ago`))
  };
}

function urgentUnconfirmedSales(){
  const today=todayStr();

  return (STATE.plannedSales||[])
    .map(record=>{
      if(!record || !record.start || record.start<=today) return null;
      const product=(STATE.products||[]).find(p=>p.id===record.productId);
      if(!product) return null;

      const requestInfo=saleRequestDeadlineInfo(record.start);
      if(!requestInfo || requestInfo.signedDays>=8) return null;

      return {
        record,
        product,
        requestInfo
      };
    })
    .filter(Boolean)
    .sort((a,b)=>{
      if(a.requestInfo.signedDays!==b.requestInfo.signedDays){
        return a.requestInfo.signedDays-b.requestInfo.signedDays;
      }
      return a.record.start.localeCompare(b.record.start);
    });
}

function urgentUnconfirmedSalesCount(){
  return urgentUnconfirmedSales().length;
}

function urgentSaleTimingLabel(info){
  if(!info) return '';
  if(info.signedDays>1) return `in ${info.signedDays} days`;
  if(info.signedDays===1) return 'in 1 day';
  if(info.signedDays===0) return 'today';
  const overdue=Math.abs(info.signedDays);
  return `overdue by ${overdue} day${overdue===1?'':'s'}`;
}

  };
}

function addSuggestionAsPlannedSale(product,suggestion){
  hideSalesSuggestionGlobalTooltip();
  if(!product || !suggestion) return false;

  const validation=validatePlannedSalePlacement(
    product,
    suggestion.start,
    suggestion.end,
    null
  );

  if(!validation.ok){
    showSalesTransientMessage(validation.message);
    return false;
  }

  const record=suggestionPlannedSaleRecord(product,suggestion);
  if(!record) return false;

  const restoreDate=captureSalesTimelineVisibleDate();
  captureSalesTimelineScroll();

  STATE.plannedSales=STATE.plannedSales||[];
  STATE.plannedSales.push(record);

  SALE_PERIOD_CACHE.clear();
  MONTHLY_PROFILE_CACHE.clear();
  MONTHLY_NORMALIZED_CACHE.clear();
  persist();

  SALES_TIMELINE_RESTORE_DATE=restoreDate;
  closeSalesGlobalModal();
  renderTabContent();
  return true;
}

function mountSalesTimelineSalePeriods(){
  normalizeStartedPlannedSales();
  const scroller=document.getElementById('salesTimelineScroll');
  const track=document.getElementById('salesTimelineTrack');
  const overlay=document.getElementById('salesTimelineSaleOverlay');
  const suggestionOverlay=document.getElementById('salesTimelineSuggestionOverlay');
  if(!scroller || !track || !overlay || !suggestionOverlay) return;

  overlay.innerHTML='';
  suggestionOverlay.innerHTML='';

  const rows=[...track.querySelectorAll('[data-sales-date]')];
  if(!rows.length) return;

  const rowByDate=new Map(rows.map(row=>[row.dataset.salesDate,row]));
  const startDate=rows[0].dataset.salesDate;
  const endDate=rows[rows.length-1].dataset.salesDate;
  const products=(STATE.products||[]).slice();
  const ids=products.map(p=>p.id);

  const sampleRow=rows[0];
  const daySize=Math.round(sampleRow.getBoundingClientRect().height)||42;
  const labelWidth=Math.round(
    (sampleRow.querySelector('.sales-timeline-day-label')||sampleRow).getBoundingClientRect().width
  )||116;

  const laneGeometry=salesTimelineLaneGeometry(track);
  const cellWidth=laneGeometry?laneGeometry.cellWidth:daySize+8;
  const cellInset=(cellWidth-daySize)/2;

  const appendSaleBox=(p,period,productIndex,isPlanned=false)=>{
    const visualStart=period.start;
    const visualEnd=period.end;
    if(visualEnd<startDate || visualStart>endDate) return;

    const clippedStart=visualStart<startDate?startDate:visualStart;
    const clippedEnd=visualEnd>endDate?endDate:visualEnd;
    const startRow=rowByDate.get(clippedStart);
    const endRow=rowByDate.get(clippedEnd);
    if(!startRow || !endRow) return;

    const startsInsideRange=visualStart>=startDate;
    const endsInsideRange=visualEnd<=endDate;
    const top=startRow.offsetTop+(startsInsideRange?startRow.offsetHeight*.5:0);
    const bottom=endRow.offsetTop+(endsInsideRange?endRow.offsetHeight*.5:endRow.offsetHeight);
    const height=Math.max(daySize*.5,bottom-top);
    const left=labelWidth+14+productIndex*cellWidth+cellInset;
    const color=colorFor(p.id,ids);
    const shortName=cleanShortName(p.shortName||p.name);
    const weightedDays=Math.max(.5,dayDiff(visualStart,visualEnd));
    const discount=isPlanned?(Number(period.discountPercent)||0):(period.manualAdded && !(Number(period.discountPercent)>0) ? 0 : saleVisualDiscount(period));

    const box=document.createElement('button');
    box.type='button';
    box.className=isPlanned
      ? 'sales-timeline-sale-period planned-sale planned'
      : `sales-timeline-sale-period ${period.confirmed?'confirmed':'estimated'}`;

    box.style.top=`${top}px`;
    box.style.left=`${left}px`;
    box.style.width=`${daySize}px`;
    box.style.height=`${height}px`;
    box.style.setProperty('--sale-color',color);
    box.style.setProperty('--sale-fill',rgbaFromHex(color,.13));
    box.style.setProperty('--sale-stripe',rgbaFromHex(color,isPlanned?.22:.38));

    box.dataset.productId=p.id;
    if(period.fabEventId){
      box.dataset.fabEventId=period.fabEventId;
      box.classList.add('event-linked');
    }
    box.dataset.saleStart=visualStart;
    box.dataset.saleEnd=visualEnd;
    box.dataset.originalStart=period.originalStart||period.start;
    box.dataset.originalEnd=period.originalEnd||period.end;
    box.dataset.confirmed=isPlanned?'0':(period.confirmed?'1':'0');

    if(isPlanned) box.dataset.plannedId=period.id;
    else if(period.confirmationId) box.dataset.confirmationId=period.confirmationId;

    const requestInfo=isPlanned?saleRequestDeadlineInfo(visualStart):null;

    box.innerHTML=`
      <span class="sales-sale-box-label">
        <span class="sales-sale-short-name">${shortName}</span>
        ${discount?`<span class="sales-discount-badge">${discount}%</span>`:''}
        ${period.fabEventId?`<span class="sales-event-badge">Event</span>`:''}
      </span>
      ${isPlanned?saleRequestCountdownBadgeHTML(visualStart):''}
      <span class="sales-selection-floating-label" aria-hidden="true">
        <span class="sales-sale-short-name">${shortName}</span>
        ${discount?`<span class="sales-discount-badge">${discount}%</span>`:''}
        ${period.fabEventId?`<span class="sales-event-badge">Event</span>`:''}
        <span class="sales-selection-product-dot" style="background:${color}"></span>
      </span>
      <span class="sales-sale-hover-card">
        <strong class="sales-tooltip-product-title"><span class="sales-tooltip-product-dot" style="background:${color}"></span>${shortName}</strong>
        <span>${isPlanned?'Planned sale':`${formatSaleDays(weightedDays)} sale days`}</span>
        <span class="sales-sale-state ${isPlanned?'planned':(period.confirmed?'confirmed':'estimated')}">
          ${isPlanned?'Planned':(period.confirmed?'Confirmed':'Unconfirmed · estimated')}
        </span>
        ${period.fabEventId?`<span class="sales-sale-state confirmed">Participating in FAB event</span>`:''}
        ${isPlanned && requestInfo?`<span class="sales-request-deadline-tooltip"><strong>${requestInfo.daysLeft}</strong><span>${escapeHtml(requestInfo.sentence)} · deadline ${requestInfo.deadline}</span></span>`:''}
        <span class="sales-sale-edit-hint">Click to edit</span>
      </span>
    `;

    const hoverCard=box.querySelector('.sales-sale-hover-card');
    box.addEventListener('pointermove',e=>{
      if(!hoverCard) return;
      const pad=14;
      const cardWidth=180;
      const cardHeight=Math.max(84,hoverCard.offsetHeight||84);
      let x=e.clientX+14;
      let y=e.clientY+14;

      if(x+cardWidth+pad>window.innerWidth) x=e.clientX-cardWidth-14;
      if(y+cardHeight+pad>window.innerHeight) y=e.clientY-cardHeight-14;

      hoverCard.style.left=`${Math.max(pad,x)}px`;
      hoverCard.style.top=`${Math.max(pad,y)}px`;
    });

    box.addEventListener('keydown',e=>{
      if(e.key==='Enter' && (e.shiftKey || SALES_SHIFT_WAS_DOWN || SALES_SHIFT_SELECTION.size)){
        e.preventDefault();
        e.stopPropagation();
      }
    });

    box.addEventListener('click',e=>{
      e.preventDefault();
      e.stopPropagation();
      if(e.shiftKey){
        SALES_SHIFT_WAS_DOWN=true;
        toggleSalesShiftSelection(box);
        return;
      }
      if(SALES_SHIFT_SELECTION.size) clearSalesShiftSelection();
      if(!isPlanned) openSalesGlobalModalFromBox(box);
    });

    overlay.appendChild(box);
  };

  if(STATE.settings.salesShowSuggestions!==false){
    salesSuggestions().forEach(({product:p,suggestion})=>{
      const productIndex=products.findIndex(x=>x.id===p.id);
      if(productIndex<0) return;

      const visualStart=suggestion.start;
      const visualEnd=suggestion.end;
      if(visualEnd<startDate || visualStart>endDate) return;

      const clippedStart=visualStart<startDate?startDate:visualStart;
      const clippedEnd=visualEnd>endDate?endDate:visualEnd;
      const startRow=rowByDate.get(clippedStart);
      const endRow=rowByDate.get(clippedEnd);
      if(!startRow || !endRow) return;

      const startsInsideRange=visualStart>=startDate;
      const endsInsideRange=visualEnd<=endDate;
      const top=startRow.offsetTop+(startsInsideRange?startRow.offsetHeight*.5:0);
      const bottom=endRow.offsetTop+(endsInsideRange?endRow.offsetHeight*.5:endRow.offsetHeight);
      const height=Math.max(daySize*.5,bottom-top);
      const left=labelWidth+14+productIndex*cellWidth+cellInset;
      const shortName=cleanShortName(p.shortName||p.name);
      const color=colorFor(p.id,ids);

      const box=document.createElement('button');
      box.type='button';
      box.className='sales-timeline-sale-suggestion';
      box.style.top=`${top}px`;
      box.style.left=`${left}px`;
      box.style.width=`${daySize}px`;
      box.style.height=`${height}px`;
      box.innerHTML=`
        <span class="sales-suggestion-label">
          <span class="sales-product-bubble-dot" style="background:${color}"></span>
          <span>${shortName}</span>
        </span>
        ${suggestion.provisionalUnknownNextFab?`
          <span class="sales-suggestion-warning-badge"
            title="Better to wait until the next FAB event is known. This conservative suggestion ends with the last known FAB event so it stays safe for an unknown later event.">!</span>
        `:''}
        ${saleRequestCountdownBadgeHTML(suggestion.start)}
        <span class="sales-suggestion-question">?</span>
      `;

      box.addEventListener('pointermove',ev=>{
        hideSalesPlanHoverTooltip();
        hideSalesTimelineCellHover();
        showSalesSuggestionGlobalTooltip(p,suggestion,ev.clientX,ev.clientY);
      });

      box.addEventListener('pointerleave',()=>{
        hideSalesSuggestionGlobalTooltip();
      });

      box.addEventListener('pointerdown',ev=>{
        if(ev.button!==0) return;
        if(ev.shiftKey){
          ev.preventDefault();
          ev.stopPropagation();
          hideSalesSuggestionGlobalTooltip();
          box.blur();
          return;
        }
        ev.stopPropagation();
        hideSalesPlanHoverTooltip();
        hideSalesTimelineCellHover();
      });

      box.addEventListener('pointerenter',ev=>{
        hideSalesPlanHoverTooltip();
        hideSalesTimelineCellHover();
        showSalesSuggestionGlobalTooltip(p,suggestion,ev.clientX,ev.clientY);
      });

      box.addEventListener('click',ev=>{
        ev.preventDefault();
        ev.stopPropagation();

        if(ev.shiftKey){
          hideSalesSuggestionGlobalTooltip();
          box.blur();
          return;
        }

        hideSalesSuggestionGlobalTooltip();

        if(ev.ctrlKey || ev.metaKey){
          addSuggestionAsPlannedSale(p,suggestion);
          return;
        }

        openSuggestionPlanConfirm(p,suggestion);
      });

      suggestionOverlay.appendChild(box);
    });
  }

  products.forEach((p,productIndex)=>{
    displaySalePeriodsForProduct(p)
      .filter(period=>period.end>=startDate && period.start<=endDate)
      .filter(period=>STATE.settings.showEstimatedSalePeriods!==false || period.confirmed)
      .forEach(period=>appendSaleBox(p,period,productIndex,false));
  });

  products.forEach((p,productIndex)=>{
    plannedSalesForProduct(p.id)
      .filter(period=>period.end>=startDate && period.start<=endDate)
      .forEach(period=>appendSaleBox(p,period,productIndex,true));
  });

  mountFabEventSales();
}





let SALES_OPEN_EDITOR_KEY=null;
let SALES_SHIFT_SELECTION = new Map();
let SALES_SHIFT_WAS_DOWN = false;
let SALES_SHIFT_DAY_OFFSET = 0;
let SALES_TIMELINE_RESTORE_SCROLL_TOP = null;
let SALES_TIMELINE_RESTORE_DATE = null;
let SALES_MOVE_CONFIRM_ACTIVE = false;

function salesPeriodKey(p,period){
  return `${p.id}|${period.originalStart||period.start}|${period.originalEnd||period.end}`;
}

function salesFindPeriod(productId,key){
  const p=STATE.products.find(x=>x.id===productId);
  if(!p) return null;
  const period=displaySalePeriodsForProduct(p).find(x=>salesPeriodKey(p,x)===key);
  return period?{product:p,period}:null;
}

function captureSalesTimelineScroll(){
  const scroller=document.getElementById('salesTimelineScroll');
  if(scroller) SALES_TIMELINE_RESTORE_SCROLL_TOP=scroller.scrollTop;
}

function captureSalesTimelineVisibleDate(){
  const scroller=document.getElementById('salesTimelineScroll');
  if(!scroller) return null;
  const rows=[...scroller.querySelectorAll('[data-sales-date]')];
  if(!rows.length) return null;

  const targetY=scroller.getBoundingClientRect().top+90;
  let best=null;
  let bestDistance=Infinity;
  rows.forEach(row=>{
    const rect=row.getBoundingClientRect();
    const distance=Math.abs(rect.top-targetY);
    if(distance<bestDistance){
      bestDistance=distance;
      best=row;
    }
  });
  return best ? best.dataset.salesDate : null;
}

function restoreSalesTimelineVisibleDate(date){
  if(!date) return false;
  const scroller=document.getElementById('salesTimelineScroll');
  if(!scroller) return false;
  const row=scroller.querySelector(`[data-sales-date="${date}"]`);
  if(!row) return false;
  scroller.scrollTop=Math.max(0,row.offsetTop-90);
  return true;
}

function closeSalesGlobalModal(){
  document.body.classList.remove('sales-modal-open');
  const backdrop=document.getElementById('salesGlobalModalBackdrop');

function salesSelectionEntryFromBox(box){
  if(!box) return null;
  const p=STATE.products.find(x=>x.id===box.dataset.productId);
  if(!p) return null;

  if(box.dataset.plannedId){
    const record=plannedSaleById(box.dataset.plannedId);
    if(!record) return null;
    const period=plannedSalePeriodObject(record);
    return {
      key:`planned|${record.id}`,
      product:p,
      period,
      planned:true,
      plannedId:record.id
    };
  }

  const key=`${p.id}|${box.dataset.originalStart}|${box.dataset.originalEnd}`;
  const found=salesFindPeriod(p.id,key);
  if(!found) return null;
  return {
    key,
    product:found.product,
    period:found.period
  };
}
function syncSalesSelectionVisuals(){
  document.querySelectorAll('.sales-timeline-sale-period').forEach(box=>{
    let key=null;
    if(box.dataset.plannedId){
      key=`planned|${box.dataset.plannedId}`;
    }else{
      const p=STATE.products.find(x=>x.id===box.dataset.productId);
      if(p) key=`${p.id}|${box.dataset.originalStart}|${box.dataset.originalEnd}`;
    }
    box.classList.toggle('multi-selected',!!key && SALES_SHIFT_SELECTION.has(key));
  });
}
function toggleSalesShiftSelection(box){
  const entry=salesSelectionEntryFromBox(box);
  if(!entry) return;

  const incomingState=salesEntryEffectiveState(entry);
  const incomingFabEventId=entry.period?.fabEventId||null;
  if(SALES_SHIFT_SELECTION.size){
    const first=[...SALES_SHIFT_SELECTION.values()][0];
    const selectedState=salesEntryEffectiveState(first);
    const selectedFabEventId=first.period?.fabEventId||null;

    if(incomingFabEventId || selectedFabEventId){
      if(!incomingFabEventId || !selectedFabEventId || incomingFabEventId!==selectedFabEventId){
        showSalesTransientMessage('FAB event participant sales can only be selected together when they belong to the same FAB event.');
        return;
      }
    }

    if(incomingState!==selectedState){
      showSalesTransientMessage(`Only sales of the same state can be selected together. Current selection: ${salesStateLabel(selectedState)}.`);
      return;
    }
  }else{
    SALES_SHIFT_DAY_OFFSET=0;
  }

  document.body.classList.add('sales-shift-selecting');

  if(SALES_SHIFT_SELECTION.has(entry.key)){
    SALES_SHIFT_SELECTION.delete(entry.key);
  }else{
    SALES_SHIFT_SELECTION.set(entry.key,entry);
    box.classList.add('selection-snap');
    box.style.setProperty('--selection-shift-y','0px');
    requestAnimationFrame(()=>requestAnimationFrame(()=>box.classList.remove('selection-snap')));
  }

  if(!SALES_SHIFT_SELECTION.size){
    document.body.classList.remove('sales-shift-selecting');
    SALES_SHIFT_DAY_OFFSET=0;
  }

  syncSalesSelectionVisuals();
  updateSalesSelectionPreview();
  updateSalesSelectionToolbarHint();
}

function clearSalesShiftSelection(){
  SALES_SHIFT_SELECTION.clear();
  SALES_SHIFT_DAY_OFFSET=0;
  document.querySelectorAll('.sales-timeline-sale-period').forEach(box=>{
    box.classList.remove('multi-selected','selection-snap');
    box.style.setProperty('--selection-shift-y','0px');
  });
  document.body.classList.remove('sales-shift-selecting');
  updateSalesSelectionToolbarHint();

function deleteSelectedSales(entries){
  if(!Array.isArray(entries) || !entries.length) return false;

  let changed=false;

  entries.forEach(entry=>{
    if(!entry || !entry.product || !entry.period) return;

    if(entry.planned){
      const before=(STATE.plannedSales||[]).length;
      STATE.plannedSales=(STATE.plannedSales||[]).filter(x=>x.id!==entry.plannedId);
      if(STATE.plannedSales.length!==before) changed=true;
      return;
    }

    const period=entry.period;

    if(period.fabEventId){
      const event=fabEventById(period.fabEventId);
      if(event){
        const before=(event.participants||[]).length;
        event.participants=(event.participants||[]).filter(x=>x.productId!==entry.product.id);
        if((event.participants||[]).length!==before){
          saveFabEventSale(event);
          changed=true;
        }
      }
      removeConfirmedEventParticipantSale(period.fabEventId,entry.product.id);
      changed=true;
      return;
    }

    if(period.confirmed){
      if(deleteConfirmedSale(entry.product,period)) changed=true;
      return;
    }

    // Unconfirmed / estimated sale: create a deletion tombstone so the inferred
    // sale does not immediately reappear after the timeline rerenders.
    const tombstones=STATE.deletedSalePeriods||(STATE.deletedSalePeriods=[]);
    const originalStart=period.originalStart||period.start;
    const originalEnd=period.originalEnd||period.end;
    const exists=tombstones.some(x=>
      x && x.productId===entry.product.id &&
      (x.originalStart||x.start)===originalStart &&
      (x.originalEnd||x.end)===originalEnd
    );
    if(!exists){
      tombstones.push({
        id:uid('sale-delete'),
        productId:entry.product.id,
        confirmationId:period.confirmationId||null,
        originalStart,
        originalEnd,
        start:period.start,
        end:period.end,
        deletedAt:new Date().toISOString()
      });
      changed=true;
    }
  });

  if(changed){
    SALE_PERIOD_CACHE.clear();
    MONTHLY_PROFILE_CACHE.clear();
    MONTHLY_NORMALIZED_CACHE.clear();
    persist();
  }

  return changed;
}

function openSalesMultiEditor(){
  const entries=[...SALES_SHIFT_SELECTION.values()];
  if(!entries.length) return;

  if(entries.length===1){
    const only=entries[0];
    clearSalesShiftSelection();
    if(only.planned) openPlannedSaleEditor(only.plannedId);
    else openSalesGlobalEditor(only.product.id,only.key);
    return;
  }

  const state=salesEntryEffectiveState(entries[0]);
  if(entries.some(x=>salesEntryEffectiveState(x)!==state)){
    showSalesTransientMessage('Only sales of the same state can be edited together.');
    clearSalesShiftSelection();
    return;
  }

  const fabEventIds=[...new Set(entries.map(x=>x.period?.fabEventId).filter(Boolean))];
  const eventLocked=fabEventIds.length===1 && entries.every(x=>x.period?.fabEventId===fabEventIds[0]);
  const linkedFabEvent=eventLocked ? fabEventById(fabEventIds[0]) : null;

  const productNames=[...new Set(entries.map(x=>x.product.name))];
  const allStarts=entries.map(x=>x.period.start).sort();
  const allEnds=entries.map(x=>x.period.end).sort();
  const defaultStart=allStarts[0],defaultEnd=allEnds[allEnds.length-1];

  const discounts=entries.map(explicitOrDetectedDiscount);
  const commonDiscount=discounts.length && discounts.every(v=>v===discounts[0]) ? discounts[0] : null;
  const canCopyFutureSales=!eventLocked && entries.every(x=>isFutureSalePeriod(x.period) && !x.period.fabEventId);

  const modal=showSalesGlobalModal(`
    <div class="sales-global-modal-head">
      <div><strong>Edit ${entries.length} sales</strong><span>${productNames.length} product${productNames.length===1?'':'s'} selected</span></div>
      <button type="button" class="sales-global-modal-close" aria-label="Close">×</button>
    </div>
    ${salesProductBubblesHTML(entries.map(x=>x.product))}
    <div class="sales-global-modal-copy">${eventLocked
      ? 'These sales participate in the same FAB event. Their dates are locked; you can edit their discount together.'
      : 'Change dates for all selected sales. A discount is only changed for all sales if you explicitly select one below.'}</div>
    ${eventLocked ? `
      <div class="sales-multi-date-fields sales-multi-event-locked-dates">
        <label class="sales-global-modal-field"><span>Start date</span><input type="date" id="salesGlobalEditStart" value="${defaultStart}" disabled></label>
        <label class="sales-global-modal-field"><span>End date</span><input type="date" id="salesGlobalEditEnd" value="${defaultEnd}" disabled></label>
      </div>
      <div class="sales-event-date-lock-note">Change the dates in the FAB Event Sale editor.</div>
    ` : `
      <div class="sales-multi-date-toggle-row">
        <span>Apply same start and end date for all selections</span>
        <label class="switch">
          <input type="checkbox" id="salesMultiApplySameDates">
          <span class="slider"></span>
        </label>
      </div>
      <div class="sales-multi-date-fields" id="salesMultiDateFields" hidden>
        <label class="sales-global-modal-field"><span>Start date</span><input type="date" id="salesGlobalEditStart" value="${defaultStart}"></label>
        <label class="sales-global-modal-field"><span>End date</span><input type="date" id="salesGlobalEditEnd" value="${defaultEnd}"></label>
      </div>
    `}
    <div class="sales-global-modal-field"><span>Discount</span>${discountPickerHTML('salesMultiDiscount',commonDiscount)}</div>
    <div class="sales-global-modal-status"><span>State</span><strong>${escapeHtml(salesStateLabel(state))}</strong></div>
    <div class="sales-global-modal-error" id="salesGlobalModalError"></div>
    ${canCopyFutureSales?`
      <div class="sales-copy-row">
        <span>Generate formatted sale request for FAB support</span>
        <button type="button" class="btn secondary sales-copy-clipboard-btn" id="salesMultiCopyClipboard">Copy to clipboard</button>
      </div>
    `:''}
    ${!eventLocked && entries.some(x=>x.period.confirmed&&!x.planned)?`<button type="button" class="btn secondary sales-global-reset-estimate" id="salesGlobalResetAllEstimated">Reset all to estimated data</button>`:''}
    <div class="sales-multi-main-actions">
      <button type="button" class="btn danger" id="salesGlobalMultiDelete">Delete</button>
      ${!eventLocked && state!=='estimated'?`<button type="button" class="btn secondary" id="salesGlobalMultiSavePlanned">Save as Planned</button>`:''}
      <button type="button" class="btn primary sales-global-modal-save" id="salesGlobalSaveConfirm">Save as Confirmed</button>
    </div>
  `);
  if(!modal) return;
  setSalesModalSize(modal,'multi');

  const applySameDates=modal.querySelector('#salesMultiApplySameDates');
  const dateFields=modal.querySelector('#salesMultiDateFields');
  const startInput=modal.querySelector('#salesGlobalEditStart');
  const endInput=modal.querySelector('#salesGlobalEditEnd');
  const error=modal.querySelector('#salesGlobalModalError');
  const picker=wireDiscountPicker(modal,'salesMultiDiscount',commonDiscount);
  if(applySameDates && dateFields){
    applySameDates.checked=false;
    dateFields.hidden=true;
    applySameDates.addEventListener('change',()=>{
      dateFields.hidden=!applySameDates.checked;
    });
  }
  let multiDatesDirty=false;
  if(startInput) startInput.addEventListener('change',()=>{multiDatesDirty=true;});
  if(endInput) endInput.addEventListener('change',()=>{multiDatesDirty=true;});

  const copyBtn=modal.querySelector('#salesMultiCopyClipboard');
  if(copyBtn){
    copyBtn.addEventListener('click',()=>{
      const chosen=picker.getValue();
      const rows=entries.map(entry=>({
        id:productFabListingId(entry.product),
        start:(applySameDates && applySameDates.checked) ? startInput.value : entry.period.start,
        end:(applySameDates && applySameDates.checked) ? endInput.value : entry.period.end,
        discount:chosen===null ? explicitOrDetectedDiscount(entry) : chosen
      }));
      copyFabSupportRows(rows,copyBtn);
    });
  }

  const closeAndClear=()=>{closeSalesGlobalModal();clearSalesShiftSelection();};
  modal.querySelector('.sales-global-modal-close').addEventListener('click',closeAndClear);

  const resetAllBtn=modal.querySelector('#salesGlobalResetAllEstimated');
  if(resetAllBtn) resetAllBtn.addEventListener('click',()=>showSalesMultiResetConfirmDialog(entries.filter(x=>!x.planned)));

  const multiDeleteBtn=modal.querySelector('#salesGlobalMultiDelete');
  if(multiDeleteBtn){
    multiDeleteBtn.addEventListener('click',()=>showSalesMultiDeleteConfirmDialog(entries));
  }

  const multiPlannedBtn=modal.querySelector('#salesGlobalMultiSavePlanned');
  const multiConfirmBtn=modal.querySelector('#salesGlobalSaveConfirm');

  const stagedValues=()=>{
    const newStart=startInput.value;
    const newEnd=endInput.value;
    const chosen=picker.getValue();
    const changeDates=!eventLocked && !!(applySameDates && applySameDates.checked);
    return {newStart,newEnd,chosen,changeDates};
  };

  const targetDatesFor=(entry,values)=>({
    start:values.changeDates ? values.newStart : entry.period.start,
    end:values.changeDates ? values.newEnd : entry.period.end
  });

  const validateSharedDates=(values)=>{
    if(!values.changeDates) return {ok:true};
    if(!values.newStart||!values.newEnd) return {ok:false,message:'Choose both dates.'};
    if(values.newEnd<values.newStart) return {ok:false,message:'End date must be on or after start date.'};
    if(dayDiff(values.newStart,values.newEnd)>14) return {ok:false,message:'A sale can be at most 14 sale days long.'};
    return {ok:true};
  };

  const syncMultiPlanButton=()=>{
    if(!multiPlannedBtn) return;
    const values=stagedValues();
    const canPlan=entries.every(entry=>{
      const dates=targetDatesFor(entry,values);
      return !!dates.start && dates.start>todayStr();
    });
    multiPlannedBtn.hidden=!canPlan;
  };

  if(applySameDates) applySameDates.addEventListener('change',syncMultiPlanButton);
  if(startInput) startInput.addEventListener('change',syncMultiPlanButton);
  if(endInput) endInput.addEventListener('change',syncMultiPlanButton);
  syncMultiPlanButton();

  if(multiPlannedBtn){
    multiPlannedBtn.addEventListener('click',()=>{
      const values=stagedValues();
      error.textContent='';

      const shared=validateSharedDates(values);
      if(!shared.ok){error.textContent=shared.message;return;}

      const targets=entries.map(entry=>({
        entry,
        dates:targetDatesFor(entry,values)
      }));

      for(const {entry,dates} of targets){
        if(dates.start<=todayStr()){
          error.textContent='A sale that has already started cannot be saved as planned.';
          syncMultiPlanButton();
          return;
        }

        const valid=validatePlannedSalePlacement(
          entry.product,
          dates.start,
          dates.end,
          entry.planned ? entry.plannedId : null,
          entry.planned ? null : (entry.period.confirmationId||null)
        );
        if(!valid.ok){error.textContent=valid.message;return;}
      }

      captureSalesTimelineScroll();

      for(const {entry,dates} of targets){
        const chosen=values.chosen;

        if(entry.planned){
          const rec=plannedSaleById(entry.plannedId);
          if(!rec) continue;
          savePlannedSale({
            ...rec,
            start:dates.start,
            end:dates.end,
            discountPercent:chosen===null ? rec.discountPercent : chosen,
            updatedAt:new Date().toISOString()
          });
          continue;
        }

        const result=convertConfirmedSaleToPlanned(
          entry.product,
          entry.period,
          dates.start,
          dates.end,
          chosen===null ? explicitOrDetectedDiscount(entry) : chosen
        );
        if(!result.ok){
          error.textContent=result.message;
          return;
        }
      }

      clearSalesShiftSelection();
      closeSalesGlobalModal();
      renderTabContent();
    });
  }

  multiConfirmBtn.addEventListener('click',()=>{
    const values=stagedValues();
    error.textContent='';

    const shared=validateSharedDates(values);
    if(!shared.ok){error.textContent=shared.message;return;}

    const targets=entries.map(entry=>({
      entry,
      dates:targetDatesFor(entry,values)
    }));

    for(const {entry,dates} of targets){
      if(entry.planned){
        const valid=validateNewConfirmedSalePlacement(
          entry.product,
          dates.start,
          dates.end,
          entry.plannedId
        );
        if(!valid.ok){error.textContent=valid.message;return;}
      }else if(values.changeDates){
        const selectedKeys=new Set(entries.filter(x=>!x.planned).map(x=>x.key));
        const valid=validateSalePlacement(
          entry.product,
          entry.period,
          dates.start,
          dates.end,
          selectedKeys
        );
        if(!valid.ok){error.textContent=valid.message;return;}
      }
    }

    let changed=false;

    for(const {entry,dates} of targets){
      const chosen=values.chosen;

      if(entry.planned){
        const rec=plannedSaleById(entry.plannedId);
        if(!rec) continue;
        const result=convertPlannedSaleToConfirmed(
          rec,
          entry.product,
          dates.start,
          dates.end,
          chosen===null ? explicitOrDetectedDiscount(entry) : chosen
        );
        if(result.ok) changed=true;
        continue;
      }

      if(entry.period.manualAdded && entry.period.confirmationId){
        const rec=(STATE.confirmedSalePeriods||[]).find(x=>x.id===entry.period.confirmationId);
        if(rec){
          if(values.changeDates){
            rec.start=dates.start;
            rec.end=dates.end;
            rec.originalStart=dates.start;
            rec.originalEnd=dates.end;
          }
          if(chosen!==null) rec.discountPercent=chosen;
          rec.confirmedAt=new Date().toISOString();
          changed=true;
        }

        if(eventLocked && linkedFabEvent && chosen!==null){
          const participant=(linkedFabEvent.participants||[]).find(x=>x.productId===entry.product.id);
          if(participant) participant.discountPercent=chosen;
          linkedFabEvent.updatedAt=new Date().toISOString();
        }
        continue;
      }

      if(saveAndConfirmMultipleSalePeriods(
        [entry],
        dates.start,
        dates.end,
        chosen
      )) changed=true;
    }

    if(changed){
      if(eventLocked && linkedFabEvent) saveFabEventSale(linkedFabEvent);
      SALE_PERIOD_CACHE.clear();
      MONTHLY_PROFILE_CACHE.clear();
      MONTHLY_NORMALIZED_CACHE.clear();
      persist();
      captureSalesTimelineScroll();
      clearSalesShiftSelection();
      closeSalesGlobalModal();
      renderTabContent();
    }
  });

  wireEnterToPrimary(modal,multiConfirmBtn,()=>{clearAllSalesHoverVisuals(true);closeSalesGlobalModal();clearSalesShiftSelection();});
}



function salesEntryEffectiveState(entry){
  if(!entry || !entry.period) return 'unknown';
  if(entry.planned) return 'planned';
  if(!entry.period.confirmed) return 'estimated';
  return entry.period.start>todayStr() ? 'future-confirmed' : 'confirmed';
}

function salesStateLabel(state){
  return ({
    planned:'planned sales',
    estimated:'estimated sales',
    'future-confirmed':'future confirmed sales',
    confirmed:'confirmed sales'
  })[state]||'sales';
}

function detectedDiscountForRange(product,start,end){
  if(!product || !start || !end) return null;
  const candidates=detectedSalePeriodsForProduct(product)
    .filter(x=>x.end>=start && x.start<=end)
    .map(x=>normalizeSaleDiscountValue(x.discountPercent))
    .filter(v=>v!==null);
  if(candidates.length) return candidates[0];

  let d=start, guard=0;
  while(d<=end && guard<40){
    const direct=directlyObservedSaleInfoForDate(product,d);
    const v=direct?normalizeSaleDiscountValue(direct.discountPercent):null;
    if(v!==null) return v;
    d=datePlusDays(d,1);
    guard++;
  }
  return null;
}

function explicitOrDetectedDiscount(entry){
  if(!entry || !entry.product || !entry.period) return null;
  const raw=entry.period.discountPercent;
  const explicit=normalizeSaleDiscountValue(raw);
  if(explicit!==null && Number(raw)>0) return explicit;
  return detectedDiscountForRange(entry.product,entry.period.start,entry.period.end);
}

function saleVisualDiscount(period){
  const n=Number(period&&period.discountPercent);
  return Math.max(10,Math.min(100,Number.isFinite(n)?Math.round(n):10));
}
function saleEstimatedDiscount(period){
  const n=Number(period&&period.estimatedDiscountPercent);
  return Math.max(10,Math.min(100,Number.isFinite(n)&&n>0?Math.round(n):saleVisualDiscount(period)));
}

function productSaleReleaseDate(product){
  if(!product) return null;
  return product.releaseDate || inferredFirstSaleDateFromState(STATE,product.id) || null;
}

function productSaleEarliestEligibleDate(product){
  const release=productSaleReleaseDate(product);
  return release ? datePlusDays(release,30) : null;
}

function validateProductSaleReleaseEligibility(product,saleStart){
  if(!product || !saleStart) return {ok:false,message:'Invalid product release eligibility.'};

  const release=productSaleReleaseDate(product);
  if(!release){
    return {ok:false,message:'Set a release date for this product before adding a sale.'};
  }

  const ageDays=dayDiff(release,saleStart);

  if(ageDays<0){
    return {ok:false,message:`A sale cannot start before this product was released on ${release}.`};
  }

  if(ageDays<30){
    return {
      ok:false,
      message:`This product must be released for at least 30 days before a sale can start. Earliest eligible sale date: ${datePlusDays(release,30)}.`
    };
  }

  return {ok:true,releaseDate:release,ageDays};
}

function saleDatesOverlap(aStart,aEnd,bStart,bEnd){ return aStart<=bEnd && bStart<=aEnd; }
function saleFullGapDays(previousEnd,nextStart){
  if(!previousEnd || !nextStart) return 0;
  return Math.max(0,dayDiff(previousEnd,nextStart)-1);
}
function saleGapMeetsRequirement(previousEnd,nextStart,requiredDays){
  const required=Number(requiredDays)||0;
  return saleFullGapDays(previousEnd,nextStart)>=required;
}
function saleCooldownGapValid(previousEnd,nextStart){
  if(!previousEnd || !nextStart) return true;
  if(!saleCooldownApplies(nextStart)) return true;
  return saleGapMeetsRequirement(previousEnd,nextStart,30);
}
function validateSalePlacement(product,period,newStart,newEnd,ignoredKeys=new Set()){
  if(!product||!period) return {ok:false,message:'Invalid sale.'};

  const releaseEligibility=validateProductSaleReleaseEligibility(product,newStart);
  if(!releaseEligibility.ok) return releaseEligibility;
  const ownKey=salesPeriodKey(product,period);
  const peers=displaySalePeriodsForProduct(product).filter(other=>{
    const k=salesPeriodKey(product,other);
    return k!==ownKey && !ignoredKeys.has(k);
  }).sort((a,b)=>a.start.localeCompare(b.start));
  for(const other of peers){
    if(saleDatesOverlap(newStart,newEnd,other.start,other.end)) return {ok:false,message:'This sale would overlap another sale for this product.'};
  }
  const prev=peers.filter(x=>x.end<newStart).sort((a,b)=>b.end.localeCompare(a.end))[0];
  if(prev && !saleCooldownGapValid(prev.end,newStart)) return {ok:false,message:'Cannot place the sale there: at least 30 full sale-free days are required after the previous sale.'};
  const next=peers.filter(x=>x.start>newEnd).sort((a,b)=>a.start.localeCompare(b.start))[0];
  if(next && !saleCooldownGapValid(newEnd,next.start)) return {ok:false,message:'Cannot place the sale there: at least 30 full sale-free days are required before the next sale.'};
  return {ok:true};
}
function validateMultipleSalePlacement(entries,newStart,newEnd){
  const ignored=new Set(entries.map(x=>x.key));
  for(const entry of entries){
    const r=validateSalePlacement(entry.product,entry.period,newStart,newEnd,ignored);
    if(!r.ok) return r;
  }
  const byProduct=new Map();
  entries.forEach(e=>{ if(!byProduct.has(e.product.id)) byProduct.set(e.product.id,[]); byProduct.get(e.product.id).push(e); });
  for(const arr of byProduct.values()) if(arr.length>1) return {ok:false,message:'Multiple sales for the same product cannot be placed on the same dates.'};
  return {ok:true};
}
function shiftedDate(date,days){ return datePlusDays(date,days); }
function validateShiftedSelection(entries,nextOffset){
  for(const entry of entries){
    if(entry.period && entry.period.fabEventId){
      return {ok:false,message:'A FAB event participant cannot be moved independently. Edit the FAB event dates instead.'};
    }
    const newStart=shiftedDate(entry.period.start,nextOffset);
    const newEnd=shiftedDate(entry.period.end,nextOffset);

    if(entry.planned){
      const result=validatePlannedSalePlacement(entry.product,newStart,newEnd,entry.plannedId);
      if(!result.ok) return result;
      continue;
    }

    const selectedKeys=new Set(entries.filter(x=>!x.planned).map(x=>x.key));
    const result=validateSalePlacement(entry.product,entry.period,newStart,newEnd,selectedKeys);
    if(!result.ok) return result;
  }
  return {ok:true};
}
