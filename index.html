<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAB Profit Analytics</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#12151B;
    --panel:#181D26;
    --panel2:#1E2430;
    --border:#2A3140;
    --text:#EDEFF3;
    --muted:#8B93A3;
    --muted2:#5D6779;
    --gold:#D9A441;
    --gold-soft:#3A2F1D;
    --teal:#4FB8B0;
    --teal-soft:#1C2F2E;
    --coral:#E2725B;
    --coral-soft:#2E1F1C;
    --violet:#8C7CF0;
    --green:#6FBF73;
    --red:#E2604F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Sora',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;flex-wrap:wrap;gap:12px;
    position:sticky;top:0;z-index:150;
    background:rgba(18,21,27,.96);
    backdrop-filter:blur(10px);
    padding:10px 0;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg,var(--gold),#a97a2c);
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-weight:700;color:#1a1409;font-size:15px;
  }
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-0.01em;}
  .brand span{color:var(--muted);font-size:12px;display:block;margin-top:1px;letter-spacing:.02em;}

  nav.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px;flex-wrap:wrap;}
  nav.tabs button{
    background:transparent;border:none;color:var(--muted);
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:7px;cursor:pointer;transition:.15s;
    white-space:nowrap;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{background:var(--panel2);color:var(--gold);}

  .filter-bar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:10px 14px;margin-bottom:12px;
  }
  .save-warning{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    background:var(--coral-soft);border:1px solid #4a2b25;color:#f0c9c0;
    border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;line-height:1.4;
  }
  .save-warning .sw-text{flex:1;}
  .save-warning button{
    flex:0 0 auto;background:transparent;border:1px solid #6b3a30;color:#f0c9c0;
    border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .save-warning button:hover{background:#4a2b25;}

  .timeframe-bar{
    display:flex;align-items:center;flex-wrap:wrap;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:10px 14px;margin-bottom:12px;
  }
  .timeframe-bar select{width:auto;min-width:170px;}
  .timeframe-bar .custom-dates{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .timeframe-bar .custom-dates input{width:auto;}
  .timeframe-bar .tf-label{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:20px;border:1px solid var(--border);
    background:var(--panel2);color:var(--muted);cursor:pointer;transition:.15s;
    display:flex;align-items:center;gap:6px;
  }
  .chip:hover{color:var(--text);}
  .chip.active{background:var(--gold-soft);color:var(--gold);border-color:#5c451f;}
  .chip.disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
  .chip .dot{width:7px;height:7px;border-radius:50%;}

  .toggle-wrap{display:flex;align-items:center;gap:8px;}
  .toggle-label{font-size:12px;color:var(--muted);font-weight:600;}
  .switch{position:relative;width:38px;height:22px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:var(--panel2);border:1px solid var(--border);border-radius:20px;transition:.15s;}
  .slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:.15s;}
  input:checked + .slider{background:var(--gold-soft);border-color:#5c451f;}
  input:checked + .slider:before{transform:translateX(16px);background:var(--gold);}

  .kpi-strip{
    display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
    background:var(--border);border:1px solid var(--border);border-radius:12px;
    overflow:hidden;margin-bottom:18px;
  }
  .kpi{background:var(--panel);padding:16px 18px;}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px;font-weight:600;}
  .kpi .value{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--text);}
  .kpi .value.gold{color:var(--gold);}
  .kpi .value.teal{color:var(--teal);}
  .kpi .sub{font-size:11px;color:var(--muted2);margin-top:4px;}

  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:18px 20px;margin-bottom:18px;
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .panel-head h2{font-size:14px;margin:0;font-weight:700;letter-spacing:.01em;}
  .panel-head .hint{font-size:11.5px;color:var(--muted);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:820px){.grid-2{grid-template-columns:1fr;} .kpi-strip{grid-template-columns:repeat(2,1fr);}}

  canvas{max-width:100%;}
  .chart-wrap{position:relative;height:260px;}
  .chart-wrap.tall{height:320px;}

  label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  input,select{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:7px;font-family:'Inter',sans-serif;font-size:13.5px;
    outline:none;
  }
  input:focus,select:focus{border-color:var(--gold);}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > .field{flex:1;min-width:140px;}
  button.btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    background:var(--gold);color:#1a1409;border:none;border-radius:7px;
    padding:9px 16px;cursor:pointer;transition:.15s;
  }
  button.btn:hover{filter:brightness(1.08);}
  button.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  button.btn.danger{background:var(--coral-soft);color:var(--coral);border:1px solid #4a2b25;}
  button.btn.small{padding:5px 10px;font-size:11.5px;}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;
     padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;}
  td{padding:8px 10px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .table-scroll{max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}
  .table-scroll table{font-size:12.5px;}
  .table-scroll th{position:sticky;top:0;background:var(--panel);}

  .tag{
    display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
    font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;
  }
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;}

  .product-card{
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:14px 16px;margin-bottom:10px;
  }
  .product-card .pc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .product-card .pc-head .name{font-weight:700;font-size:14px;}
  .product-card .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;}
  .product-card .stats .s-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .product-card .stats .s-val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;margin-top:2px;}
  .edit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
  @media (max-width:700px){.edit-grid{grid-template-columns:1fr 1fr;} .product-card .stats{grid-template-columns:1fr 1fr;}}

  .alias-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .alias-pill{
    display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);
    padding:3px 4px 3px 10px;border-radius:20px;font-size:11.5px;color:var(--muted);
  }
  .alias-pill button{
    background:transparent;border:none;color:var(--muted2);cursor:pointer;font-size:14px;line-height:1;
    padding:2px 6px;border-radius:50%;
  }
  .alias-pill button:hover{color:var(--coral);}

  .drop-zone{
    border:2px dashed var(--border);border-radius:10px;padding:26px 18px;text-align:center;
    color:var(--muted);font-size:13px;cursor:pointer;transition:.15s;
  }
  .drop-zone:hover, .drop-zone.dragover{border-color:var(--gold);color:var(--text);}

  .resolve-card{
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:14px 16px;margin-bottom:10px;
  }
  .resolve-card .csv-title{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold);margin-bottom:8px;}
  .resolve-card .opt{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid var(--border);}
  .resolve-card .opt:first-of-type{border-top:none;}
  .resolve-card .opt input[type=radio]{width:auto;margin-top:3px;}
  .resolve-card .opt label{text-transform:none;font-size:13px;color:var(--text);font-weight:400;margin:0;cursor:pointer;}
  .resolve-card select{margin-top:6px;}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;}
  .badge.auto{background:var(--teal-soft);color:var(--teal);}
  .badge.new{background:var(--gold-soft);color:var(--gold);}
  .badge.review{background:var(--coral-soft);color:var(--coral);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .legend-row{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:10px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}

  .log-row{
    display:flex;align-items:center;gap:14px;padding:8px 4px;border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .log-row:last-child{border-bottom:none;}
  .log-row:hover{background:var(--panel2);border-radius:6px;}
  .log-row.log-row-zero{opacity:.55;}
  .log-date{width:110px;flex:0 0 auto;color:var(--muted);}
  .log-total{width:70px;flex:0 0 auto;font-weight:700;}
  .log-badges{display:flex;flex-wrap:wrap;gap:5px;flex:1;}
  .log-badge{
    padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;
    font-family:'JetBrains Mono',monospace;white-space:nowrap;
  }
  .log-tooltip{
    position:fixed;display:none;z-index:200;pointer-events:none;
    background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    padding:10px 6px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:12.5px;
    max-width:320px;
    transition:opacity .08s ease;
  }
  .log-tooltip-date{font-weight:700;color:var(--text);margin-bottom:6px;font-family:'JetBrains Mono',monospace;}
  .log-tooltip-row{
    display:grid;
    grid-template-columns:7px 198px 70px 72px;
    align-items:center;
    column-gap:2px;
    padding:3px 0;
    white-space:nowrap;
  }
  .log-tooltip-row .dot{width:7px;height:7px;flex:none;}
  .log-tooltip-name{
    display:flex;
    align-items:center;
    min-width:0;
    white-space:nowrap;
    overflow:visible;
  }
  .log-tooltip-product-name{
    color:var(--muted);
    white-space:nowrap;
    overflow:visible;
    text-overflow:clip;
    flex:0 0 auto;
    font-size:11.5px;
  }
  .log-tooltip-sale{
    color:var(--gold);
    font-size:10.5px;
    font-weight:600;
    white-space:nowrap;
    margin-left:2px;
    flex:0 0 auto;
  }
  .log-tooltip-val{
    font-family:'JetBrains Mono',monospace;
    color:var(--text);
    text-align:right;
    width:70px;
    min-width:70px;
    max-width:70px;
    white-space:nowrap;
    justify-self:end;
  }
  .log-tooltip-growth{
    font-family:'JetBrains Mono',monospace;
    color:var(--teal);
    font-size:11px;
    text-align:right;
    width:72px;
    min-width:72px;
    max-width:72px;
    white-space:nowrap;
    justify-self:end;
  }

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .chart-revenue-tooltip{position:absolute;z-index:50;min-width:200px;pointer-events:none;background:rgba(24,29,38,.94);backdrop-filter:blur(8px);border:1px solid rgba(93,103,121,.55);border-radius:7px;box-shadow:0 8px 24px rgba(0,0,0,.36);padding:9px 11px;font-size:12px;line-height:1.3;opacity:0;transform:translate3d(0,0,0);transition:opacity .12s ease,transform .095s ease-out;will-change:transform,opacity;}
  .chart-revenue-tooltip .crt-title{font-weight:700;color:var(--text);margin-bottom:7px;}
  .chart-revenue-tooltip .crt-row{display:grid;grid-template-columns:8px 34px minmax(90px,1fr);column-gap:12px;align-items:center;padding:3px 0;}
  .chart-revenue-tooltip .crt-row.zero{opacity:.38;}
  .chart-revenue-tooltip .crt-dot{width:7px;height:7px;border-radius:50%;}
  .chart-revenue-tooltip .crt-code{font-weight:700;letter-spacing:.04em;color:var(--text);}
  .chart-revenue-tooltip .crt-value{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .chart-revenue-tooltip .crt-total{display:grid;grid-template-columns:1fr minmax(90px,auto);column-gap:22px;border-top:1px solid var(--border);margin-top:6px;padding-top:7px;font-weight:700;}
  .chart-revenue-tooltip .crt-total span:last-child{text-align:right;font-variant-numeric:tabular-nums;}

  /* --- Revenue Log: compact, left-packed fixed columns --- */
  .revenue-log-sheet{
    width:max-content;
    max-width:100%;
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:8px;
    position:relative;
    background:var(--panel);
  }
  .revenue-log-grid{
    display:grid;
    width:max-content;
    min-width:100%;
    align-items:stretch;
  }
  .rl-grid-cell{
    min-height:34px;
    display:flex;
    align-items:center;
    padding:6px 8px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
    font-size:12.5px;
  }
  .rl-grid-head{
    position:sticky;
    top:0;
    z-index:8;
    background:rgba(30,36,48,.97);
    backdrop-filter:blur(8px);
    color:var(--muted);
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.055em;
    box-shadow:0 1px 0 var(--border);
  }
  .rl-date-cell{padding-left:10px;color:var(--muted);}
  .rl-total-cell{font-weight:700;text-align:right;justify-content:flex-end;font-variant-numeric:tabular-nums;padding-right:12px;}
  .rl-product-cell{justify-content:flex-start;padding-left:4px;padding-right:4px;}
  .rl-header-product{justify-content:flex-start;padding-left:5px;padding-right:6px;}
  .rl-header-code{display:inline-flex;align-items:center;gap:5px;color:var(--text);font-weight:700;letter-spacing:.06em;}
  .rl-value-pill{
    display:inline-flex;
    align-items:center;
    justify-content:flex-end;
    gap:6px;
    min-height:22px;
    padding:2px 4px;
    border-radius:0;
    background:transparent !important;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .rl-value-pill .dot{flex:0 0 auto;}
  .rl-blank{min-width:18px;}
  .rl-month-heading{
    grid-column:1 / -1;
    padding:12px 10px 7px;
    background:var(--bg);
    color:var(--gold);
    font-size:12px;
    font-weight:700;
    letter-spacing:.025em;
    border-bottom:1px solid var(--border);
  }
  .rl-day-row{display:contents;}
  .rl-day-row:hover > .rl-grid-cell{background:var(--panel2);}

  .product-short-code{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:2px 6px;border:1px solid var(--border);border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--gold);margin-left:8px;}


  /* --- Revenue Log product-column separation + sale intensity --- */
  .revenue-log-grid .rl-product-cell,
  .revenue-log-grid .rl-header-product{
    border-left:1px solid var(--border);
  }
  .revenue-log-grid .rl-product-cell{
    position:relative;
    background:var(--column-bg, transparent);
  }
  .revenue-log-grid .rl-header-product{
    position:relative;
    top:auto;
    z-index:8;
    background-color:var(--panel2);
    background-image:linear-gradient(var(--column-head-bg, transparent),var(--column-head-bg, transparent));
  }
  .revenue-log-grid .rl-sale-edge{
    box-shadow:inset 0 0 0 9999px var(--sale-edge-bg, transparent);
  }
  .revenue-log-grid .rl-sale-full{
    box-shadow:inset 0 0 0 9999px var(--sale-full-bg, transparent);
  }
  .revenue-log-grid .rl-sale-edge .rl-value-pill,
  .revenue-log-grid .rl-sale-full .rl-value-pill{
    font-weight:700;
  }
.rl-month-heading{
    display:flex;align-items:center;justify-content:space-between;
    gap:28px;min-width:320px;
  }
  .rl-month-heading .rl-month-total{
    margin-left:auto;color:var(--text);font-variant-numeric:tabular-nums;font-weight:700;
  }


  .rl-prof-badge,
  .rl-refund-badge{
    position:absolute;
    top:2px;
    z-index:3;
    pointer-events:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:10px;
    padding:0 2px;
    border-radius:3px;
    font-size:7px;
    font-weight:800;
    letter-spacing:.01em;
    line-height:10px;
  }
  .rl-prof-badge{
    right:3px;
    min-width:14px;
    background:rgba(93,168,226,.30);
    color:#D9ECFF;
  }
  .rl-refund-badge{
    right:3px;
    min-width:27px;
    background:rgba(226,114,91,.28);
    color:#FFD1C8;
  }
  .rl-prof-badge + .rl-refund-badge{right:21px;}


  .revenue-log-bottom-btn{
    position:fixed;
    right:24px;
    bottom:24px;
    z-index:120;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(30,36,48,.94);
    color:var(--text);

<script>

const SEED_DATA = {"products":[],"revenue":[],"units":[],"priceHistory":[],"settings":{"applyRevenueShare":true,"displayCurrency":"USD","subtractGeneralSpendingFromNumbers":true,"useHistoricalExchangeRates":true},"fxHistory":{},"fxSync":{"inProgress":false,"lastError":null,"startedAt":null,"completedAt":null}};

const PALETTE = ["#D9A441","#4FB8B0","#8C7CF0","#E2725B","#6FBF73","#5DA8E2","#E2C255","#C97CE0","#7FD1C1","#E08FB0"];

function colorFor(id, list){
  const p = STATE && STATE.products && STATE.products.find(x=>x.id===id);
  if(p && p.color) return p.color;
  const idx = list.indexOf(id);
  return PALETTE[idx % PALETTE.length];
}
// The actual hex color a product is currently rendered in (custom or palette-assigned),
// used to pre-fill the color picker in the edit form.
function currentColorFor(p){
  if(p.color) return p.color;
  return colorFor(p.id, STATE.products.map(x=>x.id));
}

/* ---------- Fixed global fee timeline ----------
   Marketplace fee is always 12% (i.e. you keep 88%), except for a single
   promo window (Oct 22 2024 – Dec 31 2024 inclusive) when there was no fee
   at all (you kept 100%). This is fixed and not user-editable. */
function globalFeeMultiplier(dateStr){
  if(dateStr >= '2024-10-22' && dateStr <= '2024-12-31') return 1.0;
  return 0.88;
}



/* ---------- Display integer helper ----------
   Use this only when a template displays a numeric value directly.
   Stored state keeps its original decimal precision.
*/
function fmtInt(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return Math.floor(Number(n)).toLocaleString(undefined,{maximumFractionDigits:0});
}

/* ---------- Storage ---------- */
let LAST_SAVED_SNAPSHOT = null; // JSON string of the last state we *confirmed* was actually saved
let SAVE_WARNING_ACTIVE = false;  // a save is currently failing — show the persistent banner
let SAVE_WARNING_DETAIL = '';
let SAVE_WARNING_DISMISSED = false; // user closed the banner for this failure streak

function storageApiExists(){
  return typeof window.storage !== 'undefined' && window.storage
    && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';
}

// Local-file friendly persistence.
// When this HTML is opened directly from disk (file://), Anthropic's window.storage
// is normally unavailable. We therefore use the browser's built-in localStorage.
// The saved data is kept as JSON under a dedicated key and survives reloads/browser
// restarts for this browser profile. The data in this app is small enough for the
// normal localStorage quota, while the existing window.storage API remains supported
// when the page is hosted inside a compatible artifact environment.
const LOCAL_STORAGE_KEY = 'fab-profit-analytics-state-v1';
const FX_CACHE_STORAGE_KEY = 'fab-profit-analytics-fx-history-v1';

function localStorageAvailable(){
  try{
    if(!window.localStorage) return false;
    const testKey = '__fab_storage_test__';
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    return true;
  }catch(e){
    return false;
  }
}

function getLocalState(){
  if(!localStorageAvailable()) return null;
  try{
    const value = window.localStorage.getItem(LOCAL_STORAGE_KEY);
    return value ? JSON.parse(value) : null;
  }catch(e){
    console.error('Local storage load failed', e);
    return null;
  }
}

function setLocalState(state){
  if(!localStorageAvailable()) return false;
  try{
    window.localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state));
    return true;
  }catch(e){
    console.error('Local storage save failed', e);
    return false;
  }
}

function getDedicatedFxCache(){
  if(!localStorageAvailable()) return {};
  try{
    const value=window.localStorage.getItem(FX_CACHE_STORAGE_KEY);
    const parsed=value?JSON.parse(value):{};
    return parsed && typeof parsed==='object' && !Array.isArray(parsed) ? parsed : {};
  }catch(e){
    console.error('Dedicated FX cache load failed',e);
    return {};
  }
}
function setDedicatedFxCache(cache){
  if(!localStorageAvailable()) return false;
  try{
    window.localStorage.setItem(FX_CACHE_STORAGE_KEY,JSON.stringify(cache||{}));
    return true;
  }catch(e){
    console.error('Dedicated FX cache save failed',e);
    return false;
  }
}
function mergeDedicatedFxCacheIntoState(state){
  if(!state || typeof state!=='object') return state;
  if(!state.fxHistory || typeof state.fxHistory!=='object' || Array.isArray(state.fxHistory)) state.fxHistory={};
  const dedicated=getDedicatedFxCache();
  Object.entries(dedicated).forEach(([date,entry])=>{
    if(!entry || !entry.rates) return;
    const current=state.fxHistory[date];
    // Keep the most recently fetched copy when both locations contain the date.
    if(!current || String(entry.fetchedAt||'')>=String(current.fetchedAt||'')){
      state.fxHistory[date]=entry;
    }
  });
  return state;
}

function setSaveWarning(detail){
  SAVE_WARNING_ACTIVE = true;
  SAVE_WARNING_DETAIL = detail;
  SAVE_WARNING_DISMISSED = false;
  renderSaveWarningBanner();
}
function clearSaveWarning(){
  if(!SAVE_WARNING_ACTIVE) return;
  SAVE_WARNING_ACTIVE = false;
  renderSaveWarningBanner();

async function loadState(){
  // For a normal local HTML file, use browser localStorage first.
  const localState = getLocalState();
  if(localState) return mergeDedicatedFxCacheIntoState(mergeBundledFxHistory(localState));

  // If running inside an artifact with window.storage, preserve support
  // for that environment and migrate the first loaded state into localStorage too.
  if(storageApiExists()){
    try{
      const res = await window.storage.get('marketplace-tracker-clean-import-v1');
      if(res && res.value){
        const state = mergeDedicatedFxCacheIntoState(mergeBundledFxHistory(JSON.parse(res.value)));
        setLocalState(state);
        return state;
      }
    }catch(e){
      console.error('Artifact storage load failed', e);
    }
  }

  const fxOnly=getDedicatedFxCache();
  if(Object.keys(fxOnly).length){
    const state=JSON.parse(JSON.stringify(SEED_DATA));
    state.fxHistory=fxOnly;
    mergeBundledFxHistory(state);
    return state;
  }
  return null;
}

async function saveState(state, attempt){
  attempt = attempt || 1;
  const serialized = JSON.stringify(state);

  // Primary persistence for this standalone/local HTML file.
  if(localStorageAvailable()){
    try{
      window.localStorage.setItem(LOCAL_STORAGE_KEY, serialized);
      LAST_SAVED_SNAPSHOT = serialized;
      clearSaveWarning();
      return true;
    }catch(e){
      console.error('Local storage save failed (attempt '+attempt+')', e);
      // If localStorage is unavailable/quota-limited, try the host API below.
    }
  }

  // Keep the original artifact storage as a secondary option when available.
  if(storageApiExists()){
    try{
      const result = await window.storage.set('marketplace-tracker-clean-import-v1', serialized);
      if(!result) throw new Error('storage.set returned no result');
      LAST_SAVED_SNAPSHOT = serialized;
      clearSaveWarning();
      return true;
    }catch(e){
      console.error('Artifact storage save failed (attempt '+attempt+')', e);
      if(attempt < 2){
        await new Promise(r=>setTimeout(r, 250));
        return saveState(state, attempt+1);
      }
      const detail = (e && e.message) ? e.message : 'unknown storage error';
      setSaveWarning(detail);
      return false;
    }
  }

  setSaveWarning('browser localStorage is not available');
  return false;
}

function cleanShortName(value){
  return String(value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
}
function cleanShortName(value){
  return String(value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
}
function shortNameParts(name){
  const raw=String(name||'').trim();
  const words=raw.split(/\s+/).map(w=>w.replace(/[^A-Za-z0-9]/g,'')).filter(Boolean);
  let version='';
  const semantic=[];
  words.forEach(w=>{
    const m=w.match(/^v(\d+)$/i);
    if(m) version=m[1]; else semantic.push(w);
  });
  return {raw,words,semantic,version};
}
function automaticBaseShortName(name){
  const {words,semantic}=shortNameParts(name);
  if(!words.length) return 'P';
  const source=semantic.length?semantic:words;
  const initials=source.map(w=>w[0]).join('').toUpperCase();
  // Prefer meaningful initials, with a target of up to three characters:
  // one word -> I, two words -> NI, three+ words -> NIS.
  return cleanShortName(initials.slice(0,3) || 'P');
}
function rawInitialCode(name){ return automaticBaseShortName(name); }
function shortNameCandidates(name,length){
  const {raw,semantic,version}=shortNameParts(name);
  const compact=raw.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const semanticCompact=semantic.join('').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const initials=semantic.map(w=>w[0]).join('').toUpperCase();
  const out=[];
  const add=s=>{
    s=cleanShortName(s);
    if(s.length===length && !out.includes(s)) out.push(s);
  };

  add((initials+semanticCompact).slice(0,length));
  add(semanticCompact.slice(0,length));
  add(compact.replace(/V(?=\d)/ig,'').slice(0,length));
  if(semanticCompact) add((semanticCompact[0]+semanticCompact.slice(-Math.max(0,length-1))).slice(0,length));

  const chars=semanticCompact||compact||initials||'P';
  if(chars.length){
    const first=chars[0], rest=chars.slice(1);
    const choose=(prefix,start,need)=>{
      if(need===0){ add(prefix); return; }
      for(let i=start;i<rest.length;i++) choose(prefix+rest[i],i+1,need-1);
    };
    choose(first,0,length-1);
  }
  for(let n=1;n<=99;n++){
    const suffix=String(n);
    const prefix=(semanticCompact||compact||initials||'P').slice(0,Math.max(1,length-suffix.length));
    add((prefix+suffix).slice(0,length));
  }
  return out;
}
function generateUniqueShortName(name,products,excludeId){
  const used=new Set((products||[]).filter(p=>p.id!==excludeId).map(p=>cleanShortName(p.shortName)).filter(Boolean));
  const natural=automaticBaseShortName(name);
  if(natural && !used.has(natural)) return natural;

  // Version digits are a collision resolver, not part of the normal abbreviation.
  // Nice Interaction System V2 -> NIS normally; if NIS exists -> NIS2.
  const {version}=shortNameParts(name);
  if(version){
    const withVersion=cleanShortName(natural+version);
    if(withVersion.length<=5 && !used.has(withVersion)) return withVersion;
  }

  // Otherwise stay as concise as possible, aiming at 3 first, then 4 and 5.
  for(const length of [3,4,5]){
    for(const candidate of shortNameCandidates(name,length)){
      if(!used.has(candidate)) return candidate;
    }
  }
  for(let n=0;n<1000;n++){
    const candidate=cleanShortName('P'+n.toString(36).toUpperCase());
    if(candidate && !used.has(candidate)) return candidate;
  }
  return 'P';
}
function shortNameFor(p){
  const code=cleanShortName(p&&p.shortName);
  return code || automaticBaseShortName(p&&p.name);
}
function inferredFirstSaleDateFromState(state, pid){
  const entries = (state.revenue||[]).filter(r=>r.productId===pid);
  if(entries.length===0) return todayStr();
  return entries.reduce((min,r)=> r.date<min ? r.date : min, entries[0].date);
}
function normalizeState(state){
  if(!state.settings) state.settings = {applyRevenueShare:true};
  if(state.settings.showEstimatedSalePeriods===undefined) state.settings.showEstimatedSalePeriods = true;
  if(state.settings.subtractGeneralSpendingFromNumbers===undefined) state.settings.subtractGeneralSpendingFromNumbers = true;
  if(state.settings.useHistoricalExchangeRates===undefined) state.settings.useHistoricalExchangeRates = true;
  if(!Object.prototype.hasOwnProperty.call(CURRENCY_RATES_FROM_USD,state.settings.displayCurrency)) state.settings.displayCurrency='USD';
  if(!Array.isArray(state.priceHistory)) state.priceHistory = [];
  if(!Array.isArray(state.licenseHistory)) state.licenseHistory = [];
  if(!Array.isArray(state.refundHistory)) state.refundHistory = [];
  if(!state.fxHistory || typeof state.fxHistory!=='object' || Array.isArray(state.fxHistory)) state.fxHistory = {};
  mergeBundledFxHistory(state);
  if(!state.fxSync || typeof state.fxSync!=='object') state.fxSync = {inProgress:false,lastError:null,startedAt:null,completedAt:null};
  const used = new Set();
  state.products.forEach(p=>{
    if(p.revenueSharePercent===undefined) p.revenueSharePercent = 100;
    if(p.hoursMarketing===undefined) p.hoursMarketing = 0;
    if(p.ratingsTotal===undefined) p.ratingsTotal = 0;
    if(p.adsSpend===undefined) p.adsSpend = 0;
    if(!p.aliases) p.aliases = [p.name];
    let code = cleanShortName(p.shortName);
    if(code.length<1 || code.length>5 || used.has(code)){
      const temp = Array.from(used).map((c,i)=>({id:'used_'+i,shortName:c,name:c}));
      code = generateUniqueShortName(p.name, temp, null);
    }
    p.shortName = code;
    used.add(code);
    if(!p.releaseDate) p.releaseDate = inferredFirstSaleDateFromState(state,p.id);
  });
  return state;
}

async function init(){
  // Render immediately with the seed data so the page is never blank while we figure out,
  // in the background, whether storage is available and whether saved data exists.
  STATE = normalizeState(JSON.parse(JSON.stringify(SEED_DATA)));
  render();

  const loaded = await loadState();
  if(loaded){
    STATE = normalizeState(loaded);
    LAST_SAVED_SNAPSHOT = JSON.stringify(STATE);
    render();
  }
  // If nothing was loaded (fresh install, or storage isn't available), just carry on with the
  // in-memory seed — no save is attempted here, so simply opening the page never triggers a
  // save-failure warning. The first real edit will save (or warn) via persist().
}

async function persist(){
  if(STATE && STATE.fxHistory) setDedicatedFxCache(STATE.fxHistory);
  return await saveState(STATE);
}

/* ---------- Product matching for CSV import ----------
   Only an exact alias match auto-resolves silently. Anything else always
   goes to the review list — jaccard() is only used to pick a sensible
   default suggestion in that review UI, never to auto-merge on its own. */
function normalizeTitle(s){
  let t = (s||'').toLowerCase();
  t = t.replace(/[^a-z0-9\s]/g,' ');
  t = t.replace(/\s+/g,' ').trim();
  return t;
}
function wordSet(s){ return new Set(normalizeTitle(s).split(' ').filter(Boolean)); }
function jaccard(a,b){
  const A = wordSet(a), B = wordSet(b);
  if(A.size===0 || B.size===0) return 0;
  let inter=0;
  A.forEach(w=>{ if(B.has(w)) inter++; });
  const union = A.size + B.size - inter;
  return union ? inter/union : 0;
}
// Returns {product, mode} where mode is 'exact' (auto-resolved) or 'review' (needs a decision)
function matchProduct(rawTitle, products){
  const rawLower = rawTitle.trim().toLowerCase();
  for(const p of products){
    if((p.aliases||[]).some(a=>a.trim().toLowerCase()===rawLower)) return {product:p, mode:'exact'};
  }
  return {product:null, mode:'review'};
}
// Best-guess existing product for a title that needs review, used only to prefill the UI.
function suggestClosestProduct(rawTitle, products){
  let best=null, bestScore=0;
  for(const p of products){
    let score = jaccard(rawTitle, p.name);
    (p.aliases||[]).forEach(a=>{ score = Math.max(score, jaccard(rawTitle,a)); });
    if(score>bestScore){ bestScore=score; best=p; }
  }
  return { product: best, score: bestScore };
}

function mergeBundledFxHistory(state){
  if(!state || typeof state!=='object') return state;
  if(!state.fxHistory || typeof state.fxHistory!=='object' || Array.isArray(state.fxHistory)) state.fxHistory={};

  // Bundled history is a baseline only. Never overwrite a rate already present
  // in the user's state/cache, because a successfully downloaded value wins.
  Object.entries(BUNDLED_HISTORICAL_FX).forEach(([date,entry])=>{
    if(!state.fxHistory[date]) state.fxHistory[date]=entry;
  });
  return state;
}

function fxPayoutDateForRevenueMonth(yearMonth){
  const [y,m]=String(yearMonth).split('-').map(Number);
  if(!y || !m) return todayStr();
  const d=new Date(y,m,0,12,0,0,0); // final day of revenue month
  d.setDate(d.getDate()+30);        // estimated payout/conversion date
  return localDateString(d);
}
function fxPayoutDateForRevenueDate(dateStr){
  return fxPayoutDateForRevenueMonth(String(dateStr||'').slice(0,7));
}
function cachedFxEntries(){
  return Object.entries((STATE && STATE.fxHistory)||{})
    .filter(([,entry])=>entry && entry.rates && typeof entry.rates==='object')
    .sort((a,b)=>a[0].localeCompare(b[0]));
}
function latestCachedRealRate(code=displayCurrencyCode()){
  if(code==='USD') return 1;
  const entries=cachedFxEntries();
  for(let i=entries.length-1;i>=0;i--){
    const rate=Number(entries[i][1].rates[code]);
    if(Number.isFinite(rate) && rate>0) return rate;
  }
  return null;
}
function currentPreferredCurrencyRate(code=displayCurrencyCode()){
  if(code==='USD') return 1;
  const cached=latestCachedRealRate(code);
  return cached || fallbackCurrencyRate(code);
}
function historicalFxRateForRevenueDate(dateStr,code=displayCurrencyCode()){
  if(code==='USD') return 1;
  if(!STATE.settings.useHistoricalExchangeRates) return fallbackCurrencyRate(code);

  const payoutDate=fxPayoutDateForRevenueDate(dateStr);
  const exact=STATE.fxHistory && STATE.fxHistory[payoutDate];
  const exactRate=exact && exact.rates ? Number(exact.rates[code]) : NaN;
  if(Number.isFinite(exactRate) && exactRate>0) return exactRate;

  // If an exact historical payout date is missing, prefer the newest real rate
  // already cached BEFORE that payout date. Only then use the hard-coded fallback.
  const entries=cachedFxEntries();
  for(let i=entries.length-1;i>=0;i--){
    const [requestedDate,entry]=entries[i];
    if(requestedDate>payoutDate) continue;
    const rate=Number(entry.rates && entry.rates[code]);
    if(Number.isFinite(rate) && rate>0) return rate;
  }
  return fallbackCurrencyRate(code);
}

function earliestFxRelevantProductDate(){
  // Imported revenue is authoritative for FX coverage. This intentionally does
  // not rely on the stored product release date, because an overlapping/later
  // CSV can introduce older sales for an already-existing product.
  const revenueDates=(STATE.revenue||[]).map(r=>r.date).filter(Boolean).sort();
  if(revenueDates.length) return revenueDates[0];

  // Fallback only for a product that exists before any revenue rows do.
  const productDates=(STATE.products||[]).map(p=>p.releaseDate).filter(Boolean).sort();
  return productDates.length?productDates[0]:null;
}
function requiredHistoricalFxDates(){
  const oldest=earliestFxRelevantProductDate();
  if(!oldest) return [];
  const firstMonth=oldest.slice(0,7);
  const [fy,fm]=firstMonth.split('-').map(Number);
  const today=todayStr();
  const out=[];
  let y=fy,m=fm;
  while(true){
    const ym=`${y}-${String(m).padStart(2,'0')}`;
    const payoutDate=fxPayoutDateForRevenueMonth(ym);
    if(payoutDate>today) break;
    out.push({revenueMonth:ym,payoutDate});
    m++;
    if(m>12){m=1;y++;}
    if(y>new Date().getFullYear()+1) break;
  }
  return out;
}
function cachedFxDateComplete(payoutDate){
  const entry=STATE.fxHistory && STATE.fxHistory[payoutDate];
  if(!entry || !entry.rates) return false;
  return FX_TARGET_CURRENCIES.every(code=>{
    const r=Number(entry.rates[code]);
    return Number.isFinite(r) && r>0;
  });
}
function fxCoverageInfo(){
  const required=requiredHistoricalFxDates();
  const complete=required.filter(x=>cachedFxDateComplete(x.payoutDate));
  const missing=required.filter(x=>!cachedFxDateComplete(x.payoutDate));
  const cached=cachedFxEntries();
  const requiredDates=new Set(required.map(x=>x.payoutDate));
  const cachedOutsideCurrentRange=cached.filter(([date])=>!requiredDates.has(date)).length;

  let latestSourceDate=null;
  complete.forEach(({payoutDate})=>{
    const entry=STATE.fxHistory && STATE.fxHistory[payoutDate];
    if(entry && entry.sourceDate && (!latestSourceDate || entry.sourceDate>latestSourceDate)){
      latestSourceDate=entry.sourceDate;
    }
  });

  return {required,complete,missing,latestSourceDate,cachedOutsideCurrentRange};
}

/* ---------- Time range resolution (used by the two chart-specific selectors) ---------- */
const TIME_PRESETS = [
  { id:'all', label:'All time' },
  { id:'this_month', label:'This month' },
  { id:'this_year', label:'This year' },
  { id:'30d', label:'Last 30 days', days:30 },
  { id:'2m', label:'Last 60 days', days:60 },
  { id:'3m', label:'Last 90 days', days:90 },
  { id:'6m', label:'Last 180 days', days:180 },
  { id:'1y', label:'Last 365 days', days:365 },
  { id:'2y', label:'Last 2 years', days:730 },
  { id:'3y', label:'Last 3 years', days:1095 },
  { id:'custom', label:'Custom range…' }
];
function earliestSaleDateOrNull(pid){
  const entries = STATE.revenue.filter(r=>r.productId===pid);
  if(entries.length===0) return null;
  return entries.reduce((min,r)=> r.date<min ? r.date : min, entries[0].date);
}
// Resolves a {preset,start,end} selector + the currently filtered products into a concrete
// {start,end} date range. 'all' dynamically resolves to the earliest sale among the
// *currently filtered* products through today (it needs concrete bounds to bucket by day/month).
function resolveRange(tf, products){
  const today = todayStr();
  if(tf.preset==='custom') return { start: tf.start||today, end: tf.end||today };
  if(tf.preset==='this_month') return { start: today.slice(0,7)+'-01', end: today };
  if(tf.preset==='this_year') return { start: today.slice(0,4)+'-01-01', end: today };
  if(tf.preset==='all'){
    let earliest = null;
    products.forEach(p=>{
      const d = earliestSaleDateOrNull(p.id);
      if(d && (earliest===null || d<earliest)) earliest = d;
    });
    return { start: earliest || today, end: today };
  }
  const preset = TIME_PRESETS.find(p=>p.id===tf.preset);
  if(preset && preset.days){
    const d = new Date();
    d.setHours(12,0,0,0);
    d.setDate(d.getDate() - (preset.days-1));
    return { start: localDateString(d), end: today };
  }
  return { start: today, end: today };
}
function rangeDayCount(range){
  return Math.round((new Date(range.end) - new Date(range.start)) / 86400000) + 1;
}
function monthsInRange(range){
  const out = [];
  let [y,m] = range.start.slice(0,7).split('-').map(Number);
  const [ey,em] = range.end.slice(0,7).split('-').map(Number);
  while(y<ey || (y===ey && m<=em)){
    out.push(`${String(y).padStart(4,'0')}-${String(m).padStart(2,'0')}`);
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}
function localDateString(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysInRangeList(range){
  const days = [];
  const [sy,sm,sd]=range.start.split('-').map(Number);
  const [ey,em,ed]=range.end.split('-').map(Number);
  let d = new Date(sy,sm-1,sd,12,0,0,0);
  const endD = new Date(ey,em-1,ed,12,0,0,0);
  while(d<=endD){
    days.push(localDateString(d));
    d.setDate(d.getDate()+1);
  }
  return days;
}
function dayLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return names[d.getMonth()] + ' ' + d.getDate();
}

  const el = document.getElementById('tabContent');
  if(ACTIVE_TAB==='dashboard') el.innerHTML = dashboardHTML();
  else if(ACTIVE_TAB==='compare') el.innerHTML = compareProductsHTML();
  else if(ACTIVE_TAB==='revenuelog') el.innerHTML = revenueLogHTML();
  else if(ACTIVE_TAB==='import') el.innerHTML = importHTML();
  else if(ACTIVE_TAB==='products') el.innerHTML = productsHTML();
  else if(ACTIVE_TAB==='settings') el.innerHTML = settingsHTML();
  else if(ACTIVE_TAB==='data') el.innerHTML = dataHTML();

  if(ACTIVE_TAB==='dashboard') setTimeout(mountDashboardCharts, 0);
  else if(ACTIVE_TAB==='compare'){
    if(COMPARE_DEFERRED_RENDER){
      requestAnimationFrame(()=>{
        updateCompareLoadingViewport();
        requestAnimationFrame(()=>{
          setTimeout(()=>{
            if(ACTIVE_TAB!=='compare') return;
            COMPARE_DEFERRED_RENDER=false;
            renderTabContent();
          },70);
        });
      });
    }else{
      setTimeout(mountCompareProductsChart,0);
    }
  }
  wireTabEvents();

  requestAnimationFrame(()=>{
    const topbar=document.querySelector('.topbar');
    if(topbar){
      document.documentElement.style.setProperty('--sticky-filter-top',`${Math.ceil(topbar.getBoundingClientRect().height)}px`);
    }
    if(ACTIVE_TAB==='dashboard' || ACTIVE_TAB==='compare' || ACTIVE_TAB==='revenuelog'){
      const filter=document.querySelector('.sticky-filter-bar');
      if(filter){
        document.documentElement.style.setProperty('--revenue-log-grid-sticky-top',`${Math.ceil(filter.getBoundingClientRect().bottom)}px`);
      }
    }
    if(ACTIVE_TAB==='compare') updateCompareLoadingViewport();
    if(ACTIVE_TAB==='revenuelog' && REVENUE_LOG_SCROLL_TO_BOTTOM_ON_RENDER){
      REVENUE_LOG_SCROLL_TO_BOTTOM_ON_RENDER=false;
      scrollRevenueLogToBottom('auto');
    }
  });
}

function formatProductAge(ageMonths){
  const months=Math.max(0,Number(ageMonths)||0);
  if(months>=12){
    return `${(months/12).toFixed(1)} years`;
  }
  return `${months.toFixed(1)} months`;
}

function dashboardYearSummaryHTML(products){
  if(!products.length) return '';
  const ids=new Set(products.map(p=>p.id));
  const dates=STATE.revenue.filter(r=>ids.has(r.productId)).map(r=>r.date).filter(Boolean).sort();
  if(!dates.length) return '';

  const firstYear=Number(dates[0].slice(0,4));
  const currentYear=Number(todayStr().slice(0,4));
  const cards=[];

  for(let year=firstYear;year<=currentYear;year++){
    const start=`${year}-01-01`;
    const end=`${year}-12-31`;
    const revenue=products.reduce((sum,p)=>{
      return sum+rawNetForProductRange(p,start,end);
    },0);

    let projectionHTML='';
    if(year===currentYear){
      const now=new Date();
      const startOfYear=new Date(now.getFullYear(),0,1,12,0,0,0);
      const todayLocal=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12,0,0,0);
      const dayOfYear=Math.max(1,Math.floor((todayLocal-startOfYear)/86400000)+1);
      const projected=revenue/dayOfYear*365;
      projectionHTML=`
        <span class="year-summary-projection" tabindex="0" aria-label="Estimated year-end net revenue">
          ↗
          <span class="year-summary-projection-tooltip">
            <span class="year-summary-projection-amount">${fmtMoney(projected)}</span>
            <span class="year-summary-projection-copy">Estimated year-end net revenue based on ${dayOfYear} elapsed day${dayOfYear===1?'':'s'} at the current average daily run rate.</span>
          </span>
        </span>
      `;
    }

    cards.push(`
      <div class="year-summary-card">
        ${projectionHTML}
        <div class="year">${year}</div>
        <div class="revenue">${fmtMoney(revenue)}</div>
        <div class="net-label">net</div>
      </div>
    `);
  }

  return `<div class="year-summary-row">${cards.join('')}</div>`;
}

function updateCompareLoadingViewport(){
  const overlay=document.getElementById('compareProductsLoadingOverlay');
  const content=document.getElementById('compareProductsContent');
  if(!overlay || !content || !overlay.classList.contains('visible')) return;

  const rect=content.getBoundingClientRect();
  const topbar=document.querySelector('.topbar');
  const filter=document.querySelector('.sticky-filter-bar');
  const topbarBottom=topbar?topbar.getBoundingClientRect().bottom:0;
  const filterBottom=filter?filter.getBoundingClientRect().bottom:topbarBottom;

  const top=Math.max(0,filterBottom,rect.top);
  const bottom=Math.min(window.innerHeight,rect.bottom);
  const left=Math.max(0,rect.left);
  const right=Math.min(window.innerWidth,rect.right);
  const width=Math.max(0,right-left);
  const height=Math.max(0,bottom-top);

  overlay.style.left=Math.round(left)+'px';
  overlay.style.top=Math.round(top)+'px';
  overlay.style.width=Math.round(width)+'px';
  overlay.style.height=Math.round(height)+'px';
  overlay.style.visibility=(width>0 && height>0)?'visible':'hidden';
}
function showCompareLoadingOverlay(){
  const overlay=document.getElementById('compareProductsLoadingOverlay');
  if(!overlay) return;
  overlay.classList.add('visible');
  overlay.style.visibility='hidden';
  updateCompareLoadingViewport();
}

function dailyRevenuePerHourIncreaseSeries(p){
  const start=firstSaleDate(p.id);
  const end=todayStr();
  const hours=totalHoursForProduct(p);
  if(!start || !end || hours<=0) return [];

  const days=daysInRangeList({start,end});
  return days.map(date=>{
    const dayRevenue=chartNetForProductRange(p,date,date);
    return displayMoneyValue(dayRevenue)/hours;
  });
}

function performanceRelativeToDevelopmentTime(p){
  const series=dailyRevenuePerHourIncreaseSeries(p);
  if(!series.length) return 0;
  const mean=series.reduce((s,v)=>s+(Number(v)||0),0)/series.length;
  return mean*100;
}

function performanceEvolutionDailySeries(p){
  const start=firstSaleDate(p.id);
  const end=todayStr();
  const hours=totalHoursForProduct(p);
  if(!start || !end || hours<=0) return {days:[],values:[]};

  const days=daysInRangeList({start,end});
  let cumulative=0;

  const values=days.map((date,index)=>{
    const dayRevenue=chartNetForProductRange(p,date,date);

    const dailyIncrease=displayMoneyValue(dayRevenue)/hours;
    cumulative+=dailyIncrease;

    // Excel equivalent:
    // AVERAGE($T$first:T_current)*100
    return (cumulative/(index+1))*100;
  });

  return {days,values};
}

function performanceEvolutionMonthlySeries(p,months,range){
  const daily=performanceEvolutionDailySeries(p);
  if(!daily.days.length) return months.map(()=>null);

  const byMonthLast=new Map();
  daily.days.forEach((date,index)=>{
    if(date<range.start || date>range.end) return;
    byMonthLast.set(monthKey(date),daily.values[index]);
  });

  // For monthly chart alignment, use the final cumulative-average value of each month.
  // Before the product existed, keep null so no line is drawn.
  let lastKnown=null;
  return months.map(m=>{
    if(byMonthLast.has(m)) lastKnown=byMonthLast.get(m);
    return lastKnown;
  });
}



function unitsSoldForProduct(p){
  return STATE.units
    .filter(u=>u.productId===p.id)
    .reduce((s,u)=>s+Number(u.units||0),0);
}

function productCompareSummaryHTML(products){
  if(!products.length) return '';

  const rows=products.map(p=>{
    const age=monthsBetween(firstSaleDate(p.id),todayStr());
    const revenue=netRevenueForProduct(p);
    const hours=totalHoursForProduct(p);
    const perHour=hours>0?revenue/hours:0;
    const performance=performanceRelativeToDevelopmentTime(p);
    const units=unitsSoldForProduct(p);
    const revenueRelativeToAge=age>0?revenue/age:0;
    return {p,age,revenue,perHour,performance,units,hours,revenueRelativeToAge};
  });

  const maxOf=key=>Math.max(0,...rows.map(r=>Number(r[key])||0));
  const best={
    age:maxOf('age'),
    revenue:maxOf('revenue'),
    perHour:maxOf('perHour'),
    performance:maxOf('performance'),
    units:maxOf('units'),
    hours:maxOf('hours'),
    revenueRelativeToAge:maxOf('revenueRelativeToAge')
  };
  const pct=(v,b)=>b>0?Math.max(0,Math.min(100,(Number(v)||0)/b*100)):0;
  const ids=products.map(x=>x.id);

  const box=(title,key,formatter,rowFilter=null)=>{
    const visibleRows=rowFilter?rows.filter(rowFilter):rows;
    if(!visibleRows.length) return '';
    return `
    <div class="panel product-compare-summary-box">
      <div class="product-compare-summary-title">${title}</div>
      ${visibleRows.map(r=>`
        <div class="product-compare-summary-row" style="--fill:${pct(r[key],best[key]).toFixed(1)}%;">
          <div class="product-compare-summary-name">
            <span class="dot" style="background:${colorFor(r.p.id,ids)}"></span>
            <span>${shortNameFor(r.p)}</span>
          </div>
          <div class="product-compare-summary-value">${formatter(r[key])}</div>
        </div>
      `).join('')}
    </div>
  `;
  };

  return `
    <div class="product-compare-summary-grid">
      ${hasAnyWorkingHours()?box('Performance relative to development time','performance',v=>Number(v).toFixed(2)):''}
      ${box('Net revenue','revenue',v=>fmtMoney(v))}
      ${hasAnyWorkingHours()?box('Net revenue / hour','perHour',v=>`${fmtMoney2(v)} / hr`):''}
      ${box('Product age','age',v=>formatProductAge(v))}
      ${box('Units sold','units',v=>Math.floor(Number(v)||0).toLocaleString())}
      ${hasAnyWorkingHours()?box('Hours spent','hours',v=>`${Number(v).toLocaleString(undefined,{maximumFractionDigits:1})} h`,r=>r.hours>0):''}
      ${box('Net revenue relative to age','revenueRelativeToAge',v=>`${fmtMoney(v)} / month`)}
    </div>
  `;
}

function hexToRgba(hex,alpha){
  const h=String(hex||'').replace('#','');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return `rgba(139,147,163,${alpha})`;
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function externalRevenueTooltip(context){
  const {chart,tooltip}=context;
  const parent=chart.canvas.parentNode;
  if(getComputedStyle(parent).position==='static') parent.style.position='relative';

  let el=parent.querySelector('.chart-revenue-tooltip');
  if(!el){
    el=document.createElement('div');
    el.className='chart-revenue-tooltip';
    parent.appendChild(el);
  }

  if(tooltip.opacity===0){
    el.style.opacity='0';
    return;
  }

  const title=tooltip.title&&tooltip.title.length?tooltip.title[0]:'';
  const rows=(tooltip.dataPoints||[]).map(dp=>{
    const value=Number(dp.raw)||0;
    const zero=Math.abs(value)<0.000001?' zero':'';
    const color=dp.dataset._baseRevenueColor || '#8B93A3';
    return `<div class="crt-row${zero}">
      <span class="crt-dot" style="background:${color}"></span>
      <span class="crt-code">${dp.dataset.label}</span>
      <span class="crt-value">${fmtMoney(value)}</span>
    </div>`;
  }).join('');
  const total=(tooltip.dataPoints||[]).reduce((s,dp)=>s+(Number(dp.raw)||0),0);
  const nextHTML=`<div class="crt-title">${title}</div>${rows}<div class="crt-total"><span>Total</span><span>${fmtMoney(total)}</span></div>`;
  if(el.innerHTML!==nextHTML) el.innerHTML=nextHTML;

  const canvasRect=chart.canvas.getBoundingClientRect();
  const parentRect=parent.getBoundingClientRect();
  const canvasLeft=canvasRect.left-parentRect.left;
  const canvasTop=canvasRect.top-parentRect.top;
  const w=el.offsetWidth||200;
  const h=el.offsetHeight||120;

  // Follow Chart.js' caret/bar position like the earlier native tooltip.
  // Prefer the right side of the hovered bar; flip left near the panel edge.
  let x=canvasLeft+tooltip.caretX+12;
  let y=canvasTop+tooltip.caretY-Math.min(22,h*.18);

  if(x+w>parent.clientWidth-6){
    x=canvasLeft+tooltip.caretX-w-12;
  }
  x=Math.max(6,Math.min(parent.clientWidth-w-6,x));

  // Keep the box inside the chart vertically while remaining visually attached.
  y=Math.max(6,Math.min(parent.clientHeight-h-6,y));

  el.style.transform=`translate3d(${Math.round(x)}px,${Math.round(y)}px,0)`;
  el.style.opacity='1';
}

const yearAxisSeparatorsPlugin={
  id:'yearAxisSeparators',
  beforeDatasetsDraw(chart,args,opts){
    if(!opts||!opts.enabled) return;
    const x=chart.scales.x;
    const area=chart.chartArea;
    const buckets=chart.$timeBuckets || [];
    if(!x || !area || buckets.length<2) return;

    const yearOf=s=>String(s||'').slice(0,4);
    const monthOf=s=>String(s||'').slice(5,7);

    const ctx=chart.ctx;
    ctx.save();
    ctx.strokeStyle='#2A3140';
    ctx.lineWidth=1;
    ctx.lineCap='butt';

    for(let i=1;i<buckets.length;i++){
      const prev=String(buckets[i-1]||'');
      const cur=String(buckets[i]||'');

      // Only mark a real Dec -> Jan year boundary.
      if(yearOf(prev)===yearOf(cur)) continue;
      if(monthOf(prev)!=='12' || monthOf(cur)!=='01') continue;

      const prevX=x.getPixelForValue(i-1);
      const curX=x.getPixelForValue(i);
      if(!Number.isFinite(prevX)||!Number.isFinite(curX)) continue;

      const px=(prevX+curX)/2;

      ctx.beginPath();
      ctx.moveTo(px,area.top);
      ctx.lineTo(px,area.bottom);
      ctx.stroke();
    }
    ctx.restore();
  },
  afterDraw(chart,args,opts){
    if(!opts||!opts.enabled) return;
    const x=chart.scales.x;
    const area=chart.chartArea;
    const buckets=chart.$timeBuckets || [];
    if(!x || !area || buckets.length<2) return;

    const monthSerial=s=>{
      const text=String(s||'');
      const y=Number(text.slice(0,4));
      const m=Number(text.slice(5,7));
      return Number.isFinite(y)&&Number.isFinite(m)&&m>=1&&m<=12 ? y*12+(m-1) : null;
    };

    const firstSerial=monthSerial(buckets[0]);
    const lastSerial=monthSerial(buckets[buckets.length-1]);
    if(firstSerial===null||lastSerial===null) return;

    const x0=x.getPixelForValue(0);
    const x1=x.getPixelForValue(1);
    const monthStep=x1-x0;
    if(!Number.isFinite(x0)||!Number.isFinite(monthStep)||Math.abs(monthStep)<.001) return;

    const firstYear=Math.floor(firstSerial/12);
    const lastYear=Math.floor(lastSerial/12);

    const ctx=chart.ctx;
    ctx.save();
    ctx.font='900 22px Roboto, Arial, sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='top';

    // Include one virtual neighboring year on each side. Their centers can be
    // outside the canvas and naturally clip, which keeps annual spacing constant.
    for(let year=firstYear-1;year<=lastYear+1;year++){
      const janSerial=year*12;
      const decSerial=janSerial+11;
      const centerSerial=janSerial+5.5;
      const centerIndex=centerSerial-firstSerial;
      const centerX=x0+centerIndex*monthStep;

      const fullYear=janSerial>=firstSerial && decSerial<=lastSerial;
      const touchesVisible=decSerial>=firstSerial && janSerial<=lastSerial;

      ctx.fillStyle=fullYear
        ? 'rgba(237,239,243,.78)'
        : (touchesVisible ? 'rgba(237,239,243,.28)' : 'rgba(237,239,243,.12)');

      const y=Math.min(chart.height-24,area.bottom+30);
      ctx.fillText(String(year),centerX,y);
    }

    ctx.restore();
  }
}
Chart.register(yearAxisSeparatorsPlugin);

function niceMoneyStep(maxValue,targetMajorTicks=5){
  const max=Math.max(0,Number(maxValue)||0);
  if(max<=0) return 10;
  const rough=max/Math.max(2,targetMajorTicks);
  const exponent=Math.pow(10,Math.floor(Math.log10(rough)));
  const fraction=rough/exponent;
  let niceFraction;
  if(fraction<=1) niceFraction=1;
  else if(fraction<=2) niceFraction=2;
  else if(fraction<=2.5) niceFraction=2.5;
  else if(fraction<=5) niceFraction=5;
  else niceFraction=10;
  return niceFraction*exponent;
}
function compactMoneyAxis(value,withDollar=true){
  const n=Number(value)||0;
  const abs=Math.abs(n);
  let text;
  if(abs>=1000000){
    const v=n/1000000;
    text=(Number.isInteger(v)?v:v.toFixed(1))+'m';
  }else if(abs>=1000){
    const v=n/1000;
    text=(Number.isInteger(v)?v:v.toFixed(1))+'k';
  }else{
    text=(Number.isInteger(n)?n:Number(n.toFixed(2))).toLocaleString('de-DE');
  }
  return (withDollar?displayCurrencySymbol():'')+text;
}
function isMajorTick(value,major){
  const ratio=(Number(value)||0)/major;
  return Math.abs(ratio-Math.round(ratio))<1e-7;
}

function mountDashboardCharts(){

  const gridColor = '#2A3140';
  const tickColor = '#8B93A3';
  const allSelected = ACTIVE_FILTER==='all';
  const combinedLabel = allSelected ? 'All products' : 'Selected total';
  Chart.defaults.font.family = "'Roboto', Arial, sans-serif";
  Chart.defaults.color = tickColor;

  // ---- Revenue per product (its own time range + daily/monthly toggle) ----
  destroyChart('chartMonthlyRevenue');
  {
    const range = resolveRange(TF_PRODUCT_CHART, products);
    const dailyAllowed = rangeDayCount(range)<=90;
    const granularity = dailyAllowed ? CHART_GRANULARITY : 'monthly';
    const buckets = granularity==='daily' ? daysInRangeList(range) : monthsInRange(range);
    const labelFn = granularity==='daily' ? dayLabel : monthLabel;

    const seriesByProduct = {};
    products.forEach(p=>{
      const share = revenueShareMultiplier(p);
      seriesByProduct[p.id] = buckets.map(bucket=>{
        if(granularity==='daily') return chartNetForProductRange(p,bucket,bucket);
        const [y,m]=bucket.split('-').map(Number);
        const bucketStart=`${bucket}-01`;
        const bucketEnd=`${bucket}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;
        const start=bucketStart<range.start?range.start:bucketStart;
        const end=bucketEnd>range.end?range.end:bucketEnd;
        return chartNetForProductRange(p,start,end);
      });
    });

    const revenueStackMax=buckets.reduce((mx,_,i)=>Math.max(mx,products.reduce((s,p)=>s+(Number(seriesByProduct[p.id][i])||0),0)),0);
    const revenueMajorStep=niceMoneyStep(revenueStackMax,5);
    const revenueMinorStep=revenueMajorStep/2;
    const revenueAxisMax=Math.max(revenueMajorStep,Math.ceil(revenueStackMax/revenueMajorStep)*revenueMajorStep);

    const ctx = document.getElementById('chartMonthlyRevenue');
    if(ctx && buckets.length){
      charts.chartMonthlyRevenue = new Chart(ctx, {
        plugins:[{
          id:'moneyScaleConfigRevenue',
          beforeInit(chart){
            chart.$moneyMajorStep=revenueMajorStep;
            chart.$timeBuckets=buckets;
          }
        }],
        data: {
          labels: buckets.map(labelFn),
          datasets:[{
            type:'bar',
            label:'Revenue',
            data:buckets.map((_,i)=>products.reduce((s,p)=>s+(Number(seriesByProduct[p.id][i])||0),0)),
            backgroundColor:'rgba(217,164,65,0.12)',
            hoverBackgroundColor:'rgba(217,164,65,0.42)',
            borderColor:'#D9A441',
            hoverBorderColor:'#D9A441',
            borderWidth:1.5,
            borderRadius:2,
            maxBarThickness:26,

  // ---- Accumulated total revenue (its own separate time range, single net line) ----
  destroyChart('chartAccumulated');
  {
    const range = resolveRange(TF_ACCUM_CHART, products);
    const dayCount = rangeDayCount(range);
    const granularity = dayCount<=180 ? 'daily' : 'monthly';
    const buckets = granularity==='daily' ? daysInRangeList(range) : monthsInRange(range);
    const labelFn = granularity==='daily' ? dayLabel : monthLabel;

    let cumulative = 0;
    const series = buckets.map(bucket=>{
      const netForBucket = products.reduce((sum,p)=>{
        if(granularity==='daily') return sum+chartNetForProductRange(p,bucket,bucket);
        const [y,m]=bucket.split('-').map(Number);
        const bucketStart=`${bucket}-01`;
        const bucketEnd=`${bucket}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;
        const start=bucketStart<range.start?range.start:bucketStart;
        const end=bucketEnd>range.end?range.end:bucketEnd;
        return sum+chartNetForProductRange(p,start,end);
      },0);
      cumulative += netForBucket;
      return Math.round(cumulative*100)/100;
    });
    // The accumulated graph itself is sales net of marketplace fees only.
    // General spending affects the displayed KPI number, never the graph data.
    const totalNet = cumulative;
    const totalGeneralSpending = products.reduce((s,p)=>s+productSpendingTotal(p),0);
    const displayedTotalNet = totalNet - (
      STATE.settings.subtractGeneralSpendingFromNumbers!==false ? totalGeneralSpending : 0
    );
    const accumSeriesMax=Math.max(0,...series);
    const accumMajorStep=niceMoneyStep(accumSeriesMax,5);
    const accumMinorStep=accumMajorStep/2;
    const accumAxisMax=Math.max(accumMajorStep,Math.ceil(accumSeriesMax/accumMajorStep)*accumMajorStep);

    const totalGross = products.reduce((s,p)=>{
      const share = revenueShareMultiplier(p);
      return s + STATE.revenue
        .filter(r=>r.productId===p.id && r.date>=range.start && r.date<=range.end)
        .reduce((a,r)=>a+convertRevenueUSD(Number(r.amount)*share,r.date),0);
    },0);

    const kpiEl = document.getElementById('accumKpis');
    if(kpiEl){
      kpiEl.innerHTML = `
        <div class="kpi-strip" style="grid-template-columns:repeat(2,1fr);margin-bottom:14px;">

            <div class="label">Net revenue</div>
            <div class="value gold mono">${fmtMoney(displayedTotalNet)}</div>

            label:'Accumulated net revenue', data: series,

              position:'nearest',
              backgroundColor:'rgba(0,0,0,.82)',
              titleColor:'#EDEFF3',
              bodyColor:'#EDEFF3',
              borderColor:'rgba(255,255,255,.10)',
              borderWidth:1,
              cornerRadius:6,
              padding:10,
              displayColors:false,
              titleMarginBottom:6,
              callbacks:{
                label:c=>fmtMoney(Number(c.parsed.y)||0)
              }
            }
          },
          layout:{ padding:{ top:16, bottom:30 } },
          scales:{
            x:{ grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, color:tickColor} },
            y:{
              beginAtZero:true,
              max:accumAxisMax,
              grid:{color:gridColor},
              ticks:{
                stepSize:accumMinorStep,
                color:tickColor,
                callback:v=>isMajorTick(v,accumMajorStep)?compactMoneyAxis(v,true):''
              }
            }
          }
        }
      });
    }
  }

  // ---- Payment per hour (all time, each product plus a blended combined bar) ----
  destroyChart('chartPerHour');
  {
    const ctx = document.getElementById('chartPerHour');
    const perProduct = products.map(p=>{
      const hours = totalHoursForProduct(p);
      const net = netRevenueForProduct(p);
      return hours>0 ? net/hours : 0;
    });
    const totalHoursAll = products.reduce((s,p)=>s+totalHoursForProduct(p),0);
    const totalNetAll = products.reduce((s,p)=>s+netRevenueForProduct(p),0);

    const labels = [...products.map(p=>shortNameFor(p)), combinedLabel];

    const colors = [...ids.map(id=>colorFor(id,ids)), '#EDEFF3'];
    if(ctx){

  // ---- Age (all time) ----
  destroyChart('chartAge');

    if(ctx){

  // ---- Units sold per month (all time) ----
  destroyChart('chartUnits');

    const months = allMonthKeysSorted(products);

    const byProduct = {};
    ids.forEach(id=>{ byProduct[id] = months.map(m => STATE.units.filter(u=>u.productId===id && u.yearMonth===m).reduce((s,u)=>s+Number(u.units),0)); });

  // ---- Ratings (all time) ----

  // ---- Revenue relative to age (all time) ----
  destroyChart('chartRevPerAge');
  {
    const ctx = document.getElementById('chartRevPerAge');
    const perProduct = products.map(p=>{
      const age = monthsBetween(firstSaleDate(p.id), todayStr());
      const net = netRevenueForProduct(p);
      return age>0 ? net/age : 0;
    });
    const oldestRelease = products.reduce((min,p)=>{ const d=firstSaleDate(p.id); return d<min?d:min; }, firstSaleDate(products[0].id));
    const combinedAge = monthsBetween(oldestRelease, todayStr());
    const combinedNet = products.reduce((s,p)=>s+netRevenueForProduct(p),0);

function mountIndividualProductComparisonCharts(targetProductId=null){
  const products=getFilteredProducts();
  if(!products.length) return;

  const gridColor='#2A3140';
  const tickColor='#8B93A3';

  // All cards use one shared X range. With "All time" this begins at the
  // oldest visible product's first sale, so every chart lines up exactly.
  const range=resolveRange(TF_PRODUCT_CARDS,products);
  const months=monthsInRange(range);

  // Build every product's monthly series first so we can derive one shared Y scale.
  const seriesByProduct={};
  const performanceByProduct={};
  let globalMonthlyMax=0;
  let globalPerformanceMax=0;

  products.forEach(p=>{
    const series=months.map(m=>{
      const [y,mo]=m.split('-').map(Number);
      const bucketStart=`${m}-01`;
      const bucketEnd=`${m}-${String(new Date(y,mo,0).getDate()).padStart(2,'0')}`;
      const start=bucketStart<range.start?range.start:bucketStart;
      const end=bucketEnd>range.end?range.end:bucketEnd;
      return chartNetForProductRange(p,start,end);
    });
    const performanceSeries=performanceEvolutionMonthlySeries(p,months,range);

    seriesByProduct[p.id]=series;
    performanceByProduct[p.id]=performanceSeries;

    const localMax=Math.max(0,...series);
    if(localMax>globalMonthlyMax) globalMonthlyMax=localMax;

    const perfValues=performanceSeries.filter(v=>Number.isFinite(Number(v)));
    const localPerfMax=perfValues.length?Math.max(0,...perfValues):0;
    if(localPerfMax>globalPerformanceMax) globalPerformanceMax=localPerfMax;
  });

  const sharedMajorStep=niceMoneyStep(globalMonthlyMax,5);
  const sharedMinorStep=sharedMajorStep/2;
  const sharedAxisMax=Math.max(
    sharedMajorStep,
    Math.ceil(globalMonthlyMax/sharedMajorStep)*sharedMajorStep
  );

  const perfMajorStep=niceMoneyStep(globalPerformanceMax,5);
  const perfAxisMax=Math.max(
    perfMajorStep,
    Math.ceil(globalPerformanceMax/perfMajorStep)*perfMajorStep
  );

  products.forEach(p=>{
    if(targetProductId && p.id!==targetProductId) return;

    const canvasId=`productHistory_${p.id}`;
    destroyChart(canvasId);

    if(COLLAPSED_PRODUCT_COMPARE_CARDS.has(p.id)) return;

    const ctx=document.getElementById(canvasId);
    if(!ctx) return;

    const series=seriesByProduct[p.id]||[];
    const performanceSeries=performanceByProduct[p.id]||[];
    const productColor=colorFor(p.id,products.map(x=>x.id));

    const ownPerfValues=performanceSeries.filter(v=>Number.isFinite(Number(v)));
    const ownPerfMax=ownPerfValues.length?Math.max(0,...ownPerfValues):0;
    const ownPerfMin=ownPerfValues.length?Math.min(0,...ownPerfValues):0;
    const ownPerfStep=niceMoneyStep(Math.max(Math.abs(ownPerfMin),Math.abs(ownPerfMax)),5);
    const ownPerfAxisMax=Math.max(ownPerfStep,Math.ceil(ownPerfMax/ownPerfStep)*ownPerfStep);
    const ownPerfAxisMin=ownPerfMin<0 ? Math.floor(ownPerfMin/ownPerfStep)*ownPerfStep : 0;

    const perfScaleMax=PRODUCT_PERFORMANCE_SHARED_SCALE?perfAxisMax:ownPerfAxisMax;
    const perfScaleMin=PRODUCT_PERFORMANCE_SHARED_SCALE?0:ownPerfAxisMin;

    charts[canvasId]=new Chart(ctx,{
      plugins:[{
        id:`moneyScale_${p.id}`,
        beforeInit(chart){
          chart.$moneyMajorStep=sharedMajorStep;
          chart.$timeBuckets=months;
        }
      }],
      type:'bar',
      data:{
        labels:months.map(monthLabel),
        datasets:[
          {
            type:'bar',
            label:shortNameFor(p),
            data:series,
            backgroundColor:hexToRgba(productColor,.16),
            hoverBackgroundColor:hexToRgba(productColor,.42),
            borderColor:productColor,
            hoverBorderColor:productColor,
            borderWidth:1.5,
            borderRadius:2,
            maxBarThickness:26,
            _tooltipColor:productColor,
            _bucketKeys:months,
            yAxisID:'y'
          },
          ...(hasAnyWorkingHours()?[{
            type:'line',
            label:'Performance',
            data:performanceSeries,
            borderColor:productColor,
            backgroundColor:'transparent',
            borderWidth:2,
            pointRadius:0,
            pointHoverRadius:4,
            pointHitRadius:18,
            tension:.22,
            spanGaps:true,
            yAxisID:'yPerf'
          }]:[])
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false,axis:'x'},
        plugins:{
          legend:{display:false},
          revenueChartDecorations:{enabled:true},
          yearAxisSeparators:{enabled:true},
          tooltip:{
            enabled:true,
            mode:'index',
            intersect:false,
            displayColors:false,
            backgroundColor:'rgba(0,0,0,.82)',
            borderColor:'rgba(255,255,255,.10)',
            borderWidth:1,
            cornerRadius:6,
            padding:9,
            titleColor:'#EDEFF3',
            bodyColor:'#EDEFF3',
            titleFont:{family:"Roboto, Arial, sans-serif",size:12,weight:'800'},
            bodyFont:{family:"Roboto, Arial, sans-serif",size:12,weight:'600'},
            callbacks:{
              title:items=>{
                if(!items.length) return '';
                const idx=items[0].dataIndex;
                const bucket=months[idx]||'';
                if(/^\d{4}-\d{2}$/.test(bucket)){
                  const [y,m]=bucket.split('-').map(Number);
                  const names=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
                  return `${names[m-1]||''}                              ${y}`;
                }
                return items[0].label||'';
              },
              label:c=>{
                if(c.dataset.yAxisID==='yPerf'){
                  return `Performance   ${Number(c.raw||0).toFixed(2)}`;
                }
                return `Gross revenue ${fmtMoney(Number(c.raw)||0)}`;
              }
            }
          }
        },
        layout:{padding:{top:12,bottom:28}},
        scales:{
          x:{
            grid:{display:false},
            ticks:{maxRotation:0,autoSkip:true,color:tickColor}
          },
          y:{
            beginAtZero:true,
            max:sharedAxisMax,
            grid:{color:gridColor},
            ticks:{
              stepSize:sharedMinorStep,
              color:tickColor,
              callback:v=>isMajorTick(v,sharedMajorStep)?compactMoneyAxis(v,true):''
            }
          },
          yPerf:{
            display:hasAnyWorkingHours(),
            position:'right',
            beginAtZero:perfScaleMin>=0,
            min:perfScaleMin,
            max:perfScaleMax,
            grid:{drawOnChartArea:false},
            ticks:{
              color:tickColor,
              callback:v=>Number(v).toFixed(0)
            }
          }
        }
      }
    });
  });
}
