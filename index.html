function commitImport(){
  const { groupedByDayTitle, resolutions, firstImport } = IMPORT_STATE;

  // apply resolutions: create new products / merge aliases / rename as needed
  const titleToProductId = {};
  Object.entries(resolutions).forEach(([title, r])=>{
    if(r.action==='auto'){
      titleToProductId[title] = r.productId;
    } else if(r.action==='new'){
      const p = { id: uid('p'), name: title, aliases:[title],
        shortName:generateUniqueShortName(title,STATE.products,null), releaseDate:null,
        hoursUntracked:0, hoursTracked:0, hoursMarketing:0, hoursSupport:0,
        adsSpend:0, ratingsTotal:0, revenueSharePercent:100 };
      STATE.products.push(p);
      titleToProductId[title] = p.id;
    } else if(r.action==='merge'){
      const p = STATE.products.find(x=>x.id===r.mergeTargetId);
      if(p){
        if(!p.aliases) p.aliases=[];
        if(!p.aliases.some(a=>a.toLowerCase()===title.toLowerCase())) p.aliases.push(title);
        if(r.rename) p.name = title;
        titleToProductId[title] = p.id;
      }
    }
  });

  // sum incoming amounts per (date, productId)
  const incoming = {}; // key: date||productId -> amount
  const incomingPrices = {}; // key: date||productId -> distinct observed private base/list prices
  const incomingUnits = {}; // key: YYYY-MM||productId -> net units
  const incomingProfessional = {}; // key: date||productId -> any professional sale that day
  const incomingRefunds = {}; // key: date||productId -> any refund/return that day
  Object.values(groupedByDayTitle).forEach(g=>{
    const pid = titleToProductId[g.title];
    if(!pid) return;
    const key = g.day+'||'+pid;
    incoming[key] = (incoming[key]||0) + g.amount;
    const unitKey = g.day.slice(0,7)+'||'+pid;
    incomingUnits[unitKey] = (incomingUnits[unitKey]||0) + (Number(g.units)||0);
    if(g.hasProfessional) incomingProfessional[key] = true;
    if(g.hasRefund) incomingRefunds[key] = true;
    const observedPrices=Array.isArray(g.basePrices) && g.basePrices.length
      ? g.basePrices
      : (g.basePrice!==null && g.basePrice!==undefined && Number.isFinite(Number(g.basePrice)) ? [Number(g.basePrice)] : []);
    if(observedPrices.length){
      if(!incomingPrices[key]) incomingPrices[key]=[];
      observedPrices.forEach(price=>{
        const rounded=Math.round(Number(price)*100)/100;
        if(Number.isFinite(rounded) && rounded>0 && !incomingPrices[key].includes(rounded)){
          incomingPrices[key].push(rounded);
        }
      });
      incomingPrices[key].sort((a,b)=>a-b);
    }
  });

  // upsert: remove any existing revenue entries at these (date,productId) pairs, then insert fresh
  const incomingKeys = new Set(Object.keys(incoming));
  STATE.revenue = STATE.revenue.filter(r=> !incomingKeys.has(r.date+'||'+r.productId));
  Object.entries(incoming).forEach(([key, amount])=>{
    const [date, productId] = key.split('||');
    STATE.revenue.push({ id: uid('r'), date, productId, amount: Math.round(amount*100)/100 });
  });

  // Price history is independent from old seed revenue. Only CSV rows that actually
  // contain a usable price are added, so older non-CSV periods remain unclassified.
  if(!Array.isArray(STATE.priceHistory)) STATE.priceHistory=[];
  const incomingPriceKeys=new Set(Object.keys(incomingPrices));
  STATE.priceHistory=STATE.priceHistory.filter(x=>!incomingKeys.has(x.date+'||'+x.productId));
  Object.entries(incomingPrices).forEach(([key,prices])=>{
    const [date,productId]=key.split('||');
    const list=(Array.isArray(prices)?prices:[prices])
      .map(price=>Math.round(Number(price)*100)/100)
      .filter(price=>Number.isFinite(price) && price>0)
      .sort((a,b)=>a-b);
    if(!list.length) return;

    // Keep the minimum in `price` for compatibility with the sale estimator,
    // and explicitly preserve the day's highest observed private price too.
    // A day such as Sep 14 can therefore carry salePrice=15 and normalPrice=29.99
    // without depending on multiple duplicate priceHistory rows surviving.
    STATE.priceHistory.push({
      id:uid('ph'),
      date,
      productId,
      price:list[0],
      minPrice:list[0],
      maxPrice:list[list.length-1],
      observedPrices:[...new Set(list)]
    });
  });

  // Imported price observations may change inferred sale boundaries,
  // especially same-day discounted + normal-price transition days.
  // Force every sale period to be recalculated from the new evidence.
  SALE_PERIOD_CACHE.clear();

  // Store whether a product had at least one professional sale on a given date.
  if(!Array.isArray(STATE.licenseHistory)) STATE.licenseHistory = [];
  const incomingProfessionalKeys = new Set(Object.keys(incomingProfessional));
  STATE.licenseHistory = STATE.licenseHistory.filter(x=>!incomingKeys.has(x.date+'||'+x.productId));
  Object.entries(incomingProfessional).forEach(([key])=>{
    const [date,productId]=key.split('||');
    STATE.licenseHistory.push({id:uid('lh'),date,productId,hasProfessional:true});
  });

  if(!Array.isArray(STATE.refundHistory)) STATE.refundHistory = [];
  STATE.refundHistory = STATE.refundHistory.filter(x=>!incomingKeys.has(x.date+'||'+x.productId));
  Object.entries(incomingRefunds).forEach(([key])=>{
    const [date,productId]=key.split('||');
    STATE.refundHistory.push({id:uid('rh'),date,productId,hasRefund:true});
  });

  // Rebuild monthly unit totals from the imported CSV's Net Units column.
  const incomingUnitKeys = new Set(Object.keys(incomingUnits));
  STATE.units = STATE.units.filter(u=>!incomingUnitKeys.has(u.yearMonth+'||'+u.productId));
  Object.entries(incomingUnits).forEach(([key,count])=>{
    const [yearMonth,productId]=key.split('||');
    STATE.units.push({id:uid('u'),yearMonth,productId,units:Math.round(count)});
  });

  STATE.products.forEach(p=>{
    if(!p.releaseDate) p.releaseDate = inferredFirstSaleDateFromState(STATE,p.id);
  });

  // CSV imports may extend the sales history backward. The required FX range is
  // derived dynamically from STATE.revenue, so this immediately exposes any new
  // missing older payout dates while retaining all dates already cached.
  mergeDedicatedFxCacheIntoState(STATE);
  if(STATE.fxSync){
    const coverageAfterImport=fxCoverageInfo();
    if(coverageAfterImport.missing.length){
      STATE.fxSync.completedAt=null;
    }
  }

  const newCount = Object.values(resolutions).filter(r=>r.action==='new').length;
  const mergeCount = Object.values(resolutions).filter(r=>r.action==='merge').length;
  const newProductReward=motivationNewProductReward(newCount,firstImport);

  persist().then((ok)=>{
    // Whether or not the save succeeded, the product/revenue changes already exist in memory —
    // persist() has already alerted the user if saving failed, and told them to export a backup.
    showToast(`Imported ${Object.keys(incoming).length} entries${Object.keys(incomingPrices).length?`, ${Object.keys(incomingPrices).length} price points`:''}${newCount?`, ${newCount} new product(s)`:''}${mergeCount?`, ${mergeCount} merged`:''}`);
    IMPORT_STATE = null;
    renderTabContent();
    mountMotivationFloatingControl();
    if(newProductReward) setTimeout(()=>showMotivationProductLaunchReward(newProductReward),120);
  });
}

function fxStatusText(){
  const {required,complete,missing,latestSourceDate}=fxCoverageInfo();
  if(!required.length){
    return {
      tone:'muted',
      title:'Fallback exchange-rate data only',
      detail:'No historical payout dates are required yet because there is no product history old enough to fetch.'
    };
  }
  if(complete.length===0){
    return {
      tone:'warn',
      title:'Fallback exchange-rate data only',
      detail:`0 of ${required.length} required monthly payout dates are cached. Historical mode currently falls back to the built-in rates.`
    };
  }
  if(missing.length===0){
    return {
      tone:'ok',
      title:'Historical exchange rates are up to date',
      detail:`${complete.length} of ${required.length} required monthly payout dates are cached${latestSourceDate?` · latest real source date ${latestSourceDate}`:''}.`
    };
  }
  const interrupted=STATE.fxSync && STATE.fxSync.inProgress;
  return {
    tone:'warn',
    title:interrupted?'Exchange-rate pull was interrupted':'Historical exchange-rate cache is incomplete',
    detail:`${complete.length} of ${required.length} required monthly payout dates are cached${latestSourceDate?` · latest real source date ${latestSourceDate}`:''}. ${missing.length} date${missing.length===1?'':'s'} still need to be pulled. Already cached months are kept when the required history expands after a CSV import.`
  };
}

async function fetchHistoricalFxDate(payoutDate){
  const quotes=FX_TARGET_CURRENCIES.join(',');
  const url=`${FX_API_BASE}/rates?base=USD&quotes=${encodeURIComponent(quotes)}&date=${encodeURIComponent(payoutDate)}`;
  const response=await fetch(url,{headers:{'Accept':'application/json'},cache:'no-store'});
  if(!response.ok) throw new Error(`HTTP ${response.status} for ${payoutDate}`);
  const data=await response.json();
  if(!Array.isArray(data)) throw new Error(`Unexpected JSON for ${payoutDate}`);

  const rates={USD:1};
  let sourceDate=null;
  data.forEach(row=>{
    if(!row || !row.quote) return;
    const code=String(row.quote).toUpperCase();
    const rate=Number(row.rate);
    if(FX_TARGET_CURRENCIES.includes(code) && Number.isFinite(rate) && rate>0){
      rates[code]=rate;
      if(row.date && (!sourceDate || row.date>sourceDate)) sourceDate=row.date;
    }
  });

  const missing=FX_TARGET_CURRENCIES.filter(code=>!Number.isFinite(Number(rates[code])));
  if(missing.length) throw new Error(`Missing ${missing.join(', ')} for ${payoutDate}`);

  return {
    requestedDate:payoutDate,
    sourceDate:sourceDate||payoutDate,
    rates,
    fetchedAt:new Date().toISOString(),
    source:'Frankfurter'
  };
}

async function pullHistoricalFxHistory(){
  if(FX_PULL_ACTIVE) return;
  const coverage=fxCoverageInfo();
  const missing=coverage.missing.slice().sort((a,b)=>a.payoutDate.localeCompare(b.payoutDate));
  if(!missing.length) return;

  FX_PULL_ACTIVE=true;
  STATE.fxSync={
    inProgress:true,
    lastError:null,
    startedAt:new Date().toISOString(),
    completedAt:null
  };
  await persist();

  const btn=document.getElementById('pullFxHistoryBtn');
  if(btn){btn.disabled=true;btn.textContent='Pulling exchange rates…';}

  const total=coverage.required.length;
  let done=coverage.complete.length;
  updateFxProgressUI(done,total);

  try{
    // Oldest missing payout dates first so a newly imported older product is filled backward first.
    for(const item of missing){
      if(ACTIVE_TAB!=='settings') throw new Error('Pull interrupted because the Settings page was left.');
      const entry=await fetchHistoricalFxDate(item.payoutDate);
      STATE.fxHistory[item.payoutDate]=entry;

      // Mirror the successful date to the dedicated FX cache immediately, before
      // touching any other UI/state. This survives later CSV imports and reloads.
      setDedicatedFxCache(STATE.fxHistory);

      // Recompute against the current requirement instead of blindly incrementing.
      // If the required range changed while the page was open, progress stays truthful.
      const liveCoverage=fxCoverageInfo();
      done=liveCoverage.complete.length;
      updateFxProgressUI(done,liveCoverage.required.length);

      // Persist every successful date immediately so reload/close preserves progress.
      await persist();
      await new Promise(resolve=>setTimeout(resolve,35));
    }

    STATE.fxSync.inProgress=false;
    STATE.fxSync.lastError=null;
    STATE.fxSync.completedAt=new Date().toISOString();
    await persist();
  }catch(err){
    STATE.fxSync.inProgress=false;
    STATE.fxSync.lastError=String(err && err.message ? err.message : err);
    await persist();
  }finally{
    FX_PULL_ACTIVE=false;
    if(ACTIVE_TAB==='settings') renderTabContent();
  }
}

      };

      const rectKeys=(r0,r1,c0,c1)=>{
        const keys=[];
        for(let r=r0;r<=r1;r++){
          for(let c=c0;c<=c1;c++) keys.push(`${r}|${c}`);
        }
        return keys;
      };

      const positionSelectionTooltip=(clientX,clientY)=>{
        const w=selectionTooltip.offsetWidth||190;
        const h=selectionTooltip.offsetHeight||76;
        let left=clientX+15;
        let top=clientY+15;
        if(left+w>window.innerWidth-10) left=clientX-w-15;
        if(top+h>window.innerHeight-10) top=clientY-h-15;
        selectionTooltip.style.left=Math.max(8,left)+'px';
        selectionTooltip.style.top=Math.max(8,top)+'px';
      };


      const revenueLogClipboardMoney=(value)=>{
        const amount=Math.floor(Number(value)||0).toLocaleString(undefined,{maximumFractionDigits:0});
        const symbol=displayCurrencySymbol();
        const gap=/^[A-Z]{2,}$/.test(symbol)?' ':'';
        return `${amount}${gap}${symbol}`;
      };

      const buildRevenueSelectionClipboardText=()=>{
        if(!dragSelection) return '';

        const endRow=Number.isFinite(dragSelection.endRow)?dragSelection.endRow:dragSelection.startRow;
        const endCol=Number.isFinite(dragSelection.endCol)?dragSelection.endCol:dragSelection.startCol;
        const r0=Math.min(dragSelection.startRow,endRow);
        const r1=Math.max(dragSelection.startRow,endRow);
        const c0=Math.min(dragSelection.startCol,endCol);
        const c1=Math.max(dragSelection.startCol,endCol);

        const filteredProducts=getFilteredProducts();
        const productParts=[];

        for(let c=c0;c<=c1;c++){
          const product=filteredProducts[c];
          if(!product) continue;

          const daily=[];
          for(let r=r0;r<=r1;r++){
            const cell=getCell(r,c);
            if(!cell || !cell.dataset.date) continue;
            daily.push({
              date:cell.dataset.date,
              value:Number(cell.dataset.value)||0
            });
          }

          daily.sort((a,b)=>a.date.localeCompare(b.date));

          const dayText=daily.map(item=>
            `${shortDayLabel(item.date)}: ${revenueLogClipboardMoney(item.value)}`
          ).join('; ');

          productParts.push(`The product ${product.name} revenue: ${dayText}`);
        }

        return productParts.join(' and ');
      };

      const copyRevenueSelectionToClipboard=async()=>{
        const text=buildRevenueSelectionClipboardText();
        if(!text) return false;

        try{
          if(navigator.clipboard && typeof navigator.clipboard.writeText==='function'){
            await navigator.clipboard.writeText(text);
          }else{
            throw new Error('Clipboard API unavailable');
          }
        }catch(_){
          const ta=document.createElement('textarea');
          ta.value=text;
          ta.style.position='fixed';
          ta.style.left='-9999px';
          ta.style.top='0';
          ta.setAttribute('readonly','');
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }

        const hint=selectionTooltip.querySelector('.revenue-selection-copy-hint');
        if(hint){
          hint.classList.add('copied');
          hint.innerHTML='<kbd>Enter</kbd>Copied to clipboard';
          clearTimeout(copyRevenueSelectionToClipboard._timer);
          copyRevenueSelectionToClipboard._timer=setTimeout(()=>{
            if(!dragSelection) return;
            const current=selectionTooltip.querySelector('.revenue-selection-copy-hint');
            if(current){
              current.classList.remove('copied');
              current.innerHTML='<kbd>Enter</kbd>Copy selected daily revenue';
            }
          },900);
        }
        return true;
      };

      const clearDragSelection=()=>{
        if(!dragSelection) return;
        dragSelection.selectedKeys.forEach(key=>{
          const [r,c]=key.split('|').map(Number);
          const cell=getCell(r,c);
          if(cell) cell.classList.remove('rl-range-selected');
        });
        dragSelection=null;
        selectionTooltip.classList.remove('visible');
        selectionTooltip.innerHTML='';
        document.body.classList.remove('rl-selecting');
      };

      const updateDragSelection=(endCell,clientX,clientY)=>{
        if(!dragSelection || !endCell) return;

        const endRow=Number(endCell.dataset.rowIndex);
        const endCol=Number(endCell.dataset.colIndex);
        if(!Number.isFinite(endRow)||!Number.isFinite(endCol)) return;

        if(endRow===dragSelection.endRow && endCol===dragSelection.endCol){
          positionSelectionTooltip(clientX,clientY);
          return;
        }

        const r0=Math.min(dragSelection.startRow,endRow);
        const r1=Math.max(dragSelection.startRow,endRow);
        const c0=Math.min(dragSelection.startCol,endCol);
        const c1=Math.max(dragSelection.startCol,endCol);

        const newKeys=new Set(rectKeys(r0,r1,c0,c1));

        // Only toggle cells whose membership changed.
        dragSelection.selectedKeys.forEach(key=>{
          if(!newKeys.has(key)){
            const [r,c]=key.split('|').map(Number);
            const cell=getCell(r,c);
            if(cell) cell.classList.remove('rl-range-selected');
          }
        });
        newKeys.forEach(key=>{
          if(!dragSelection.selectedKeys.has(key)){
            const [r,c]=key.split('|').map(Number);
            const cell=getCell(r,c);
            if(cell) cell.classList.add('rl-range-selected');
          }
        });

        dragSelection.selectedKeys=newKeys;
        dragSelection.endRow=endRow;
        dragSelection.endCol=endCol;

        let sum=0;
        let count=0;
        let firstDate=null;
        let lastDate=null;

        const filteredProducts=getFilteredProducts();
        const selectedProducts=filteredProducts.slice(c0,c1+1);
        const perProduct=new Map();
        selectedProducts.forEach((p,offset)=>{
          perProduct.set(c0+offset,{product:p,sum:0,count:0});
        });

        // Every selected cell counts toward the average, including empty/zero
        // cells. This means days without a sale correctly lower both the total
        // average and each individual product's average.
        for(let r=r0;r<=r1;r++){
          for(let c=c0;c<=c1;c++){
            const cell=getCell(r,c);
            if(!cell) continue;
            const value=Number(cell.dataset.value)||0;
            sum+=value;
            count++;

            const productStats=perProduct.get(c);
            if(productStats){
              productStats.sum+=value;
              productStats.count++;
            }

            const date=cell.dataset.date;
            if(date){
              if(!firstDate || date<firstDate) firstDate=date;
              if(!lastDate || date>lastDate) lastDate=date;
            }
          }
        }

        const productLabel=selectedProducts.length===1
          ? selectedProducts[0].name
          : `${selectedProducts.length} products`;
        const dateLabel=firstDate===lastDate
          ? (firstDate?shortDayLabel(firstDate):'')
          : `${firstDate?shortDayLabel(firstDate):''} – ${lastDate?shortDayLabel(lastDate):''}`;

        const dayCount=(firstDate&&lastDate)?(dayDiff(firstDate,lastDate)+1):0;
        const overallAverage=count?sum/count:0;
        const allProductIds=STATE.products.map(p=>p.id);

        const productRows=[...perProduct.values()].map(stats=>{
          const average=stats.count?stats.sum/stats.count:0;
          return `
            <div class="rst-product-row">
              <span class="dot" style="background:${colorFor(stats.product.id,allProductIds)}"></span>
              <span class="rst-product-name">${shortNameFor(stats.product)}</span>
              <span class="rst-product-total">${fmtMoney(stats.sum)}</span>
              <span class="rst-product-average">${fmtMoney(average)} avg</span>
            </div>
          `;
        }).join('');

        selectionTooltip.innerHTML=`
          <div class="rst-label">Selected total</div>
          <div class="rst-sum">${fmtMoney(sum)}</div>
          <div class="rst-average">Average per selected cell <strong>${fmtMoney(overallAverage)}</strong></div>
          <div class="rst-meta">${count} cell${count===1?'':'s'} · ${productLabel}${dateLabel?` · ${dateLabel}`:''}${dayCount?` · ${dayCount} day${dayCount===1?'':'s'}`:''}</div>
          ${productRows?`
            <div class="rst-products">
              <div class="rst-products-head"><span>Product</span><span>Total</span><span>Average</span></div>
              ${productRows}
            </div>
          `:''}
          <div class="revenue-selection-copy-hint"><kbd>Enter</kbd>Copy selected daily revenue</div>
        `;
        selectionTooltip.classList.add('visible');
        positionSelectionTooltip(clientX,clientY);
      };

      container.addEventListener('pointerdown',(e)=>{
        if(e.button!==0) return;
        const cell=e.target.closest('[data-rl-selectable="1"]');
        if(!cell) return;

        e.preventDefault();
        if(tooltip){
          tooltip.style.display='none';
          logTooltipHoveredDate=null;
        }

        dragSelection={
          startRow:Number(cell.dataset.rowIndex),
          startCol:Number(cell.dataset.colIndex),
          endRow:NaN,
          endCol:NaN,
          selectedKeys:new Set()
        };

        document.body.classList.add('rl-selecting');
        updateDragSelection(cell,e.clientX,e.clientY);

        let rafPending=false;
        let lastMoveEvent=null;

        const processMove=()=>{
          rafPending=false;
          if(!dragSelection || !lastMoveEvent) return;
          const ev=lastMoveEvent;
          const under=document.elementFromPoint(ev.clientX,ev.clientY);
          const endCell=under && under.closest ? under.closest('[data-rl-selectable="1"]') : null;
          if(endCell) updateDragSelection(endCell,ev.clientX,ev.clientY);
          else positionSelectionTooltip(ev.clientX,ev.clientY);
        };

        const onMove=(ev)=>{
          if(!dragSelection) return;
          lastMoveEvent=ev;
          if(!rafPending){
            rafPending=true;
            requestAnimationFrame(processMove);
          }
        };

        const onKeyDown=(ev)=>{
          if(!dragSelection || ev.key!=='Enter') return;
          ev.preventDefault();
          ev.stopPropagation();
          ev.stopImmediatePropagation();
          copyRevenueSelectionToClipboard();
        };

        const onUp=()=>{
          document.removeEventListener('pointermove',onMove,true);
          document.removeEventListener('pointerup',onUp,true);
          document.removeEventListener('pointercancel',onUp,true);
          document.removeEventListener('keydown',onKeyDown,true);
          clearDragSelection();
        };

        document.addEventListener('pointermove',onMove,true);
        document.addEventListener('pointerup',onUp,true);
        document.addEventListener('pointercancel',onUp,true);
        document.addEventListener('keydown',onKeyDown,true);
      });
    }
    if(container && tooltip){
      container.addEventListener('mousemove',(e)=>{
        if(document.body.classList.contains('rl-selecting')){
          tooltip.style.display='none';
          return;
        }
        const rowEl=e.target.closest('[data-log-date]');
        if(!rowEl){ tooltip.style.display='none'; logTooltipHoveredDate=null; return; }
        const date=rowEl.dataset.logDate;
        if(date!==logTooltipHoveredDate){
          logTooltipHoveredDate=date;
          tooltip.innerHTML=buildLogTooltipHTML(date);

          // Keep a compact shared layout: long product names ellipsize,
          // while sale %, revenue and $/hr remain fully visible and aligned.
          tooltip.style.width='max-content';
          tooltip.style.maxWidth='calc(100vw - 20px)';
          tooltip.style.display='block';
        }
        tooltip.style.display='block';
        const tw=tooltip.offsetWidth||280, th=tooltip.offsetHeight||120;
        let left=e.clientX+16, top=e.clientY+16;
        if(left+tw>window.innerWidth-10) left=e.clientX-tw-16;
        if(top+th>window.innerHeight-10) top=e.clientY-th-16;
        tooltip.style.left=left+'px'; tooltip.style.top=top+'px';
      });
      container.addEventListener('mouseleave',()=>{
        tooltip.style.display='none';
        logTooltipHoveredDate=null;
      });
    }
    // Shared filter bar + revenue-share toggle (same controls as the Dashboard, same global state)
    const chips = document.getElementById('filterChips');
    if(chips){
      chips.querySelectorAll('[data-filter-all]').forEach(b=>{
        b.addEventListener('click', ()=>{
          ACTIVE_FILTER='all';
          queueRevenueLogRefresh();
        });
      });
      chips.querySelectorAll('[data-filter-chip]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const id = b.dataset.filterChip;
          if(ACTIVE_FILTER==='all'){
            ACTIVE_FILTER = new Set([id]);
          } else {
            if(ACTIVE_FILTER.has(id)) ACTIVE_FILTER.delete(id); else ACTIVE_FILTER.add(id);
            if(ACTIVE_FILTER.size===0 || ACTIVE_FILTER.size===STATE.products.length) ACTIVE_FILTER='all';
          }
          queueRevenueLogRefresh();
        });
      });
    }
    const revShare = document.getElementById('revShareToggle');
    if(revShare) revShare.addEventListener('change', ()=>{
      STATE.settings.applyRevenueShare = revShare.checked;
      persist();
      queueRevenueLogRefresh();
    });
  }

  if(ACTIVE_TAB==='import'){
    const dropZone = document.getElementById('dropZone');
    const csvInput = document.getElementById('csvInput');
    if(dropZone && csvInput){
      dropZone.addEventListener('click', ()=>csvInput.click());
      csvInput.addEventListener('change', (e)=>{
        if(e.target.files && e.target.files.length) handleCsvFiles(e.target.files);
      });
      dropZone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropZone.classList.add('dragover'); });
      dropZone.addEventListener('dragleave', ()=> dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', (e)=>{
        e.preventDefault(); dropZone.classList.remove('dragover');
        if(e.dataTransfer.files && e.dataTransfer.files.length) handleCsvFiles(e.dataTransfer.files);
      });
    }
    document.querySelectorAll('[data-resolve-action]').forEach(r=>{
      r.addEventListener('change', ()=>{
        const title = r.dataset.resolveTitle;
        IMPORT_STATE.resolutions[title].action = r.dataset.resolveAction;
      });
    });
    document.querySelectorAll('[data-resolve-merge-target]').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const title = sel.dataset.resolveMergeTarget;
        IMPORT_STATE.resolutions[title].mergeTargetId = sel.value;
        IMPORT_STATE.resolutions[title].action = 'merge';
        const radio = document.querySelector(`[data-resolve-action="merge"][data-resolve-title="${cssEscape(title)}"]`);
        if(radio) radio.checked = true;
      });
    });
    document.querySelectorAll('[data-resolve-rename]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const title = cb.dataset.resolveRename;
        IMPORT_STATE.resolutions[title].rename = cb.checked;
      });
    });
    const commitBtn = document.getElementById('commitImportBtn');
    if(commitBtn) commitBtn.addEventListener('click', commitImport);
    const cancelBtn = document.getElementById('cancelImportBtn');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ IMPORT_STATE=null; renderTabContent(); });
  }

  if(ACTIVE_TAB==='units'){
    const form = document.getElementById('unitsForm');
    if(form) form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const yearMonth = document.getElementById('units-month').value;
      const productId = document.getElementById('units-product').value;
      const count = parseInt(document.getElementById('units-count').value, 10);
      if(!yearMonth || !productId || isNaN(count)) return;
      STATE.units = STATE.units.filter(u=>!(u.productId===productId && u.yearMonth===yearMonth));
      STATE.units.push({ id: uid('u'), yearMonth, productId, units: count });
      await persist();
      showToast('Units entry saved');
      renderTabContent();
    });
    document.querySelectorAll('[data-del-units]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const id = b.dataset.delUnits;
        STATE.units = STATE.units.filter(u=>u.id!==id);
        await persist();
        renderTabContent();
      });
    });
    document.querySelectorAll('[data-save-ratings]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const pid = b.dataset.saveRatings;
        const input = document.querySelector(`[data-ratings-input="${pid}"]`);
        const p = STATE.products.find(x=>x.id===pid);
        if(p && input){ p.ratingsTotal = parseFloat(input.value)||0; await persist(); showToast('Ratings updated'); renderTabContent(); }
      });
    });
  }

  if(ACTIVE_TAB==='products'){
    const setEditProductCollapsed=(pid,collapsed)=>{
      const card=document.querySelector(`[data-product-card="${CSS.escape(pid)}"]`);
      if(!card) return;
      card.classList.toggle('edit-collapsed',collapsed);
      const btn=card.querySelector(`[data-edit-product-toggle="${CSS.escape(pid)}"]`);
      if(btn){
        btn.textContent=collapsed?'▼':'▲';
        btn.setAttribute('aria-expanded',collapsed?'false':'true');
        btn.title=collapsed?'Expand':'Collapse';
      }
      if(collapsed) COLLAPSED_EDIT_PRODUCT_CARDS.add(pid);
      else COLLAPSED_EDIT_PRODUCT_CARDS.delete(pid);
    };

    document.querySelectorAll('[data-edit-product-toggle]').forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        const pid=btn.dataset.editProductToggle;
        setEditProductCollapsed(pid,!COLLAPSED_EDIT_PRODUCT_CARDS.has(pid));
      });
    });

    document.querySelectorAll('[data-edit-product-header]').forEach(header=>{
      header.addEventListener('click',e=>{
        if(e.target.closest('button,input,select,a,label')) return;
        const pid=header.dataset.editProductHeader;
        setEditProductCollapsed(pid,!COLLAPSED_EDIT_PRODUCT_CARDS.has(pid));
      });
    });

    const collapseAllEdit=document.getElementById('collapseAllEditProducts');
    if(collapseAllEdit) collapseAllEdit.addEventListener('click',()=>{
      STATE.products.forEach(p=>setEditProductCollapsed(p.id,true));
    });
    const expandAllEdit=document.getElementById('expandAllEditProducts');
    if(expandAllEdit) expandAllEdit.addEventListener('click',()=>{
      STATE.products.forEach(p=>setEditProductCollapsed(p.id,false));
    });

    const markFieldDirty=(inp)=>{
      const pid=inp.dataset.pid;
      const field=inp.dataset.field;
      if(!pid || !field) return;
      let value=inp.value;
      if(field==='shortName'){
        value=cleanShortName(value);
        inp.value=value;
      }else if(field==='fabListingId'){
        const normalized=normalizeFabListingId(value);
        value=normalized || String(value||'').trim();
        if(normalized) inp.value=normalized;
      }else if(inp.type==='number'){
        value=inp.value===''?0:(parseFloat(inp.value)||0);
      }
      setProductDraftField(pid,field,value);

      if(['hoursTracked','hoursUntracked','hoursMarketing','hoursSupport'].includes(field)){
        const p=STATE.products.find(x=>x.id===pid);
        const totalEl=document.getElementById('editTotalHours-'+pid);
        if(p && totalEl){
          const total=productDraftTotalHours(p);
          totalEl.textContent=Number(total).toLocaleString(undefined,{maximumFractionDigits:1})+' h';
        }
      }

      updateFloatingProductSaveButton();
    };

    document.querySelectorAll('[data-field]').forEach(inp=>{
      inp.addEventListener('input',()=>markFieldDirty(inp));
      inp.addEventListener('change',()=>markFieldDirty(inp));
    });

    document.querySelectorAll('[data-del-product]').forEach(b=>{
      b.addEventListener('click',async ()=>{
        const pid=b.dataset.delProduct;
        if(!confirm('Delete this product? Its logged revenue and units entries will stay in the data but no longer be shown. This cannot be undone here.')) return;
        PRODUCT_EDIT_DRAFTS.delete(pid);
        COLLAPSED_EDIT_PRODUCT_CARDS.delete(pid);
        KNOWN_EDIT_PRODUCT_CARDS.delete(pid);
        STATE.products=STATE.products.filter(p=>p.id!==pid);
        await persist();
        showToast('Product deleted');
        renderTabContent();
      });
    });

    const saveAllBtn=document.getElementById('saveAllProductsFloating');
    if(saveAllBtn){
      saveAllBtn.addEventListener('click',async ()=>{
        if(!PRODUCT_EDIT_DRAFTS.size) return;

        // Validate all draft short names together before changing STATE.
        const resultingCodes=new Map();
        for(const p of STATE.products){
          const draft=productDraftFor(p.id);
          const raw=Object.prototype.hasOwnProperty.call(draft,'shortName')?draft.shortName:shortNameFor(p);
          const code=cleanShortName(raw);
          if(code.length<1 || code.length>5){
            alert(`Short name for ${p.name} must contain between 1 and 5 letters or numbers.`);
            return;
          }
          if(resultingCodes.has(code)){
            const other=resultingCodes.get(code);
            alert(`The short name ${code} would be used by both ${other} and ${p.name}. Please choose unique abbreviations.`);
            return;
          }
          resultingCodes.set(code,p.name);
        }

        for(const [pid,draft] of PRODUCT_EDIT_DRAFTS.entries()){
          const p=STATE.products.find(x=>x.id===pid);
          if(!p) continue;
          Object.entries(draft).forEach(([field,value])=>{
            if(field==='shortName') p[field]=cleanShortName(value);
            else if(field==='fabListingId') p[field]=normalizeFabListingId(value);
            else if(field==='color' && (value===null || value==='')) delete p.color;
            else p[field]=value;
          });
        }

        const count=PRODUCT_EDIT_DRAFTS.size;
        PRODUCT_EDIT_DRAFTS.clear();
        await persist();
        showToast(count>1?`${count} products saved`:'Product saved');
        renderTabContent();
      });
    }

    document.querySelectorAll('[data-reset-color]').forEach(b=>{
      b.addEventListener('click',()=>{
        const pid=b.dataset.resetColor;
        const p=STATE.products.find(x=>x.id===pid);
        if(!p) return;

        // Mark reset as a pending edit instead of saving immediately.
        setProductDraftField(pid,'color',null);
        const clone={...p};
        delete clone.color;
        const colorInput=document.querySelector(`[data-pid="${pid}"][data-field="color"]`);
        if(colorInput) colorInput.value=currentColorFor(clone);
        updateFloatingProductSaveButton();
      });
    });

    document.querySelectorAll('[data-add-alias]').forEach(b=>{
      b.addEventListener('click',async ()=>{
        const pid=b.dataset.addAlias;
        const input=document.getElementById('new-alias-'+pid);
        const p=STATE.products.find(x=>x.id===pid);
        if(!p || !input || !input.value.trim()) return;
        if(!p.aliases) p.aliases=[];
        p.aliases.push(input.value.trim());
        await persist();
        renderTabContent();
      });
    });

    document.querySelectorAll('[data-del-alias]').forEach(b=>{
      b.addEventListener('click',async ()=>{
        const pid=b.dataset.delAlias;
        const val=b.dataset.aliasVal;
        const p=STATE.products.find(x=>x.id===pid);
        if(!p) return;
        p.aliases=(p.aliases||[]).filter(a=>a!==val);
        await persist();
        renderTabContent();
      });
    });

    updateFloatingProductSaveButton();
  }

  if(ACTIVE_TAB==='settings'){
    const historicalFxToggle=document.getElementById('historicalFxToggle');
    if(historicalFxToggle) historicalFxToggle.addEventListener('change',async()=>{
      STATE.settings.useHistoricalExchangeRates=historicalFxToggle.checked;
      await persist();
      renderTabContent();
    });

    const pullFxHistoryBtn=document.getElementById('pullFxHistoryBtn');
    if(pullFxHistoryBtn) pullFxHistoryBtn.addEventListener('click',()=>pullHistoricalFxHistory());
  }

  if(ACTIVE_TAB==='data'){
    const exportBtn = document.getElementById('exportBtn');
    if(exportBtn) exportBtn.addEventListener('click', ()=>{
      const payload=createFullBackupPayload();
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fab-profit-analytics-backup-${motivationLocalTodayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Full backup downloaded');
    });

    const importInput = document.getElementById('importInput');
    if(importInput) importInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async (evt)=>{
        try{
          const parsed=JSON.parse(evt.target.result);
          const backup=parseFullBackupPayload(parsed);

          if(!backup.state.products || !backup.state.revenue || !backup.state.units){
            throw new Error('bad shape');
          }

          if(!confirm('This will replace all current data with the imported backup, including Motivation Mode, XP/challenges/tasks and synced Toggl history. Continue?')) return;

          // Normalize on restore so backups from both older and newer versions
          // receive every current default/validation rule before being persisted.
          STATE=normalizeState(backup.state);
          DASHBOARD_REVENUE_MODE=STATE.settings.dashboardRevenueMode==='net'?'net':'gross';

          if(backup.localConnection && backup.localConnection.togglBridgeUrl){
            setTogglBridgeUrl(backup.localConnection.togglBridgeUrl);
          }

          // Keep the dedicated FX cache consistent with the restored STATE.
          if(STATE.fxHistory) setDedicatedFxCache(STATE.fxHistory);

          await persist();
          showToast('Full backup imported');
          ACTIVE_FILTER='all';
          render();
        }catch(err){
          console.error('Backup import failed',err);
          alert("That file doesn't look like a valid backup.");
        }finally{
          importInput.value='';
        }
      };
      reader.readAsText(file);
    });
  }
}

function cssEscape(s){
  return String(s).replace(/["\\]/g, '\\$&');
}


window.addEventListener('resize',()=>{
  if(ACTIVE_TAB==='dashboard' || ACTIVE_TAB==='compare' || ACTIVE_TAB==='revenuelog'){
    requestAnimationFrame(scheduleStickyDashboardOffsetSync);
  }
},{passive:true});

init();

</script>
</body>
</html>
